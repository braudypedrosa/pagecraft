name: pagecraft-wordpress

x-wordpress-common: &wordpress-common
  image: wordpress:6.6-php8.1-apache
  restart: unless-stopped

x-cli-common: &cli-common
  image: wordpress:cli-php8.1
  entrypoint: ["wp"]
  user: "33:33"
  working_dir: /var/www/html

services:
  staging-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pagecraft_staging
      MARIADB_USER: pagecraft
      MARIADB_PASSWORD: pagecraft-dev
      MARIADB_ROOT_PASSWORD: pagecraft-root-dev
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - staging-db-data:/var/lib/mysql

  staging-wordpress:
    <<: *wordpress-common
    depends_on:
      staging-db:
        condition: service_healthy
    ports:
      - "${STAGING_PORT:-8088}:80"
    environment:
      WORDPRESS_DB_HOST: staging-db:3306
      WORDPRESS_DB_NAME: pagecraft_staging
      WORDPRESS_DB_USER: pagecraft
      WORDPRESS_DB_PASSWORD: pagecraft-dev
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'staging');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('PAGECRAFT_CONNECTOR_ALLOW_INSECURE_LOOPBACK', true);
        define('PAGECRAFT_CONNECTOR_ALLOW_LOCAL_ROOT_OVERRIDE', true);
        define('PAGECRAFT_CONNECTOR_LOCAL_ROOT_PUBLIC_KEY', 'AYrtOA8MouvyuMBywFi5i6jY90dxxYch28ujLoSRm0g');
    volumes:
      - staging-wordpress-data:/var/www/html
      - ../pagecraft-theme:/var/www/html/wp-content/themes/pagecraft:ro
      - ../pagecraft-connector:/var/www/html/wp-content/plugins/pagecraft-connector:ro

  staging-cli:
    <<: *cli-common
    depends_on:
      staging-db:
        condition: service_healthy
      staging-wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: staging-db:3306
      WORDPRESS_DB_NAME: pagecraft_staging
      WORDPRESS_DB_USER: pagecraft
      WORDPRESS_DB_PASSWORD: pagecraft-dev
    volumes:
      - staging-wordpress-data:/var/www/html
      - ../pagecraft-theme:/var/www/html/wp-content/themes/pagecraft:ro
      - ../pagecraft-connector:/var/www/html/wp-content/plugins/pagecraft-connector:ro
      - ../tests:/opt/pagecraft-tests:ro
      - ../../server/tests/fixtures:/opt/pagecraft-shared:ro

  production-db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: pagecraft_production
      MARIADB_USER: pagecraft
      MARIADB_PASSWORD: pagecraft-dev
      MARIADB_ROOT_PASSWORD: pagecraft-root-dev
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - production-db-data:/var/lib/mysql

  production-wordpress:
    <<: *wordpress-common
    depends_on:
      production-db:
        condition: service_healthy
    ports:
      - "${PRODUCTION_PORT:-8089}:80"
    environment:
      WORDPRESS_DB_HOST: production-db:3306
      WORDPRESS_DB_NAME: pagecraft_production
      WORDPRESS_DB_USER: pagecraft
      WORDPRESS_DB_PASSWORD: pagecraft-dev
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', 'production');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('PAGECRAFT_CONNECTOR_ALLOW_INSECURE_LOOPBACK', true);
        define('PAGECRAFT_CONNECTOR_ALLOW_LOCAL_ROOT_OVERRIDE', true);
        define('PAGECRAFT_CONNECTOR_LOCAL_ROOT_PUBLIC_KEY', 'AYrtOA8MouvyuMBywFi5i6jY90dxxYch28ujLoSRm0g');
    volumes:
      - production-wordpress-data:/var/www/html
      - ../pagecraft-theme:/var/www/html/wp-content/themes/pagecraft:ro
      - ../pagecraft-connector:/var/www/html/wp-content/plugins/pagecraft-connector:ro

  production-cli:
    <<: *cli-common
    depends_on:
      production-db:
        condition: service_healthy
      production-wordpress:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: production-db:3306
      WORDPRESS_DB_NAME: pagecraft_production
      WORDPRESS_DB_USER: pagecraft
      WORDPRESS_DB_PASSWORD: pagecraft-dev
    volumes:
      - production-wordpress-data:/var/www/html
      - ../pagecraft-theme:/var/www/html/wp-content/themes/pagecraft:ro
      - ../pagecraft-connector:/var/www/html/wp-content/plugins/pagecraft-connector:ro
      - ../tests:/opt/pagecraft-tests:ro
      - ../../server/tests/fixtures:/opt/pagecraft-shared:ro

volumes:
  staging-db-data:
  staging-wordpress-data:
  production-db-data:
  production-wordpress-data:
