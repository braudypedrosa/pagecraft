/* Takes a file into the library. Shared by every upload entry point. */
async function mediaTake(file, options = {}) {
  const managed = options.feedback === false;
  if (!file || !/^image\//.test(file.type)) {
    if (managed) throw new Error('Choose an image file to upload.');
    toast('Choose an image file to upload.', {tone:'error'}); return null;
  }
  if (file.size > 6e6 && !await askConfirm('That is a large image',
    `This file is <b>${(file.size / 1048576).toFixed(1)} MB</b>. Large images slow the page down.`,
    { ok: 'Add anyway', danger: false })) return null;
  const upload = async () => {
    const id = await assetAdd(file);
    if (!id) { if (managed) throw new Error('Upload failed'); return false; }
    writeNow();
    return id;
  };
  if (managed) return await upload() || null;
  return await withAction(null, 'Uploading ' + file.name + '…', upload,
    file.name + ' uploaded.') || null;

async function mediaUploadFiles(files, after, button = null, zone = null) {
  const selected = Array.from(files || []);
  if (!selected.length) return;
  return withAction(button, 'Uploading images…', async action => {
    zone?.setAttribute('aria-busy', 'true');
    const failed = []; let count = 0;
    try {
      for (const file of selected) {
        action.update('Uploading ' + file.name + '…');
        try { if (await mediaTake(file, {feedback:false})) count++; }
        catch { failed.push(file.name); }
      }
      after();
      if (failed.length) throw new Error(`${count ? count + ' uploaded. ' : ''}Could not upload ${failed.join(', ')}. Choose image files and try again.`);
      return count || false;
    } finally { zone?.removeAttribute('aria-busy'); }
  }, count => `${count === 1 ? 'Image' : count + ' images'} uploaded.`, {key:'media-upload'});
}

function mediaChooseFiles(takeFiles, multiple = true) {
  const fi = document.createElement('input');
  fi.type = 'file'; fi.accept = 'image/*'; fi.multiple = multiple;
  fi.hidden = true; fi.tabIndex = -1; fi.setAttribute('aria-hidden', 'true');
  const cleanup = () => fi.remove();
  fi.addEventListener('change', () => {

    cleanup();
    takeFiles(files);

  fi.addEventListener('cancel', cleanup, {once:true});
  document.body.appendChild(fi);

    e.preventDefault(); e.stopPropagation();
    e.dataTransfer.dropEffect = busy() ? 'none' : 'copy';
  });
  zone.addEventListener('dragleave', e => {
    if (!files(e)) return;
    e.preventDefault(); e.stopPropagation();
    if (--depth <= 0) reset();
  });
  zone.addEventListener('dragend', reset);
  zone.addEventListener('drop', e => {
    if (!files(e)) return;
    e.preventDefault(); e.stopPropagation(); reset();
    if (busy()) return;
    const selected = Array.from(e.dataTransfer.files || []);
    if (!selected.length) { toast('Drop image files to upload. Folders are not supported.', {tone:'error'}); return; }
    void takeFiles(selected);
  });
}

/* The global Media button can either place a new image or replace the selected Image.
   Pin the target when the library opens: later selection changes must not redirect a replace. */
function mediaSelectedImageTarget() {
  if (multiOn() || !state.ui.sel) return null;
  const found = locate(state.ui.sel);
  if (!found || found.node.type !== 'image') return null;
  const mode = state.ui.mode;
  const ownerId = mode === 'page' ? page().id : mode === 'component' ? state.ui.cedit : mode;
  const ownerLabel = mode === 'page' ? page().name
    : mode === 'component' ? (findComponent(state.ui.cedit)?.name || 'Component')
      : mode === 'header' ? 'Global header' : 'Global footer';
  return Object.freeze({
    id: found.node.id, mode, ownerId, src: String(found.node.props.src || ''),
    label: `${nameOf(found.node)} · ${ownerLabel}`
  });
}

function mediaResolveImageTarget(target) {
  if (!target) return null;
  let list = null;
  if (target.mode === 'page') list = state.pages.find(item => item.id === target.ownerId)?.tree;
  else if (target.mode === 'header') list = state.header;
  else if (target.mode === 'footer') list = state.footer;
  else if (target.mode === 'component') {
    const definition = findComponent(target.ownerId);
    list = definition ? [definition.node] : null;
  }
  const found = list && locate(target.id, list);
  if (!found || found.node.type !== 'image' || String(found.node.props.src || '') !== target.src) return null;
  return found.node;
}

function mediaApplyIntent(intent, target, assetId) {
  const asset = AS.mem.get(assetId);
  if (!asset) return 'missing';
  if (intent === 'replace') {
    const image = mediaResolveImageTarget(target);
    if (!image) return 'stale';
    edit(() => {
      image.props.src = 'asset:' + asset.id;
      if (asset.w) { image.props.w = String(asset.w); image.props.h = String(asset.h); }
    }, 'Replace image');
    return 'replaced';
  }
  let made = null;
  edit(() => {
    made = insert('image', ...smartTarget('image'));
    if (!made) return;
    made.props.src = 'asset:' + asset.id;
    made.props.alt = '';
    if (asset.w) { made.props.w = String(asset.w); made.props.h = String(asset.h); }
    selSet([made.id]);
  }, 'Insert image');
  return made ? 'inserted' : 'does-not-fit';
}

async function cmsCommit(collections) {
  // Wait for the existing write queue before using its acknowledged version.
  while (saving) await new Promise(resolve => setTimeout(resolve, 25));
  if (loadBlocked) throw new Error('This site could not be opened, so nothing is being saved.');
  if (saveState === 'failed') throw new Error('Resolve the draft save error in the builder before saving CMS changes. Your entry is still here.');
  const next = JSON.parse(JSON.stringify(doc()));
  collectionsReplace(next, collections);
  saving = true;
  try {
    if (SRV) {
      const result = await HOST.documents.save({ document: next, version: SRV.version });
      SRV.version = result.version;
      lastCloudDocument = JSON.stringify(next);
    } else {
      localStorage.setItem(LS, JSON.stringify({ ...next, v: SCHEMA, cur: state.cur, tab: TABID }));
    }
    edit(() => { collectionsReplace(doc(), collections); });
    saveState = 'ok';
    stamp('Draft saved — not published', false);
  } catch (error) {
    const raw = error?.status === 409
      ? 'The site changed in another session. Copy your edits before reloading; nothing was overwritten.'
      : String(error?.message || '').trim();
    throw new Error(!raw || /^[a-z][a-z0-9_-]*$/i.test(raw)
      ? 'Entry could not be saved. Your changes are still here.'
      : raw);
  } finally {
    saving = false;
    if (saveAgain) { saveAgain = false; writeNow(); }
  }
}

/* Field types whose control has a fixed intrinsic width, so an even share of a
   `table-layout:fixed` table is mostly empty space taken from the text columns.
   Anything not listed here shares what is left. */
const CMS_COL_W = { image: '72px', bool: '54px', date: '128px', number: '84px' };

/* one cell of the items table, per field type */
function cmsCell(col, it, f) {
  const v = it.values[f.id] ?? '';
  const k = `${it.id}|${f.id}`;
  if (f.type === 'image') {
    const a = /^asset:(\w+)$/.test(String(v)) && AS.mem.get(String(v).slice(6));
    return `<button class="cmsimg" data-vimg="${k}" title="Choose from the library">
      ${a ? `<img src="${a.url}" alt="" loading="lazy">` : `<span>Choose…</span>`}</button>`;
  }
  if (f.type === 'bool') return `<input type="checkbox" data-v="${k}"${v ? ' checked' : ''}>`;
  if (f.type === 'ref') {
    const to = f.ref ? findCollection(f.ref) : null;
    if (!to) return `<span class="rowmeta">Pick a collection for this field</span>`;
    /* by title, because an item id is not something anyone recognises. Drafts are listed:
       you relate a post to an author while the author is still being written. */
    return `<select class="ctl" data-v="${k}" style="font-size:var(--fs-2)">
        <option value=""${v ? '' : ' selected'}>— none —</option>
        ${to.items.map(x => `<option value="${esc(x.id)}"${x.id === v ? ' selected' : ''}>${esc(itemTitle(to, x) || x.slug)}</option>`).join('')}
      </select>`;
  }
  if (f.type === 'rich') return `<textarea class="ctl" data-v="${k}" rows="2" style="font-size:var(--fs-2)">${esc(v)}</textarea>`;
  const type = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
  return `<input class="ctl" type="${type}" data-v="${k}" value="${esc(v)}" style="font-size:var(--fs-2)">`;
}

/* The Undo and Redo buttons reflect history depth, and `tx()` pushes a snapshot
   without going through `edit()` — so `HOOKS.change()` never fires and the
   buttons kept their disabled state until the next full render. After any style
   edit `hist.u.length` was 1 while the button was still greyed out: ⌘Z worked and
   the button looked dead. Anything that moves history depth calls this. */
function paintHistory() {
  const u = $('#undoBtn'), r = $('#redoBtn');
  for (const [button, direction, stack, shortcut] of [[u, 'undo', hist.u, '⌘Z'], [r, 'redo', hist.r, '⌘⇧Z']]) {
    if (!button) continue;
    const verb = direction === 'undo' ? 'Undo' : 'Redo';
    const label = stack.length ? verb + ': ' + historyLabel(direction) : verb;
    button.disabled = !stack.length;
    button.title = label + ' (' + shortcut + ')';

}

/* The frame renders at its breakpoint's width and is scaled to fit whatever the
   panels leave. Everything the drag and selection code measures lives *inside* the
   iframe, so it keeps working in unscaled document coordinates — only the three
   places that cross the boundary need the factor, and `zoomK` is what they read. */
let zoomK = 1;
function restoreCanvasLayout() {
  requestAnimationFrame(() => { layoutCanvas(); positionHud(); renderDim(); });
}
function layoutCanvas() {
  const wrap = $('#frameWrap'), cv = $('#canvas');
  if (!wrap || !cv || !$('#stage')?.clientWidth || !wrap.clientHeight) return;
  const preview = document.body.classList.contains('preview');
  const stage = $('#stage');
  /* Desktop preview fills the viewport. Device previews retain their actual
     breakpoint width, even when the editor uses a custom zoom. */
  const target = preview && state.ui.dev === 'desktop'
    ? stage.clientWidth : canvasWidth(state.ui.dev, state.meta.maxWidth);
  /* Preview has no stage padding; editor clientWidth excludes its scrollbar. */
  const avail = preview ? stage.clientWidth : Math.max(120, stage.clientWidth - 32);
  const k = zoomK = preview ? fitZoom(target, avail) : zoomFor(state.ui.zoom, target, avail);
  wrap.style.width = Math.round(target * k) + 'px';
  cv.style.width = target + 'px';
  /* the wrap's height comes from flex and does not depend on the iframe, so this
     is not circular: the iframe is made tall enough that scaling fills the wrap */
  cv.style.height = Math.max(1, Math.round(wrap.clientHeight / k)) + 'px';
  cv.style.transform = k === 1 ? 'none' : `scale(${k})`;
  /* The selection HUD lives inside the iframe, so it is scaled along with the page.
     The frame has to be — it tracks the element — but its label bar and handles are
     editor chrome and were shrinking to 57% of legible. `--z` lets that CSS divide
     itself back out. Set after renderDoc(), which rewrites the document. */
  if (cdoc && cdoc.documentElement) cdoc.documentElement.style.setProperty('--z', String(k));
}

function renderDim() {
  const el = $('#dim');
  if (!el || !cwin || !$('#stage')?.clientWidth) return;
  const target = canvasWidth(state.ui.dev, state.meta.maxWidth);
  const stage = $('#stage');
  /* what Fit *would* give, so the label reads the same whichever option is chosen */
  const pct = Math.round(fitZoom(target, Math.max(120, (stage ? stage.clientWidth : 0) - 32)) * 100);
  /* the width shown is the width the page is *rendered* at, which is now the same
     thing as the breakpoint being edited — that is the whole point of the scale */
  el.innerHTML = `<span>${esc(DEV_LABEL[dk()])}</span><b>${target} PX</b>`
    + `<span class="sep"></span>`
    + `<select id="zoomSel" title="Canvas zoom">${ZOOMS.map(([v, lb]) =>
      `<option value="${v}"${String(state.ui.zoom) === v ? ' selected' : ''}>${lb}${v === 'fit' ? ' · ' + pct + '%' : ''}</option>`).join('')}</select>`;
  const sel = $('#zoomSel');

/* =============================================================== export */

/* One decision, in one place: whether a build carries image variants. The page that
   promises a srcset and the writer that satisfies it both go through here, so they cannot
   disagree about which files exist. Inlining is excluded on purpose — five copies of every
   image inside a single self-contained file is worse than not trying. */
const withVariants = (ctx, mode) => ({ ...ctx, variants: mode === 'files' });

const EXPORT_DRAFT_CHANGED = 'The site changed while this export was being prepared. Close Export, finish your edits, then open it and try again. No files were downloaded.';

/* An export action owns one mode, target list and document version. Rendering and hosted
   asset reads can all await; checking on both sides of every awaited preparation prevents a
   later draft from being mixed into files that were built from the earlier one. Target
   records are copied so changing the picker while an action runs cannot redirect it. */
function captureExportAction(mode, targets) {
  const baseline = JSON.stringify(doc());
  const stableTargets = targets.map(target => ({ ...target }));
  const check = () => {
    if (JSON.stringify(doc()) !== baseline) throw new Error(EXPORT_DRAFT_CHANGED);
  };
  const wait = async work => {
    check();
    const value = await work();
    check();
    return value;
  };
  return { mode, targets: stableTargets, check, wait };
}

/* Prepare every page before the first browser download. Besides avoiding mixed output when
   the draft changes, this lets hosted inline exports fetch all required bytes before any
   file is presented as successfully downloaded. */
async function prepareExportPages(action, render) {
  const pages = [];
  for (const target of action.targets) {
    pages.push({ target, data: await action.wait(() => render(target, action.mode)) });
  }
  return pages;
}

/* Fetch the faces once per export run and keep them: several pages want the same files, and
   a zip of twelve pages should not ask Google twelve times. `null` means it could not be done
   — offline, or a request refused — and the caller falls back to linking, because a page that
   silently ships no font at all is worse than a page with a third-party request.

   `fonts.gstatic.com` serves woff2 with a permissive CORS header, so this works from the
   browser; the css2 endpoint does too. Both are checked at runtime rather than assumed. */
let fontPack = undefined;
async function selfHostedFonts() {
  if (fontPack !== undefined) return fontPack;
  const href = gfontsHref();
  if (!href) return (fontPack = null);            // nothing but system fonts in use
  try {
    const css = await (await fetch(href)).text();
    const faces = parseFontCss(css);
    if (!faces.length) return (fontPack = null);
    const files = [];
    for (const f of faces) {
      const r = await fetch(f.url);
      if (!r.ok) return (fontPack = null);
      files.push({ path: fontFile(f), blob: await r.blob() });
    }
    fontPack = { css: fontFaceCss(faces, fontFile), files };
  } catch { fontPack = null; }
  return fontPack;
}

async function exportPage(pg, mode, ctx = {}) {
  /* only the separate-files export: a single self-contained file has nowhere to put a woff2,
     and inlining four of them as base64 is a worse trade than one request to Google */
  const pack = mode === 'files' && state.meta.selfHostFonts ? await selfHostedFonts() : null;
  const raw = buildPage(pg, { ...withVariants(ctx, mode), fontCss: pack ? pack.css : '' });
  if (mode === 'files') {
    await materializeAssetsFor(raw);
    return assetsToPaths(raw, ctx.rel || '');
  }
  return assetsToData(raw);
}

/* Hand over each asset and downscaled variant promised by a token-bearing page source. */
async function writeAssetsFor(source, download) {
  for (const file of await exportAssetFiles(source)) {
    if (await download(file.path.replace(/^assets\//, ''), file.data, file.type) === false) return false;
  }
  return true;
}


/* Saving a file: hosted viewers mediate it through the downloads capability,
   a plain browser (or the local file) uses an object URL. Same code both ways. */
let dlNs;
async function saveHost() {
  if (dlNs !== undefined) return dlNs;
  dlNs = null;
  try { if (typeof claude !== 'undefined' && claude.use) dlNs = await claude.use('downloads'); } catch (e) { dlNs = null; }
  return dlNs;
}
async function download(name, text, type = 'text/html;charset=utf-8') {
  const ns = await saveHost();
  if (ns) {
    try { await ns.save({ filename: name, data: text }); return true; }
    catch (err) {
      const c = err && err.code;
      if (c === 'declined') { return false; }
      if (c === 'extension_not_enabled') {
        try {
          await ns.save({ filename: name.replace(/\.html?$/, '') + '.txt', data: text });
          toast('Saved as .txt — rename it to .html'); return true;
        } catch (e2) { throw new Error('Saving is blocked here — use Copy HTML.'); }
      }
      if (c === 'too_large') { throw new Error('Too large to save — use Copy HTML.'); }
      if (c === 'rate_limited') { throw new Error('One save at a time — try again.'); }
      /* anything else: fall through to the object-URL path */
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
    return true;
  } catch (e) { throw new Error('Download blocked here — use Copy HTML.'); }
}

/* ================================================================ modal */
const dialogFocusables = box => $$('button:not([disabled]):not([hidden]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])', box)
  .filter(el => !el.closest('[hidden]'));
function trapDialogKey(e, box, close) {
  if (e.key === 'Escape') {
    e.preventDefault(); e.stopPropagation(); close(); return true;
  }
  if (e.key !== 'Tab') return false;
  const list = dialogFocusables(box);
  if (!list.length) { e.preventDefault(); box.focus(); return true; }
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  return true;
}

let modalReturnFocus = null;
let modalMotionVersion = 0;
/* Only the top dialog may be exposed to the accessibility tree. The confirmation
   layer intentionally sits above the larger project/publish dialog, so opening it
   makes that underlying dialog inert until the confirmation resolves. */
function syncDialogLayers() {
  const modalOpen = !$('#modal').hidden;
  const askOpen = !$('#ask').hidden;
  const app = $('#app');
  const modal = $('#modal');
  const lock = (el, on) => {
    if (on) { el.setAttribute('inert', ''); el.setAttribute('aria-hidden', 'true'); }
    else { el.removeAttribute('inert'); el.removeAttribute('aria-hidden'); }
  };
  const settingsOpen = modalOpen && $('#modalBox').classList.contains('project-settings');
  lock(app, askOpen || (modalOpen && !settingsOpen));
  /* Settings occupies the workspace, but the visible tool rail remains navigation. */
  $$('#app > :not(.main), #app > .main > :not(#leftRail)').forEach(el => lock(el, settingsOpen));
  $('#modalBox').setAttribute('aria-modal', settingsOpen ? 'false' : 'true');
  lock(modal, modalOpen && askOpen);
  lock($('#ask'), false);
}
function openModal(title, bodyHtml, footHtml, size) {
  clearPublicationFrames();
  modalMotionVersion++;
  const mask = $('#modal'), box = $('#modalBox');
  const wasHidden = mask.hidden || mask.hasAttribute('data-pc-motion-closing');
  if (wasHidden) modalReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
  box.className = 'modal pc-dialog' + (size ? ' ' + size : '');
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = bodyHtml;
  $('#mFoot').innerHTML = footHtml || '';
  mask.hidden = false; box.hidden = false;
  syncDialogLayers();
  const fx = PC_UI.installUiMotion();
  if (wasHidden) {
    fx?.enter(mask, {kind:'fade'}); fx?.enter(box, {kind:'dialog'});
    const first = dialogFocusables($('#modalBox'))[0];
    (first || $('#modalBox')).focus();
  }
}
const closeModal = afterClose => {
  clearPublicationFrames();
  const mask = $('#modal'), box = $('#modalBox');
  // Click handlers pass an event; only explicit callbacks run after the exit.
  const resume = typeof afterClose === 'function' ? afterClose : () => {};
  if (mask.hidden) { resume(); return; }
  if (mask.hasAttribute('data-pc-motion-closing')) return;
  const finish = () => {
    mask.hidden = true; box.hidden = false;
    syncDialogLayers(); endTx();
    const back = modalReturnFocus; modalReturnFocus = null;
    if (back && back.isConnected) back.focus({preventScroll:true});
    resume();
  };
  const fx = PC_UI.installUiMotion();
  if (!fx || fx.reduced()) { finish(); return; }
  const version=++modalMotionVersion;
  Promise.all([fx.exit(box,{kind:'dialog',hide:false}),fx.exit(mask,{kind:'fade',hide:false})]).then(done=>{if(version===modalMotionVersion&&done.every(Boolean))finish();});
};
$('#mClose').addEventListener('click', closeModal);
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
$('#modal').addEventListener('keydown', e => {
  if ($('#modalBox').classList.contains('project-settings') && e.key !== 'Escape') return;
  trapDialogKey(e, $('#modalBox'), closeModal);
});

/* ---- asking for something ---------------------------------------------
   Replaces native prompt() and confirm(). Those were unstyled OS chrome in the
   middle of an art-directed tool, and — the reason this had to change — sandboxed
   iframes refuse them outright, so naming a class or a colour silently did
   nothing in an embedded editor.
   Both return a promise: a string / true on confirm, null / false on any exit. */
let askDone = null;
let askReturnFocus = null;
let askMotionVersion = 0;
function askOpen(title, bodyHtml, okLabel, danger) {
  askMotionVersion++;
  if (!$('#ask').hidden) {                            // never stack two asks
    PC_UI.installUiMotion()?.cancel($('#ask'));
    PC_UI.installUiMotion()?.cancel($('#askBox'));
    $('#ask').hidden = true;
    const previous = askDone; askDone = null;
    if (previous) previous(null);
  }
  askReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
  $('#askTitle').textContent = title;
  $('#askBody').innerHTML = bodyHtml;
  const yes = $('#askYes');
  /* a picker resolves by choosing something, so it has no commit button and its
     only exit is labelled Close rather than Cancel */
  yes.hidden = okLabel === null;
  yes.textContent = okLabel || '';
  yes.classList.toggle('danger', !!danger);
  yes.classList.toggle('primary', !danger);
  $('#askNo').textContent = okLabel === null ? 'Close' : 'Cancel';
  $('#ask').hidden = false; $('#askBox').hidden = false;
  syncDialogLayers();
  const fx = PC_UI.installUiMotion();
  fx?.enter($('#ask'), {kind:'fade'}); fx?.enter($('#askBox'), {kind:'dialog'});
  const input = $('#askBody input');
  if (input) { input.focus(); input.select(); }
  else {
    const choice = $('#askBody [data-p], #askBody [data-pick]');
    if (choice) choice.focus();
    else if (!yes.hidden) yes.focus();
    else $('#askBox').focus();
  }
  return new Promise(res => { askDone = res; });
}
function askClose(value) {
  const mask=$('#ask'),box=$('#askBox'),wasOpen=!mask.hidden;
  if (!wasOpen || mask.hasAttribute('data-pc-motion-closing')) return;
  const finish = () => {
    mask.hidden = true; box.hidden = false;
    box.classList.remove('media-library');
    $('#ask [data-media-upload]')?.remove();
    syncDialogLayers();
    const res = askDone; askDone = null;
    if (res) res(value);
    const back = askReturnFocus; askReturnFocus = null;
    if (back && back.isConnected) back.focus({preventScroll:true});
  };
  const fx=PC_UI.installUiMotion();
  if(!fx||fx.reduced()){finish();return;}
  const version=++askMotionVersion;
  Promise.all([fx.exit(box,{kind:'dialog',hide:false}),fx.exit(mask,{kind:'fade',hide:false})]).then(done=>{if(version===askMotionVersion&&done.every(Boolean))finish();});
}
const askOpenNow = () => !$('#ask').hidden;

/* a name, a URL — anything that used prompt() */
function askText(title, label, value = '', opts = {}) {
  return askOpen(title,
    `<div class="f" style="margin-bottom:0"><label for="askIn">${esc(label)}</label>
       <input class="ctl" id="askIn" value="${esc(value)}" placeholder="${esc(opts.placeholder || '')}">
       ${opts.note ? `<div class="note">${opts.note}</div>` : ''}</div>`,
    opts.ok || 'Save', false);
}

/* a yes/no — anything that used confirm(). `msg` may carry markup. */
function askConfirm(title, msg, opts = {}) {
  return askOpen(title, `<div class="msg">${msg}</div>`, opts.ok || 'Delete', opts.danger !== false)
    .then(v => v === true);
}

/* The media library as a picker. Resolves with an asset id, or null. It rides the
   ask layer so it can open from inside Project settings without displacing it. */
/* one-of-many, for choosing a field. Resolves with the value, or null on exit. */
function askPick(title, opts, current = '') {
  const p = askOpen(title, `<div class="pickrows">${opts.map(([v, l]) =>
    `<button class="pickrow${v === current ? ' on' : ''}" data-p="${esc(v)}">${esc(l)}</button>`).join('')}</div>`, null, false);
  $$('#askBody [data-p]').forEach(b => b.addEventListener('click', () => askClose(b.dataset.p)));
  return p;
}

function mediaPicker(options = {}) {
  const title = typeof options === 'string' ? options : options.title || 'Media library';
  const browserState = {view: options.view || 'library'};
  const p = askOpen(title, '', null, false);
  $('#askBox').classList.add('media-library');
  $('#askNo').textContent = 'Done';
  const draw = () => {
    const use = assetUsage();
    $('#askBody').innerHTML = `<div class="media-library-drop"><div class="media-library-items">${mediaBrowserMarkup()}</div>
      <div class="media-library-overlay" aria-hidden="true">Drop images to upload</div></div>`;
    const zone = $('.media-library-drop', $('#askBody'));
    $('#ask [data-media-upload]')?.remove();
    $('#askNo').insertAdjacentHTML('beforebegin', `<button type="button" class="btn" data-media-upload>${svg('image', 13)} Upload</button>`);
    const upload = $('#ask [data-media-upload]');
    const takeFiles = async files => {
      const selected = options.multiple === false ? Array.from(files).slice(0, 1) : files;
      if (options.onFiles) {
        if (zone.getAttribute('aria-busy') === 'true') return;
        zone.setAttribute('aria-busy', 'true');
        const chooser = $('[data-media-choose]', zone); chooser.disabled = true;
        try { const result = await options.onFiles(selected); if (result && zone.isConnected) askClose(null); }
        finally { zone.removeAttribute('aria-busy'); chooser.disabled = false; }
        return;
      }
      return mediaUploadFiles(selected, () => { if (zone.isConnected && !$('#ask').hidden) { browserState.view = 'library'; draw(); } }, upload, zone);
    };
    wireMediaDrop(zone, takeFiles);
    const showView = wireMediaViews(zone, takeFiles, browserState, options.multiple !== false);
    if (options.uploadOnly) $('[data-media-view=library]', zone).hidden = true;
    upload.addEventListener('click', () => showView('upload'));
    wireMediaBrowser(zone, use, 'data-pick', id => askClose(id), async (id, button) => {
      const usage = assetUse(id);
      if (!usage.canDelete) { toast(assetDeleteBlockedMessage(usage), {tone:'error'}); mediaDetails(zone, id, draw, button); return; }
      if (IS_WORDPRESS && !await confirmWordPressAssetDelete([id])) return;
      if (!await assetDel(id, button)) { draw(); return; }
      writeNow(); paint(); draw();
    }, browserState);
  };
  draw();
  return p;
}

$('#askX').addEventListener('click', () => askClose(null));
$('#askNo').addEventListener('click', () => askClose(null));
$('#ask').addEventListener('pointerdown', e => { if (e.target.id === 'ask') askClose(null); });
$('#askYes').addEventListener('click', () => {
  const input = $('#askBody input');
  if (!input) return askClose(true);
  const v = input.value.trim();
  if (!v) { input.focus(); return; }                  // an empty name is a no-op, not a cancel
  askClose(v);
});
$('#ask').addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    e.preventDefault(); e.stopPropagation(); askClose(null); return;
  }
  if (e.key === 'Tab') { trapDialogKey(e, $('#askBox'), () => askClose(null)); return; }
  if (e.key !== 'Enter' || e.target.tagName === 'TEXTAREA') return;
  const yes = $('#askYes');
  const choice = e.target.closest && e.target.closest('[data-p], [data-pick], [data-del]');
  if (yes.hidden) {
    if (choice) { e.preventDefault(); e.stopPropagation(); choice.click(); }
    return;
  }
  /* Let focused buttons keep their native Enter action, including Cancel and Close.
     Inputs still submit the prompt; a dialog-level shortcut must not override a button. */
  if (e.target.closest && e.target.closest('button, a')) return;
  e.preventDefault(); e.stopPropagation(); yes.click();
});

function exportModal() {
  if (editing.on) exitEdit();
  /* one entry per file the project emits — a detail template contributes one per item */
  const targets = exportTargets();
  const opts = targets.map((t, i) => `<option value="${i}">${esc(t.item ? t.pg.title || itemTitle(t.col, t.item) : t.pg.name)} — /${esc(t.path)}</option>`).join('');
  const nAssets = AS.mem.size;
  openModal('Export static HTML', `
    <div style="display:flex;gap:var(--sp-4);align-items:center;margin-bottom:var(--gap-2);flex-wrap:wrap">
      <select class="ctl" id="exPick" style="flex:1;min-width:220px;max-width:300px">${opts}</select>
      <select class="ctl" id="exMode" style="width:210px" title="How images are handled">
        <option value="inline">Images inlined — one file</option>
        <option value="files">Images as separate files</option>
      </select>
      <span style="font-size:var(--fs-1);color:var(--text-3)" id="exSize">…</span>
    </div>
    <div class="review" id="exReview"></div>
    <pre class="code" id="exCode" style="max-height:32vh">Building…</pre>
    <div class="note" id="exNote" style="margin-top:var(--gap-2)"></div>

    <div class="xtra">
      <div class="xlab">Individual files, instead of the archive</div>
      <div class="xrow">
        <button class="btn" id="exAll">Download all ${targets.length} page${targets.length === 1 ? '' : 's'}</button>
        <button class="btn" id="exSeo"${state.meta.baseUrl ? '' : ' disabled title="Needs a Site URL in Project settings — a sitemap has to know its own domain"'}>sitemap.xml + robots.txt</button>
        ${collections().length ? `<button class="btn" id="exContent" title="Published collection items as data. Export project JSON to include drafts.">content.json</button>` : ''}
        ${collections().length ? `<button class="btn" id="exContentIn" title="Read a content.json back into this project">Import content.json…</button>` : ''}
        <button class="btn" id="exCopy">Copy this page's HTML</button>
      </div>
      <div class="note">The archive already contains every one of these, with folders intact. Reach for
        these when a browser blocks the .zip${targets.some(t => t.rel) ? ', but note that a browser saves downloads flat — a page in a folder arrives with its path in the filename' : ''}.
        ${collections().length ? 'Importing a <b>content.json</b> adds and updates items — it never deletes one, so a file holding part of your content is safe to open.' : ''}</div>
    </div>

    <div class="xtra">
      <div class="xlab">The project itself, not the site</div>
      <div class="xrow">
        <button class="btn" id="exJson">Export project JSON</button>
        <button class="btn" id="exImport">Import project JSON…</button>
      </div>
      <div class="note">A backup you can reopen and keep editing — pages, styles and content, not
        publishable HTML. <b>Importing replaces everything in this project.</b></div>
    </div>`, `
    <span class="note" id="exFoot" style="margin:0;flex:1;text-align:left"></span>
    <button class="btn" id="exOne">Download this page</button>
    <button class="btn primary" id="exZip" title="Every page, image and SEO file, with folders intact">${svg('copy', 13)} Download site .zip</button>`);

  /* app/src/ui/ReviewList.tsx owns #exReview. The rest of this dialog is asynchronous
     orchestration — building, zipping, saving — and stays imperative, because that is
     what it is. */
  ui().mountReview();

  const pick = $('#exPick'), mode = $('#exMode'), code = $('#exCode');
  /* the picker indexes files now, not pages, so land on the first file this page
     produces — which for a detail template is its first item */
  pick.value = String(Math.max(0, targets.findIndex(t => t.pg.id === page().id)));
  const target = () => targets[+pick.value] || targets[0];
  const cur = () => { const t = target(); return exportPage(t.pg, mode.value, t); };

  /* Two builds can be in flight at once — change the page or the mode while one is
     running — and the slower one used to win, whichever it was. Inlining awaits base64 for
     every image while writing paths is near-instant, so switching to separate files showed
     the inline output a moment later and looked like the mode had not taken. A sequence
     number is enough: a build that is no longer the latest drops its result. */
  let seq = 0, previewNotice;
  const draw = async () => {
    const mine = ++seq;
    code.textContent = 'Building…';
    code.setAttribute('aria-busy', 'true');
    const notice = previewNotice || (previewNotice = feedback().notify('Building export preview…', {tone:'progress'}));
    notice.update('Building export preview…');
    let html;
    try { html = await cur(); }
    catch (error) {
      if (mine !== seq) return;
      if (!code.isConnected) { notice.dismiss(); return; }
      const message = (error.message || 'Could not build this page.') + ' Choose a page or image mode to retry.';
      code.textContent = message; $('#exSize').textContent = '';
      code.removeAttribute('aria-busy'); notice.error(message); return;
    }
    if (mine !== seq) return;
    if (!code.isConnected) { notice.dismiss(); return; }
    code.removeAttribute('aria-busy'); notice.success('Export preview ready.');
    code.textContent = html;
    $('#exSize').textContent = (html.length / 1024).toFixed(1) + ' KB';
    /* Counted from the html that was just built rather than from the asset store, because
       what a download hands over is one file per token in *this* page — and with variants
       that is several files per image, not one. The note used to promise "one confirmation
       each" against a count of originals, which was several times short. */
    /* Counted from the rendered page, not from `html`: by here every asset token has been
       rewritten to a path or a data URI, so counting tokens in it always found none. */
    const tk = buildPage(target().pg, withVariants(target(), mode.value));
    const nVar = assetVariantsIn(tk).length;
    const nFiles = assetsUsedIn(tk).length + nVar;
    $('#exNote').innerHTML = mode.value === 'files'
      ? `Image tags point at <code>assets/…</code>, so keep the downloaded <b>assets</b> folder beside the HTML.
         ${nVar ? `Each photo is written at several widths with a <code>srcset</code>, so a phone fetches a small
         one and a desktop a large one. ` : ''}Downloading this page hands over
         ${nFiles ? `<b>${nFiles}</b> image file${nFiles === 1 ? '' : 's'}` : 'the images it uses'} — one confirmation each.
         Best for real hosting: browsers cache the images across pages.`
      : `One self-contained file: semantic markup, a single inline stylesheet, and every image embedded.
         Nothing to upload alongside it. The global header and footer are inlined into every page.`;
  };
  pick.addEventListener('change', draw);
  mode.addEventListener('change', draw);
  draw();

  $('#exOne').addEventListener('click', event => withAction(event.currentTarget, 'Preparing page…', async () => {
    const action = captureExportAction(mode.value, [target()]);
    const [{ target: t, data: html }] = await prepareExportPages(action,
      (candidate, exportMode) => exportPage(candidate.pg, exportMode, candidate));
    let assetFiles = [];
    if (action.mode === 'files') {
      /* Build the unresolved source with the same frozen target and preflight every original
         and variant before downloading the HTML that promises those files. */
      const source = buildPage(t.pg, withVariants(t, action.mode));
      assetFiles = await action.wait(() => exportAssetFiles(source));
    }
    action.check();
    /* a nested file keeps its folder in the name; browsers save it flat, so the note
       says where it belongs */
    if (await download(t.path.replace(/\//g, '-'), html) === false) return false;
    if (t.rel) toast('Put this in a ' + t.path.split('/')[0] + '/ folder, named ' + t.path.split('/').pop());
    for (const file of assetFiles) {
      if (await download(file.path.replace(/^assets\//, ''), file.data, file.type) === false) return false;
    }
  }, 'Page export ready. Download started.'));

  $('#exAll').addEventListener('click', event => withAction(event.currentTarget, 'Preparing pages…', async () => {
    const action = captureExportAction(mode.value, targets);
    const pages = await prepareExportPages(action,
      (candidate, exportMode) => exportPage(candidate.pg, exportMode, candidate));
    let assetFiles = [];
    if (action.mode === 'files') {
      /* every page's worth of tokens, so a variant used on one page only is still written */
      let all = '';
      for (const t of action.targets) all += buildPage(t.pg, withVariants(t, action.mode));
      assetFiles = await action.wait(() => exportAssetFiles(all));
    }
    action.check();
    for (const { target: t, data: html } of pages) {
      if (await download(t.path.replace(/\//g, '-'), html) === false) return false;
    }
    for (const file of assetFiles) {
      if (await download(file.path.replace(/^assets\//, ''), file.data, file.type) === false) return false;
    }
  }, 'Page exports ready. Downloads started.'));

  $('#exCopy').addEventListener('click', event => withAction(event.currentTarget, 'Preparing HTML…', async () => {
    const action = captureExportAction(mode.value, [target()]);
    const [{ data: html }] = await prepareExportPages(action,
      (candidate, exportMode) => exportPage(candidate.pg, exportMode, candidate));
    try { await navigator.clipboard.writeText(html); }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents(code);
      const sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(r);
      throw new Error('Automatic copy is unavailable. HTML selected — press ⌘C to copy.');
    }
  }, 'HTML copied to clipboard.'));

  $('#exSeo').addEventListener('click', event => withAction(event.currentTarget, 'Preparing SEO files…', async () => {
    /* the button is disabled without a Site URL, so this is a belt-and-braces guard:
       a sitemap with no domain is worse than no sitemap */
    if (!state.meta.baseUrl) {
      toast('Add a Site URL in Project settings first');
      return;
    }
    if (await download('sitemap.xml', sitemapXml(), 'application/xml') === false) return false;
    return download('robots.txt', robotsTxt(), 'text/plain');
  }, 'SEO files ready. Downloads started.'));
  /* The whole site as one archive: real folder paths, the images beside them, and
     the SEO files. This is the only export that can honour a nested detail page,
     since a browser download saves flat. */
  const buildSite = async (action, plan) => {
    const files = [];
    /* fetched once for the whole archive, and null when it could not be — offline, or a
       request refused — in which case every page links Google as it always did */
    const pack = state.meta.selfHostFonts
      ? await action.wait(() => selfHostedFonts())
      : null;
    if (pack) pack.files.forEach(f => files.push({ path: f.path, data: f.blob }));
    action.check();
    for (const step of plan) {
      /* a zip is separate files by definition, so it always carries variants */
      if (step.kind === 'page') files.push({ path: step.path, data: assetsToPaths(buildPage(step.target.pg, { ...withVariants(step.target, 'files'), fontCss: pack ? pack.css : '' }), step.target.rel) });
      else if (step.kind === 'content') files.push({ path: step.path, data: contentJson(assetPath) });
      else if (step.kind === 'sitemap') files.push({ path: step.path, data: sitemapXml() });
      else if (step.kind === 'robots') files.push({ path: step.path, data: robotsTxt() });
    }
    /* every image any page references, once, at the path those pages point to */
    let every = '';
    for (const t of action.targets) every += buildPage(t.pg, withVariants(t, 'files'));
    /* content.json can carry a published CMS image that no rendered page happens to use. Its
       path is still a promise made by the archive, so include those tokens in the byte plan. */
    if (collections().length) every += contentJson();
    for (const file of await action.wait(() => exportAssetFiles(every))) files.push({ path: file.path, data: file.data });
    return files;
  };
  $('#exZip').addEventListener('click', event => withAction(event.currentTarget, 'Building archive…', async () => {
    const action = captureExportAction('files', targets);
    const plan = sitePlan();
    const name = (slugify(state.meta.name) || 'site') + '.zip';
    const files = await buildSite(action, plan);
    const blob = await action.wait(() => makeZip(files));
    return download(name, blob, 'application/zip');
  }, 'Site archive ready. Download started.', {key:'site-export', paint:true}));
  /* The footer says what the committed action will actually produce, so the count
     is not hidden inside a tooltip on the button. */
  const foot = $('#exFoot');
  if (foot) {
    const n = sitePlan().length;
    const imgs = new Set();
    /* the archive is separate files by definition, so it carries the variants too and the
       count has to include them — it said "1 image" for an archive holding seven */
    let every = '';
    for (const t of exportTargets()) every += buildPage(t.pg, withVariants(t, 'files'));
    for (const a of assetsUsedIn(every)) imgs.add(a.id);
    const nv = assetVariantsIn(every).length;
    const nImg = imgs.size + nv;
    foot.innerHTML = `The archive holds <b>${n + nImg}</b> file${n + nImg === 1 ? '' : 's'}`
      + ` — ${targets.length} page${targets.length === 1 ? '' : 's'}`
      + `${nImg ? `, ${nImg} image file${nImg === 1 ? '' : 's'}` : ''}`
      + `${collections().length ? ', content.json' : ''}`
      + `${state.meta.baseUrl ? ', sitemap and robots' : ''}.`;
  }
  const exc = $('#exContent');
  if (exc) exc.addEventListener('click', () => withAction(exc, 'Preparing content…', () => download('content.json', contentJson(assetPath), 'application/json'), 'Content export ready. Download started.', {key:'content-export', paint:true}));
  $('#exJson').addEventListener('click', backupJson);
  const inContent = $('#exContentIn');
  if (inContent) inContent.addEventListener('click', () => {
    const fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.json,application/json';
    fi.onchange = () => {
      const f = fi.files[0]; if (!f) return;
      const action = feedback().begin(inContent, 'Importing content…'); if (!action) return;
      const rd = new FileReader();
      rd.onerror = () => action.error('Could not read this file. Try again.');
      rd.onload = () => {
        let rep = null;
        /* inside `edit` so the whole file is one undo step: an import that landed forty
           items should come back out in one press, not forty */
        try {
          const resolveImage = contentImageResolver();
          edit(() => { rep = contentImport(JSON.parse(rd.result), {resolveImage}); }, 'Import content');
        } catch (e) { rep = null; }
        if (!rep) { action.error('That file has no collections in it — expected a content.json'); return; }
        render();
        /* the counts, because an upsert is invisible otherwise: nothing was deleted and you
           cannot tell what landed by looking at the CMS */
        const bits = [];
        if (rep.collections.added) bits.push(`${rep.collections.added} new collection${rep.collections.added === 1 ? '' : 's'}`);
        if (rep.fields.added) bits.push(`${rep.fields.added} new field${rep.fields.added === 1 ? '' : 's'}`);
        if (rep.items.added) bits.push(`${rep.items.added} item${rep.items.added === 1 ? '' : 's'} added`);
        if (rep.items.updated) bits.push(`${rep.items.updated} updated`);
        action.success(bits.length ? bits.join(' · ') : 'Nothing in that file was new');
        /* a note is something the author has to act on, so it gets a dialog rather than a
           toast that disappears */
        if (rep.notes.length) {
          askConfirm('Imported, with notes',
            '<ul style="margin:0;padding-left:18px">' + rep.notes.map(n => `<li>${esc(n)}</li>`).join('') + '</ul>',
            { ok: 'Got it', danger: false });
        }
      };
      rd.readAsText(f);
    };
    fi.click();
  });

  $('#exImport').addEventListener('click', () => {
    const fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.json,application/json';
    fi.onchange = () => {
      const f = fi.files[0]; if (!f) return;
      const action = feedback().begin($('#exImport'), 'Importing project…'); if (!action) return;
      const rd = new FileReader();
      rd.onerror = () => action.error('Could not read this file. Try again.');
      rd.onload = () => {
        let d = null;
        try { d = migrate(JSON.parse(rd.result)); } catch (e) { d = null; }
        if (!d) { action.error('That file is not a Pagecraft project this build can open'); return; }
        checkpoint('Import project');
        state.meta = { ...state.meta, ...d.meta }; state.header = d.header || []; state.footer = d.footer || [];
        state.pages = d.pages; state.cur = 0; selSet([]);
        closeModal(); render(); writeNow(); action.success('Project imported.');
      };
      rd.readAsText(f);
    };
    fi.click();
  });
}

function wireUnit(id, get, set) {
  const num = $('#' + id), unit = $('#' + id + 'U');
  if (!num || !unit) return;
  const push = () => {
    tx('project:' + id);
    const v = String(num.value).trim();
    set(v === '' ? '' : v + unit.value);
    paintCss(); save();
  };
  num.addEventListener('input', push);
  num.addEventListener('blur', endTx);
  unit.addEventListener('change', () => { push(); endTx(); });
}
function langSelect(id, val) {
  const cur = String(val || 'en');

      ${LANGS.map(([v, l]) => `<option value="${esc(v)}"${cur === v ? ' selected' : ''}>${esc(l)} — ${esc(v)}</option>`).join('')}
      ${known ? '' : `<option value="${esc(cur)}" selected>${esc(cur)}</option>`}
    </select>`;
}

/* A new page starts from a template built out of this project's own tokens. */
function newPageModal() {
  const categories = ['All', ...new Set(TEMPLATES.map(t => t.category))];
  openModal('New page', `
    <div class="templateChooser">
      <div class="templateControls">
        <div class="f"><label for="npName">Page name</label><input class="ctl" id="npName" value="" placeholder="Uses the template name"></div>
        <div class="f"><label for="templateSearch">Find a page</label><input class="ctl" id="templateSearch" type="search" autocomplete="off" placeholder="Search landing, portfolio, article…"></div>
      </div>
      <div class="templateFilters" role="toolbar" aria-label="Filter page templates">
        ${categories.map((category, index) => `<button type="button" class="templateFilter" data-template-filter="${esc(category)}" aria-pressed="${index === 0 ? 'true' : 'false'}">${esc(category)}</button>`).join('')}
      </div>
      <div class="templateSummary"><span id="templateCount" aria-live="polite"><b>${TEMPLATES.length}</b> Pagecraft templates</span><button type="button" id="templateClear" hidden>Clear filters</button></div>
      <div class="tplgrid">${TEMPLATES.map(t => `
        <button type="button" class="tpl" data-tpl="${esc(t.id)}" data-category="${esc(t.category)}" data-search="${esc([t.name, t.desc, t.category, ...t.keywords].join(' ').toLowerCase())}">
          <span class="templatePreviewWrap">${templatePreview(t.id)}</span>
          <span class="templateCardCopy"><span><b>${esc(t.name)}</b><small>${esc(t.desc)}</small></span><span class="templateCategory">${esc(t.category)}</span></span>
        </button>`).join('')}</div>
      <div class="templateEmpty" id="templateEmpty" hidden><b>No templates match</b><span>Try a different search or clear the category filter.</span></div>
    </div>`, '', 'lg');
  const nameEl = $('#npName');
  const searchEl = $('#templateSearch');
  let category = 'All';
  const filterButtons = $$('[data-template-filter]', $('#modal'));
  const templateButtons = $$('[data-tpl]', $('#modal'));
  const applyFilter = () => {
    const query = searchEl.value.trim().toLowerCase();
    let shown = 0;
    templateButtons.forEach(button => {
      const visible = (category === 'All' || button.dataset.category === category)
        && (!query || button.dataset.search.includes(query));
      button.hidden = !visible;
      if (visible) shown++;
    });
    $('#templateCount').innerHTML = `<b>${shown}</b> ${shown === 1 ? 'Pagecraft template' : 'Pagecraft templates'}`;
    $('#templateEmpty').hidden = shown !== 0;
    $('#templateClear').hidden = category === 'All' && !query;
  };
  filterButtons.forEach(button => button.addEventListener('click', () => {
    category = button.dataset.templateFilter;
    filterButtons.forEach(item => item.setAttribute('aria-pressed', String(item === button)));
    applyFilter();
  }));
  searchEl.addEventListener('input', applyFilter);
  $('#templateClear').addEventListener('click', () => {
    category = 'All'; searchEl.value = '';
    filterButtons.forEach((item, index) => item.setAttribute('aria-pressed', String(index === 0)));
    applyFilter(); searchEl.focus();
  });
  nameEl.focus();
  templateButtons.forEach(b => b.addEventListener('click', () => {
    const tid = b.dataset.tpl;
    closeModal();
    edit(() => {
      state.pages.push(pageFromTemplate(tid, nameEl.value.trim() || undefined));
      state.cur = state.pages.length - 1;
      selSet([]); state.ui.mode = 'page';
    });
    if (document.body.classList.contains('pages-open')) openPage(state.cur);
    toast(`“${page().name}” created`);
  }));
}

/** Resource editors can rewrite project CSS while this legacy modal remains mounted. Refresh
    its code controls when that section is reopened, without disturbing a field being edited. */
function syncProjectSettingsCodeFields() {
  [['mCss', 'css'], ['mHeadHtml', 'headHtml']].forEach(([id, key]) => {
    const field = $('#' + id);
    if (!field || document.activeElement === field) return;
    const live = String(state.meta[key] || '');
    if (field.value !== live) field.value = live;
  });
}

/* ---- find and replace -----------------------------------------------
   Grouped by where a hit lives, because "which page was that on" is the question
   being asked. A row is a button: it switches page or global region, selects the
   element and scrolls to it. Replace is one action over the whole project with undo
   behind it, since a per-hit replace list goes stale the moment the first one lands. */
let findState = { q: '', to: '', ci: true };
/* ---- the bind sheet -------------------------------------------------
   One dialog that shows the whole mapping and commits it in one go. Binding used to
   be one control at a time — select, open Content, click the badge, pick a field,
   repeat — which was about fifteen interactions for a five-field card, and there was
   nowhere to see what was bound to what. */
function bindModal(rootId) {
  if (editing.on) exitEdit();
  const sc = bindScope(rootId);
  if (!sc) { toast('Point this at a collection first'); return; }
  const col = sc.col;
  const slots = bindSlots(rootId);
  if (!slots.length) {
    toast('Nothing inside this to bind — add a Heading, an Image or a text block');
    return;
  }
  let map = guessBindings(slots, col);
  const key = s => s.nodeId + '|' + s.key;
  const slotLabel = (s, i) => {
    const base = `${s.element} · ${DEF[s.type].label} · ${s.label}`;
    const duplicate = slots.some((other, j) => j !== i && `${other.element} · ${DEF[other.type].label} · ${other.label}` === base);
    return duplicate ? `${base} · ${i + 1}` : base;
  };

  const draw = () => {
    const set = Object.values(map).filter(Boolean).length;
    $('#bsCount').innerHTML = set
      ? `<b>${set}</b> of ${slots.length} bound to <b>${esc(col.name)}</b>`
      : `Nothing bound yet. ${slots.length} places could take a value.`;
    $('#bsBody').innerHTML = `<table class="cmst"><thead><tr>
        <th>Element</th><th style="width:150px">Its field</th><th style="width:230px">Takes its value from</th>
      </tr></thead><tbody>${slots.map((s, i) => `<tr>
        <td><b style="font-size:var(--fs-2)">${esc(s.element)}</b><br><small style="font-family:var(--label);font-size:var(--fs-1);color:var(--text-3)">${esc(DEF[s.type].label)}</small></td>
        <td>${esc(s.label)}</td>
        <td><select class="ctl" data-b="${i}" aria-label="${esc(slotLabel(s, i))}">
          <option value="">— not bound —</option>
          ${/* `fieldPaths`, so a reference can be read through here as well as in the badge —
                 a sheet that could only offer this collection's own fields would make the
                 whole-card flow the one place a reference was useless */''}
          ${fieldPaths(col).filter(f => !s.fieldTypes || s.fieldTypes.includes(f.type)).map(f => `<option value="${esc(f.path)}"${map[key(s)] === f.path ? ' selected' : ''}>${esc(f.label)} · ${f.type}</option>`).join('')}
        </select></td>
      </tr>`).join('')}</tbody></table>`;
    $$('#bsBody select').forEach(el => el.addEventListener('change', () => {
      map[key(slots[+el.dataset.b])] = el.value;
      draw();
    }));
  };

  openModal(`Bind to ${col.name}`, `
    <div id="bsBody"></div>`, `
    <span class="note" id="bsCount" style="margin:0;flex:1;text-align:left"></span>
    <button class="btn" id="bsGuess">Suggest again</button>
    <button class="btn" id="bsNone">Clear all</button>
    <button class="btn primary" id="bsOk">Bind</button>`, 'lg');

  $('#bsGuess').addEventListener('click', () => { map = guessBindings(slots.map(s => ({ ...s, current: '' })), col); draw(); });
  $('#bsNone').addEventListener('click', () => { slots.forEach(s => { map[key(s)] = ''; }); draw(); });
  $('#bsOk').addEventListener('click', () => {
    let n = 0;
    edit(() => { n = applyBindings(map); });
    closeModal(); render();
    toast(n ? `${n} binding${n === 1 ? '' : 's'} set` : 'Nothing changed');
  });
  draw();
}

function findModal() {
  if (editing.on) exitEdit();
  openModal('Find and replace', `
    <div class="fgrid" style="margin-bottom:var(--gap-2)">
      <div class="f"><label>Find</label>
        <input class="ctl" id="fdQ" value="${esc(findState.q)}" placeholder="Text on any page, or in the CMS" autocomplete="off"></div>
      <div class="f"><label>Replace with</label>
        <input class="ctl" id="fdTo" value="${esc(findState.to)}" placeholder="Leave empty to delete it" autocomplete="off"></div>
    </div>
    <div class="tog-row" style="margin-bottom:var(--gap-2)"><span>Match case</span>
      <button class="sw-tog${findState.ci ? '' : ' on'}" id="fdCase"><i></i></button></div>
    <div id="fdOut"></div>`, `
    <span class="note" id="fdCount" style="margin:0;flex:1;text-align:left"></span>
    <button class="btn danger" id="fdRep">Replace all</button>
    <button class="btn primary" id="fdDone">Close</button>`);

  const q = $('#fdQ'), to = $('#fdTo'), out = $('#fdOut'), count = $('#fdCount'), rep = $('#fdRep');

  const draw = () => {
    findState.q = q.value; findState.to = to.value;
    const hits = searchAll(findState.q, { caseSensitive: !findState.ci });
    const total = searchCount(hits);
    rep.disabled = !total;
    count.innerHTML = !findState.q
      ? 'Searches every page, both global regions and the CMS.'
      : total
        ? `<b>${total}</b> occurrence${total === 1 ? '' : 's'} in ${hits.length} place${hits.length === 1 ? '' : 's'}`
        : 'Nothing found.';
    if (!findState.q) { out.innerHTML = '<div class="empty">Type to search.</div>'; return; }
    if (!hits.length) { out.innerHTML = `<div class="empty">No match for <b>${esc(findState.q)}</b>.</div>`; return; }
    /* group in the order searchAll walked, so the list reads header → pages → footer → CMS */
    const groups = [];
    hits.forEach(h => {
      const key = h.where + ':' + h.pageName;
      let g = groups.find(x => x.key === key);
      if (!g) groups.push(g = { key, name: h.pageName, where: h.where, rows: [] });
      g.rows.push(h);
    });
    out.innerHTML = groups.map((g, gi) => `
      <div class="xlab"${gi ? ' style="margin-top:var(--gap-3)"' : ''}>${esc(g.name)}${g.where === 'cms' ? ' · CMS' : ''}</div>
      ${g.rows.map(h => `<button class="hitrow" data-h="${hits.indexOf(h)}">
        <span class="hn">${esc(h.element)}</span>
        <span class="hf">${esc(h.field)}</span>
        <span class="hs">${esc(h.snippet)}</span>
        ${h.hits > 1 ? `<span class="hc">${h.hits}×</span>` : ''}
      </button>`).join('')}`).join('');

    $$('.hitrow', out).forEach(b => b.addEventListener('click', () => {
      const h = hits[+b.dataset.h];
      closeModal();
      /* a hit goes wherever it is edited: an element on the canvas, an item in the
         CMS dialog, a page's own fields in the Pages panel, the project name in
         Project settings */
      if (h.where === 'cms') { cmsModal(h.colId); return; }
      if (h.where === 'project') { projectModal(); return; }
      state.ui.mode = h.where === 'page' ? 'page' : h.where;
      if (h.where === 'page') state.cur = h.page;
      render();
      if (h.type === 'meta') { showPanel('pages'); selSet([]); return; }
      select(h.nodeId, { scroll: true });
    }));
  };

  const live = dbounce(draw, 140);
  q.addEventListener('input', live);
  to.addEventListener('input', () => { findState.to = to.value; });
  $('#fdCase').addEventListener('click', () => {
    findState.ci = !findState.ci;
    $('#fdCase').classList.toggle('on', !findState.ci);
    draw();
  });
  rep.addEventListener('click', async () => {
    const n = searchCount(searchAll(findState.q, { caseSensitive: !findState.ci }));
    if (!n) return;
    if (!await askConfirm('Replace across the whole project?',
      `<b>${n}</b> occurrence${n === 1 ? '' : 's'} of “${esc(findState.q)}” become “${esc(findState.to) || '<i>nothing</i>'}”, `
      + 'on every page, in both global regions and in the CMS. ⌘Z undoes it in one step.',
      { ok: 'Replace all ' + n, danger: true })) return;
    let did = 0;
    edit(() => { did = replaceAll(findState.q, findState.to, { caseSensitive: !findState.ci }); });
    render();
    toast(`Replaced ${did} occurrence${did === 1 ? '' : 's'}`);
    draw();
  });
  $('#fdDone').addEventListener('click', closeModal);
  draw();
  q.focus(); q.select();
}
