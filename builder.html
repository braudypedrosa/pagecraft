.arow img{width:34px;height:34px;flex:0 0 34px;border-radius:var(--r-sm);object-fit:cover;background:var(--field-2)}
.arow .an{flex:1;min-width:0}
.arow .an b{display:block;font-size:var(--fs-3);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .an small{color:var(--text-3);font-family:var(--label);font-size:var(--fs-2)}
/* Every control in a dense row shares --h-row, so a row is one line and its
   columns line up. The colour rows had a 30px swatch, a 27px name field, a 35px
   hex field and a 32px button stacked against each other. */
.arow .ctl{height:var(--h-row);padding:var(--pc-control-padding)}
.arow select.ctl{padding:var(--pc-control-padding);padding-right:calc(var(--pc-control-padding-x) + 14px);background-position:right var(--pc-control-padding-x) center;background-size:9px 9px}
.arow .sw{width:var(--h-row);height:var(--h-row);flex:0 0 var(--h-row)}
.arow .iconbtn,.arow .rowlock{width:var(--h-row);height:var(--h-row);flex:0 0 var(--h-row)}
/* holds the slot a deletable row uses for its trash button, so a built-in token
   and a custom one are the same shape */
.arow .rowlock{display:grid;place-items:center;color:var(--text-3)}
/* a read-only figure in a dense row: takes the row height like a control would, so
   it cannot push the row onto a second line the way a stacked <small> did */
.arow .rowmeta{
  flex:0 0 74px;height:var(--h-row);display:flex;align-items:center;justify-content:flex-end;
  font-family:var(--label);font-size:var(--fs-1);color:var(--text-3);white-space:nowrap;
}
.arow .un{color:var(--warn);font-weight:600}
.arow.open{border-color:var(--ink);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.iconbtn.flip svg{transform:rotate(180deg)}
.tsedit{
  border:1px solid var(--ink);border-top:0;border-radius:0 0 var(--r-md) var(--r-md);
  padding:12px 12px 10px;margin-bottom:6px;background:var(--field);
}
.tsedit .f{margin-bottom:var(--pc-field-gap)}
.tsedit .row2{gap:var(--sp-4)}

/* ---------------------------------------------------------------- drag --- */
/* The context menu. In the outer document, so it is never clipped by the canvas
   iframe and never scaled with it. */
#ctx{
  position:fixed;z-index:9600;min-width:212px;padding:5px;
  background:var(--panel);border:1px solid var(--line-2);border-radius:var(--r-md);
  box-shadow:var(--shadow-lg);display:flex;flex-direction:column;
}
#ctx button{
  gap:var(--sp-6);
}
#ctx button em{font-family:var(--label);font-size:var(--fs-1);font-style:normal;color:var(--text-3)}
#ctx button:hover em{color:var(--text-2)}
/* the bar's "everything else" glyph is the drag dots turned on their side */

#ghost{
  position:fixed;z-index:9999;pointer-events:none;padding:7px 12px;border-radius:var(--r-md);
  background:var(--ink);color:var(--paper);font-size:var(--fs-3);font-weight:500;box-shadow:var(--shadow-lg);
  transform:translate(12px,12px);display:none;align-items:center;gap:var(--sp-4);
}
#ghost svg{width:13px;height:13px;color:var(--green)}
body.dragging{cursor:grabbing !important;user-select:none}

/* --------------------------------------------------------------- modal --- */
.mask{position:fixed;inset:0;background:var(--pc-dialog-scrim);z-index:200;display:grid;place-items:center;padding:24px}
.mask[hidden]{display:none}
.modal{
  background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);
  width:100%;max-width:880px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;
}

/* Site settings retain the builder shell and separate everyday controls from code. */
.mask:has(.project-settings){inset:52px 0 0 var(--pc-rail-width);padding:0;background:var(--panel);backdrop-filter:none}
.project-settings{max-width:none;width:100%;height:100%;max-height:none;border-radius:0;box-shadow:none}
.project-settings #mBody{padding:0;overflow:hidden;flex:1;min-height:0;display:flex}
.settings-layout{display:flex;flex:1;min-width:0;min-height:0}
.settings-nav{width:184px;flex:0 0 184px;border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.settings-nav button{text-align:left;padding:11px 12px;border-radius:var(--r-sm);color:var(--text-2);font-size:var(--fs-3)}
.settings-nav button:hover{background:var(--pc-hover-bg)}
.settings-nav button[aria-current]{background:var(--pc-selection-bg);color:var(--pc-selection-text);font-weight:600}
.settings-content{flex:1;min-width:0;overflow:auto;padding:28px 32px}
.settings-content section{max-width:980px;margin:0 auto}
.settings-content section[hidden]{display:none}
.settings-content h2{font-size:var(--fs-5);margin:0 0 24px}
.settings-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--pc-field-gap) var(--pc-space-5)}
.settings-fields>.f{margin:0;min-width:0}
.settings-fields.settings-fields-type{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 140px}
#settings-typography .f:has(#mStyles),#settings-colors .f,#settings-classes .f,#settings-code .f,.settings-reset{grid-column:1/-1}

.settings-reset h3{font-size:var(--fs-4);margin:0 0 8px}

.settings-reset-actions{display:flex;gap:var(--pc-action-gap);flex-wrap:wrap}
.project-settings #mStyles .arow{border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;padding:9px 0;background:transparent;gap:10px}
.project-settings #mStyles .tsedit{border:0;border-bottom:1px solid var(--line);border-radius:0;margin:0;padding:20px;background:var(--field)}
.project-settings #mStyles>.btn{margin-top:16px}
.text-style-columns{display:none}
.project-settings .text-style-columns{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);color:var(--text-2);font-size:var(--fs-1)}

@media(max-width:1050px){.settings-nav{width:146px;flex-basis:146px;padding:16px 8px}.settings-content{padding:24px 20px}.settings-fields{gap:16px}.project-settings #mStyles .arow{gap:6px}.project-settings .text-style-columns{gap:6px}}

.modal.sm{max-width:440px}
.modal.lg,#ask .modal.media-library{max-width:1060px}
/* The ask layer sits above #modal rather than reusing it: over half of these
   prompts fire from inside Project settings, and reusing the one modal element
   would tear the dialog underneath out from under the user. Keep that dialog's
   draft mounted but hide its mask and card while the focused prompt is shown. */
#modal[inert][aria-hidden="true"]{visibility:hidden}
#ask{z-index:300;padding:24px}
#ask .modal{max-width:420px}
#askBody{padding:var(--mpad)}
#ask .media-library #askBody{padding:0;display:flex;overflow:hidden}
#askBody .msg{font-size:var(--fs-3);line-height:1.6;color:var(--text-2)}
#askBody .msg b{color:var(--text)}
.pickrows{display:flex;flex-direction:column;gap:var(--sp-2)}
.pickrow{
  text-align:left;padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--line);
  background:var(--panel);font-size:var(--fs-3);color:var(--text-2);
}
.pickrow:hover{background:var(--lift-bg);border-color:var(--lift-line);color:var(--text)}
.pickrow.on{border-color:var(--ink);background:var(--pc-selection-bg);color:var(--pc-selection-text);font-weight:600}
/* The items table — one row per item, one column per field.
   This existed twice, ~20 lines apart, and the live styling was a *merge*: the later
   copy won on th/td padding and on the whole `.cmsimg` treatment, while
   `table-layout:fixed`, the header ellipsis and `line-height` survived from the
   earlier one because the later copy never restated them. One block now, carrying
   what that merge actually resolved to — with the header padding corrected.

   A header sits directly over the field it names: `td` has no left padding, so
   `th` must not either, or every column label is 8px right of its own input. */
.cmst{width:100%;border-collapse:collapse;table-layout:fixed}
/* A held-back row reads as inactive without hiding it: you still edit a draft here, and
   the table is the one place that has to show both what is live and what is not. */
.cmst tr.isdraft td{opacity:.5}
.cmst tr.isdraft td:has(input[type="checkbox"]){opacity:1}
.cmst th{
  text-align:left;padding:0 8px 8px 0;font-family:var(--label);font-size:var(--fs-1);font-weight:600;
  color:var(--text-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cmst th:last-child{padding-right:0}
.cmst td{padding:var(--pc-table-cell-y) var(--pc-table-cell-x) var(--pc-table-cell-y) 0;vertical-align:middle}
.cmst td:last-child{padding-right:0}
.cmst tr+tr td{border-top:1px solid var(--line)}
.cmst .ctl{padding:var(--pc-control-padding)}
.cmst textarea.ctl{min-height:0;line-height:1.4;resize:vertical}
.cmsimg{
  width:56px;height:40px;border:1px solid var(--line-2);border-radius:var(--r-sm);
  background:var(--field);display:grid;place-items:center;overflow:hidden;padding:0;
  font-family:var(--label);font-size:var(--fs-1);color:var(--text-3);
}
.cmsimg:hover{border-color:var(--text-3);background:var(--panel)}
.cmsimg img{width:100%;height:100%;object-fit:cover;display:block}

/* the media library grid — same cards in the panel and in the picker */
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(152px,100%),1fr));gap:var(--sp-4)}
.mgrid.wide{grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:var(--sp-5)}
.pc-dialog.media-library .pc-dialog-body{padding:0;display:flex;overflow:hidden}
.media-library-drop{position:relative;display:flex;flex:1;min-width:0;min-height:180px}
.media-library-items{width:100%;padding:var(--mpad);overflow:auto}
.media-browser{display:flex;flex-direction:column;gap:var(--sp-4);min-width:0;flex:1}
.media-view-switch{display:flex;gap:var(--sp-3)}
.media-view-switch [aria-pressed="true"]{background:var(--pc-selection-bg)}
.media-upload-target{min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-4);border:1px dashed var(--line-2);border-radius:var(--r-md);padding:var(--sp-5);text-align:center}
.media-browser [hidden]{display:none}
.media-browser-tools{display:flex;flex-wrap:wrap;gap:var(--sp-3)}
.media-browser-tools label{display:flex;flex-direction:column;gap:var(--sp-2);font:var(--pc-type-label);min-width:0;flex:1 1 100px}
.media-browser-tools label:first-child{flex:2 1 160px}
.media-browser-tools input,.media-browser-tools select{width:100%;min-width:0}
.media-asset-details{display:flex;flex-direction:column;gap:var(--sp-3);padding:var(--sp-4);border:1px solid var(--line);border-radius:var(--r-sm);min-width:0}
.media-asset-details .note,.media-asset-details ul{margin:0}
.media-asset-details .media-browser-page,.media-browser-page[data-media-selection]{flex-wrap:wrap}
.media-browser-page[data-media-selection]{justify-content:flex-start}
.media-browser-page [data-media-selected]{margin-right:auto}
.media-asset-details strong{min-width:0;overflow-wrap:anywhere;flex:1}
.media-asset-details button{flex-shrink:0}
.media-asset-details ul{list-style:none;padding:0;display:flex;flex-direction:column;gap:var(--sp-3)}
.media-asset-details [data-media-reference]{white-space:normal;text-align:left;justify-content:flex-start;max-width:100%;overflow-wrap:anywhere}
.media-asset-details [data-tags-status]{flex-basis:100%;overflow-wrap:anywhere}
.media-asset-details [data-tags-status]:empty{display:none}
.media-asset-details form{display:flex;flex-wrap:wrap;align-items:end;gap:var(--sp-3)}
.media-asset-details label{display:flex;flex-direction:column;gap:var(--sp-2);flex:1 1 160px;min-width:0;font:var(--pc-type-label)}
.media-asset-details input{width:100%;min-width:0}
.media-browser-page{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3)}
.media-library-overlay{
  position:absolute;inset:0;z-index:2;display:none;place-content:center;justify-items:center;
  gap:var(--pc-space-2);background:var(--pc-selection-bg);color:var(--pc-selection-text);
  font:var(--pc-type-control);pointer-events:none;
}
.media-library-drop.over .media-library-overlay{display:grid}
/* `width:100%` matters: a <button> sizes to fit-content, so a long filename with
   `white-space:nowrap` widened the card past its grid cell and the 4:3 thumb grew
   with it — one card 254px in a 161px column, and a row of uneven tiles. */
.mcard{
  display:flex;flex-direction:column;gap:var(--sp-2);padding:6px;text-align:left;width:100%;
  border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);cursor:pointer;
  transition:border-color .12s,background .12s;min-width:0;
}
.mcard:hover{background:var(--lift-bg);border-color:var(--lift-line)}
.mcard.on{border-color:var(--ink);background:var(--pc-selection-bg);box-shadow:0 0 0 2px #b7f34a55}
.mthumb{
  display:block;aspect-ratio:4/3;border-radius:var(--r-sm);overflow:hidden;background:var(--field-2);
  background-image:linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%);
  background-size:10px 10px;background-position:0 0,5px 5px;
}
.mthumb img{width:100%;height:100%;object-fit:contain;display:block}
.mname{font-size:var(--fs-2);font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msub{font-family:var(--label);font-size:var(--fs-1);color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* sibling of the card inside .mitem, not a descendant of it */
.mitem .mdel{
  position:absolute;top:var(--sp-4);right:var(--sp-4);width:var(--ic-md);height:var(--ic-md);border-radius:var(--r-sm);
  display:grid;place-items:center;background:var(--panel);border:1px solid var(--line-2);
  color:var(--text-3);opacity:0;transition:opacity .12s;
}
.mitem{position:relative;display:flex;flex-direction:column;gap:var(--sp-3);min-width:0}
.mitem>[data-media-detail]{width:100%}
.mitem:hover .mdel,.mitem:focus-within .mdel{opacity:1}
.mitem .mdel:hover{background:var(--panel);border-color:var(--danger);color:var(--danger);box-shadow:0 2px 8px #11131124}
.mh{display:flex;align-items:center;gap:var(--sp-5);padding:16px var(--mpad);border-bottom:1px solid var(--line)}
.mh b{font-size:var(--fs-5);font-weight:600;flex:1;letter-spacing:-.02em}
.mb{padding:var(--mpad);overflow:auto;flex:1;min-height:0}
/* wrap is a safety net, not a layout: a footer should hold the committed action
   and its near alternatives, and anything that needs a second line has outgrown
   the footer. The Export dialog had eight buttons here doing three unrelated jobs. */
.mf{padding:13px var(--mpad);border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:var(--sp-4);justify-content:flex-end;align-items:center;background:var(--field)}

/* secondary actions that belong in the body, where they can be grouped and
   explained, rather than crowded into the footer beside the primary one */
.xtra{border-top:1px solid var(--line);margin-top:var(--gap-3);padding-top:var(--gap-3)}
.xtra+.xtra{margin-top:var(--gap-2)}
.xlab{

}
.xrow{display:flex;flex-wrap:wrap;gap:var(--gap-1);align-items:center}
.xrow .btn{font-size:var(--fs-2)}
.xrow .btn[disabled]{opacity:.45;cursor:default}
.xrow .btn[disabled]:hover{background:var(--panel);border-color:var(--line-2)}

/* one search hit: what it is, which field, and the words around it */
.hitrow{

  width:100%;text-align:left;padding:8px 10px;border-radius:var(--r-sm);

}

}

  overflow:auto;max-height:52vh;white-space:pre;margin:0;
}
.kbd{
  display:inline-block;padding:2px 6px;border-radius:var(--r-sm);background:var(--field-2);
  border:1px solid var(--line-2);font-family:var(--label);font-size:var(--fs-2);color:var(--text-2);
}
.kt{width:100%;border-collapse:collapse}
.kt td{padding:7px 4px;border-bottom:1px solid var(--line);font-size:var(--fs-3);color:var(--text-2)}
.kt td:last-child{text-align:right;white-space:nowrap}
.review{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-bottom:16px}
.review .rh{display:flex;align-items:center;gap:var(--sp-4);padding:12px 14px;background:var(--field);font-size:var(--fs-3);font-weight:600}
.review .rh .dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
.review .rh .dot.ok{background:var(--green)}
.review .rh .dot.bad{background:var(--danger)}
.review .rh .dot.warn{background:var(--warn)}
.review .rh .spacer{flex:1}
.review ul{list-style:none;margin:0;padding:0}
.review li{display:flex;gap:var(--sp-4);align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line);font-size:var(--fs-2)}
.review .lv{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:0 0 7px}
.review .lv.error{background:var(--danger)}
.review .lv.warn{background:var(--warn)}
.review .msg{flex:1;color:var(--text-2);line-height:1.5}
.review .msg em{color:var(--text-3);font-style:normal;font-family:var(--label);font-size:var(--fs-1);display:block;margin-top:2px}
.review .go{flex:0 0 auto;padding:3px 10px;border-radius:var(--r-pill);border:1px solid var(--line-2);font-size:var(--fs-2);background:var(--panel)}
.review .go:hover{background:var(--lift-bg);border-color:var(--lift-line)}
.alert{display:flex;flex-direction:column;gap:var(--sp-3);padding:13px 15px;border-radius:var(--r-md);background:#a8402f0f;border:1px solid #a8402f40}
.publication-preview-error{margin-bottom:var(--gap-2)}
.schedule-panel{display:grid;gap:var(--sp-3);padding:var(--sp-4);margin-bottom:var(--sp-4);border:1px solid var(--line);border-radius:var(--r-md)}.schedule-panel h3{margin:0}.schedule-panel .f,.schedule-panel .help{margin:0}.schedule-ack{display:flex;align-items:center;gap:var(--pc-action-gap)}.schedule-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:var(--pc-action-gap)}#scheduleStatus:empty{display:none}.schedule-status{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--pc-action-gap)}.schedule-status .help{margin:0;flex:1 1 260px}
.alert b{font-size:var(--fs-4);color:var(--danger);font-weight:600}
.alert span{font-size:var(--fs-3);color:var(--text-2);line-height:1.55}
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:var(--r-pill);
  font-size:var(--fs-3);font-weight:500;box-shadow:var(--shadow-lg);
  z-index:9000;opacity:0;transition:.24s cubic-bezier(.4,0,.2,1);pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* A tablet cannot give the library, canvas and inspector useful widths at the same
   time. Keep the rail stable and let whichever side the person is using own the
   workspace. Clicking a rail item brings the library forward; selecting something
   brings the inspector forward. The other panel leaves layout instead of crushing the
   canvas into the 116px sliver the three fixed columns used to leave at 768px. These
   rules intentionally live after every panel's base rule so the responsive dimensions
   win the cascade. */
@media(max-width:1360px){
  body:not(.library-focus) .left{display:none}
  body.library-focus .right{display:none}
  .rail button{height:52px}
  .left{width:260px;flex-basis:260px}
  .right{width:300px;flex-basis:300px}
  .stage{padding-inline:12px}
}
/* A smaller laptop uses one working panel at a time. Authors can also clear both
   panels explicitly without changing selection, editing scope, or canvas width. */
body.canvas-focus .left,body.canvas-focus .right{display:none!important}
body.canvas-focus #canvasFocusBtn{color:var(--green)}
body.preview #canvasFocusBtn{display:none}
/* At narrow layout widths, including enlarged desktop views, use drawers over the
   canvas. The rail closes the library; the inspector has an explicit close control. */
@media(max-width:767px){
  .topbar{gap:var(--sp-2);padding-right:6px}
  .brand{padding-inline:8px}
  .docname,.topUtility,.topTools,#clientReviewBtn,#shareBtn{display:none}
  .moreToolsToggle{display:grid}
  #devSeg{padding:2px}
  #devSeg button{width:30px;height:28px}
  .topTools,.topActions{gap:0}
  .topgroup.divided{padding-left:var(--sp-2)}
  .topbar .btn.primary{padding:var(--pc-control-padding)}
  .main{position:relative}
  .rail{width:48px;flex-basis:48px}
  .rail button{height:49px}
  .rail button span{display:none}
  .left,.right{
    position:absolute;top:0;bottom:0;z-index:28;box-shadow:var(--shadow-lg);
    max-width:calc(100vw - 48px)
  }
  .left{left:48px;width:min(300px,calc(100vw - 48px))}
  .right{right:0;width:min(318px,calc(100vw - 48px))}
  .sHead .panelClose{display:grid}
  .stage{padding:10px 8px 8px}
  .mask,#ask{padding:8px}
  .modal{max-height:calc(100vh - 16px);border-radius:var(--r-md)}
  .mh{padding:13px 14px}
  .mb{padding:14px}
  .mf{padding:11px 14px}
  .toast{max-width:calc(100vw - 24px);text-align:center}
}
@media(max-width:360px){
  #redoBtn{display:none}
  .topbar .btn.primary{width:var(--ic-lg);height:var(--ic-lg);min-height:var(--ic-lg);padding:0}
  #publishLabel{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
}

/* ------------------------------------------------------- accessibility --- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
  .frameWrap{transition:none}
}
.borderpick button{position:relative}
.borderpick button.set::after{
  content:"";position:absolute;right:4px;top:4px;width:4px;height:4px;border-radius:50%;background:var(--green);
}
.borderpick button.on.set::after{background:var(--pc-selection-text)}
.borderctl>.f{margin-bottom:var(--gap-3)}
body.submissions-loading::after{content:"Loading submissions…";position:fixed;inset:52px 0 0 var(--pc-rail-width);display:grid;place-items:center;background:var(--panel);color:var(--text-2);z-index:20;pointer-events:none}
#submissions-workspace[hidden]{display:none}
#submissions-workspace{flex:1;min-width:0;min-height:0;border:0;background:var(--panel)}
body.submissions-open #app>.main>.left,body.submissions-open #app>.main>.stage,body.submissions-open #app>.main>.right,body.submissions-open #cms-workspace-host{display:none}
body:not(.cms-open) #cms-workspace-host,#cms-workspace-host:empty{display:none}

#proposals-workspace-host{flex:1;min-width:0;min-height:0}
body.proposals-open #app>.main>.left,body.proposals-open #app>.main>.stage,body.proposals-open #app>.main>.right,body.proposals-open #cms-workspace-host{display:none}
#leftRail button{position:relative}
#leftRail .rail-badge{position:absolute;top:7px;right:calc(50% - 20px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--green);color:var(--on-green);font-size:10px;font-weight:700;line-height:16px;text-align:center}
#leftRail .rail-badge[hidden]{display:none}
.pw{height:100%;min-height:0;display:flex;flex-direction:column;background:var(--panel);color:var(--text);font-size:var(--fs-3)}
.pw-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-5);padding:18px 24px;border-bottom:1px solid var(--line)}
.pw-head h1{margin:0;font-size:1.35rem;letter-spacing:-.02em}.pw-head p{margin:4px 0 0;color:var(--text-3);font-size:var(--fs-2)}
.pw-head-actions{display:flex;gap:var(--sp-3);flex-wrap:wrap;justify-content:flex-end}
.pw-empty{margin:0;padding:28px 24px;max-width:70ch;color:var(--text-2);line-height:1.55}.pw-empty p{margin:0 0 14px}
.pw-main{flex:1;min-height:0;display:grid;grid-template-columns:260px minmax(0,1fr)}
.pw-list{border-right:1px solid var(--line);overflow:auto;padding:8px}
.pw-item{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:10px;border:1px solid transparent;border-radius:var(--r-md);background:transparent;color:inherit;font:inherit;text-align:left;cursor:pointer}
.pw-item:hover{background:var(--pc-hover-bg)}.pw-item.on{border-color:var(--line-2);background:var(--lift-bg)}

 <div class="boot-content">
  <svg viewBox="0 0 73 95" role="img" aria-label="Pagecraft"><path d="M0 0H73V71H52L46 65L40 71H18V77H40V95H0Z M18 18V77H40V53H55V18Z" fill="#b7f34a" fill-rule="evenodd"/></svg>

 </div>

<script id="builder-loading-controller">
(() => {
 const started = performance.now();
 const screen = document.getElementById('builderLoading');
 const status = document.getElementById('builderLoadingStatus');
 const retry = document.getElementById('builderLoadingRetry');
 const slow = setTimeout(() => {
  status.textContent = 'This is taking longer than usual. You can keep waiting or reload.';
  retry.hidden = false;
 }, 20000);
 retry.addEventListener('click', () => location.reload());
 window.PC_BUILDER_LOADING = {
  async ready() {
   clearTimeout(slow);
   await new Promise(resolve => setTimeout(resolve, Math.max(0, 450 - (performance.now() - started))));
   const app = document.getElementById('app');
   app.removeAttribute('inert');
   app.setAttribute('aria-busy', 'false');
   screen.hidden = true;
  },
  fail() {
   clearTimeout(slow);
   status.textContent = 'The builder could not finish loading. Please reload to try again.';
   screen.querySelector('.boot-progress').hidden = true;
   retry.hidden = false;
  }
 };
})();
</script>

const WORDPRESS_CONTENT = (() => {
  if (!SRV || !Array.isArray(SRV.wordpressContent)) return Object.freeze([]);
  const targets = [];
  const seenConnections = new Set();
  const text = value => typeof value === 'string' ? value.trim() : '';

    try {
      const parsed = new URL(text(value));

    const connectionId = text(raw.connectionId);
    const environment = raw.environment === 'staging' || raw.environment === 'production' ? raw.environment : '';
    const targetOrigin = text(raw.targetOrigin);
    const targetPathText = text(raw.targetPath);
    const targetPath = targetPathText === '/' ? '/' : targetPathText.replace(/\/+$/, '');

    const items = [];

        url,
        modifiedAt: text(rawItem.modifiedAt)

  const version = payload.publishedVersion ?? payload.sourceVersion ?? SRV.publishedVersion;
  const when = payload.publishedAt;
  const status = payload.status || (publicationId ? 'published' : 'draft');
  host.innerHTML = `
    <div class="releaseLead">
      <div>
        <h3>${publicationId ? 'Published on Pagecraft' : 'Nothing has been published yet'}</h3>
        <p>${publicationId
          ? `Draft version ${esc(version || '—')} became the public release${when ? ` on ${esc(historyDate(when))}` : ''}. Autosaved changes after that remain private.`
          : 'Autosave is protecting this draft, but visitors will not see it until an owner publishes it.'}</p>
      </div>
      <span class="releaseState ${releaseClass(status)}">${esc(releaseLabel(status))}</span>
    </div>`;
  host.setAttribute('aria-busy', 'false');
}

async function flushDraft() {
  await writeServer();
  const until = Date.now() + 20000;
  while ((saving || saveAgain) && Date.now() < until) await new Promise(resolve => setTimeout(resolve, 40));
  if (saving || saveAgain) throw new Error('The draft is still saving. Try Publish again in a moment.');
  if (saveState !== 'ok') throw new Error('The draft was not saved, so it was not published.');
}

/* The dashboard must never load the public site just to draw a card. Capture the canvas that
   is already open while the publication request is in flight, then attach that image to the
   exact immutable publication that won. A failed thumbnail is deliberately non-fatal: the
   release is the user's work, while this image is only dashboard furniture. */
async function publicationPreviewSnapshot() {
  if (!cdoc || /jsdom/i.test(navigator.userAgent || '')) return null;
  const source = cdoc.getElementById('s-root');
  if (!source || typeof XMLSerializer !== 'function') return null;
  const asDataUrl = blob => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ''));
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(blob);
  });
  const embedded = async raw => {
    if (!raw || /^(?:data:|#)/i.test(raw)) return raw;
    try {
      const response = await fetch(new URL(raw, cdoc.baseURI), { credentials: 'same-origin' });
      if (!response.ok) return raw;
      const blob = await response.blob();
      return blob.size <= 4 * 1024 * 1024 ? await asDataUrl(blob) : raw;
    } catch { return raw; }
  };
  const clone = source.cloneNode(true);
  const sourceImages = [...source.querySelectorAll('img')];
  const cloneImages = [...clone.querySelectorAll('img')];
  await Promise.all(sourceImages.map(async (image, index) => {
    const src = image.currentSrc || image.src;
    if (!src || src.startsWith('data:')) return;
    try {
      const data = await embedded(src);
      cloneImages[index]?.setAttribute('src', data);
      cloneImages[index]?.removeAttribute('srcset');
    } catch { /* The layout is still useful when an optional image cannot be embedded. */ }
  }));
  let css = [...cdoc.querySelectorAll('style')].map(style => style.textContent || '').join('\n');
  const cssUrls = [...new Set([...css.matchAll(/url\(\s*(['"]?)([^)'"\s]+)\1\s*\)/gi)]
    .map(match => match[2]).filter(value => !/^(?:data:|#)/i.test(value)))];
  await Promise.all(cssUrls.map(async raw => {
    const data = await embedded(raw);
    if (data !== raw) css = css.split(raw).join(data);
  }));
  const width = 1200, height = 750, outputWidth = 960, outputHeight = 600;
  const markup = new XMLSerializer().serializeToString(clone);
  const svgMarkup = `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}"><foreignObject width="100%" height="100%"><div xmlns="http://www.w3.org/1999/xhtml"><style>html,body{width:${width}px;height:${height}px;margin:0;overflow:hidden;background:#fff}${css}</style>${markup}</div></foreignObject></svg>`;
  const url = URL.createObjectURL(new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' }));
  try {
    const image = new Image();
    image.decoding = 'async';
    image.src = url;
    await image.decode();
    const canvas = document.createElement('canvas');
    canvas.width = outputWidth;
    canvas.height = outputHeight;
    const context = canvas.getContext('2d');
    if (!context) return null;
    context.fillStyle = '#fff';
    context.fillRect(0, 0, outputWidth, outputHeight);
    context.drawImage(image, 0, 0, outputWidth, outputHeight);
    return canvas.toDataURL('image/webp', .78);
  } finally {
    URL.revokeObjectURL(url);
  }
}

async function finishWordPress(button) {
  const action = feedback().begin(button, 'Saving…');
  if (!action) return;
  try {
    await flushDraft();
    action.success('Draft saved.');
    const target = WP.pagesUrl || WP.exitUrl;
    if (target) window.top.location.href = target;
  } catch (error) {
    action.error(error && error.message || 'Could not save. Try again.');
  }
}

async function publishDraft(button, reviewed = null) {
  const findings = lint();
  const counts = lintCounts(findings);
  if (counts.error) {
    toast(`Resolve ${counts.error} problem${counts.error === 1 ? '' : 's'} before publishing`);
    return;
  }
  if (counts.warn && !await askConfirm('Publish with suggestions?',
    `${counts.warn} suggestion${counts.warn === 1 ? '' : 's'} will be recorded with this release. Problems always block publication.`,
    { ok: 'Publish this release' })) return;

  const action = feedback().begin(button, 'Publishing…');
  if (!action) return;
  $('#releasePanel')?.setAttribute('aria-busy', 'true');
  try {
    await flushDraft();
    if (HOST.releases.prepare && (!reviewed || reviewed.sourceVersion !== SRV.version || reviewed.document !== JSON.stringify(doc()))) {
      throw new Error('The draft changed. Create a new review preview before publishing.');
    }
    const preview = publicationPreviewSnapshot().catch(() => null);
    const payload = await HOST.releases.publish({
      sourceVersion: reviewed?.sourceVersion ?? SRV.version,
      snapshotId: reviewed?.snapshotId,
      acknowledgeWarnings: counts.warn > 0 || !!reviewed?.warnings?.length
    });
    void preview.then(snapshot => snapshot && payload.publicationId
      ? HOST.releases.savePreview({ publicationId: payload.publicationId, snapshot })
      : undefined).catch(() => undefined);
    SRV.publishedPublicationId = payload.publicationId;
    SRV.publishedVersion = payload.sourceVersion ?? SRV.publishedVersion;
    paintShareState();
    renderReleasePanel(payload);
    action.success(payload.status === 'unchanged' ? 'This version is already published' : 'Published to Pagecraft');
    button.textContent = 'Published';
    setTimeout(() => { if (button.isConnected) { button.disabled = false; button.textContent = 'Publish to Pagecraft'; } }, 900);
  } catch (error) {
    if (error && error.status === 409) {
      warnStale(error.payload || {});
    }
    const detail = error.payload?.detail || (error.message === 'publication_validation_failed' ? 'This draft did not pass publication checks. Review the site’s problems and try again.' : /^[a-z0-9_]+$/.test(error.message || '') ? 'The server could not publish this draft. Please try again.' : error.message || 'Please try again.');
    const message = error.status ? 'Publish failed. ' + detail : 'Publication could not be confirmed. Check the published site before trying again.';
    action.error(message);
    button.textContent = 'Try again';
    const host = $('#releasePanel');
    if (host) host.insertAdjacentHTML('afterbegin', `<div class="alert" style="margin-bottom:var(--gap-2)"><b>Publication needs attention.</b><span>${esc(message)}</span></div>`);
    if (host) host.setAttribute('aria-busy', 'false');
  }
}

const publicationFrameCleanup = new Map();
function clearPublicationFrames() {
  publicationFrameCleanup.forEach(cleanup => cleanup());
  publicationFrameCleanup.clear();
}
function loadPublicationFrame(frame, source, navigation = {}) {
  publicationFrameCleanup.get(frame)?.();
  let strip = frame.parentElement.querySelector('.pc-preview-state');
  if (!strip) {
    strip = document.createElement('div'); strip.className = 'pc-preview-state';
    frame.before(strip);
  }
  strip.innerHTML = '<span role="status">Loading page preview…</span><button type="button" class="btn tiny" hidden>Retry preview</button>';
  const status = strip.querySelector('span'), retry = strip.querySelector('button');
  const token = Array.from(crypto.getRandomValues(new Uint8Array(16)), value => value.toString(16).padStart(2, '0')).join('');
  let active = true, settled = false;
  const cleanup = () => { active = false; clearTimeout(timer); window.removeEventListener('message', received); };
  const finish = (text, canRetry) => {
    if (!active || settled || !frame.isConnected) return;
    settled = true;
    status.textContent = text; retry.hidden = !canRetry;
    frame.setAttribute('aria-busy', 'false'); clearTimeout(timer);
  };
  const received = event => {
    if (!active || !frame.isConnected || event.source !== frame.contentWindow || event.data?.token !== token) return;
    if (event.data.type === 'pagecraft-preview-navigate') {
      const path = event.data.path, hash = event.data.hash;
      if (typeof path !== 'string' || !Array.isArray(navigation.pages) || !navigation.pages.includes(path)
        || path.split('/').some(part => !part || part === '.' || part === '..')
        || path.length > 512 || !/^[a-zA-Z0-9._@+/-]+\.html$/.test(path)
        || typeof hash !== 'string' || (hash && !hash.startsWith('#')) || hash.length > 2048) return;
      if (typeof navigation.onNavigate === 'function') navigation.onNavigate(path, hash);
      return;
    }
    if (event.data.type !== 'pagecraft-preview-ready') return;
    if (event.data.status === 'ready') finish('Page preview displayed.', false);
    else if (event.data.status === 'degraded') finish('Some preview assets could not load. Check the page before publishing.', true);
  };
  const timer = setTimeout(() => finish('Preview is taking too long. Retry to check this saved version.', true), 15000);
  window.addEventListener('message', received);
  publicationFrameCleanup.set(frame, cleanup);
  retry.addEventListener('click', () => loadPublicationFrame(frame, source, navigation));
  frame.setAttribute('aria-busy', 'true');
  frame.removeAttribute('srcdoc');
  const target = new URL(source, location.href); target.searchParams.set('pcPreviewReady', token);
  frame.src = target.href;
}

function publicationPreviewFailure(error) {
  const payload = error?.payload && typeof error.payload === 'object' ? error.payload : {};
  const findings = Array.isArray(payload.findings)
    ? payload.findings.filter(finding => finding && typeof finding === 'object')
    : [];
  const code = String(payload.error || error?.message || '');
  const validation = error?.status === 422 && (code === 'publication_validation_failed' || findings.length);
  const problems = findings.filter(finding => finding.level !== 'warn').length;
  const trustedLocalMessage = !error?.status && code === 'The draft changed while preparing the preview. Create a new preview.'
    ? code : '';
  let message;
  if (trustedLocalMessage) message = trustedLocalMessage;
  else if (code === 'publication_dependency_unavailable' && payload.dependency === 'google_fonts') {
    message = 'Your draft is saved, but Pagecraft could not prepare its webfonts right now. Try creating the publication preview again.';
  }
  else if (validation && problems) message = 'This draft did not pass publication checks. Fix the problems below, then create a new preview.';
  else if (validation && findings.length) message = 'This draft needs publication suggestions reviewed. Review them below, then create a new preview.';
  else if (validation) message = 'This draft did not pass publication checks. Review Site checks, then create a new preview.';
  else if (error?.status === 401 || error?.status === 403) message = 'Your publishing access could not be confirmed. Refresh Pagecraft and try again.';
  else if (error?.status) message = 'Pagecraft could not create the publication preview. Try again.';
  else message = 'Pagecraft could not reach the publishing service. Check your connection and try again.';
  return { message, findings };
}

function renderPublicationPreviewFailure(host, failure) {
  if (!host?.isConnected) return;
  const location = finding => {
    const where = finding.where && typeof finding.where === 'object' ? finding.where : {};
    return [where.page, where.region, where.node].filter(value => typeof value === 'string' && value.trim()).join(' · ');
  };
  const canShow = finding => {
    const where = finding.where && typeof finding.where === 'object' ? finding.where : {};
    return (finding.target && typeof finding.target === 'object')
      || (typeof where.slug === 'string' && state.pages.some(page => page.slug === where.slug))
      || (typeof finding.nodeId === 'string' && !!locate(finding.nodeId));
  };
  const problems = failure.findings.filter(finding => finding.level !== 'warn').length;
  const suggestions = failure.findings.length - problems;
  const summary = [
    problems ? `${problems} ${problems === 1 ? 'problem' : 'problems'}` : '',
    suggestions ? `${suggestions} ${suggestions === 1 ? 'suggestion' : 'suggestions'}` : ''
  ].filter(Boolean).join(' · ');
  host.innerHTML = `<div class="alert publication-preview-error" role="alert">
      <b>Publication preview needs attention.</b><span>${esc(failure.message)}</span>
    </div>
    ${failure.findings.length ? `<div class="review publication-preview-findings">
      <div class="rh"><span class="dot ${problems ? 'bad' : 'warn'}"></span><span>${summary}</span></div>
      <ul>${failure.findings.map((finding, index) => {
        const message = typeof finding.message === 'string' && finding.message.trim()
          ? finding.message.trim() : 'A publication check needs attention.';
        const place = location(finding);
        const level = finding.level === 'warn' ? 'warn' : 'error';
        return `<li><span class="lv ${level}"></span><span class="msg">${esc(message)}${place ? `<em>${esc(place)}</em>` : ''}</span>${canShow(finding) ? `<button class="go" type="button" data-publication-finding="${index}">Show me</button>` : ''}</li>`;
      }).join('')}</ul>
    </div>` : ''}`;
  host.querySelectorAll('[data-publication-finding]').forEach(button => button.addEventListener('click', () => {
    const finding = failure.findings[+button.dataset.publicationFinding];
    /* A finding can be opened from publication preview. Leave that view before
       selecting the editor target so panels and canvas context are live. */
    if (document.body.classList.contains('preview')) togglePreview();
    if (finding?.target && typeof finding.target === 'object') {
      showReviewTarget(finding.target);
      return;
    }
    const where = finding?.where && typeof finding.where === 'object' ? finding.where : {};
    const page = typeof where.slug === 'string' ? state.pages.findIndex(candidate => candidate.slug === where.slug) : -1;
    if (page > -1) state.cur = page;
    const mode = {'global header':'header','global footer':'footer'}[where.region] || 'page';
    state.ui.mode = mode;
    closeModal(); render();
    if (typeof finding?.nodeId === 'string' && locate(finding.nodeId)) select(finding.nodeId, {scroll:true});
    else showPanel('layers');
  }));
}

async function preparePublicationReview(button) {
  const action = feedback().begin(button, 'Preparing preview…');
  if (!action) return;
  const host = $('#publicationChanges');
  const publish = $('#releasePublish');
  const schedule = $('#releaseSchedule');
  if (publish) { publish.disabled = true; publish.onclick = null; }
  if (schedule) { schedule.disabled = true; schedule.onclick = null; }
  clearPublicationFrames();
  if (host?.isConnected) host.innerHTML = '<p role="status">Preparing a new publication preview…</p>';
  try {
    await flushDraft();
    const baseline = JSON.stringify(doc());
    const reviewed = await HOST.releases.prepare(SRV.version);
    reviewed.document = baseline;
    if (!host?.isConnected) { action.cancel(); return; }
    if (JSON.stringify(doc()) !== baseline || reviewed.sourceVersion !== SRV.version) throw new Error('The draft changed while preparing the preview. Create a new preview.');
    const root = `/api/sites/${encodeURIComponent(SRV.siteId)}/publication-snapshots/`;
    const url = (id, path) => root + encodeURIComponent(id) + '/files/' + path.split('/').map(encodeURIComponent).join('/');
    const groups = [...new Set(reviewed.changes.map(change => change.group))];
    if ($('#exReview')) $('#exReview').hidden = true;
    host.innerHTML = `<h3>Changes to publish</h3>
      <p class="help">Review of saved version ${esc(reviewed.sourceVersion)}. Publication includes the whole site. Shared changes may affect every page.</p>
      ${!reviewed.comparisonAvailable ? '<p class="alert">The previous publication has no retained source document. Compare the page previews before publishing.</p>' : groups.length ? groups.map(group => `<details><summary>${esc(group)}</summary><ul>${reviewed.changes.filter(change => change.group === group).map(change => `<li>${esc(change.label)} · ${esc(change.status)}${change.pages.length ? `<small> — ${change.pages.map(page => `<button class="btn" type="button" data-review-page="${esc(page.slug || 'index')}">${esc(page.name)}</button>`).join(' ')}</small>` : ''}</li>`).join('')}</ul></details>`).join('') : '<p>No document changes since the current publication.</p>'}
      ${reviewed.warnings.length ? `<details><summary>${reviewed.warnings.length} publication suggestions</summary><ul>${reviewed.warnings.map(warning => `<li>${esc(warning.message)}</li>`).join('')}</ul></details>` : ''}
      <div class="f"><label for="publicationPage">Compare page</label><select id="publicationPage">${reviewed.pages.map(path => `<option value="${esc(path)}">${esc(path === 'index.html' ? 'Home' : path.replace(/\.html$/, ''))}</option>`).join('')}</select></div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--gap-2)">
        ${reviewed.baselinePublicationId ? '<div><h4>Published version</h4><iframe id="publicationBefore" title="Published page comparison" sandbox="allow-scripts" style="width:100%;height:320px;border:1px solid var(--line);border-radius:var(--pc-control-radius)"></iframe></div>' : '<p>This site has not been published.</p>'}
        <div><h4>Reviewed draft</h4><iframe id="publicationAfter" title="Reviewed draft comparison" sandbox="allow-scripts" style="width:100%;height:320px;border:1px solid var(--line);border-radius:var(--pc-control-radius)"></iframe></div>
      </div>`;
    const page = $('#publicationPage');
    const update = (hash = '') => {
      const show = (frame, id, paths) => {
        if (!frame) return;
        if (paths && !paths.includes(page.value)) {
          publicationFrameCleanup.get(frame)?.();
          frame.parentElement.querySelector('.pc-preview-state')?.remove();
          frame.removeAttribute('aria-busy');
          frame.removeAttribute('src'); frame.srcdoc = '<p style="font:14px system-ui;padding:16px">This page is not included in this version.</p>';
        } else { loadPublicationFrame(frame, url(id, page.value) + (typeof hash === 'string' ? hash : ''), {
          pages: paths || reviewed.pages,
          onNavigate: (path, hash) => {
            if (!reviewed.pages.includes(path)) return;
            page.value = path;
            page.dispatchEvent(new Event('input', {bubbles:true}));
            update(hash);
          }
        }); }
      };
      show($('#publicationAfter'), reviewed.snapshotId, reviewed.draftPages);
      show($('#publicationBefore'), reviewed.baselinePublicationId, reviewed.publishedPages);
    };
    page.addEventListener('change', update);
    host.querySelectorAll('[data-review-page]').forEach(link => link.addEventListener('click', () => {
      const path = link.dataset.reviewPage + '.html';
      const available = reviewed.pages.find(candidate => candidate === path || candidate.startsWith(link.dataset.reviewPage + '/'));
      if (available) { page.value = available; page.dispatchEvent(new Event('input', {bubbles:true})); update(); $('#publicationAfter').scrollIntoView({block:'nearest'}); }
      else { toast('This page has no output in the reviewed draft. It may have been removed or has no published entries.'); }
    }));
    update();
    publish.disabled = false; publish.textContent = 'Publish reviewed version';
    publish.onclick = () => publishDraft(publish, reviewed);
    if (schedule) { schedule.disabled = false; schedule.onclick = () => openSchedulePanel(reviewed); }
    action.success('Review snapshot prepared. Page previews are loading.');
  } catch (error) {
    const failure = publicationPreviewFailure(error);
    renderPublicationPreviewFailure(host, failure);
    action.error(failure.message);
  }
}

/* Scheduling publishes this exact reviewed version later, and only if nothing newer has been
   published by then; the server pauses it otherwise. Cloud only (HOST.releases.schedule). */
const SCHEDULE_PAUSED = {
  baseline_superseded: 'a newer version was published after it was prepared.',
  owner_removed: 'the person who scheduled it is no longer an owner.',
  snapshot_unavailable: 'the prepared version is no longer available.',
  site_address_changed: "the site's address changed after it was prepared."
};
const SCHEDULE_ERRORS = {
  schedule_exists: 'This site already has a scheduled publish. Cancel it first.',
  stale_baseline: 'Someone published after this preview was made. Create a new preview.',
  invalid_publish_at: 'Choose a time at least 2 minutes and at most 90 days from now.',
  publication_warnings: 'Confirm the publication suggestions first.',
  stale_snapshot: 'This preview is no longer current. Create a new preview.',
  snapshot_not_found: 'This preview is no longer available. Create a new preview.',
  schedule_running: 'It is publishing right now and can no longer be cancelled.'
};
const scheduleError = error => SCHEDULE_ERRORS[error?.message] || error?.message || 'Could not schedule. Try again.';
const scheduleZone = () => Intl.DateTimeFormat().resolvedOptions().timeZone || 'your local time';
const scheduleWhen = iso => new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
const localInputValue = date => new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

/* Opening Publish renders the schedules injected with the editor, like the publication state;
   only a schedule or cancel action asks the server again. */
async function renderScheduleStatus(refresh = false) {
  const host = $('#scheduleStatus');
  if (!host || !HOST.releases.schedules || !SRV.schedulingAvailable) return;
  let rows = SRV.schedules || [];
  if (refresh) {
    try { rows = SRV.schedules = await HOST.releases.schedules(); } catch { return; } // supplementary; never blocks publishing
  }
  if (!host.isConnected) return;
  const pending = rows.find(row => row.status === 'pending');
  const paused = !pending && rows.find(row => row.status === 'paused' && Date.now() - Date.parse(row.settledAt || '') < 7 * 864e5);
  host.innerHTML = pending
    ? `<div class="schedule-status"><p class="help">Scheduled to publish a reviewed version on <b>${esc(scheduleWhen(pending.publishAt))}</b> (${esc(scheduleZone())})${pending.lastError ? '. The last attempt failed and will be retried.' : '.'}</p><button class="btn" type="button" id="scheduleCancel">Cancel schedule</button></div>`
    : paused ? `<p class="alert">A scheduled publish was paused because ${esc(SCHEDULE_PAUSED[paused.pausedReason] || 'it could not be applied safely.')} Create a new preview to schedule again.</p>` : '';
  $('#scheduleCancel')?.addEventListener('click', async event => {
    const action = feedback().begin(event.currentTarget, 'Cancelling…');
    if (!action) return;
    try { await HOST.releases.cancelSchedule(pending.id); action.success('Schedule cancelled'); renderScheduleStatus(true); }
    catch (error) { action.error(scheduleError(error)); }
  });
}

function openSchedulePanel(reviewed) {
  const host = $('#publicationChanges');
  if (!host || $('#schedulePanel')) return $('#schedulePublishAt')?.focus();
  const soon = new Date(Date.now() + 60 * 60000);
  soon.setMinutes(Math.ceil(soon.getMinutes() / 5) * 5, 0, 0);
  const idempotencyKey = 'schedule-' + crypto.randomUUID(); // one per panel, so a repeated click is one schedule
  host.insertAdjacentHTML('afterbegin', `<div id="schedulePanel" class="schedule-panel">
    <h3>Schedule this version</h3>
    <div class="f"><label for="schedulePublishAt">Publish at</label>
      <input id="schedulePublishAt" class="ctl" type="datetime-local" value="${localInputValue(soon)}" min="${localInputValue(new Date(Date.now() + 3 * 60000))}"></div>
    <p class="help">${esc(scheduleZone())}. Publishes within a few minutes of this time, and only if nothing newer has been published by then.</p>
    ${reviewed.warnings.length ? `<label class="schedule-ack"><input type="checkbox" id="scheduleAck"> Publish despite ${reviewed.warnings.length} publication ${reviewed.warnings.length === 1 ? 'suggestion' : 'suggestions'}</label>` : ''}
    <div class="schedule-actions"><button class="btn" type="button" id="scheduleDismiss">Cancel</button><button class="btn primary" type="button" id="scheduleConfirm">Schedule this version</button></div>
  </div>`);
  $('#schedulePublishAt').focus();
  $('#scheduleDismiss').addEventListener('click', () => $('#schedulePanel')?.remove());
  $('#scheduleConfirm').addEventListener('click', async event => {
    const at = new Date($('#schedulePublishAt').value);
    const ack = $('#scheduleAck');
    if (Number.isNaN(at.getTime())) return toast(SCHEDULE_ERRORS.invalid_publish_at);
    if (ack && !ack.checked) return toast(SCHEDULE_ERRORS.publication_warnings);
    const action = feedback().begin(event.currentTarget, 'Scheduling…');
    if (!action) return;
    try {
      const schedule = await HOST.releases.schedule({ snapshotId: reviewed.snapshotId, publishAt: at.toISOString(), acknowledgeWarnings: !!ack?.checked, idempotencyKey });
      action.success(`Scheduled for ${scheduleWhen(schedule.publishAt)}`);
      $('#schedulePanel')?.remove();
      renderScheduleStatus(true);
    } catch (error) { action.error(scheduleError(error)); }
  });
}

/* May this session change the shape of the site, as opposed to its words?

   The server already refuses a structural save from a content account, and it is the
   boundary — this is not a second one. It is so the editor stops offering what cannot be
   done: a panel that adds elements, a tab full of colours, a keystroke that deletes a
   section. Refusing a save somebody was invited to attempt is honest and unkind.

   Absent `PC_SERVER` this is the single-file build, where there is no account and nothing to
   scope. */
const canStructure = () => !SRV || SRV.role !== 'content';

/** Wrap a structural verb so it cannot fire from a shortcut, a menu or a drag. */
const structural = (fn) => (...args) => { if (canStructure()) return fn(...args); };

function stamp(txt, bad) {
  const t = $('#savedTag');
  t.textContent = txt;
  t.classList.toggle('bad', !!bad);
  if (!bad && saveState === 'ok') {
    window.__pcFeedback?.resolveProblem('draft-save');
    if (UI) drawBlocks();
  }
}

function writeNow() {
  if (loadBlocked) { dirty = false; stamp('Not saving', true); return; }
  if (SRV) return writeServer();
  try {
    localStorage.setItem(LS, JSON.stringify({ ...doc(), v: SCHEMA, cur: state.cur, tab: TABID }));
    saveState = 'ok';
    dirty = false;
    stamp('Saved ' + new Date().toTimeString().slice(0, 5), false);
  } catch (e) {
    saveState = 'failed';
    stamp('NOT SAVED', true);
    warnSaveFailed(e);
  }
}

/* One save in flight at a time, and one queued behind it. Without the guard a fast typist
   sends the second PUT before the first returns, the second carries the version the first
   is about to consume, and the server correctly calls it stale — so the editor would report
   a conflict it caused itself. */
let saving = false, saveAgain = false;
let ambiguousCloudSave = null;
let deliberateReload = false, saveTimer = null;

/* A cloud PUT can commit and still lose its response. Compare a fresh server read with the
   exact attempted version and document before advancing the local version; version proximity
   alone is never enough, because another editor may have saved in the meantime. */
const saveDocumentKey = value => JSON.stringify(value, (_key, part) => {
  if (!part || typeof part !== 'object' || Array.isArray(part)) return part;
  return Object.fromEntries(Object.keys(part).sort().map(key => [key, part[key]]));
});
async function readCloudDraft() {
  const headers = SRV.editorSessionToken
    ? { 'X-Pagecraft-Editor-Session': SRV.editorSessionToken } : {};
  const response = await fetch('/api/sites/' + encodeURIComponent(SRV.siteId), {
    headers, credentials: 'same-origin', cache: 'no-store'
  });
  if (!response.ok) throw new Error('Draft readback failed (' + response.status + ')');
  const body = await response.json();
  return { version: Number(body.version), document: body.doc ?? body.document };
}
async function reconcileAmbiguousCloudSave(attempt) {
  let remote;
  try { remote = await readCloudDraft(); } catch (_) { return 'unavailable'; }
  if (remote.version !== attempt.version + 1
      || saveDocumentKey(remote.document) !== saveDocumentKey(attempt.document)) return 'different';
  SRV.version = remote.version;
  lastCloudDocument = attempt.serialized;
  ambiguousCloudSave = null;
  saveState = 'ok';
  saveWarned = false;
  dirty = JSON.stringify(doc()) !== lastCloudDocument;
  if (dirty) saveAgain = true;
  stamp('Draft saved ' + new Date().toTimeString().slice(0, 5), false);
  return 'matched';
}

function snapshotPageForWP() {
  const styles = wordpressStyles(page());
  const compiled = {
    compiler: BUNDLED_COMPILER_CONTRACT,
    html: assetsToBlob(buildPage(page())),
    globalCss: assetsToBlob(styles.global),
    pageCss: assetsToBlob(styles.page)
  };
  /* Rendering may materialize optional empty collections through legacy lazy accessors.
     Capture the source after those synchronous normalizations so an exact retry stays exact. */
  const document = clone(doc());
  return {
    document,
    compiled
  };
}

async function compilePageForWP(compiled) {
  return compiled;
}

async function writeServer(opts = {}) {
  if (loadBlocked) { dirty = false; stamp('Not saving', true); return; }
  if (saving) { saveAgain = true; return; }
  /* Freeze the same migrated clone the Web adapter serializes. Comparing a pre-adoption
     source to a post-adoption GET would otherwise reject an exact response-loss recovery. */
  const cloudSnapshot = !IS_WORDPRESS ? migrate(clone(doc())) : null;
  const cloudDocument = !IS_WORDPRESS ? JSON.stringify(cloudSnapshot) : null;
  if (!IS_WORDPRESS && saveState === 'ok' && cloudDocument === lastCloudDocument) { dirty = false; return; }
  const cloudAttempt = !IS_WORDPRESS ? {
    version: SRV.version,
    document: cloudSnapshot,
    serialized: cloudDocument
  } : null;
  saving = true;
  stamp('Saving…', false);
  try {
    /* cleared as the request takes its copy of the document, so an edit made while it is in
       flight marks the page dirty again rather than being counted as saved */
    dirty = false;
    /* WordPress font loading can await the network. Freeze both source and generated output
       first so an edit made during that wait belongs wholly to the queued next save. */
    const wordpressSnapshot = IS_WORDPRESS ? snapshotPageForWP() : null;
    const body = await HOST.documents.save({
      document: wordpressSnapshot ? wordpressSnapshot.document : doc(),
      version: cloudAttempt ? cloudAttempt.version : SRV.version,
      keepalive: !!opts.keepalive,
      ...(wordpressSnapshot ? { compiled: await compilePageForWP(wordpressSnapshot.compiled) } : {})
    });
    SRV.version = body.version;
    if (!IS_WORDPRESS) { lastCloudDocument = cloudDocument; ambiguousCloudSave = null; }
    saveState = 'ok';
    saveWarned = false;
    stamp('Draft saved ' + new Date().toTimeString().slice(0, 5), false);
  } catch (e) {
    // A failed write needs a deliberate retry, not a queued automatic replay.
    saveAgain = false;
    dirty = true;
    if (e && e.status === 409 && e.payload?.retryable === true && !e.payload.conflict) {
      saveState = 'failed'; stamp('NOT SAVED', true); warnSaveBusy(); return;
    }
    if (e && e.status === 409 && e.payload?.reloadRequired === true) {
      saveState = 'failed'; stamp('NOT SAVED', true); warnCompilerReload(e.payload); return;
    }
    if (e && e.status === 409) {
      if (!IS_WORDPRESS && cloudAttempt) {
        /* A prior interrupted attempt remains the first candidate: the author may have edited
           again before retrying, so the host can match those older bytes and the newer draft
           must stay queued. With no recorded interruption, a version+1 host carrying this
           exact attempted document is still safe to acknowledge — no overwrite or rebase is
           involved, and accepting identical bytes cannot discard another author's work. */
        const candidates = ambiguousCloudSave ? [ambiguousCloudSave] : [];
        if (!ambiguousCloudSave || ambiguousCloudSave.version !== cloudAttempt.version
            || ambiguousCloudSave.serialized !== cloudAttempt.serialized) candidates.push(cloudAttempt);
        for (const candidate of candidates) {
          const reconciled = await reconcileAmbiguousCloudSave(candidate);
          if (reconciled === 'matched') return;
          if (reconciled === 'unavailable') {
            saveState = 'failed'; stamp('NOT SAVED', true); warnSaveUnconfirmed(e.payload || {}); return;
          }
        }
      }
      saveState = 'failed'; stamp('NOT SAVED', true); warnStale(e.payload || {}); return;
    }
    /* The adapter already fetched a fresh nonce and retried once; this one means the WordPress
       login itself is gone. It is not a permission the account lacks. */
    if (e && e.status === 403 && e.payload?.code === 'rest_cookie_invalid_nonce') {
      saveState = 'failed'; stamp('NOT SAVED', true); warnSessionExpired(); return;
    }
    if (e && e.status === 403 && !IS_WORDPRESS) {
      saveState = 'failed'; stamp('NOT SAVED', true); warnContentOnly(e.payload || {}); return;
    }
    /* An upstream 5xx can be returned after the database transaction committed but before
       its result reached this editor. Treat it like a dropped response and prove the outcome
       by readback; never retry or advance the version from status proximity alone. */
    const uncertainCloudFailure = !(e && Number.isInteger(e.status)) || e.status >= 500;
    if (!IS_WORDPRESS && cloudAttempt && uncertainCloudFailure) {
      ambiguousCloudSave = cloudAttempt;
      if (await reconcileAmbiguousCloudSave(cloudAttempt) === 'matched') return;
    }
    saveState = 'failed';
    stamp('NOT SAVED', true);
    warnSaveFailed(e);
  } finally {
    saving = false;
    if (saveAgain) { saveAgain = false; writeServer(); }
  }
}

// A lock is temporary, not proof that the document version has changed.
function warnSaveBusy() {
  rememberSaveProblem('Saving is busy. Your changes are still in this tab. Keep it open, then try saving again.', warnSaveBusy);
  // Do not suppress a later real conflict after this warning is dismissed.
  saveWarned = false;
  openModal('Saving is temporarily busy', `
    <div class="alert">
      <b>Another operation is saving this content.</b>
      <span>Your changes have not been saved. They are still here in this tab.</span>
    </div>
    <p class="note">Keep this tab open. Wait a moment, then try saving again.</p>`, `
    <button class="btn" id="busyBackup">Download my copy</button>
    <span style="flex:1"></span>
    <button class="btn primary" id="busyRetry">Try saving again</button>`);
  $('#busyBackup').addEventListener('click', event => backupJson(event));
  $('#busyRetry').addEventListener('click', () => {
    closeModal(); writeNow();
  });
}

/* WordPress compiled the save against a different Pagecraft release from the editor in this
   tab. Retrying those same bytes cannot make the two compilers agree, and this is not another
   author's version conflict. Preserve the draft, offer a backup, and make the required reload
   explicit without advancing the document version or replaying the write. */
function warnCompilerReload(info) {
  rememberSaveProblem('Pagecraft was updated while this editor was open. Your latest changes have not been saved. Download a copy before reloading.', () => warnCompilerReload(info));
  if (saveWarned) return;
  saveWarned = true;
  openModal('Reload Pagecraft to keep editing', `
    <div class="alert">
      <b>Pagecraft was updated while this editor was open.</b>
    </div>
    <div class="note" style="margin-top:var(--gap-2);line-height:1.7">
      Your latest changes are still in this tab and have not been saved. Download a copy before reloading.
    </div>`, `
    <button class="btn" id="compilerBackup">Download my copy</button>
    <span style="flex:1"></span>
    <button class="btn primary" id="compilerReload">Reload builder</button>`);
  $('#compilerBackup').addEventListener('click', event => backupJson(event));
  $('#compilerReload').addEventListener('click', reloadDiscardingChanges);
}

/* A previous cloud request may have committed after its response was lost. If the host cannot
   be read back now, neither retrying nor calling this a foreign edit is safe. */
function warnSaveUnconfirmed(info) {
  rememberSaveProblem('The host has a newer draft, but this editor could not verify whether it came from your interrupted save. Download your copy before reloading.', () => warnSaveUnconfirmed(info));
  if (saveWarned) return;
  saveWarned = true;
  const theirs = info && info.conflict ? info.conflict.theirs : '?';
  openModal('Save outcome needs checking', `
    <div class="alert">
      <b>The host is on version ${theirs}, but this editor could not safely read it back.</b>
      <span>Your interrupted save may have reached the host. It may also contain a change from another editor, so Pagecraft will not overwrite it.</span>
    </div>
    <div class="note" style="margin-top:var(--gap-2);line-height:1.7">
      Download your copy, then reload the host draft. Keep both copies until you confirm which changes are present.
    </div>`, `
    <button class="btn" id="ucBackup">Download my copy</button>
    <span style="flex:1"></span>
    <button class="btn primary" id="ucReload">Reload host draft</button>`);
  $('#ucBackup').addEventListener('click', event => backupJson(event));
  $('#ucReload').addEventListener('click', reloadDiscardingChanges);
}

/* Somebody else saved between this editor loading and this editor saving. Reloading is the

function warnStale(info) {
  rememberSaveProblem('A newer draft was saved elsewhere. Download your copy before reloading; saving would overwrite their work.', () => warnStale(info));
  if (saveWarned) return;
  saveWarned = true;
  const theirs = info && info.conflict ? info.conflict.theirs : '?';
  openModal('Somebody else saved this page', `
    <div class="alert">
      <b>This page changed somewhere else while you were working.</b>
      <span>Your version is ${SRV.version}, the host now has ${theirs}. Saving would overwrite their work, so nothing was saved.</span>
    </div>
    <div class="note" style="margin-top:var(--gap-2);line-height:1.7">
      Download a copy of what you have, then reload to get their version. There is no way to
      merge the two, and guessing which parts to keep is not a guess worth making for you.
    </div>`, `
    <button class="btn" id="stBackup">Download my copy</button>
    <span style="flex:1"></span>
    <button class="btn primary" id="stReload">Reload theirs</button>`);
  $('#stBackup').addEventListener('click', event => backupJson(event));
  $('#stReload').addEventListener('click', reloadDiscardingChanges);

/* A content account tried to change something structural. Not an error on their part —

    <div class="alert">
      <b>That change was not saved.</b>

    <div class="note" style="margin-top:var(--gap-2);line-height:1.7">

    <button class="btn" id="coBackup">Download my copy</button>
    <span style="flex:1"></span>

  $('#coReload').addEventListener('click', reloadDiscardingChanges);

/* WordPress refused the REST nonce even after a fresh one was asked for, which means the login

  if (saveWarned) return;

    <div class="alert">
      <b>Your WordPress session expired. Reload to keep editing.</b>
      <span>Your latest changes were not saved. They are still here in this tab.</span>
    </div>
    <p class="note">Download a copy first if you want to keep them, then reload and sign in again.</p>`, `
    <button class="btn" id="seBackup">Download my copy</button>
    <span style="flex:1"></span>
    <button class="btn primary" id="seReload">Reload</button>`);

/* Explicit recovery and confirmed history restoration discard this tab's failed draft.

/* A failed write must never be a whisper — it means work is being lost. */

    'The compiled Pagecraft page contains an unsafe inline style.': 'Embedded HTML contains an unsafe inline style. Remove that style, then save again.',
    'The compiled Pagecraft stylesheet contains an unsupported executable or parser directive.': 'Custom CSS contains an unsupported directive. Remove that directive, then save again.',
    'Pagecraft runtime video embeds must use a credential-free absolute HTTPS URL.': 'A video embed needs an absolute HTTPS URL without a username or password. Correct its URL, then save again.',
    'Pagecraft iframe embeds must use an absolute HTTPS URL.': 'An iframe embed needs an absolute HTTPS URL. Correct its URL, then save again.',
    'Pagecraft form actions must use an absolute HTTPS URL.': 'A form action needs an absolute HTTPS URL. Correct its URL, then save again.'

    <button class="btn" id="svRetry">Try saving again</button>

  $('#svBackup').addEventListener('click', event => backupJson(event));
  $('#svRetry').addEventListener('click', () => {

/* The last edit before the tab closes is still waiting on the debounce. Write it now: localStorage

window.addEventListener('pagehide', () => {
