/*<core>*/
/* ============================================================== presets */
/* Column layouts, grouped by how many columns they produce. The count is
   structural so it lives on the desktop base; per-breakpoint width tweaks are
   done with each column's own Width control. */
const T3 = 33.3333, T6 = 66.6666;
const LAYOUTS = {
  1: [[100]],
  2: [[50, 50], [T6, T3], [T3, T6], [75, 25], [25, 75]],
  3: [[T3, T3, T3], [50, 25, 25], [25, 50, 25], [25, 25, 50]],
  4: [[25, 25, 25, 25], [40, 20, 20, 20], [20, 20, 20, 40]],
  5: [[20, 20, 20, 20, 20]],
  6: [[16.6666, 16.6666, 16.6666, 16.6666, 16.6666, 16.6666]]
};
const COUNTS = Object.keys(LAYOUTS).map(Number);
const DEFAULT_COLS = 2;                       // what a fresh Columns drop gives you
/* `columns` is a palette key, not a node type — it builds a row of columns */
const BASE = { columns: 'row' };
const labelOf = k => k === 'columns' ? 'Columns' : DEF[k].label;
const iconOf = k => k === 'columns' ? 'columns' : DEF[k].icon;
function makeFor(key) {
  if (key !== 'columns') return N(key);
  return N('row', {}, {}, LAYOUTS[DEFAULT_COLS][0].map(w =>
    N('column', {}, { d: { 'flex-grow': String(+w.toFixed(4)) } })));
}
/* which layout, if any, the row currently matches */
const rowRatios = row => (row.children || []).map(c => parseFloat((c.css.d || {})['flex-grow']) || 0);
function matchLayout(row) {
  const cur = rowRatios(row), list = LAYOUTS[cur.length] || [];
  const i = list.findIndex(l => l.every((w, k) => Math.abs(w - cur[k]) < 0.51));
  return i < 0 ? null : i;
}

/* Saved blocks sit alongside the components, because that is where you go to
   put something on the page. */
/* Shared by the canvas bar and the Blocks tab, so both offer the same choices. */
async function saveBlockFlow(nodeId) {
  const h = locate(nodeId); if (!h) return;
  const got = await askBlock(nameOf(h.node));
  if (!got || !got.name) return;
  edit(() => blockSave(nodeId, got.name, got.sync));
  toast(got.sync ? `“${got.name}” saved as a global block` : `“${got.name}” saved — find it in Add`);
}

/* Sending one copy's content to the block and the rest. The same shape as updating
   a text style from an element: say how many others move, then do it in one step. */
async function pushBlockFlow(nodeId) {
  const h = locate(nodeId); if (!h) return;
  const b = findBlock((h.node.adv || {}).block); if (!b) return;
  const others = blockUsage(b.id) - 1;
  if (others > 0 && !await askConfirm('Update every copy?',
    `${others} other cop${others === 1 ? 'y' : 'ies'} of <b>${esc(b.name)}</b> will be updated to match this one.`,
    { ok: 'Push to all', danger: false })) return;
  let n = 0;
  edit(() => { n = blockPush(nodeId); });
  toast(n ? `“${esc(b.name)}” updated — ${n} cop${n === 1 ? 'y' : 'ies'} matched` : `“${esc(b.name)}” updated`);
}

function drawBlocks() {
  const box = $('#addBody');
  if (!box || (state.ui.atab || 'widgets') !== 'blocks') return;

  box.innerHTML = `${blocks().length ? blocks().map(b => `

        <button class="bx" data-bdel="${b.id}" title="Forget this block">${svg('trash', 11)}</button>
      </div>`).join('') : '<div class="hint">Nothing saved yet. Select something on the canvas and save it here to reuse it on any page.</div>'}
    <button class="btn" id="blockSave" style="width:100%;justify-content:center;margin-top:var(--gap-1);font-size:12px"${sel ? '' : ' disabled'}>
      ${svg('plus', 12)} ${sel ? 'Save ' + esc(DEF[sel.node.type].label) + ' as block' : 'Select something to save'}
    </button>`;

  $$('.brow', box).forEach(row => {

    });

/* click-to-add: drop it into the current selection's nearest legal container */
/* Where a new `key` should land given the current selection: inside it when it can
   hold one, otherwise beside the nearest ancestor that can. Shared by the Add
   panel and the media library, which both place elements without a drag. */
function smartTarget(key) {
  let container = null, index = null;
  const s = state.ui.sel ? locate(state.ui.sel) : null;
  if (s) {
    let node = s.node, parent = s.parent;
    if (holds(node.type, key)) { container = node; index = node.children.length; }
    else {
      while (parent && !holds(parent.type, key)) { node = parent; parent = locate(parent.id).parent; }
      if (parent) { container = parent; index = parent.children.findIndex(c => c.id === node.id) + 1; }
      else { container = null; index = tree().findIndex(c => c.id === node.id) + 1; }
    }
  }
  if (index === null) index = tree().length;
  return [container, index];
}
function appendSmart(key) {
  const [container, index] = smartTarget(key);
  edit(() => { const leaf = insert(key, container, index); selSet([leaf.id]); });
  toast(labelOf(key) + ' added');
  const el = cdoc && cdoc.getElementById(state.ui.sel);
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

/* =============================================================== layers */
function renderLayers() {
  const p = $('#paneLayers');
  const list = tree();
  const rows = [];

  /* Global regions are edited in place: the live one expands, the others stay
     collapsed and locked. Selecting one switches the editing scope. */
  const scope = scopeOf();
  const regionRow = R => {
    const live = R.kind === scope;
    return `<div class="lrow region${live ? ' live' : ' locked'}" data-goto="${modeFor(R.kind)}">
      ${svg(R.kind === 'main' ? 'page' : 'globe', 13, 'ico')}
      <span class="nm">${R.label}</span>
      ${live ? '<span class="badge">Editing</span>' : svg('lock', 12, 'lk')}
    </div>`;
  };
  const picked = new Set(selIds());
  const walk = (arr, depth) => arr.forEach(n => {
    const kids = n.children || [];
    const col = state.ui.collapsed[n.id];
    const hid = n.hide && n.hide[dk()];
    const mark = state.ui.sel === n.id ? ' sel' : picked.has(n.id) ? ' sel2' : '';
    rows.push(`<div class="lrow${mark}${col ? ' collapsed' : ''}" data-id="${n.id}" style="padding-left:${6 + depth * 13}px">
      <span class="tw" data-tw="${n.id}">${kids.length ? svg('caret', 10) : ''}</span>
      ${svg(DEF[n.type].icon, 13, 'ico')}
      <span class="nm">${esc(nameOf(n))}</span>
      <span class="act">
        <button data-act="hide" title="${hid ? 'Show' : 'Hide'} on ${DEV_LABEL[dk()]}">${svg(hid ? 'eyeoff' : 'eye', 12)}</button>
        <button data-act="dup" title="Duplicate">${svg('copy', 12)}</button>
        <button data-act="del" title="Delete">${svg('trash', 12)}</button>
      </span>
    </div>`);
    if (kids.length && !col) walk(kids, depth + 1);
  });
  for (const R of REGIONS) {
    rows.push(regionRow(R));
    if (R.kind !== scope) continue;
    if (!list.length) rows.push(`<div class="empty" style="padding:14px 16px">Empty.<br>Add an element from the <b>Add</b> panel.</div>`);
    else walk(list, 1);
  }
  p.innerHTML = `<div class="layers">${rows.join('')}</div>`;
  bindLayers(p);
}

function bindLayers(p) {
  $$('.lrow', p).forEach(r => {
    if (r.dataset.goto) { r.addEventListener('click', () => setMode(r.dataset.goto)); return; }
    if (r.dataset.main) { r.addEventListener('click', () => select(null)); return; }
    const id = r.dataset.id;
    r.addEventListener('click', e => {
      const tw = e.target.closest('[data-tw]');
      if (tw) { state.ui.collapsed[id] = !state.ui.collapsed[id]; renderLayers(); return; }
      const b = e.target.closest('button[data-act]');
      if (b) {
        e.stopPropagation();
        const a = b.dataset.act;
        if (a === 'dup') edit(() => dupNode(id));
        else if (a === 'del') edit(() => delNode(id));
        else if (a === 'hide') edit(() => { const n = locate(id).node; n.hide = n.hide || {}; n.hide[dk()] = !n.hide[dk()]; });
        return;
      }
      select(id, { scroll: true, add: e.metaKey || e.ctrlKey, range: e.shiftKey });
    });
  });
}

/* ================================================================ pages */
/* ============================================================ media library
   A grid modal rather than a rail panel: a 272px panel fits one card per row,
   which is no way to look at images. `mediaModal` manages the library, and
   `mediaPicker` (on the ask layer) is the same grid used to answer "which image?".
   Both draw their cards from `mediaCards`, so they cannot drift. */
function mediaCards(list, use, attr) {
  return list.map(a => `<div class="mitem">
    <button class="mcard" ${attr}="${a.id}" title="${esc(a.name)}">
      <span class="mthumb"><img src="${a.url}" alt=""></span>
      <span class="mname">${esc(a.name)}</span>
      <span class="msub">${kb(a.size)}${a.w ? ` · ${a.w}×${a.h}` : ''}${use[a.id] ? ` · used ${use[a.id]}×` : ' · unused'}</span>
    </button>
    <button class="mdel" data-del="${a.id}" title="Delete from the library">${svg('trash', 12)}</button>
  </div>`).join('');
}

/* Takes a file into the library. Shared by every upload entry point. */
async function mediaTake(file) {
  if (!file || !/^image\//.test(file.type)) { toast('That is not an image file'); return null; }
  if (file.size > 6e6 && !await askConfirm('That is a large image',
    `This file is <b>${(file.size / 1048576).toFixed(1)} MB</b>. Large images slow the page down.`,
    { ok: 'Add anyway', danger: false })) return null;
  const id = await assetAdd(file);
  const got = AS.mem.get(id);
  writeNow();
  toast(`${file.name} — ${kb(file.size)}${got && got.w ? `, ${got.w} × ${got.h}` : ''}`);
  return id;
}
function mediaChooseFiles(after) {
  const fi = document.createElement('input');
  fi.type = 'file'; fi.accept = 'image/*'; fi.multiple = true;
  fi.onchange = async () => { for (const f of fi.files) await mediaTake(f); after(); };
  fi.click();
}

function mediaModal() {
  if (editing.on) exitEdit();
  const draw = () => {
    const use = assetUsage();
    const list = [...AS.mem.values()];
    const orphans = list.filter(a => !use[a.id]).length;
    openModal('Media library', list.length
      ? `<div class="mgrid wide">${mediaCards(list, use, 'data-use')}</div>`
      : `<div class="empty" style="padding:28px 8px">Nothing here yet.<br><br>
          Upload below, or drop an image onto any <b>Image</b> or <b>Background</b> field.</div>`,
      `<span class="note" style="margin:0;flex:1;text-align:left">${list.length
        ? `${list.length} image${list.length === 1 ? '' : 's'} · ${kb(assetBytes())} · click one to place it`
        : 'Stored in this browser'}</span>
       ${orphans ? `<button class="btn" id="mmPrune">Remove ${orphans} unused</button>` : ''}
       <button class="btn" id="mmUp">${svg('image', 13)} Upload</button>
       <button class="btn primary" id="mmDone">Done</button>`, 'lg');

    $('#mmUp').addEventListener('click', () => mediaChooseFiles(draw));
    $('#mmDone').addEventListener('click', closeModal);
    const prune = $('#mmPrune');
    if (prune) prune.addEventListener('click', async () => {
      for (const a of [...AS.mem.values()]) if (!use[a.id]) await assetDel(a.id);
      writeNow(); draw(); toast('Unused images removed');
    });
    $$('[data-use]', $('#mBody')).forEach(b => b.addEventListener('click', () => {
      const a = AS.mem.get(b.dataset.use); if (!a) return;
      let made = null;
      edit(() => {
        made = insert('image', ...smartTarget('image'));
        made.props.src = 'asset:' + a.id;
        made.props.alt = '';
        if (a.w) { made.props.w = String(a.w); made.props.h = String(a.h); }
        selSet([made.id]);
      });
      closeModal();
      toast(`${a.name} placed — add alt text`);
    }));
    $$('[data-del]', $('#mBody')).forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.del;
      if (use[id] && !await askConfirm('Delete this image?',
        `It is used ${use[id]}× on the site. Those elements fall back to a placeholder.`,
        { ok: 'Delete image' })) return;
      await assetDel(id); writeNow(); paint(); draw();
    }));
  };
  draw();
}

/* ====================================================== settings panel */
let CUR = [];                                   // control descriptors for this render
/* Style edits land on whatever the inspector is targeting: this element, or one
   of its classes. Explicit, so nobody restyles twelve elements by accident. */
function tgtObj(n) {
  const id = state.ui.target;
  const c = id && findClass(id);
  return (c && (n.cls || []).includes(id)) ? c : n;
}
const tgtIsClass = n => tgtObj(n) !== n;
/* The Undo and Redo buttons reflect history depth, and `tx()` pushes a snapshot
   without going through `edit()` — so `HOOKS.change()` never fires and the
   buttons kept their disabled state until the next full render. After any style
   edit `hist.u.length` was 1 while the button was still greyed out: ⌘Z worked and
   the button looked dead. Anything that moves history depth calls this. */
function paintHistory() {
  const u = $('#undoBtn'), r = $('#redoBtn');
  if (u) u.disabled = !hist.u.length;
  if (r) r.disabled = !hist.r.length;
}
let txKey = null;
function tx(key) {
  if (txKey === key) return;
  txKey = key; hist.u.push(clone(doc()));
  if (hist.u.length > hist.max) hist.u.shift();
  hist.r.length = 0;
  paintHistory();
}
const endTx = () => { txKey = null; paintHistory(); };
const repaint = dbounce(() => { paint(); save(); renderLayers(); refreshReview(); paintHistory(); }, 90);
const repaintCss = dbounce(() => { paintCss(); save(); refreshReview(); paintHistory(); }, 60);

function parseU(v) {
  const s = String(v == null ? '' : v).trim();
  const m = s.match(/^(-?[\d.]+)\s*(px|rem|em|%|vw|vh|ch|s|ms)?$/);
  return m ? { n: m[1], u: m[2] || '' } : { n: '', u: '' };
}
/* current + inherited value for a css prop */
function cssVal(n, c, resp) {
  const b = resp ? dk() : 'd';
  const own = n.css[b] ? n.css[b][c] : undefined;
  if (own !== undefined && own !== '') return { v: own, own: true };
  if (b === 'm' && n.css.t && n.css.t[c]) return { v: n.css.t[c], own: false };
  const d = n.css.d ? n.css.d[c] : '';
  return { v: d == null ? '' : d, own: false };
}
function setCss(n, c, val, resp) {
  const b = resp ? dk() : 'd';
  n.css[b] = n.css[b] || {};
  if (val === '' || val == null) delete n.css[b][c]; else n.css[b][c] = val;
}
const propVal = (n, k) => n.props[k];
/* A link's mode is derived from the href it holds, so a mode with nothing to store
   yet — URL, email or phone before you have typed — parsed back as `none`: the select
   snapped shut before its input could appear, and anything typed was then discarded
   because the builder was told the mode was `none`. The pending choice lives in
   `ui.lmode` until a value makes it real. Both the markup and the wiring read it here,
   or they disagree about what mode the field is in. */
function linkOf(n, propKey, here) {
  const L = parseLink(propVal(n, propKey), here);
  if (L.mode === 'none' && state.ui.lmode && state.ui.lmode.key === n.id + '|' + propKey) L.mode = state.ui.lmode.mode;
  return L;
}

function labelHtml(c, n) {
  const resp = !!c.r, dev = dk(), o = tgtObj(n);
  const own = resp && c.c ? !!(o.css[dev] && o.css[dev][c.c] !== undefined) : false;
  const badge = resp
    ? `<span class="rsp${own && dev !== 'd' ? ' ovr' : ''}" data-clear="${own && dev !== 'd' ? '1' : ''}"
        title="${dev === 'd' ? 'Editing the desktop base value' : own ? 'Overridden on ' + DEV_LABEL[dev] + ' — click to clear' : 'Set a ' + DEV_LABEL[dev] + ' override'}">${svg(dev === 'd' ? 'desktop' : dev === 't' ? 'tablet' : 'mobile', 9)}</span>`
    : '';
  return `<label>${esc(c.label || '')}${badge}</label>`;
}

      const list = LAYOUTS[count] || [];
      return `<div class="f" data-ci="${i}">${labelHtml(c, n)}
        <div class="pick">${COUNTS.map(k =>
        `<button data-x="ccount" data-v="${k}" class="${k === count ? 'on' : ''}" title="${k} column${k === 1 ? '' : 's'}">${k}</button>`).join('')}</div>
        ${list.length > 1 ? `<label style="margin-top:var(--gap-2)">Layout</label>
        <div class="lay">${list.map((l, k) =>
          `<button data-x="clay" data-v="${k}" class="${hit === k ? 'on' : ''}" title="${l.map(w => Math.round(w) + '%').join(' / ')}">
             ${l.map(w => `<i style="flex-grow:${w}"></i>`).join('')}
           </button>`).join('')}</div>` : ''}
        <div class="note">${count > COUNTS[COUNTS.length - 1] ? `${count} columns — more than the presets cover. Set each column's width individually.` : 'Drag a gutter on the canvas to change the split. Reducing the count moves content into the last column.'}</div>
      </div>`;
    }
  }
  return '';
}

function groupHtml(name, items, n, base) {
  const key = n.type + ':' + name;
  const closed = state.ui.open[key] === false;
  return `<div class="group${closed ? ' closed' : ''}" data-gk="${key}">
    <div class="gh">${svg('caret', 10)} ${esc(name)}</div>
    <div class="gb">${items.map((c, i) => ctlHtml(n, c, base + i)).join('')}</div>
  </div>`;
}

function renderRight() {
  const box = $('#right');
  const s = state.ui.sel ? locate(state.ui.sel) : null;
  CUR = [];

  /* With nothing selected there is nothing to inspect, so the panel leaves and
     the canvas takes the space. What the empty state used to hold — the shortcut
     table — lives in the ? dialog, which is always reachable. */
  const was = box.hidden;
  box.hidden = !s;
  /* Joining or leaving changes the canvas width, so the selection frame and the
     px readout need recomputing once layout settles — `select()` paints the HUD
     before it calls this. */
  if (was !== box.hidden) requestAnimationFrame(() => { positionHud(); renderDim(); });
  if (!s) { box.innerHTML = ''; return; }

  const n = s.node, d = DEF[n.type], tab = state.ui.stab;
  const content = d.controls.content || [];
  const style = d.controls.style || [];
  /* With several elements picked, the fields still come from the primary — it is
     the one type whose controls are guaranteed to exist — and `applyC` fans each
     edit out over the set. The header has to say so, or the count is the only
     clue that a slider just moved twelve things. */
  const ids = selIds(), many = ids.length > 1;
  const kinds = [...new Set(selNodes().map(x => DEF[x.type].label))];

  let html = `
    <div class="sHead">
      <div class="ic">${svg(d.icon, 14)}</div>
      <div class="tt"><b>${many ? ids.length + ' selected' : esc(d.label)}</b>
        <small>${many ? esc(kinds.join(' · ')) : '#' + esc(domIdOf(n))}</small></div>
      ${!many && s.parent ? `<button class="iconbtn" id="selParent" title="Select parent (esc)">${svg('caret', 13)}</button>` : ''}
    </div>
    <div class="tabs" id="sTabs">
      <button data-s="content" class="${tab === 'content' ? 'on' : ''}">Content</button>
      <button data-s="style" class="${tab === 'style' ? 'on' : ''}">Style</button>
      <button data-s="advanced" class="${tab === 'advanced' ? 'on' : ''}">Advanced</button>
    </div><div class="pane">`;

  if (tab === 'content') {
    CUR = content.slice();
    html += `<div class="group"><div class="gh">${svg('caret', 10)} ${esc(d.label)}</div><div class="gb">${content.map((c, i) => ctlHtml(n, c, i)).join('') || '<div class="note">No content options — use the Style tab.</div>'}</div></div>`;
  } else if (tab === 'style') {
    const applied = nodeClasses(n);
    const target = state.ui.target && findClass(state.ui.target) && applied.some(c => c.id === state.ui.target) ? state.ui.target : '';
    const pool = classes().filter(c => !applied.some(x => x.id === c.id));
    html += `<div class="group" data-gk="${n.type}:Styling"><div class="gh">${svg('caret', 10)} Styling</div><div class="gb">
      <div class="tgrow">
        <button class="tg${target ? '' : ' on'}" data-tg="">This element</button>
      </div>
      ${applied.map(c => {
      const uses = classUsage(c.id);
      return `<div class="tgrow">
          <button class="tg${target === c.id ? ' on' : ''}" data-tg="${c.id}">.${esc(c.id)}</button>
          <small>${uses} use${uses === 1 ? '' : 's'}</small>
          <button class="tgx" data-rm="${c.id}" title="Remove this class from the element">${svg('trash', 12)}</button>
        </div>`;
    }).join('')}
      <select class="ctl" data-x="addcls" style="margin-top:var(--gap-1)">
        <option value="">Add a class…</option>
        ${pool.map(c => `<option value="${c.id}">.${esc(c.id)} · ${classUsage(c.id)} use${classUsage(c.id) === 1 ? '' : 's'}</option>`).join('')}
        <option value="__new">＋ New class from this element…</option>
      </select>
      <div class="note">${target
      ? `Editing <b>.${esc(target)}</b> — every change here reaches all ${classUsage(target)} element${classUsage(target) === 1 ? '' : 's'} using it.`
      : applied.length
        ? 'Editing this element only. Its classes are listed above; pick one to edit it instead.'
        : 'Editing this element only. Save its styling as a class to reuse it elsewhere.'}</div>
    </div></div>`;

    let base = 0;
    if (style.length) { CUR = style.slice(); html += groupHtml('Typography & fill', style, n, 0); base = style.length; }
    COMMON_STYLE.forEach(g => {
      CUR = CUR.concat(g.items);
      html += groupHtml(g.g, g.items, n, base);
      base += g.items.length;
    });
  } else {
    const adv = [
      { t: 'text', k: '_id', label: 'HTML id', ph: autoId(n), note: 'Auto-generated unless you set one. This is what a link anchor targets.' },
      { t: 'text', k: '_cls', label: 'CSS classes', ph: 'hero card--dark' },
      { t: 'select', c: 'position', label: 'Position', opts: [['', 'Static'], ['relative', 'Relative'], ['absolute', 'Absolute'], ['sticky', 'Sticky'], ['fixed', 'Fixed']] },
      { t: 'unit', c: 'top', label: 'Top', r: 1, units: ['px', '%', 'rem'] },
      { t: 'unit', c: 'z-index', label: 'Z-index', units: [''] },
      { t: 'select', c: 'overflow', label: 'Overflow', opts: [['', 'Visible'], ['hidden', 'Hidden'], ['auto', 'Auto']] },
      { t: 'unit', c: 'max-width', label: 'Max width', r: 1, units: ['px', 'rem', '%', 'ch'] },
      { t: 'area', k: '_css', label: 'Custom CSS', rows: 4, ph: '& { … }' }
    ];
    CUR = adv.slice();
    html += `<div class="group"><div class="gh">${svg('caret', 10)} Identity & layout</div><div class="gb">${adv.map((c, i) => ctlHtml(n, c, i)).join('')}</div></div>
    <div class="group"><div class="gh">${svg('caret', 10)} Visibility</div><div class="gb">
      ${['d', 't', 'm'].map(b => `<div class="tog-row" style="margin-bottom:var(--gap-1)"><span>${svg(b === 'd' ? 'desktop' : b === 't' ? 'tablet' : 'mobile', 12)} Hide on ${DEV_LABEL[b]}</span>
        <button class="sw-tog${n.hide && n.hide[b] ? ' on' : ''}" data-hide="${b}"><i></i></button></div>`).join('')}
      <div class="note">Ghosted on the canvas, so you can still select them.</div>
    </div></div>`;
  }

  html += `</div>
    <div class="sFoot">
      <button class="btn" id="sDup">${svg('copy', 13)} Duplicate${many ? ' all' : ''}</button>
      <button class="btn danger" id="sDel">${svg('trash', 13)} Delete${many ? ' all' : ''}</button>
    </div>`;
  box.innerHTML = html;
  bindRight(n);
}

/* ------------------------------------------------------ control wiring */
/* One edit reaches every selected element. The exception is a class target:
   its members already share the object, so it takes a single write and fanning
   out would just rewrite the same value N times. */
function applyC(n, c, v) {
  const ids = selIds();
  if (ids.length > 1 && ids.includes(n.id) && !(c.c && tgtIsClass(n))) {
    fanTargets(c, ids).forEach(t => applyOne(t, c, v));
    return;
  }
  applyOne(n, c, v);
}
function applyOne(n, c, v) {
  if (c.k === '_id') { n.adv.htmlId = v.replace(/[^\w-]/g, ''); return; }
  if (c.k === '_cls') { n.adv.cls = v; return; }
  if (c.k === '_css') { n.adv.css = v; return; }
  if (c.c) setCss(tgtObj(n), c.c, v, !!c.r);
  else n.props[c.k] = v;
}

function bindRight(n) {
  const box = $('#right');

  $$('.gh', box).forEach(h => h.addEventListener('click', () => {
    const g = h.parentElement, k = g.dataset.gk;
    g.classList.toggle('closed');
    if (k) state.ui.open[k] = !g.classList.contains('closed');
  }));
  const st = $('#sTabs');
  if (st) $$('button', st).forEach(b => b.addEventListener('click', () => { state.ui.stab = b.dataset.s; renderRight(); }));
  const sp = $('#selParent');
  if (sp) sp.addEventListener('click', () => { const h = locate(n.id); select(h.parent ? h.parent.id : null); });
  const sd = $('#sDup'); if (sd) sd.addEventListener('click', () => {
    const ids = selIds(); edit(() => ids.length > 1 ? dupMany(ids) : dupNode(n.id));
  });
  const sx = $('#sDel'); if (sx) sx.addEventListener('click', () => {
    const ids = selIds(); edit(() => ids.length > 1 ? delMany(ids) : delNode(n.id));
  });
  $$('[data-tg]', box).forEach(b => b.addEventListener('click', () => {
    state.ui.target = b.dataset.tg;
    renderRight();
  }));
  $$('[data-rm]', box).forEach(b => b.addEventListener('click', () => {
    if (state.ui.target === b.dataset.rm) state.ui.target = '';
    edit(() => classRemove(n, b.dataset.rm));
  }));
  const addCls = box.querySelector('[data-x="addcls"]');
  if (addCls) addCls.addEventListener('change', async () => {
    const v = addCls.value;
    if (!v) return;
    if (v === '__new') {
      const name = await askText('New class', 'Class name', DEF[n.type].label,
        { ok: 'Create class', note: 'Restyling it reaches every element using it.' });
      if (name === null) { addCls.value = ''; return; }
      edit(() => { state.ui.target = classFrom(n, name); });
      toast('Class created from this element');
      return;
    }
    edit(() => { classApply(n, v); state.ui.target = v; });
  });
  $$('[data-hide]', box).forEach(b => b.addEventListener('click', () => edit(() => {
    n.hide = n.hide || {}; n.hide[b.dataset.hide] = !n.hide[b.dataset.hide];
  })));

  $$('.f[data-ci]', box).forEach(f => {
    const c = CUR[+f.dataset.ci]; if (!c) return;
    const key = n.id + '|' + (c.c || c.k || c.t);
    const cssOnly = !!c.c;                       // writes a CSS property, not content
    const live = v => { tx(key); applyC(n, c, v); (cssOnly ? repaintCss : repaint)(); };
    const hard = v => {
      tx(key); applyC(n, c, v);
      if (cssOnly) paintCss(); else { paint(); renderLayers(); }
      save(); endTx(); renderRight();
    };

    /* responsive badge → clear the override for this breakpoint */
    const badge = f.querySelector('.rsp[data-clear="1"]');
    if (badge) badge.addEventListener('click', () => {
      tx(key + ':clear');
      const o = tgtObj(n);
      if (c.t === 'box') ['top', 'right', 'bottom', 'left'].forEach(s => { delete o.css[dk()][c.c + '-' + s]; });
      else delete o.css[dk()][c.c];
      endTx(); paintCss(); save(); renderRight();
    });

    const gv = x => f.querySelector(`[data-x="${x}"]`);

    switch (c.t) {
      case 'text': case 'area': {
        const el = gv('v');
        el.addEventListener('input', () => live(el.value));
        el.addEventListener('blur', endTx);
        break;
      }
      case 'select': { const el = gv('v'); el.addEventListener('change', () => hard(el.value)); break; }
      case 'unit': {
        const nu = gv('n'), uu = gv('u');
        const push = () => {
          const v = String(nu.value).trim();
          live(v === '' ? '' : v + (uu.value || ''));
        };
        nu.addEventListener('input', push);
        nu.addEventListener('blur', endTx);
        uu.addEventListener('change', () => { push(); endTx(); });
        break;
      }
      case 'slider': {
        const r = gv('r'), nn = gv('n');
        const push = v => { r.value = v; nn.value = v; live(c.raw ? String(v) : v + 'px'); };
        r.addEventListener('input', () => push(r.value));
        nn.addEventListener('input', () => push(nn.value));
        r.addEventListener('change', endTx); nn.addEventListener('blur', endTx);
        break;
      }
      case 'color': {
        const pk = gv('c'), hx = gv('v'), cl = gv('clr'), sw = f.querySelector('.sw i');
        const cur = () => (c.c ? cssVal(tgtObj(n), c.c, !!c.r).v : propVal(n, c.k));
        pk.addEventListener('input', () => {
          sw.style.background = pk.value;
          if (hx) hx.value = pk.value;
          live(pk.value);                       // picking a literal breaks any link
        });
        pk.addEventListener('change', () => { endTx(); if (isRef(cur())) renderRight(); });
        if (hx) {
          hx.addEventListener('input', () => { sw.style.background = hx.value || 'transparent'; live(hx.value.trim()); });
          hx.addEventListener('blur', endTx);
        }
        if (cl) cl.addEventListener('click', () => hard(''));
        const un = gv('unlink');
        if (un) un.addEventListener('click', () => hard(resolveColor(cur())));
        $$('[data-x="tok"]', f).forEach(b => b.addEventListener('click', () => hard(cvar(b.dataset.id))));
        gv('tokadd').addEventListener('click', async () => {
          const lit = resolveColor(cur()) || pk.value;
          const name = await askText('New colour token', 'Colour name', 'Accent',
            { ok: 'Create token', note: 'Every element using it changes with it.' });
          if (name === null) return;
          edit(() => { const id = colorAdd(name, lit); applyC(n, c, cvar(id)); });
          toast('Colour token created');
        });
        break;
      }
      case 'pick': $$('[data-x="p"]', f).forEach(b => b.addEventListener('click', () => hard(b.dataset.v))); break;
      case 'toggle': gv('t').addEventListener('click', () => hard(propVal(n, c.k) ? 0 : 1)); break;
      case 'box': {
        const uu = gv('bu');
        const push = () => {
          tx(key);
          $$('[data-x="b"]', f).forEach(inp => {
            const v = String(inp.value).trim();
            setCss(tgtObj(n), c.c + '-' + inp.dataset.s, v === '' ? '' : v + uu.value, !!c.r);
          });
          repaintCss();
        };
        $$('[data-x="b"]', f).forEach(inp => { inp.addEventListener('input', push); inp.addEventListener('blur', endTx); });
        uu.addEventListener('change', () => { push(); endTx(); });
        break;
      }
      case 'img': {
        const wrapv = v => c.bg ? (v ? `url("${v}")` : '') : v;
        const cl = gv('clr');
        if (cl) cl.addEventListener('click', () => hard(wrapv('')));
        const useAsset = got => edit(() => {
          applyC(n, c, wrapv('asset:' + got.id));
          if (!c.bg && got.w) { n.props.w = String(got.w); n.props.h = String(got.h); }
        });
        const libEl = gv('lib');
        if (libEl) libEl.addEventListener('click', async () => {
          const id = await mediaPicker();
          const got = id && AS.mem.get(id);
          if (got) useAsset(got);
        });
        /* one entry point for taking a file into the library, so the type check, the
           large-image warning and the toast are identical everywhere */
        const take = async file => {
          const id = await mediaTake(file);
          if (!id) return;
          const got = AS.mem.get(id);
          if (got) useAsset(got);
        };
        const choose = () => {
          const fi = document.createElement('input');
          fi.type = 'file'; fi.accept = 'image/*';
          fi.onchange = () => take(fi.files[0]);
          fi.click();
        };
        gv('up').addEventListener('click', choose);
        const drop = gv('drop');
        if (drop) {
          drop.addEventListener('click', choose);
          ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => {
            e.preventDefault(); drop.classList.add('over');
          }));
          ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => {
            e.preventDefault(); drop.classList.remove('over');
          }));
          drop.addEventListener('drop', e => take(e.dataTransfer.files[0]));
        }
        break;
      }
      case 'opt': {
        const ck = n.id + '|' + (c.c || c.k);
        const selEl = gv('o'), cin = gv('oc');
        selEl.addEventListener('change', () => {
          if (selEl.value === '__custom') { state.ui.custom[ck] = true; renderRight(); return; }
          delete state.ui.custom[ck];
          hard(selEl.value);
        });
        if (cin) {
          cin.addEventListener('input', () => live(cin.value.trim()));
          cin.addEventListener('blur', endTx);
        }
        break;
      }
      case 'dims': {
        const w = gv('dw'), h = gv('dh');
        const push = () => { tx(key); n.props.w = w.value; n.props.h = h.value; repaint(); };
        w.addEventListener('input', push); h.addEventListener('input', push);
        w.addEventListener('blur', endTx); h.addEventListener('blur', endTx);
        gv('ddetect').addEventListener('click', async () => {
          const got = await imgSize(assetsToBlob(String(n.props.src || '')));
          if (!got) { toast('Could not read that image'); return; }
          edit(() => { n.props.w = String(got.w); n.props.h = String(got.h); });
          toast(`Detected ${got.w} × ${got.h}`);
        });
        break;
      }
      case 'items': {
        const arr = () => (n.props[c.k] = Array.isArray(n.props[c.k]) ? n.props[c.k] : []);
        const fld = (x, prop) => $$(`[data-x="${x}"]`, f).forEach(el => {
          el.addEventListener('input', () => { tx(key); arr()[+el.dataset.k][prop] = el.value; repaint(); });
          el.addEventListener('blur', endTx);
        });
        fld('il', 'label'); fld('ih', 'href');
        $$('[data-x="iu"]', f).forEach(b => b.addEventListener('click', () => {
          const k = +b.dataset.k; if (!k) return;
          edit(() => { const arr2 = arr(); [arr2[k - 1], arr2[k]] = [arr2[k], arr2[k - 1]]; });
        }));
        $$('[data-x="ix"]', f).forEach(b => b.addEventListener('click', () =>
          edit(() => arr().splice(+b.dataset.k, 1))));
        gv('ia').addEventListener('click', () => edit(() => arr().push({ label: 'New link', href: '' })));
        break;
      }
      case 'tstyle': {
        const selEl = gv('ts');
        selEl.addEventListener('change', () => edit(() => {
          if (selEl.value) tsApply(n, selEl.value); else tsUnlink(n);
        }));
        const push = gv('tspush');
        if (push) push.addEventListener('click', async () => {
          const t = findStyle(n.props.ts), k = t ? tsUsage(t.id) : 0;
          if (k > 1 && !await askConfirm('Update the style everywhere?', `<b>${esc(t.name)}</b> is used ${k}×. Taking this element's typography into the style changes the other ${k - 1} too.`, { ok: 'Update style', danger: false })) return;
          edit(() => tsUpdateFrom(n));
          toast('Style updated everywhere');
        });
        const drop = gv('tsdrop');
        if (drop) drop.addEventListener('click', () => { edit(() => tsUnlink(n)); toast('Detached — the look is now local'); });
        const mk = gv('tsnew');
        if (mk) mk.addEventListener('click', async () => {
          const name = await askText('New text style', 'Style name', DEF[n.type].label,
            { ok: 'Create style', note: 'Every element using it follows.' });
          if (name === null) return;
          edit(() => tsCreateFrom(n, name));
          toast('Text style created');
        });
        break;
      }
      case 'fields': {
        const arr = () => (n.props[c.k] = Array.isArray(n.props[c.k]) ? n.props[c.k] : []);
        const live = (x, prop) => $$(`[data-x="${x}"]`, f).forEach(el => {
          el.addEventListener('input', () => { tx(key); arr()[+el.dataset.k][prop] = el.value; repaint(); });
          el.addEventListener('blur', endTx);
        });
        live('fl', 'label'); live('fn', 'name'); live('fp', 'ph'); live('fo', 'opts');
        $$('[data-x="ft"]', f).forEach(el => el.addEventListener('change', () => {
          tx(key); arr()[+el.dataset.k].type = el.value; endTx(); paint(); save(); renderRight();
        }));
        $$('[data-x="fr"]', f).forEach(b => b.addEventListener('click', () => {
          const k = +b.dataset.k;
          edit(() => { const a2 = arr(); a2[k].required = a2[k].required ? 0 : 1; });
        }));
        $$('[data-x="fu"]', f).forEach(b => b.addEventListener('click', () => {
          const k = +b.dataset.k; if (!k) return;
          edit(() => { const a2 = arr(); [a2[k - 1], a2[k]] = [a2[k], a2[k - 1]]; });
        }));
        $$('[data-x="fx"]', f).forEach(b => b.addEventListener('click', () =>
          edit(() => arr().splice(+b.dataset.k, 1))));
        gv('fa').addEventListener('click', () => edit(() =>
          arr().push({ type: 'text', label: 'New field', name: '', required: 0, ph: '' })));
        break;
      }
      case 'link': {
        const here = page().slug;
        const tkey = c.tk || 'target';
        const cur = () => linkOf(n, c.k, here);
        const commit = o => { tx(key); n.props[c.k] = buildLink(o); endTx(); paint(); save(); renderRight(); };
        gv('lm').addEventListener('change', () => {
          const mode = gv('lm').value;
          if (mode === 'none') n.props[tkey] = '';
          state.ui.lmode = mode === 'none' ? null : { key: n.id + '|' + c.k, mode };
          commit(mode === 'page' ? { mode, page: here, frag: '' } : { mode });
        });
        const lp = gv('lp'), lf = gv('lf'), lv = gv('lv'), lt = gv('lt');
        if (lp) lp.addEventListener('change', () => commit({ mode: 'page', page: lp.value, frag: '' }));
        if (lf) lf.addEventListener('change', () => { const o = cur(); o.frag = lf.value; commit(o); });
        if (lv) {
          lv.addEventListener('input', () => { tx(key); const o = cur(); o.value = lv.value.trim(); n.props[c.k] = buildLink(o); repaint(); });
          lv.addEventListener('blur', endTx);
        }
        if (lt) lt.addEventListener('click', () => {
          tx(key); n.props[tkey] = propVal(n, tkey) === '_blank' ? '' : '_blank';
          endTx(); paint(); save(); renderRight();
        });
        break;
      }
      case 'rich': gv('rich').addEventListener('click', () => enterEdit(n.id)); break;
      case 'cols': {
        $$('[data-x="ccount"]', f).forEach(b => b.addEventListener('click', async () => {
          const k = +b.dataset.v, had = n.children.length;
          if (k === had) return;
          const lost = n.children.slice(k).reduce((t, col) => t + col.children.length, 0);
          if (k < had && lost && !await askConfirm('Fewer columns', `${lost} element${lost === 1 ? '' : 's'} will move into the last remaining column.`, { ok: 'Continue', danger: false })) return;
          /* keep the current proportions where the count is unchanged-ish */
          edit(() => applyCols(n, LAYOUTS[k][0]));
        }));
        $$('[data-x="clay"]', f).forEach(b => b.addEventListener('click', () =>
          edit(() => applyCols(n, LAYOUTS[n.children.length][+b.dataset.v]))));
        break;
      }
    }
  });

  /* advanced pseudo-props need their stored values back in the inputs */

const tidy = css => css.replace(/\}/g, '}\n').replace(/\n{2,}/g, '\n').replace(/^\s+|\s+$/g, '');

function buildPage(pg) {
  const m = state.meta;
  const css = treeCss([state.header, pg.tree, state.footer], false);
  const body = renderList(state.header, { edit: false }) + renderList(pg.tree, { edit: false }) + renderList(state.footer, { edit: false });
  const title = pg.title || `${pg.name} — ${m.name}`;
  const base = String(m.baseUrl || '').replace(/\/+$/, '');
  const abs = u => !u ? '' : (/^https?:/i.test(u) ? u : (base ? base + '/' + String(u).replace(/^\/+/, '') : u));
  const canon = base ? `${base}/${pg.slug}.html` : '';
  const ogImg = abs(pg.ogImage || m.ogImage || '');
  return `<!doctype html>
<html lang="${esc(m.lang || 'en')}">

<title>${esc(title)}</title>
${pg.desc ? `<meta name="description" content="${esc(pg.desc)}">\n` : ''}${canon ? `<link rel="canonical" href="${esc(canon)}">\n` : ''}${m.favicon ? `<link rel="icon" href="${esc(m.favicon)}">\n` : ''}${gfontsLink()}<meta property="og:type" content="website">
<meta property="og:title" content="${esc(title)}">
${pg.desc ? `<meta property="og:description" content="${esc(pg.desc)}">\n` : ''}${canon ? `<meta property="og:url" content="${esc(canon)}">\n` : ''}${ogImg ? `<meta property="og:image" content="${esc(ogImg)}">\n<meta name="twitter:card" content="summary_large_image">\n` : ''}<style>
${tidy(css)}
</style>
${m.headHtml || ''}
</head>
<body>
${body}
${/data-nav/.test(body) ? NAV_JS : ''}${/data-facade/.test(body) ? FACADE_JS : ''}</body>
</html>
`;
}

/* Saving a file: hosted viewers mediate it through the downloads capability,
   a plain browser (or the local file) uses an object URL. Same code both ways. */
let dlNs;
async function saveHost() {
  if (dlNs !== undefined) return dlNs;
  dlNs = null;
  try { if (typeof claude !== 'undefined' && claude.use) dlNs = await claude.use('downloads'); } catch (e) { dlNs = null; }
  return dlNs;
}
async function download(name, text, type = 'text/html;charset=utf-8') {
  const ns = await saveHost();
  if (ns) {
    try { await ns.save({ filename: name, data: text }); toast('Saved ' + name); return true; }
    catch (err) {
      const c = err && err.code;
      if (c === 'declined') { toast('Save cancelled'); return false; }
      if (c === 'extension_not_enabled') {
        try {
          await ns.save({ filename: name.replace(/\.html?$/, '') + '.txt', data: text });
          toast('Saved as .txt — rename it to .html'); return true;
        } catch (e2) { toast('Saving is blocked here — use Copy HTML'); return false; }
      }
      if (c === 'too_large') { toast('Too large to save — use Copy HTML'); return false; }
      if (c === 'rate_limited') { toast('One save at a time — try again'); return false; }
      /* anything else: fall through to the object-URL path */
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
    toast('Downloaded ' + name);
    return true;
  } catch (e) { toast('Download blocked here — use Copy HTML'); return false; }
}

/* ---- asking for something ---------------------------------------------
   Replaces native prompt() and confirm(). Those were unstyled OS chrome in the
   middle of an art-directed tool, and — the reason this had to change — sandboxed
   iframes refuse them outright, so naming a class or a colour silently did
   nothing in the published Artifact.
   Both return a promise: a string / true on confirm, null / false on any exit. */
let askDone = null;
function askOpen(title, bodyHtml, okLabel, danger) {
  askClose(null);                                     // never stack two asks
  $('#askTitle').textContent = title;
  $('#askBody').innerHTML = bodyHtml;
  const yes = $('#askYes');
  /* a picker resolves by choosing something, so it has no commit button and its
     only exit is labelled Close rather than Cancel */
  yes.hidden = okLabel === null;
  yes.textContent = okLabel || '';
  yes.classList.toggle('danger', !!danger);
  yes.classList.toggle('primary', !danger);
  $('#askNo').textContent = okLabel === null ? 'Close' : 'Cancel';
  $('#ask').hidden = false;
  const input = $('#askBody input');
  if (input) { input.focus(); input.select(); }
  else if (!yes.hidden) yes.focus();
  return new Promise(res => { askDone = res; });
}
function askClose(value) {
  $('#ask').hidden = true;
  const res = askDone; askDone = null;
  if (res) res(value);
}
const askOpenNow = () => !$('#ask').hidden;

/* a name, a URL — anything that used prompt() */
function askText(title, label, value = '', opts = {}) {
  return askOpen(title,
    `<div class="f" style="margin-bottom:0"><label>${esc(label)}</label>
       <input class="ctl" id="askIn" value="${esc(value)}" placeholder="${esc(opts.placeholder || '')}">
       ${opts.note ? `<div class="note">${opts.note}</div>` : ''}</div>`,
    opts.ok || 'Save', false);
}

/* a yes/no — anything that used confirm(). `msg` may carry markup. */
function askConfirm(title, msg, opts = {}) {
  return askOpen(title, `<div class="msg">${msg}</div>`, opts.ok || 'Delete', opts.danger !== false)
    .then(v => v === true);
}

/* The media library as a picker. Resolves with an asset id, or null. It rides the
   ask layer so it can open from inside Project settings without displacing it. */
function mediaPicker(title = 'Choose from the library') {

  if (!list.length) {

  $$('#askBody [data-pick]').forEach(b => b.addEventListener('click', () => askClose(b.dataset.pick)));

/* Naming and the global choice belong in one step — the toggle changes what saving
   means, so asking afterwards would be too late. Resolves {name, sync} or null. */
function askBlock(defaultName) {
  const p = askOpen('Save as a block', `
    <div class="f"><label>Block name</label>
      <input class="ctl" id="askIn" value="${esc(defaultName)}"></div>
    <div class="tog-row" style="margin-top:var(--gap-2)">

      <button class="sw-tog" id="askSync"><i></i></button>
    </div>
    <div class="note" id="askSyncNote"></div>`, 'Save block', false);
  const tog = $('#askSync'), note = $('#askSyncNote');
  const paint = () => {
    note.innerHTML = tog.classList.contains('on')
      ? 'Copies stay linked. Edit one, then push to the rest.'
      : 'Each copy is independent.';
  };
  tog.addEventListener('click', () => { tog.classList.toggle('on'); paint(); });
  paint();
  return p.then(v => v === null ? null : { name: v, sync: tog.classList.contains('on') });
}

function exportModal() {
  if (editing.on) exitEdit();
  const opts = state.pages.map((p, i) => `<option value="${i}">${esc(p.name)} — /${esc(p.slug)}.html</option>`).join('');
  const nAssets = AS.mem.size;
  openModal('Export static HTML', `
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:var(--gap-2);flex-wrap:wrap">
      <select class="ctl" id="exPick" style="flex:1;min-width:220px;max-width:300px">${opts}</select>
      <select class="ctl" id="exMode" style="width:210px" title="How images are handled">
        <option value="inline">Images inlined — one file</option>
        <option value="files">Images as separate files</option>
      </select>
      <span style="font-size:11.5px;color:var(--text-3)" id="exSize">…</span>
    </div>
    <div class="review" id="exReview"></div>
    <pre class="code" id="exCode">Building…</pre>
    <div class="note" id="exNote" style="margin-top:var(--gap-2)"></div>`, `
    <button class="btn" id="exSeo" title="sitemap.xml and robots.txt">SEO files</button>
    <button class="btn" id="exJson">Export project JSON</button>
    <button class="btn" id="exImport">Import JSON</button>
    <span style="flex:1"></span>
    <button class="btn" id="exCopy">Copy HTML</button>
    <button class="btn" id="exAll">Download all ${state.pages.length}</button>
    <button class="btn primary" id="exOne">Download page</button>`);

  /* Review the whole project before anything leaves the building. */
  const findings = lint();
  const counts = lintCounts(findings);
  const REGION_MODE = { 'page': 'page', 'global header': 'header', 'global footer': 'footer' };
  const drawReview = (open) => {
    const box = $('#exReview');
    const clean = !findings.length;
    box.innerHTML = `
      <div class="rh">
        <span class="dot ${clean ? 'ok' : counts.error ? 'bad' : 'warn'}"></span>
        <span>${clean ? 'No problems found' : [
        counts.error ? counts.error + (counts.error === 1 ? ' problem' : ' problems') : '',
        counts.warn ? counts.warn + (counts.warn === 1 ? ' suggestion' : ' suggestions') : ''
      ].filter(Boolean).join(' · ')}</span>
        <span class="spacer"></span>
        ${clean ? '' : `<button class="reset" id="exToggle">${open ? 'Hide' : 'Show'} details</button>`}
      </div>
      ${clean || !open ? '' : `<ul>${findings.map((f, i) => `<li>
          <span class="lv ${f.level}"></span>
          <span class="msg">${esc(f.msg)}<em>${esc(f.where.page || '')}${f.where.region ? ' · ' + esc(f.where.region) : ''}</em></span>
          ${f.nodeId ? `<button class="go" data-f="${i}">Show me</button>` : ''}
        </li>`).join('')}</ul>`}`;
    const t = $('#exToggle');
    if (t) t.addEventListener('click', () => drawReview(!open));
    $$('[data-f]', box).forEach(b => b.addEventListener('click', () => {
      const f = findings[+b.dataset.f];
      const pi = state.pages.findIndex(p => p.slug === f.where.slug);
      if (pi > -1) state.cur = pi;
      state.ui.mode = REGION_MODE[f.where.region] || 'page';
      closeModal();
      render();
      select(f.nodeId, { scroll: true });
      if (!locate(f.nodeId)) toast('That element is no longer in the project');
    }));
  };
  drawReview(counts.error > 0);          // problems open themselves; suggestions wait

  const pick = $('#exPick'), mode = $('#exMode'), code = $('#exCode');
  pick.value = String(state.cur);
  const cur = () => exportPage(state.pages[+pick.value], mode.value);

  const draw = async () => {
    code.textContent = 'Building…';
    const html = await cur();
    code.textContent = html;
    $('#exSize').textContent = (html.length / 1024).toFixed(1) + ' KB';
    $('#exNote').innerHTML = mode.value === 'files'
      ? `Image tags point at <code>assets/…</code>, so keep the downloaded <b>assets</b> folder beside the HTML.
         Downloading a page also saves the ${nAssets ? nAssets + ' image' + (nAssets === 1 ? '' : 's') + ' it uses' : 'images it uses'} — one confirmation each.
         Best for real hosting: browsers cache the images across pages.`
      : `One self-contained file: semantic markup, a single inline stylesheet, and every image embedded.
         Nothing to upload alongside it. The global header and footer are inlined into every page.`;
  };
  pick.addEventListener('change', draw);
  mode.addEventListener('change', draw);
  draw();

  /* in files mode a page download also hands over the images it references */
  const saveAssetsFor = async html => {
    for (const a of assetsUsedIn(buildPage(state.pages[+pick.value]))) {
      if (!a.blob) continue;
      if (await download(assetFile(a).replace(/^assets\//, ''), a.blob, a.type) === false) return false;
    }
    return true;
  };

  $('#exOne').addEventListener('click', async () => {
    const p = state.pages[+pick.value];
    const html = await cur();

    if (mode.value === 'files') await saveAssetsFor(html);
  });

  $('#exAll').addEventListener('click', async () => {                 // one prompt at a time
    for (const p of state.pages) {
      const html = await exportPage(p, mode.value);
      if (await download(p.slug + '.html', html) === false) return;
    }
    if (mode.value === 'files') {
      for (const a of AS.mem.values()) {
        if (!a.blob) continue;
        if (await download(assetFile(a).replace(/^assets\//, ''), a.blob, a.type) === false) return;
      }
    }
  });

  $('#exCopy').addEventListener('click', async () => {
    const html = await cur();
    try { await navigator.clipboard.writeText(html); toast('HTML copied to clipboard'); }
    catch (e) {
      const r = document.createRange(); r.selectNodeContents(code);
      const sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(r);
      toast('Selected — press ⌘C to copy');
    }
  });
  $('#exSeo').addEventListener('click', async () => {
    if (!state.meta.baseUrl) {
      toast('Add a Site URL in Project settings first');
      return;
    }
    if (await download('sitemap.xml', sitemapXml(), 'application/xml') === false) return;
    await download('robots.txt', robotsTxt(), 'text/plain');
  });
  $('#exJson').addEventListener('click', backupJson);
  $('#exImport').addEventListener('click', () => {
    const fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.json,application/json';
    fi.onchange = () => {
      const f = fi.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        let d = null;
        try { d = migrate(JSON.parse(rd.result)); } catch (e) { d = null; }
        if (!d) { toast('That file is not a Slate project this build can open'); return; }
        hist.u.push(clone(doc()));
        state.meta = { ...state.meta, ...d.meta }; state.header = d.header || []; state.footer = d.footer || [];
        state.pages = d.pages; state.cur = 0; selSet([]);
        closeModal(); render(); writeNow(); toast('Project imported');
      };
      rd.readAsText(f);
    };
    fi.click();
  });
}

          <button class="x" id="${pfx}Clr" title="Remove">${svg('trash', 12)}</button>
        </div>`
    : `<div class="imgdrop" id="${pfx}Drop"><b>Drop an image here</b><span>or choose a file</span></div>`}
    <div style="display:flex;gap:6px;margin-top:var(--gap-1)">
      <button class="btn" id="${pfx}Up" style="flex:1;justify-content:center">${svg('image', 13)} ${a ? 'Replace' : 'Upload'}</button>
      ${AS.mem.size ? `<button class="btn" id="${pfx}Lib" style="flex:1;justify-content:center" title="Pick from the Media library">${svg('copy', 13)} Library</button>` : ''}
    </div>
    ${note ? `<div class="note">${note}</div>` : ''}`;
}
function wireAsset(pfx, set, redraw) {
  const take = async file => {
    const id = await mediaTake(file);
    if (!id) return;
    set('asset:' + id); redraw();
  };
  const choose = () => {
    const fi = document.createElement('input');
    fi.type = 'file'; fi.accept = 'image/*';
    fi.onchange = () => take(fi.files[0]);
    fi.click();
  };
  const up = $('#' + pfx + 'Up'); if (up) up.addEventListener('click', choose);
  const clr = $('#' + pfx + 'Clr'); if (clr) clr.addEventListener('click', () => { set(''); writeNow(); redraw(); });
  const lib = $('#' + pfx + 'Lib'); if (lib) lib.addEventListener('click', async () => {
    const id = await mediaPicker();
    if (!id) return;
    set('asset:' + id); writeNow(); redraw();
  });
  const drop = $('#' + pfx + 'Drop');
  if (drop) {
    drop.addEventListener('click', choose);
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => take(e.dataTransfer.files[0]));
  }
}

/* the same font vocabulary the inspector offers, for the project defaults */
function fontSelect(id, val) {
  const cur = String(val || '');
  const groups = fontGroups();
  const known = groups.some(([, list]) => list.some(([v]) => v === cur));
  return `<select class="ctl" id="${id}">
      ${groups.map(([g, list]) => `<optgroup label="${esc(g)}">${list.map(([v, l]) =>
    `<option value="${esc(v)}"${known && cur === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</optgroup>`).join('')}
      ${known ? '' : `<option value="${esc(cur)}" selected>Custom — ${esc(familyOf(cur))}</option>`}
    </select>`;
}

  /* ---- text styles: created, named and edited here ---- */
  let openStyle = null, styleDev = 'd';
  const TS_WEIGHTS = [['', 'Default'], ['300', 'Light 300'], ['400', 'Regular 400'], ['500', 'Medium 500'],

  const TS_CASE = [['', 'None'], ['uppercase', 'UPPERCASE'], ['lowercase', 'lowercase'], ['capitalize', 'Capitalize']];

  function styleEditor(t) {
    const b = t.css[styleDev] || {};
    const base = t.css.d || {};

        .map(([v, l]) => `<option value="${v}"${(t.tag || '') === v ? ' selected' : ''}>${l}</option>`).join('')}

      <div class="row2">
        <div class="f"><label>Transform</label><select class="ctl" data-sv="text-transform">

        </select></div>
        <div class="f"><label>Colour</label>
          <div class="clr">

        <select class="ctl" data-tweight="${t.id}" title="Base weight" style="width:118px;flex:0 0 118px;font-size:11.5px">

    $$('[data-tn]', box).forEach(el => el.addEventListener('input', () => {
      tx('tsname:' + el.dataset.tn);

    /* Size and weight are editable in the row itself — the read-only meta line that

    $$('[data-tsize]', box).forEach(el => {
      const push = () => {
        const t = findStyle(el.dataset.tsize); if (!t) return;

    $$('[data-tweight]', box).forEach(el => el.addEventListener('change', () => {
      const t = findStyle(el.dataset.tweight); if (!t) return;

    $$('[data-te]', box).forEach(b => b.addEventListener('click', () => {

    $$('[data-td]', box).forEach(b => b.addEventListener('click', async () => {

    $$('select[data-sv]', box).forEach(el => el.addEventListener('change', () => {

    }));
    $$('input[data-sv]', box).forEach(el => {
      const prop = el.dataset.sv;
      const unit = box.querySelector(`[data-su="${prop}"]`);
      const push = () => {
        tx('tsval:' + t.id + prop);

        if (raw === '') delete bucket()[prop];
        else bucket()[prop] = unit ? raw + unit.value : raw;
        commit();
      };
      el.addEventListener('input', push);
      el.addEventListener('blur', () => { endTx(); drawStyles(); });
      if (unit) unit.addEventListener('change', () => { push(); endTx(); });
    });
    const tagEl = $('#tsTag');
    if (tagEl) tagEl.addEventListener('change', () => {
      tx('tstag:' + t.id);
      if (tagEl.value) t.tag = tagEl.value; else delete t.tag;
      endTx(); save();
    });
    const fontEl = $('#tsFont');
    if (fontEl) fontEl.addEventListener('change', () => {
      tx('tsval:' + t.id + 'font');
      if (fontEl.value) bucket()['font-family'] = fontEl.value; else delete bucket()['font-family'];
      endTx(); commit(); drawStyles();
    });
    $$('[data-stok]', box).forEach(b => b.addEventListener('click', () => {
      tx('tsval:' + t.id + 'color');
      bucket().color = cvar(b.dataset.stok);
      endTx(); commit(); drawStyles();
    }));
    const sclr = box.querySelector('[data-sclr]');
    if (sclr) sclr.addEventListener('click', () => {
      tx('tsval:' + t.id + 'color');

  /* ---- style classes ---- */

    const box = $('#mClasses'); if (!box) return;

      const props = ['d', 't', 'm'].reduce((k, b) => k + Object.keys(c.css[b] || {}).length, 0);
      return `<div class="arow" data-k="${c.id}">

    $$('[data-kd]', box).forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.kd, uses = classUsage(id);
      if (uses && !await askConfirm('Delete this class?', `<b>${esc(findClass(id).name)}</b> is used by ${uses} element${uses === 1 ? '' : 's'}. They keep their current look — they just stop sharing it.`, { ok: 'Delete class' })) return;
      edit(() => classDelete(id));

  $('#mDone').addEventListener('click', () => { closeModal(); render(); });
  $('#mReset').addEventListener('click', async () => {
    if (!await askConfirm('Replace everything?', '<b>Your current pages are lost.</b> Export a project JSON first to keep them.', { ok: 'Replace with demo' })) return;
    hist.u.push(clone(doc()));
    seed(); selSet([]); closeModal(); render(); writeNow(); toast('Demo content restored');
  });
}

function helpModal() {
  /* This is now the only place the shortcuts are written down — the inspector's
     empty state used to repeat a shorter list, and that panel no longer appears
     when nothing is selected. */
  const K = [
    ['Move through elements', '↑ ↓'], ['Select parent · first child', '← →'],
    ['Add to the selection', '⌘click'], ['Select a range, in the Navigator', '⇧click'],
    ['Reorder among siblings', '⇧↑ ⇧↓'], ['Edit text in place', '↵ or double-click'],
    ['Copy · cut · paste', '⌘C · ⌘X · ⌘V'], ['Duplicate', '⌘D'], ['Delete', '⌫'],
    ['Undo / redo', '⌘Z · ⌘⇧Z'], ['Back to one element, then the parent', 'esc'],
    ['Preview', '⌘P'], ['Export HTML', '⌘E'],
    ['Bold / italic while editing', '⌘B · ⌘I'], ['Insert link while editing', '⌘K']
  ];
  openModal('Keyboard & tips', `
    <table class="kt">${K.map(([a, b]) => `<tr><td>${a}</td><td><span class="kbd">${b}</span></td></tr>`).join('')}</table>
    <div class="note" style="margin-top:var(--gap-3);line-height:1.7">
      <b style="color:var(--text-2)">Structure</b> — Section → Row → Column → content. Missing wrappers are
      created for you.<br>
      <b style="color:var(--text-2)">Responsive</b> — pick Tablet or Mobile in the top bar and what you change
      becomes an override (max-width 1024px / 767px). A green badge marks one; click it to clear.<br>
      <b style="color:var(--text-2)">Global header &amp; footer</b> — shared by every page, edited in place. Hover the
      region and press <b>Edit header</b> or <b>Edit footer</b>; <b>Done</b> brings you back.<br>
      <b style="color:var(--text-2)">Autosave</b> — stored in this browser. Export → project JSON for a backup.
    </div>`, `<button class="btn primary" id="hOk">Got it</button>`);
  $('#hOk').addEventListener('click', closeModal);
}

/* ============================================================= keyboard */
function hotkey(e) {
  /* the ask layer owns the keyboard while it is up — its own handler takes Enter
     and Escape, and without this Escape would also walk the canvas selection */
  if (askOpenNow()) return;
  const t = e.target, tag = (t.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || (t.isContentEditable && !editing.on)) return;
  const meta = e.metaKey || e.ctrlKey;
  /* some synthetic and assistive input stacks omit `key`; `code` still names
     the physical key, which is enough for the navigation set */
  const k = (e.key || '').toLowerCase() || (e.code || '').toLowerCase();
  if (meta && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (meta && k === 'y') { e.preventDefault(); redo(); return; }
  if (meta && k === 'd') {
    e.preventDefault();
    const ids = selIds();
    if (ids.length) edit(() => ids.length > 1 ? dupMany(ids) : dupNode(ids[0]));
    return;
  }
  const oneDeep = ' — the clipboard holds one element at a time';
  if (meta && k === 'c') {
    if (state.ui.sel && copyNode(state.ui.sel)) {
      e.preventDefault();
      toast(DEF[locate(state.ui.sel).node.type].label + ' copied' + (multiOn() ? oneDeep : ''));
    }
    return;
  }
  if (meta && k === 'x') {
    if (state.ui.sel && copyNode(state.ui.sel)) {
      e.preventDefault();
      const label = DEF[locate(state.ui.sel).node.type].label, many = multiOn();
      edit(() => delNode(state.ui.sel));
      toast(label + ' cut' + (many ? oneDeep : ''));
    }
    return;
  }
  if (meta && k === 'v') {
    if (!clip.node) return;
    e.preventDefault();
    let made = null;
    edit(() => { made = pasteNode(state.ui.sel); if (made) selSet([made.id]); });
    toast(made ? DEF[made.type].label + ' pasted' : 'A ' + DEF[clip.node.type].label + ' cannot go there');
    return;
  }
  if (meta && k === 'p') { e.preventDefault(); togglePreview(); return; }
  if (meta && k === 'e') { e.preventDefault(); exportModal(); return; }
  if (meta && k === 's') { e.preventDefault(); save(); toast('Saved locally'); return; }
  if (!meta && (k === 'backspace' || k === 'delete')) {
    const ids = selIds();
    if (ids.length) { e.preventDefault(); edit(() => ids.length > 1 ? delMany(ids) : delNode(ids[0])); }
    return;
  }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
    if (e.shiftKey && state.ui.sel && (k === 'arrowup' || k === 'arrowdown')) {
      e.preventDefault();
      const ids = selIds(), dir = k === 'arrowup' ? -1 : 1;
      edit(() => ids.length > 1 ? nudgeMany(ids, dir) : nudge(ids[0], dir));
      return;
    }
    if (meta) return;
    e.preventDefault();
    const cur = state.ui.sel;
    let next = null;
    if (k === 'arrowup') next = step(cur, -1);
    else if (k === 'arrowdown') next = step(cur, 1);
    else if (k === 'arrowleft') next = parentOf(cur);
    else next = firstChildOf(cur) || step(cur, 1);
    if (next) select(next, { scroll: true });
    return;
  }
  if (k === 'enter' && state.ui.sel && !meta) {
    const n = locate(state.ui.sel);
    if (n && DEF[n.node.type].edit) { e.preventDefault(); enterEdit(state.ui.sel); return; }
  }
  if (k === 'escape') {
    if (!$('#modal').hidden) { closeModal(); return; }
    /* one step per press: back to a single element first, then up the tree.
       Doing both at once would lose the set before you could see what you had. */
    if (multiOn()) { select(state.ui.sel); return; }
    if (state.ui.sel) { const h = locate(state.ui.sel); select(h && h.parent ? h.parent.id : null); }
  }
}
document.addEventListener('keydown', hotkey);

/* ================================================================= init */
function bindTop() {
  $$('#devSeg button').forEach(b => b.addEventListener('click', () => setDev(b.dataset.dev)));
  $('#undoBtn').addEventListener('click', undo);
  $('#redoBtn').addEventListener('click', redo);
  $('#previewBtn').addEventListener('click', togglePreview);
  $('#exportBtn').addEventListener('click', exportModal);
  $('#reviewBtn').addEventListener('click', exportModal);
  $('#projBtn').addEventListener('click', projectModal);
  $('#helpBtn').addEventListener('click', helpModal);
  $$('#leftRail button').forEach(b => b.addEventListener('click', () => {
    /* Media and Project open dialogs rather than swapping the panel, so they set
       neither `state.ui.tab` nor the `on` treatment — the panel behind them has not
       changed. Scoping the toggle to `[data-t]` is what keeps them out of it. */
    const dialog = { media: mediaModal, project: projectModal }[b.dataset.act];
    if (dialog) { dialog(); return; }
    state.ui.tab = b.dataset.t;
    $$('#leftRail button[data-t]').forEach(x => x.classList.toggle('on', x === b));
    ['add', 'layers', 'pages', 'cms'].forEach(t => { $('#pane' + t[0].toUpperCase() + t.slice(1)).hidden = t !== b.dataset.t; });
    renderPanelHead();
    renderCms();
  }));
  window.addEventListener('resize', () => { positionHud(); renderDim(); });
}

HOOKS.change = () => render();
HOOKS.save = () => save();
HOOKS.note = msg => toast(msg);

(async function boot() {
  await assetsLoad();
  load();
  await mountCanvas();
  bindTop();
  renderPalette();
  setDev(state.ui.dev);
  stamp('Ready', false);
})();
</script>
