        : SRV ? 'Preview shows your working draft. Site checks helps find problems. Saving keeps your draft; Publish makes a reviewed version public. Live link copies the published site address.'
        : 'Preview shows your working page. Site checks helps find problems. Export downloads the site; changes save only in this browser.'}</p>
      ${SRV && !IS_WORDPRESS ? `<p>For client feedback, open <a href="/sites/${encodeURIComponent(SRV.siteId)}/reviews">Reviews</a>. Review links show the latest saved draft and shared comments. A publication preview freezes one saved version for publishing.</p>` : ''}
    </div>
    <h3>Keyboard shortcuts</h3>
    <table class="kt">${K.map(([a, b]) => `<tr><td>${a}</td><td><span class="kbd">${b}</span></td></tr>`).join('')}</table>
    <div class="note" style="margin-top:var(--gap-3);line-height:1.7">
      <b style="color:var(--text-2)">Structure</b> — Section → Row → Column → content. Missing wrappers are
      created for you.<br>
      <b style="color:var(--text-2)">Responsive</b> — pick Tablet or Mobile in the top bar and what you change
      becomes an override (max-width 1024px / 767px). A green badge marks one; click it to clear.<br>
      <b style="color:var(--text-2)">Global header &amp; footer</b> — shared by every page, edited in place. Hover the
      region and press <b>Edit header</b> or <b>Edit footer</b>; <b>Done</b> brings you back.<br>
      <b style="color:var(--text-2)">Saving</b> — ${IS_WORDPRESS
        ? 'changes are saved to WordPress. Use Done to finish editing; WordPress owns the page’s publication status.'
        : SRV
          ? 'changes are autosaved to your Pagecraft site draft. They become public only when an owner chooses Publish.'
          : 'changes are stored in this browser. Export → project JSON for a backup.'}
      ${HOST_FEATURES.revisions ? '<br><b style="color:var(--text-2)">History</b> — open History to review saved versions.' : ''}
    </div>`, `<button class="btn primary" id="hOk">Got it</button>`);
  $('#hOk').addEventListener('click', closeModal);
}

/* Narrow workspaces hide the utility group to protect Save, Preview and device controls.
   Keep its recovery paths available through one compact menu, while the original buttons
   remain the capability and action source of truth. */
function wireMoreTools() {
  const button = $('#moreToolsBtn'), menu = $('#moreToolsPop');
  if (!button || !menu || button.dataset.wired) return;
  button.dataset.wired = '1';
  const narrow = () => matchMedia('(max-width:767px)').matches;
  const availableItems = () => $$('[data-more-target]', menu).filter(item => {
    const target = document.getElementById(item.dataset.moreTarget);
    const available = !!target && !target.hidden;
    item.hidden = !available;
    item.disabled = !!target?.disabled;
    item.setAttribute('aria-disabled', String(!!target?.disabled));
    if (available) item.textContent = target.getAttribute('aria-label') || target.title || item.textContent;
    return available && !target.disabled;
  });
  const openNow = () => !menu.hidden && !menu.hasAttribute('data-pc-motion-closing');
  const close = (focus = true, immediate = false) => {
    if (!openNow() && !menu.hasAttribute('data-pc-motion-closing')) return;
    button.setAttribute('aria-expanded', 'false');
    if (focus) button.focus({preventScroll:true});
    const fx = PC_UI.installUiMotion();
    if (immediate || !fx || fx.reduced()) { fx?.cancel(menu); menu.hidden = true; return; }
    fx.exit(menu, {kind:'popover'});
  };
  const open = (last = false) => {
    if (!narrow()) return;
    const items = availableItems();
    if (!items.length) return;
    const fx = PC_UI.installUiMotion();
    if (fx) fx.enter(menu, {kind:'popover'}); else menu.hidden = false;
    button.setAttribute('aria-expanded', 'true');
    const rect = button.getBoundingClientRect();
    menu.style.top = Math.max(4, rect.bottom + 4) + 'px';
    menu.style.right = Math.max(6, innerWidth - rect.right) + 'px';
    items[last ? items.length - 1 : 0].focus({preventScroll:true});
  };
  button.addEventListener('click', () => openNow() ? close(true) : open());
  button.addEventListener('keydown', event => {
    if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
    event.preventDefault();
    open(event.key === 'ArrowUp');
  });
  menu.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      event.preventDefault(); event.stopPropagation(); close(true, true); return;
    }
    const items = availableItems();
    const at = items.indexOf(document.activeElement);
    const next = event.key === 'Home' ? 0 : event.key === 'End' ? items.length - 1
      : event.key === 'ArrowDown' ? (at + 1) % items.length
        : event.key === 'ArrowUp' ? (at - 1 + items.length) % items.length : -1;
    if (next < 0) return;
    event.preventDefault(); items[next].focus({preventScroll:true});
  });
  menu.addEventListener('click', event => {
    const item = event.target.closest('[data-more-target]');
    const target = item && document.getElementById(item.dataset.moreTarget);
    if (!target || target.hidden || target.disabled) return;
    close(true, true);
    target.click();
    /* A compact-menu item can launch a modal through a toolbar button that is hidden at
       this width. Browsers may leave that source button active during its synthetic click,
       so make the visible menu trigger the explicit recovery target for every modal exit. */
    if (!$('#modal')?.hidden) modalReturnFocus = button;
    /* WordPress checks and history open a right surface whose original toolbar trigger is
       hidden at this width. Return to the visible menu button when that surface closes. */
    if (IS_WORDPRESS && !$('#rightAux')?.hidden) rightSurfaceTrigger = button;
  });
  document.addEventListener('click', event => {
    if (openNow() && !menu.contains(event.target) && event.target !== button) close(true, true);
  }, true);
  document.addEventListener('focusin', event => {
    if (openNow() && !menu.contains(event.target) && event.target !== button) close(false, true);
  });
  document.addEventListener('pagecraft:outside-pointer', () => close(true, true));
  window.addEventListener('resize', () => { if (!narrow()) close(true, true); });
}

/* ============================================================= keyboard */
function hotkey(e) {
  /* the ask layer owns the keyboard while it is up — its own handler takes Enter
     and Escape, and without this Escape would also walk the canvas selection */
  if (askOpenNow()) return;
  const t = e.target, tag = (t.tagName || '').toLowerCase();
  /* A dialog is its own keyboard scope. Buttons inside it used to leak Enter, arrows,
     Delete and command shortcuts into the canvas; Escape could close the dialog and then
     walk the selection as the same event continued bubbling. */
  const modalTarget = t.closest && t.closest('#modal');
  if (!$('#modal').hidden || modalTarget) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    return;
  }
  /* The loading shell makes the app inert, but this listener lives on document and can
     otherwise run against the empty core state before the hosted document is hydrated. */
  if ($('#app')?.getAttribute('aria-busy') === 'true') return;
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || (t.isContentEditable && !editing.on)) return;
  const meta = e.metaKey || e.ctrlKey;
  /* some synthetic and assistive input stacks omit `key`; `code` still names
     the physical key, which is enough for the navigation set */
  const k = (e.key || '').toLowerCase() || (e.code || '').toLowerCase();
  /* Preview content owns its keyboard: arrows, activation, deletion, and history keys
     must stay in the rendered page instead of mutating the hidden editor model. Keep
     the explicit Preview/save shortcuts available to return to the editor or save. */
  if (document.body.classList.contains('preview') && !(meta && (k === 'p' || k === 's'))) return;
  /* Native controls own activation and navigation keys. Let Enter/Space reach their
     default action instead of entering canvas text editing or moving its selection. */
  if (!meta && t.closest?.('button,summary,a[href],[role="button"],[role="combobox"],[role="listbox"]')) return;
  if (meta && k === 'z') { e.preventDefault(); endTx(); e.shiftKey ? redo() : undo(); return; }
  if (meta && k === 'y') { e.preventDefault(); endTx(); redo(); return; }
  if (document.body.classList.contains('pages-open')) {
    if (e.key === 'Escape') { e.preventDefault(); backToBuilder(); }
    return;
  }
  if (meta && k === 'd') {
    e.preventDefault();
    const ids = selIds();
    if (ids.length && canStructure()) edit(() => ids.length > 1 ? dupMany(ids) : dupNode(ids[0]), ids.length > 1 ? `Duplicate ${ids.length} elements` : 'Duplicate ' + kindOf(locate(ids[0]).node).toLowerCase());
    return;
  }
  /* Styles first: the ⌘C and ⌘V branches below never checked shift, so without this
     ⌘⇧C would copy the element instead of its look. */
  if (meta && e.shiftKey && k === 'c') {
    if (!state.ui.sel) return;
    e.preventDefault();
    copyStyles(state.ui.sel);
    toast('Styles copied from ' + styleClip.from);
    renderRight();
    return;
  }
  if (meta && e.shiftKey && k === 'v') {
    if (!styleClip.css) { toast('No styles copied yet — ⌘⇧C first'); return; }
    const ids = selIds();
    if (!ids.length) return;
    e.preventDefault();
    const check = stylePasteCheck();
    if (!check.ok) { toast(check.reason); return; }
    let n = 0;
    edit(() => { n = pasteStylesMany(ids); });
    toast(n > 1 ? `Styles pasted onto ${n} elements` : n ? 'Styles pasted' : 'Nothing to paste onto');
    return;
  }
  const oneDeep = ' — the clipboard holds one element at a time';
  if (meta && k === 'c') {
    if (state.ui.sel && copyElement(state.ui.sel)) {
      e.preventDefault();
      toast(kindOf(locate(state.ui.sel).node) + ' copied' + (multiOn() ? oneDeep : ''));
    }
    return;
  }
  if (meta && k === 'x') {
    if (state.ui.sel && locate(state.ui.sel)) {
      e.preventDefault();
      const label = kindOf(locate(state.ui.sel).node), many = multiOn();
      if (!cutElement(state.ui.sel)) return;
      toast(label + ' cut' + (many ? oneDeep : ''));
    }
    return;
  }
  if (meta && k === 'v') {
    if (!clip.node) return;
    e.preventDefault();
    let made = null;
    edit(() => { made = pasteElement(state.ui.sel); if (made) selSet([made.id]); });
    toast(made ? kindOf(made) + ' pasted' : 'A ' + kindOf(clip.node) + ' cannot go there');
    return;
  }
  if (meta && k === 'f') { e.preventDefault(); findModal(); return; }
  if (meta && k === 'p') {
    e.preventDefault();
    if (HOST_FEATURES.preview === 'wordpress' && WP.previewUrl) window.open(WP.previewUrl, '_blank', 'noopener');
    else togglePreview();
    return;
  }
  if (meta && k === 'e') {
    e.preventDefault();
    if (HOST_FEATURES.projectExport) exportModal();
    else if (IS_WORDPRESS) reviewPanel();
    else reviewModal();
    return;
  }
  if (meta && k === 's') { e.preventDefault(); void saveExplicitly(); return; }
  if (!meta && (k === 'backspace' || k === 'delete')) {
    const ids = selIds();
    if (ids.length && canStructure()) { e.preventDefault(); edit(() => ids.length > 1 ? delMany(ids) : delNode(ids[0])); }
    return;
  }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
    if (e.shiftKey && state.ui.sel && (k === 'arrowup' || k === 'arrowdown')) {
      e.preventDefault();
      const dir = k === 'arrowup' ? -1 : 1;
      /* with meta as well, all the way — the same pair of keys, one step or the whole way,
         which is how every list in every editor behaves */
      if (meta) { runAct(dir < 0 ? 'first' : 'last', selIds()); return; }
      const ids = selIds();
      if (canStructure()) edit(() => ids.length > 1 ? nudgeMany(ids, dir) : nudge(ids[0], dir));
      return;
    }
    if (meta) return;
    e.preventDefault();
    const cur = state.ui.sel;
    let next = null;
    if (k === 'arrowup') next = step(cur, -1);
    else if (k === 'arrowdown') next = step(cur, 1);
    else if (k === 'arrowleft') next = parentOf(cur);
    else next = firstChildOf(cur) || step(cur, 1);
    if (next) select(next, { scroll: true });
    return;
  }
  if (k === 'enter' && state.ui.sel && !meta) {
    const n = locate(state.ui.sel);
    if (n && DEF[n.node.type].edit) { e.preventDefault(); enterEdit(state.ui.sel); return; }
  }
  if (k === 'escape') {
    if (IS_WORDPRESS && !$('#rightAux')?.hidden) { closeRightSurface(); return; }
    /* one step per press: back to a single element first, then up the tree.
       Doing both at once would lose the set before you could see what you had. */
    if (multiOn()) { select(state.ui.sel); return; }
    if (state.ui.sel) { const h = locate(state.ui.sel); select(h && h.parent ? h.parent.id : null); }
  }
}
document.addEventListener('keydown', hotkey);

/* ================================================================= init */
function bindTop() {
  const sitesButton = $('#sitesBtn');
  const accountButton = $('#accountBtn');
  const accountPop = $('#accountPop');
  const closeAccount = (focus = false) => {
    if (accountPop.hidden || accountPop.hasAttribute('data-pc-motion-closing')) return;
    accountButton.setAttribute('aria-expanded', 'false');
    if (focus) accountButton.focus({preventScroll:true});
    const fx=PC_UI.installUiMotion();
    if(fx)fx.exit(accountPop,{kind:'popover'});else accountPop.hidden=true;
  };
  const accountDialog = () => {
    const open = accountPop.hidden || accountPop.hasAttribute('data-pc-motion-closing');
    if(open)PC_UI.installUiMotion()?.enter(accountPop,{kind:'popover'});else closeAccount(true);
    accountButton.setAttribute('aria-expanded', String(open));
  };
  if (SRV && HOST_FEATURES.sites) {
    sitesButton.hidden = false;
    const brandLink = $('#brandHome');
    brandLink.href = '/';
    let leaving = false;
    const returnToDashboard = async event => {
      if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      if (leaving) return;
      leaving = true;
      brandLink.setAttribute('aria-busy', 'true');
      const action = feedback().begin(sitesButton, 'Saving draft…');
      try {
        await flushDraft();
        action.update('Opening Sites…');
        location.href = '/';
      } catch (error) {
        leaving = false;
        brandLink.removeAttribute('aria-busy');
        action.error('Your draft could not finish saving. Please try again before leaving.');
      }
    };
    sitesButton.addEventListener('click', returnToDashboard);
    brandLink.addEventListener('click', returnToDashboard);
    if (SRV.user) {
      const accountName = String(SRV.user.name || SRV.user.email || 'Pagecraft');
      const initials = accountName.trim().split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase();
      $('#accountInitials').textContent = initials || 'PC';
      $('#accountEmail').textContent = SRV.user.email || accountName;
      accountButton.hidden = false;
      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape' || accountPop.hidden) return;
        closeAccount(true);
      });
    }
  }
  $$('#devSeg button').forEach(b => b.addEventListener('click', () => setDev(b.dataset.dev)));
  $('#undoBtn').addEventListener('click', () => { endTx(); undo(); });
  $('#redoBtn').addEventListener('click', () => { endTx(); redo(); });
  if (HOST_FEATURES.preview === 'wordpress' && WP.previewUrl) {
    $('#previewBtn').title = 'Preview this WordPress page';
    $('#previewBtn').setAttribute('aria-label', 'Preview this WordPress page');
    $('#previewBtn').addEventListener('click', () => window.open(WP.previewUrl, '_blank', 'noopener'));
  } else {
    $('#previewBtn').addEventListener('click', togglePreview);
  }
  const primary = $('#exportBtn');
  const primaryLabel = $('#publishLabel');
  if (IS_WORDPRESS) {
    const returnLabel = WP.returnLabel || 'Save and return to WordPress Pages';
    primary.title = returnLabel;
    primary.setAttribute('aria-label', returnLabel);
    primaryLabel.textContent = 'Done';
    primary.addEventListener('click', () => finishWordPress(primary));
    $('#reviewBtn').addEventListener('click', reviewPanel);
  } else if (SRV) {
    if (SRV.role === 'owner') {
      primary.title = 'Publish this draft';
      primary.setAttribute('aria-label', 'Publish this draft');
      primaryLabel.textContent = 'Publish';
      primary.addEventListener('click', publishModal);
    } else {
      /* Publication includes warning acceptance and target promotion. A content collaborator
         may review and export, but must not be offered an action the API will refuse. */
      primary.hidden = true;
    }
    $('#reviewBtn').addEventListener('click', reviewModal);
  } else {
    primary.title = 'Export HTML (⌘E)';
    primary.setAttribute('aria-label', 'Export HTML');
    primaryLabel.textContent = 'Export';
    primary.addEventListener('click', exportModal);
    $('#reviewBtn').addEventListener('click', reviewModal);
  }
  wireShare();
  wireHistory();
  $('#helpBtn').addEventListener('click', helpModal);
  wireMoreTools();
  /* Extracted so anything can open a panel, not only a click on the rail — starting
     an empty site sends you to Add, which is the only thing left to do. */
  let submissionsFrame = null;
  let submissionsActive = [];
  let submissionsVersion = null;
  const closeSubmissions = () => {
    if (!submissionsFrame || !document.body.classList.contains('submissions-open')) return;
    submissionsFrame.hidden = true;
    document.body.classList.remove('submissions-loading');
    document.body.classList.remove('submissions-open');
    $$('#leftRail button').forEach(b => b.classList.toggle('on', submissionsActive.includes(b)));
    restoreCanvasLayout();
  };
  const prepareSubmissions = () => {
    if (!SRV?.siteId || submissionsFrame) return;
    submissionsVersion = SRV.version;
    const frame = document.createElement('iframe');
    submissionsFrame = frame;
    frame.id = 'submissions-workspace'; frame.title = 'Submissions'; frame.hidden = true;
    frame.addEventListener('load', () => {
      if (submissionsFrame !== frame) return;
      frame.dataset.ready = '1';
      if (!frame.hidden) frame.contentWindow.postMessage('pagecraft:refresh-submissions', location.origin);
      document.body.classList.remove('submissions-loading');
    });
    frame.src = '/sites/' + encodeURIComponent(SRV.siteId) + '/submissions?embedded=1';
    $('#app > .main').append(frame);
  };
  const openSubmissions = () => {
    closePages();
    if (document.body.classList.contains('submissions-open')) return;
    submissionsActive = $$('#leftRail button.on');
    if (submissionsFrame && submissionsVersion !== SRV.version) {
      submissionsFrame.remove(); submissionsFrame = null;
    }
    prepareSubmissions();
    submissionsFrame.hidden = false;
    PC_UI.installUiMotion()?.enter(submissionsFrame,{kind:'panel'});
    if (submissionsFrame.dataset.ready) submissionsFrame.contentWindow.postMessage('pagecraft:refresh-submissions', location.origin);
    document.body.classList.toggle('submissions-loading', !submissionsFrame.dataset.ready);
    document.body.classList.add('submissions-open');
    $$('#leftRail button').forEach(b => b.classList.toggle('on', b.dataset.act === 'submissions'));
    submissionsFrame.focus();
  };
  // Start the authorized inbox request while the user works, not after their click.
  if (SRV?.siteId) setTimeout(prepareSubmissions, 0);
  const proposalsButton = $('#leftRail [data-act="proposals"]');
  const refreshProposals = () => {
    const api = HOST && HOST.proposals;
    if (!proposalsButton || !api) return;
    api.list('pending').then(list => {
      const badge = proposalsButton.querySelector('.rail-badge');
      badge.hidden = !list.length;
      badge.textContent = list.length > 9 ? '9+' : String(list.length);
      proposalsButton.setAttribute('aria-label', list.length ? `Proposals, ${list.length} waiting` : 'Proposals');
    }).catch(() => {});
  };
  const openProposals = focus => { closeSubmissions(); ui().openProposals(focus, refreshProposals); };
  if (proposalsButton) {
    setTimeout(refreshProposals, 0);
    const focus = new URLSearchParams(location.search).get('proposal');
    if (focus && /^[a-f0-9]{16}$/.test(focus)) setTimeout(() => openProposals(focus), 0);
  }
  window.addEventListener('message', event => {
    if (event.origin === location.origin && submissionsFrame && event.source === submissionsFrame.contentWindow
      && event.data === 'pagecraft:close-submissions') {
      closeSubmissions(); $('#leftRail [data-act="submissions"]').focus();
    }
  });
  window.showPanel = t => {
    if (document.body.classList.contains('proposals-open')) ui().closeProposals();
    closeSubmissions();
    closePages();
    document.body.classList.remove('cms-open');
    document.body.classList.add('library-focus');
    state.ui.tab = t;
    $$('#leftRail button[data-t]').forEach(x => x.classList.toggle('on', x.dataset.t === t));
    ['add', 'layers', 'pages', 'cms'].forEach(k => {
      const pane = $('#pane' + k[0].toUpperCase() + k.slice(1));
      if (pane) pane.hidden = k !== t;
    });
    renderPanelHead();
    renderCms();
    requestAnimationFrame(() => { layoutCanvas(); positionHud(); renderDim(); });
  };
  /* Add is the default panel and a content account has no Add. Pages is the right landing
     place: every site has one, and its title and description are content. */
  if (SRV && !canStructure()) showPanel('pages');
  $$('#leftRail button').forEach(b => b.addEventListener('click', () => {
    if (!$('#modal').hidden && $('#modalBox').classList.contains('project-settings')) {
      closeModal();
      if (b.dataset.act === 'project') return;
    }
    /* Media and Project open dialogs rather than swapping the panel, so they set
       neither `state.ui.tab` nor the `on` treatment — the panel behind them has not
       changed. Scoping the toggle to `[data-t]` is what keeps them out of it. */
    if (b.dataset.act === 'proposals') { openProposals(); return; }
    if (document.body.classList.contains('proposals-open')) ui().closeProposals();
    if (b.dataset.act === 'submissions') { openSubmissions(); return; }
    closeSubmissions();
    closePages();
    if (b.dataset.t) document.body.classList.remove('cms-open');
    const dialog = { media: mediaModal, project: projectModal, account: accountDialog }[b.dataset.act];
    if (dialog) { dialog(); return; }
    if (b.dataset.t === 'pages') { openPages(); return; }
    /* A second press on the active rail item dismisses the narrow drawer. Desktop
       keeps the stable workbench behavior. */
    if (matchMedia('(max-width:900px)').matches && b.dataset.t === state.ui.tab
      && document.body.classList.contains('library-focus')) {
      document.body.classList.remove('library-focus');
      requestAnimationFrame(() => { layoutCanvas(); positionHud(); renderDim(); });
      return;
    }
    showPanel(b.dataset.t);
  }));
  document.body.classList.toggle('library-focus', !state.ui.sel);
  window.addEventListener('resize', () => { layoutCanvas(); positionHud(); renderDim(); });
}

HOOKS.change = () => render();
HOOKS.save = () => save();
HOOKS.note = msg => toast(msg);

(async function boot() {
  applyHostFeatures();
  await assetsLoad();
  load();
  /* not after a failed load: what is on screen is the demo, and calling it saved would let
     publishing and the settings flows treat it as the site's draft */
  if (SRV && !IS_WORDPRESS && !loadBlocked) {
    lastCloudDocument = JSON.stringify(doc());
    saveState = 'ok';
  }
  await mountCanvas();
  bindTop();
  $('#clientReviewBtn').hidden = !SRV || IS_WORDPRESS || SRV.role !== 'owner' || !!SRV.editorSessionToken;
  $('#clientReviewBtn').addEventListener('click', clientReviewModal);
  renderPalette();
  setDev(state.ui.dev);
  if (loadBlocked) stamp('Not saving', true);
  else stamp(IS_WORDPRESS ? 'WordPress draft ready' : (SRV ? 'Draft ready' : 'Ready'), false);
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  await window.PC_BUILDER_LOADING.ready();
})().catch(error => {
  console.error('Pagecraft builder startup failed', error);
  window.PC_BUILDER_LOADING.fail();
});
</script>
