    <div class="f"><label>Colours <span style="color:var(--text-3);font-weight:500">— change one here and every element linked to it follows</span></label>
      <div id="mColors"></div></div>

    <div class="f"><label>Text styles <span style="color:var(--text-3);font-weight:500">— reusable typography, edited from any element that uses one</span></label>
      <div id="mStyles"></div></div>

    <div class="f"><label>Style classes <span style="color:var(--text-3);font-weight:500">— any reusable styling; later in the list wins</span></label>
      <div id="mClasses"></div></div>

    <div class="f"><label>Global CSS — injected into every exported page</label>
      <textarea class="ctl" id="mCss" style="min-height:88px">${esc(m.css)}</textarea></div>
    <div class="f"><label>Extra &lt;head&gt; HTML — web fonts, analytics, favicons</label>
      <textarea class="ctl" id="mHeadHtml" style="min-height:66px" placeholder="&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/…&quot;&gt;">${esc(m.headHtml)}</textarea></div>`, `
    <button class="btn" id="mBlank" title="Clear the pages and global regions, keep your colours and styles">Start an empty site</button>
    <button class="btn danger" id="mReset">Reset to demo content</button>
    <span style="flex:1"></span>
    <button class="btn primary" id="mDone">Done</button>`);

  const wire = (id, fn) => {
    const el = $('#' + id); if (!el) return;
    el.addEventListener('input', () => { fn(el.value); paintCss(); save(); });
  };
  wire('mName', v => { m.name = v; renderModebar(); });

  const wireSel = (id, fn) => {
    const el = $('#' + id); if (!el) return;
    el.addEventListener('change', () => { fn(el.value); paintCss(); save(); });
  };
  wireSel('mFont', v => { m.font = v || FONT_BASE[1][0]; });
  wireSel('mHead', v => { m.headFont = v; });
  wire('mBase', v => { m.baseUrl = v.trim(); });
  wireUnit('mMax', null, v => { m.maxWidth = v || '1200px'; });
  wireUnit('mSize', null, v => { m.size = v || '16px'; });
  const langEl = $('#mLang');
  if (langEl) langEl.addEventListener('change', () => { m.lang = langEl.value; paintCss(); save(); });

  const drawFav = () => {
    $('#mFavBox').innerHTML = assetField('mFav', m.favicon, 'Exported as a &lt;link rel="icon"&gt;.');
    wireAsset('mFav', v => { m.favicon = v; }, drawFav);
  };
  const drawOg = () => {
    $('#mOgBox').innerHTML = assetField('mOg', m.ogImage,
      'Crawlers need an absolute URL, so this works once a <b>Site URL</b> is set and you export with <b>images as separate files</b>.');
    wireAsset('mOg', v => { m.ogImage = v; }, drawOg);
  };
  drawFav(); drawOg();
  wire('mCss', v => { m.css = v; });
  wire('mHeadHtml', v => { m.headHtml = v; });

  /* ---- colour tokens ---- */
  function drawColors() {
    const box = $('#mColors'); if (!box) return;
    box.innerHTML = colors().map(t => {
      const lock = RESERVED.includes(t.id);
      return `<div class="arow" data-c="${t.id}">
        <span class="sw"><i style="background:${esc(t.value)}"></i>
          <input type="color" data-cp="${t.id}" value="${/^#[0-9a-f]{6}$/i.test(t.value) ? t.value : '#888888'}"></span>
        <span class="an">
          <input class="ctl" data-cn="${t.id}" value="${esc(t.name)}" style="font-size:12.5px;font-weight:600">
        </span>
        <input class="ctl" data-cv="${t.id}" value="${esc(t.value)}" style="width:92px;flex:0 0 92px;font-family:var(--mono);font-size:11px">
        ${lock
        ? `<span class="rowlock" title="Built in — part of the brand, so it cannot be deleted">${svg('lock', 13)}</span>`
        : `<button class="iconbtn" data-cd="${t.id}" title="Delete — usages keep this colour as a literal">${svg('trash', 13)}</button>`}
      </div>`;
    }).join('') + `<button class="btn" id="mColorAdd" style="width:100%;justify-content:center;font-size:11px">${svg('plus', 12)} Add colour</button>`;

    const set = (id, v) => {
      const t = findColor(id); if (!t) return;
      t.value = v;
      const row = box.querySelector(`[data-c="${id}"]`);
      row.querySelector('.sw i').style.background = v;
      const cp = row.querySelector('[data-cp]'), cv = row.querySelector('[data-cv]');
      if (/^#[0-9a-f]{6}$/i.test(v) && cp.value !== v) cp.value = v;
      if (cv.value !== v) cv.value = v;
      paintCss(); save();
    };
    $$('[data-cp]', box).forEach(el => el.addEventListener('input', () => { tx('tok:' + el.dataset.cp); set(el.dataset.cp, el.value); }));
    $$('[data-cv]', box).forEach(el => el.addEventListener('input', () => { tx('tok:' + el.dataset.cv); set(el.dataset.cv, el.value.trim()); }));
    $$('[data-cn]', box).forEach(el => el.addEventListener('input', () => {
      tx('tokname:' + el.dataset.cn);
      const t = findColor(el.dataset.cn); if (t) { t.name = el.value; save(); }
    }));
    $$('[data-cd]', box).forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.cd, used = colorUsage(id);
      if (used && !await askConfirm('Delete this colour token?', `<b>${esc(findColor(id).name)}</b> is used ${used}×. Those elements keep the colour, as a literal value — they just stop following the token.`, { ok: 'Delete token' })) return;
      edit(() => colorDelete(id));
      drawColors(); toast('Token deleted, colours kept');
    }));
    $('#mColorAdd').addEventListener('click', async () => {
      const name = await askText('New colour token', 'Colour name', 'New colour', { ok: 'Add colour' });
      if (name === null) return;
      edit(() => colorAdd(name, '#888888'));
      drawColors();
    });
  }
  drawColors();

  /* ---- text styles: created, named and edited here ---- */
  let openStyle = null, styleDev = 'd';
  const TS_WEIGHTS = [['', 'Default'], ['300', 'Light 300'], ['400', 'Regular 400'], ['500', 'Medium 500'],
  ['600', 'Semibold 600'], ['700', 'Bold 700'], ['800', 'Extrabold 800'], ['900', 'Black 900']];
  const TS_CASE = [['', 'None'], ['uppercase', 'UPPERCASE'], ['lowercase', 'lowercase'], ['capitalize', 'Capitalize']];

  function styleEditor(t) {
    const b = t.css[styleDev] || {};
    const base = t.css.d || {};
    const ph = k => styleDev === 'd' ? '' : (base[k] || '');
    const uf = (prop, units) => {
      const p = parseU(b[prop]);
      return `<div class="unit">
          <input class="ctl" data-sv="${prop}" type="number" step="any" value="${esc(p.n)}" placeholder="${esc(parseU(ph(prop)).n || 'auto')}">
          <select class="ctl" data-su="${prop}">${units.map(u => `<option value="${u}"${u === p.u ? ' selected' : ''}>${u || '—'}</option>`).join('')}</select>
        </div>`;
    };
    const colVal = b.color || '';
    const tok = refId(colVal) ? findColor(refId(colVal)) : null;
    return `<div class="tsedit">
      <div class="pick" style="margin-bottom:var(--gap-2)">
        ${['d', 't', 'm'].map(d => `<button data-sd="${d}" class="${styleDev === d ? 'on' : ''}">${svg(d === 'd' ? 'desktop' : d === 't' ? 'tablet' : 'mobile', 12)} ${DEV_LABEL[d]}</button>`).join('')}
      </div>
      <div class="row2">
        <div class="f"><label>Size</label>${uf('font-size', U.size)}</div>
        <div class="f"><label>Weight</label><select class="ctl" data-sv="font-weight">
          ${TS_WEIGHTS.map(([v, l]) => `<option value="${v}"${(b['font-weight'] || '') === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select></div>
      </div>
      <div class="row2">
        <div class="f"><label>Line height</label>${uf('line-height', U.line)}</div>
        <div class="f"><label>Letter spacing</label>${uf('letter-spacing', U.track)}</div>
      </div>
      <div class="f"><label>Font</label>${fontSelect('tsFont', b['font-family'] || '')}</div>
      ${styleDev === 'd' ? `<div class="f"><label>Default HTML tag <span style="color:var(--text-3);font-weight:400">— applied when a heading takes this style</span></label>
        <select class="ctl" id="tsTag">
          ${[['', 'Leave as-is'], ['h1', 'H1'], ['h2', 'H2'], ['h3', 'H3'], ['h4', 'H4'], ['h5', 'H5'], ['h6', 'H6'], ['p', 'Paragraph'], ['div', 'div — not a heading']]
        .map(([v, l]) => `<option value="${v}"${(t.tag || '') === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select></div>` : ''}
      <div class="row2">
        <div class="f"><label>Transform</label><select class="ctl" data-sv="text-transform">
          ${TS_CASE.map(([v, l]) => `<option value="${v}"${(b['text-transform'] || '') === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select></div>
        <div class="f"><label>Colour</label>
          <div class="clr">
            <span class="sw"><i style="background:${esc(resolveColor(colVal) || 'transparent')}"></i></span>
            ${tok ? `<span class="tokchip">${svg('link', 10)} ${esc(tok.name)}</span>`
        : `<input class="ctl hex" data-sv="color" value="${esc(colVal)}" placeholder="${esc(ph('color') || 'inherit')}">`}
            <button class="x" data-sclr="1" title="Clear">${svg('trash', 11)}</button>
          </div>
          <div class="toks">${colors().map(c =>
          `<button class="tok${tok && tok.id === c.id ? ' on' : ''}" data-stok="${c.id}" title="${esc(c.name)}" style="background:${esc(c.value)}"></button>`).join('')}</div>
        </div>
      </div>
      <div class="note">${styleDev === 'd'
        ? 'The base values. Switch to Tablet or Mobile to override only what differs there.'
        : 'Only what you set here overrides desktop. Empty fields fall through to the base value shown as a placeholder.'}</div>
    </div>`;
  }

  function drawStyles() {
    const box = $('#mStyles'); if (!box) return;
    box.innerHTML = styles().map(t => {
      const d = t.css.d || {};
      const open = openStyle === t.id;
      return `<div class="arow${open ? ' open' : ''}" data-t="${t.id}">
        <span style="flex:0 0 40px;text-align:center;font-weight:${d['font-weight'] || 500};font-size:${Math.min(19, parseInt(d['font-size'] || 16, 10) || 16)}px;color:var(--text)">Aa</span>
        <span class="an">
          <input class="ctl" data-tn="${t.id}" value="${esc(t.name)}" style="font-size:12.5px;font-weight:600">
        </span>
        <input class="ctl" data-tsize="${t.id}" value="${esc(d['font-size'] || '')}" placeholder="auto"
          title="Base size — expand the row to set a Tablet or Mobile override"
          style="width:74px;flex:0 0 74px;font-family:var(--mono);font-size:11px">
        <select class="ctl" data-tweight="${t.id}" title="Base weight" style="width:118px;flex:0 0 118px;font-size:11.5px">
          ${TS_WEIGHTS.map(([v, l]) => `<option value="${v}"${(d['font-weight'] || '') === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select>
        <button class="iconbtn${open ? ' flip' : ''}" data-te="${t.id}" title="${open ? 'Close' : 'Line height, letter spacing, colour, and per-breakpoint overrides'}">${svg('caret', 13)}</button>
        <button class="iconbtn" data-td="${t.id}" title="Delete — elements keep the look">${svg('trash', 13)}</button>
      </div>${open ? styleEditor(t) : ''}`;
    }).join('') + `<button class="btn" id="mStyleAdd" style="width:100%;justify-content:center">${svg('plus', 12)} Add text style</button>`;

    $$('[data-tn]', box).forEach(el => el.addEventListener('input', () => {
      tx('tsname:' + el.dataset.tn);
      const t = findStyle(el.dataset.tn); if (t) { t.name = el.value; save(); }
    }));
    /* Size and weight are editable in the row itself — the read-only meta line that
       used to sit here made every row two lines tall and could not be acted on.
       Both write the desktop base; the expanded editor is where breakpoints live. */
    $$('[data-tsize]', box).forEach(el => {
      const push = () => {
        const t = findStyle(el.dataset.tsize); if (!t) return;
        tx('tssize:' + t.id);
        const base = (t.css.d = t.css.d || {});
        const raw = String(el.value).trim();
        const p = parseU(raw);
        if (raw === '' || p.n === '') delete base['font-size'];
        else base['font-size'] = p.n + (p.u || 'px');   // a bare number means px
        paintCss(); save();
      };
      el.addEventListener('input', push);
      el.addEventListener('blur', () => { endTx(); drawStyles(); });
    });
    $$('[data-tweight]', box).forEach(el => el.addEventListener('change', () => {
      const t = findStyle(el.dataset.tweight); if (!t) return;
      tx('tsweight:' + t.id);
      const base = (t.css.d = t.css.d || {});
      if (el.value === '') delete base['font-weight']; else base['font-weight'] = el.value;
      endTx(); paintCss(); save(); drawStyles();
    }));
    $$('[data-te]', box).forEach(b => b.addEventListener('click', () => {
      openStyle = openStyle === b.dataset.te ? null : b.dataset.te;
      styleDev = 'd';
      drawStyles();
    }));
    $$('[data-td]', box).forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.td, used = tsUsage(id);
      if (used && !await askConfirm('Delete this text style?', `<b>${esc(findStyle(id).name)}</b> is used by ${used} element${used === 1 ? '' : 's'}. They keep their current look — they just stop following the style.`, { ok: 'Delete style' })) return;
      edit(() => styleDelete(id));
      if (openStyle === id) openStyle = null;
      drawStyles(); toast('Style deleted, looks kept');
    }));
    $('#mStyleAdd').addEventListener('click', async () => {
      const name = await askText('New text style', 'Style name', 'New style', { ok: 'Add style' });
      if (name === null) return;
      const base = tokenId(name) || 'style';
      let id = base, k = 2;
      while (findStyle(id)) id = base + '-' + k++;
      edit(() => state.meta.tokens.text.push({
        id, name: String(name).slice(0, 40),
        css: { d: { 'font-size': '16px', 'font-weight': '400', 'line-height': '1.5' }, t: {}, m: {} }
      }));
      openStyle = id; styleDev = 'd';
      drawStyles();
      toast('Text style created — set its values below');
    });

    /* ---- the expanded editor ---- */
    const t = openStyle && findStyle(openStyle);
    if (!t) return;
    const bucket = () => (t.css[styleDev] = t.css[styleDev] || {});
    const commit = () => { paintCss(); save(); };
    $$('[data-sd]', box).forEach(b => b.addEventListener('click', () => { styleDev = b.dataset.sd; drawStyles(); }));
    $$('select[data-sv]', box).forEach(el => el.addEventListener('change', () => {
      tx('tsval:' + t.id + el.dataset.sv);
      if (el.value === '') delete bucket()[el.dataset.sv]; else bucket()[el.dataset.sv] = el.value;
      endTx(); commit(); drawStyles();
    }));
    $$('input[data-sv]', box).forEach(el => {
      const prop = el.dataset.sv;
      const unit = box.querySelector(`[data-su="${prop}"]`);
      const push = () => {
        tx('tsval:' + t.id + prop);
        const raw = String(el.value).trim();
        if (raw === '') delete bucket()[prop];
        else bucket()[prop] = unit ? raw + unit.value : raw;
        commit();
      };
      el.addEventListener('input', push);
      el.addEventListener('blur', () => { endTx(); drawStyles(); });
      if (unit) unit.addEventListener('change', () => { push(); endTx(); });
    });
    const tagEl = $('#tsTag');
    if (tagEl) tagEl.addEventListener('change', () => {
      tx('tstag:' + t.id);
      if (tagEl.value) t.tag = tagEl.value; else delete t.tag;
      endTx(); save();
    });
    const fontEl = $('#tsFont');
    if (fontEl) fontEl.addEventListener('change', () => {
      tx('tsval:' + t.id + 'font');
      if (fontEl.value) bucket()['font-family'] = fontEl.value; else delete bucket()['font-family'];
      endTx(); commit(); drawStyles();
    });
    $$('[data-stok]', box).forEach(b => b.addEventListener('click', () => {
      tx('tsval:' + t.id + 'color');
      bucket().color = cvar(b.dataset.stok);
      endTx(); commit(); drawStyles();
    }));
    const sclr = box.querySelector('[data-sclr]');
    if (sclr) sclr.addEventListener('click', () => {
      tx('tsval:' + t.id + 'color');
      delete bucket().color;
      endTx(); commit(); drawStyles();
    });
  }
  drawStyles();

  /* ---- style classes ---- */
  function drawClasses() {
    const box = $('#mClasses'); if (!box) return;
    const list = classes();
    box.innerHTML = list.length ? list.map((c, i) => {
      const props = ['d', 't', 'm'].reduce((k, b) => k + Object.keys(c.css[b] || {}).length, 0);
      return `<div class="arow" data-k="${c.id}">
        <span style="flex:0 0 34px;text-align:center;font-family:var(--label);font-size:11px;color:var(--text-3)">.${esc(c.id.slice(0, 4))}</span>
        <span class="an">
          <input class="ctl" data-kn="${c.id}" value="${esc(c.name)}" style="font-size:12.5px;font-weight:600">
        </span>
        <span class="rowmeta" title="${props} declaration${props === 1 ? '' : 's'} in this class">${props} decl</span>
        <button class="iconbtn" data-ku="${c.id}" title="Raise precedence"${i === 0 ? ' disabled' : ''}>${svg('caret', 12)}</button>
        <button class="iconbtn" data-kd="${c.id}" title="Delete — elements keep the look">${svg('trash', 13)}</button>
      </div>`;
    }).join('') + `<div class="note">Precedence runs top to bottom: a class lower in this list overrides one above it. An element's own styling always wins.</div>`
      : `<div class="note">No classes yet. Select an element, open <b>Style</b>, and save its styling as a class.</div>`;

    $$('[data-kn]', box).forEach(el => el.addEventListener('input', () => {
      tx('clsname:' + el.dataset.kn);
      const c = findClass(el.dataset.kn); if (c) { c.name = el.value; save(); }
    }));
    $$('[data-ku]', box).forEach(b => b.addEventListener('click', () => {
      edit(() => classMove(b.dataset.ku, -1)); drawClasses();
    }));
    $$('[data-kd]', box).forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.kd, uses = classUsage(id);
      if (uses && !await askConfirm('Delete this class?', `<b>${esc(findClass(id).name)}</b> is used by ${uses} element${uses === 1 ? '' : 's'}. They keep their current look — they just stop sharing it.`, { ok: 'Delete class' })) return;
      edit(() => classDelete(id));
      drawClasses(); toast('Class deleted, looks kept');
    }));
  }
  drawClasses();

  /* ---- image manager ---- */

  $('#mDone').addEventListener('click', () => { closeModal(); render(); });
  /* Naming the site *is* the confirmation: cancelling the name cancels the whole
     thing, so there is one dialog rather than a warning followed by a prompt — and
     naming it is what you were going to do next anyway. */
  $('#mBlank').addEventListener('click', async () => {
    const name = await askText('Start an empty site', 'Site name', '', {
      ok: 'Start empty',
      placeholder: state.meta.name === 'Pagecraft' ? 'My site' : state.meta.name,
      note: 'Clears every page, the global header and footer, and the items in any CMS '
        + 'collection. Your colours, text styles, classes, saved blocks and the collections '
        + 'themselves stay — and ⌘Z brings this project back.'
    });
    if (name === null) return;
    edit(() => blankProject(name));
    selSet([]); closeModal(); render(); writeNow();
    toast('Empty site — add your first section');
    showPanel('add');
  });

  $('#mReset').addEventListener('click', async () => {
    if (!await askConfirm('Replace everything?', '<b>Your current pages are lost.</b> Export a project JSON first to keep them.', { ok: 'Replace with demo' })) return;
    hist.u.push(clone(doc()));
    seed(); selSet([]); closeModal(); render(); writeNow(); toast('Demo content restored');
  });
}

/* ---- find and replace -----------------------------------------------
   Grouped by where a hit lives, because "which page was that on" is the question
   being asked. A row is a button: it switches page or global region, selects the
   element and scrolls to it. Replace is one action over the whole project with undo
   behind it, since a per-hit replace list goes stale the moment the first one lands. */
let findState = { q: '', to: '', ci: true };
/* ---- the bind sheet -------------------------------------------------
   One dialog that shows the whole mapping and commits it in one go. Binding used to
   be one control at a time — select, open Content, click the badge, pick a field,
   repeat — which was about fifteen interactions for a five-field card, and there was
   nowhere to see what was bound to what. */
function bindModal(rootId) {
  if (editing.on) exitEdit();
  const sc = bindScope(rootId);
  if (!sc) { toast('Point this at a collection first'); return; }
  const col = sc.col;
  const slots = bindSlots(rootId);
  if (!slots.length) {
    toast('Nothing inside this to bind — add a Heading, an Image or a text block');
    return;
  }
  let map = guessBindings(slots, col);
  const key = s => s.nodeId + '|' + s.key;

  const draw = () => {
    const set = Object.values(map).filter(Boolean).length;
    $('#bsCount').innerHTML = set
      ? `<b>${set}</b> of ${slots.length} bound to <b>${esc(col.name)}</b>`
      : `Nothing bound yet. ${slots.length} places could take a value.`;
    $('#bsBody').innerHTML = `<table class="cmst"><thead><tr>
        <th>Element</th><th style="width:150px">Its field</th><th style="width:230px">Takes its value from</th>
      </tr></thead><tbody>${slots.map((s, i) => `<tr>
        <td><b style="font-size:12.5px">${esc(s.element)}</b><br><small style="font-family:var(--label);font-size:11px;color:var(--text-3)">${esc(DEF[s.type].label)}</small></td>
        <td>${esc(s.label)}</td>
        <td><select class="ctl" data-b="${i}">
          <option value="">— not bound —</option>
          ${col.fields.map(f => `<option value="${f.id}"${map[key(s)] === f.id ? ' selected' : ''}>${esc(f.name)} · ${f.type}</option>`).join('')}
        </select></td>
      </tr>`).join('')}</tbody></table>`;
    $$('#bsBody select').forEach(el => el.addEventListener('change', () => {
      map[key(slots[+el.dataset.b])] = el.value;
      draw();
    }));
  };

  openModal(`Bind to ${col.name}`, `
    <div class="note" style="margin:0 0 var(--gap-2)">Each row takes its value from a field, once
      per item. A field can be used twice if you want it twice. Nothing is written until you commit.</div>
    <div id="bsBody"></div>`, `
    <span class="note" id="bsCount" style="margin:0;flex:1;text-align:left"></span>
    <button class="btn" id="bsGuess">Suggest again</button>
    <button class="btn" id="bsNone">Clear all</button>
    <button class="btn primary" id="bsOk">Bind</button>`, 'lg');

  $('#bsGuess').addEventListener('click', () => { map = guessBindings(slots.map(s => ({ ...s, current: '' })), col); draw(); });
  $('#bsNone').addEventListener('click', () => { slots.forEach(s => { map[key(s)] = ''; }); draw(); });
  $('#bsOk').addEventListener('click', () => {
    let n = 0;
    edit(() => { n = applyBindings(map); });
    closeModal(); render();
    toast(n ? `${n} binding${n === 1 ? '' : 's'} set` : 'Nothing changed');
  });
  draw();
}

function findModal() {
  if (editing.on) exitEdit();
  openModal('Find and replace', `
    <div class="fgrid" style="margin-bottom:var(--gap-2)">
      <div class="f"><label>Find</label>
        <input class="ctl" id="fdQ" value="${esc(findState.q)}" placeholder="Text on any page, or in the CMS" autocomplete="off"></div>
      <div class="f"><label>Replace with</label>
        <input class="ctl" id="fdTo" value="${esc(findState.to)}" placeholder="Leave empty to delete it" autocomplete="off"></div>
    </div>
    <div class="tog-row" style="margin-bottom:var(--gap-2)"><span>Match case</span>
      <button class="sw-tog${findState.ci ? '' : ' on'}" id="fdCase"><i></i></button></div>
    <div id="fdOut"></div>`, `
    <span class="note" id="fdCount" style="margin:0;flex:1;text-align:left"></span>
    <button class="btn danger" id="fdRep">Replace all</button>
    <button class="btn primary" id="fdDone">Close</button>`);

  const q = $('#fdQ'), to = $('#fdTo'), out = $('#fdOut'), count = $('#fdCount'), rep = $('#fdRep');

  const draw = () => {
    findState.q = q.value; findState.to = to.value;
    const hits = searchAll(findState.q, { caseSensitive: !findState.ci });
    const total = searchCount(hits);
    rep.disabled = !total;
    count.innerHTML = !findState.q
      ? 'Searches every page, both global regions and the CMS.'
      : total
        ? `<b>${total}</b> occurrence${total === 1 ? '' : 's'} in ${hits.length} place${hits.length === 1 ? '' : 's'}`
        : 'Nothing found.';
    if (!findState.q) { out.innerHTML = '<div class="empty">Type to search.</div>'; return; }
    if (!hits.length) { out.innerHTML = `<div class="empty">No match for <b>${esc(findState.q)}</b>.</div>`; return; }
    /* group in the order searchAll walked, so the list reads header → pages → footer → CMS */
    const groups = [];
    hits.forEach(h => {
      const key = h.where + ':' + h.pageName;
      let g = groups.find(x => x.key === key);
      if (!g) groups.push(g = { key, name: h.pageName, where: h.where, rows: [] });
      g.rows.push(h);
    });
    out.innerHTML = groups.map((g, gi) => `
      <div class="xlab"${gi ? ' style="margin-top:var(--gap-3)"' : ''}>${esc(g.name)}${g.where === 'cms' ? ' · CMS' : ''}</div>
      ${g.rows.map(h => `<button class="hitrow" data-h="${hits.indexOf(h)}">
        <span class="hn">${esc(h.element)}</span>
        <span class="hf">${esc(h.field)}</span>
        <span class="hs">${esc(h.snippet)}</span>
        ${h.hits > 1 ? `<span class="hc">${h.hits}×</span>` : ''}
      </button>`).join('')}`).join('');

    $$('.hitrow', out).forEach(b => b.addEventListener('click', () => {
      const h = hits[+b.dataset.h];
      closeModal();
      /* a hit goes wherever it is edited: an element on the canvas, an item in the
         CMS dialog, a page's own fields in the Pages panel, the project name in
         Project settings */
      if (h.where === 'cms') { cmsModal(h.colId); return; }
      if (h.where === 'project') { projectModal(); return; }
      state.ui.mode = h.where === 'page' ? 'page' : h.where;
      if (h.where === 'page') state.cur = h.page;
      render();
      if (h.type === 'meta') { showPanel('pages'); selSet([]); return; }
      select(h.nodeId, { scroll: true });
    }));
  };

  const live = dbounce(draw, 140);
  q.addEventListener('input', live);
  to.addEventListener('input', () => { findState.to = to.value; });
  $('#fdCase').addEventListener('click', () => {
    findState.ci = !findState.ci;
    $('#fdCase').classList.toggle('on', !findState.ci);
    draw();
  });
  rep.addEventListener('click', async () => {
    const n = searchCount(searchAll(findState.q, { caseSensitive: !findState.ci }));
    if (!n) return;
    if (!await askConfirm('Replace across the whole project?',
      `<b>${n}</b> occurrence${n === 1 ? '' : 's'} of “${esc(findState.q)}” become “${esc(findState.to) || '<i>nothing</i>'}”, `
      + 'on every page, in both global regions and in the CMS. ⌘Z undoes it in one step.',
      { ok: 'Replace all ' + n, danger: true })) return;
    let did = 0;
    edit(() => { did = replaceAll(findState.q, findState.to, { caseSensitive: !findState.ci }); });
    render();
    toast(`Replaced ${did} occurrence${did === 1 ? '' : 's'}`);
    draw();
  });
  $('#fdDone').addEventListener('click', closeModal);
  draw();
  q.focus(); q.select();
}

function helpModal() {
  /* This is now the only place the shortcuts are written down — the inspector's
     empty state used to repeat a shorter list, and that panel no longer appears
     when nothing is selected. */
  const K = [
    ['Move through elements', '↑ ↓'], ['Select parent · first child', '← →'],
    ['Add to the selection', '⌘click'], ['Select a range, in the Navigator', '⇧click'],
    ['Reorder among siblings', '⇧↑ ⇧↓'], ['Edit text in place', '↵ or double-click'],
    ['Copy · cut · paste', '⌘C · ⌘X · ⌘V'],
    ['Copy · paste the <b>styling</b>', '⌘⇧C · ⌘⇧V'], ['Duplicate', '⌘D'], ['Delete', '⌫'],
    ['Undo / redo', '⌘Z · ⌘⇧Z'], ['Back to one element, then the parent', 'esc'],
    ['Find and replace, across the project', '⌘F'],
    ['Preview', '⌘P'], ['Export HTML', '⌘E'],
    ['Bold / italic while editing', '⌘B · ⌘I'], ['Insert link while editing', '⌘K']
  ];
  openModal('Keyboard & tips', `
    <table class="kt">${K.map(([a, b]) => `<tr><td>${a}</td><td><span class="kbd">${b}</span></td></tr>`).join('')}</table>
    <div class="note" style="margin-top:var(--gap-3);line-height:1.7">
      <b style="color:var(--text-2)">Structure</b> — Section → Row → Column → content. Missing wrappers are
      created for you.<br>
      <b style="color:var(--text-2)">Responsive</b> — pick Tablet or Mobile in the top bar and what you change
      becomes an override (max-width 1024px / 767px). A green badge marks one; click it to clear.<br>
      <b style="color:var(--text-2)">Global header &amp; footer</b> — shared by every page, edited in place. Hover the
      region and press <b>Edit header</b> or <b>Edit footer</b>; <b>Done</b> brings you back.<br>
      <b style="color:var(--text-2)">Autosave</b> — stored in this browser. Export → project JSON for a backup.
    </div>`, `<button class="btn primary" id="hOk">Got it</button>`);
  $('#hOk').addEventListener('click', closeModal);
}

/* ============================================================= keyboard */
function hotkey(e) {
  /* the ask layer owns the keyboard while it is up — its own handler takes Enter
     and Escape, and without this Escape would also walk the canvas selection */
  if (askOpenNow()) return;
  const t = e.target, tag = (t.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || (t.isContentEditable && !editing.on)) return;
  const meta = e.metaKey || e.ctrlKey;
  /* some synthetic and assistive input stacks omit `key`; `code` still names
     the physical key, which is enough for the navigation set */
  const k = (e.key || '').toLowerCase() || (e.code || '').toLowerCase();
  if (meta && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (meta && k === 'y') { e.preventDefault(); redo(); return; }
  if (meta && k === 'd') {
    e.preventDefault();
    const ids = selIds();
    if (ids.length) edit(() => ids.length > 1 ? dupMany(ids) : dupNode(ids[0]));
    return;
  }
  /* Styles first: the ⌘C and ⌘V branches below never checked shift, so without this
     ⌘⇧C would copy the element instead of its look. */
  if (meta && e.shiftKey && k === 'c') {
    if (!state.ui.sel) return;
    e.preventDefault();
    copyStyles(state.ui.sel);
    toast('Styles copied from ' + styleClip.from);
    renderRight();
    return;
  }
  if (meta && e.shiftKey && k === 'v') {
    if (!styleClip.css) { toast('No styles copied yet — ⌘⇧C first'); return; }
    const ids = selIds();
    if (!ids.length) return;
    e.preventDefault();
    let n = 0;
    edit(() => { n = pasteStylesMany(ids); });
    toast(n > 1 ? `Styles pasted onto ${n} elements` : n ? 'Styles pasted' : 'Nothing to paste onto');
    return;
  }
  const oneDeep = ' — the clipboard holds one element at a time';
  if (meta && k === 'c') {
    if (state.ui.sel && copyNode(state.ui.sel)) {
      e.preventDefault();
      toast(DEF[locate(state.ui.sel).node.type].label + ' copied' + (multiOn() ? oneDeep : ''));
    }
    return;
  }
  if (meta && k === 'x') {
    if (state.ui.sel && copyNode(state.ui.sel)) {
      e.preventDefault();
      const label = DEF[locate(state.ui.sel).node.type].label, many = multiOn();
      edit(() => delNode(state.ui.sel));
      toast(label + ' cut' + (many ? oneDeep : ''));
    }
    return;
  }
  if (meta && k === 'v') {
    if (!clip.node) return;
    e.preventDefault();
    let made = null;
    edit(() => { made = pasteNode(state.ui.sel); if (made) selSet([made.id]); });
    toast(made ? DEF[made.type].label + ' pasted' : 'A ' + DEF[clip.node.type].label + ' cannot go there');
    return;
  }
  if (meta && k === 'f') { e.preventDefault(); findModal(); return; }
  if (meta && k === 'p') { e.preventDefault(); togglePreview(); return; }
  if (meta && k === 'e') { e.preventDefault(); exportModal(); return; }
  if (meta && k === 's') { e.preventDefault(); save(); toast('Saved locally'); return; }
  if (!meta && (k === 'backspace' || k === 'delete')) {
    const ids = selIds();
    if (ids.length) { e.preventDefault(); edit(() => ids.length > 1 ? delMany(ids) : delNode(ids[0])); }
    return;
  }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
    if (e.shiftKey && state.ui.sel && (k === 'arrowup' || k === 'arrowdown')) {
      e.preventDefault();
      const ids = selIds(), dir = k === 'arrowup' ? -1 : 1;
      edit(() => ids.length > 1 ? nudgeMany(ids, dir) : nudge(ids[0], dir));
      return;
    }
    if (meta) return;
    e.preventDefault();
    const cur = state.ui.sel;
    let next = null;
    if (k === 'arrowup') next = step(cur, -1);
    else if (k === 'arrowdown') next = step(cur, 1);
    else if (k === 'arrowleft') next = parentOf(cur);
    else next = firstChildOf(cur) || step(cur, 1);
    if (next) select(next, { scroll: true });
    return;
  }
  if (k === 'enter' && state.ui.sel && !meta) {
    const n = locate(state.ui.sel);
    if (n && DEF[n.node.type].edit) { e.preventDefault(); enterEdit(state.ui.sel); return; }
  }
  if (k === 'escape') {
    if (!$('#modal').hidden) { closeModal(); return; }
    /* one step per press: back to a single element first, then up the tree.
       Doing both at once would lose the set before you could see what you had. */
    if (multiOn()) { select(state.ui.sel); return; }
    if (state.ui.sel) { const h = locate(state.ui.sel); select(h && h.parent ? h.parent.id : null); }
  }
}
document.addEventListener('keydown', hotkey);

/* ================================================================= init */
function bindTop() {
  $$('#devSeg button').forEach(b => b.addEventListener('click', () => setDev(b.dataset.dev)));
  $('#undoBtn').addEventListener('click', undo);
  $('#redoBtn').addEventListener('click', redo);
  $('#previewBtn').addEventListener('click', togglePreview);
  $('#exportBtn').addEventListener('click', exportModal);
  $('#reviewBtn').addEventListener('click', exportModal);
  $('#projBtn').addEventListener('click', projectModal);
  $('#helpBtn').addEventListener('click', helpModal);
  /* Extracted so anything can open a panel, not only a click on the rail — starting
     an empty site sends you to Add, which is the only thing left to do. */
  window.showPanel = t => {
    state.ui.tab = t;
    $$('#leftRail button[data-t]').forEach(x => x.classList.toggle('on', x.dataset.t === t));
    ['add', 'layers', 'pages', 'cms'].forEach(k => { $('#pane' + k[0].toUpperCase() + k.slice(1)).hidden = k !== t; });
    renderPanelHead();
    renderCms();
  };
  $$('#leftRail button').forEach(b => b.addEventListener('click', () => {
    /* Media and Project open dialogs rather than swapping the panel, so they set
       neither `state.ui.tab` nor the `on` treatment — the panel behind them has not
       changed. Scoping the toggle to `[data-t]` is what keeps them out of it. */
    const dialog = { media: mediaModal, project: projectModal }[b.dataset.act];
    if (dialog) { dialog(); return; }
    showPanel(b.dataset.t);
  }));
  window.addEventListener('resize', () => { layoutCanvas(); positionHud(); renderDim(); });
}

HOOKS.change = () => render();
HOOKS.save = () => save();
HOOKS.note = msg => toast(msg);

(async function boot() {
  await assetsLoad();
  load();
  await mountCanvas();
  bindTop();
  renderPalette();
  setDev(state.ui.dev);
  stamp('Ready', false);
})();
</script>
