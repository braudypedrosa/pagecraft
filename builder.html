/* =====================================================================
   Slate Page Builder — vanilla JS, zero dependencies
   ===================================================================== */
'use strict';


/*<core>*/
/* The core used to live here — around 4,100 lines of it. It is now
   app/src/core/index.ts, and build.mjs type-strips that file into this slot. Nothing
   goes between these markers: anything written here is deleted by the next build,
   which is the point. One copy, and it is the TypeScript one. */
/*</core>*/

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];



/* ---- persistence -----------------------------------------------------

   Two homes, one editor. Downloaded as a single file it saves to localStorage, which is
   what makes the file self-contained. Served by the Pagecraft server it saves to that
   server, and the server tells it so by injecting `window.PC_SERVER` — including the
   document, so `load()` stays synchronous either way. The difference is where the bytes
   go, and nothing above this line knows which it is. */
const LS = 'pagecraft.project.v1';
const LS_LEGACY = 'slate.project.v1';       // pre-rebrand key
const TABID = Math.random().toString(36).slice(2, 10);
let saveState = 'idle';                 // idle | ok | failed
let saveWarned = false;
let lastCloudDocument = null;

/* Set by the server when it serves the editor; absent in the single-file build. `version`
   is the one mutable field: every accepted save returns the next one, and sending a stale
   one is how the server knows two people are editing. */
const WP = window.PC_WORDPRESS || null;
const SRV = window.PC_SERVER || WP || null;
const IS_WORDPRESS = !!WP;

/* The server transport is a typed adapter compiled with the ported UI. WordPress creates the
   sibling adapter; both stop at the same document/schema boundary and neither reaches into
   the component runtime. The standalone artifact keeps its localStorage/IndexedDB host. */
const HOST = WP ? PC_UI.createWordPressHostAdapter({
  restUrl: WP.restUrl,
  pageId: WP.page.id,
  documentPath: WP.documentPath,
  revisionsPath: WP.revisionsPath,
  nonce: WP.nonce,
  capabilities: WP.capabilities || [],
  userId: WP.user && WP.user.id,
  userName: WP.user && WP.user.name,
  fetch: fetch.bind(window)
}) : SRV ? PC_UI.createWebHostAdapter({
  siteId: SRV.siteId,
  sessionToken: SRV.editorSessionToken,
  role: SRV.role,
  userId: SRV.user && SRV.user.id,
  userName: SRV.user && (SRV.user.name || SRV.user.email),
  document: SRV.doc,
  version: SRV.version,
  fetch: fetch.bind(window)
}) : null;

const HOST_FEATURES = HOST ? HOST.features : Object.freeze({
  sites: false, account: false, billing: false, sharing: false,
  hostedPublishing: false, cloudPageManager: true, projectExport: true,
  pages: 'pagecraft', media: 'pagecraft', menus: 'pagecraft', revisions: false,
  preview: 'pagecraft', publishing: false, globals: 'pagecraft', dynamicContent: 'pagecraft'
});

/* WordPress owns sitewide design settings independently from any one Pagecraft document.
   Only visual-system fields cross this boundary; WordPress continues to own the site title,
   language, URL, Site Icon, publishing, users and all other administration. */
const WORDPRESS_DESIGN_KEYS = ['maxWidth', 'font', 'headFont', 'size', 'css', 'tokens'];
function wordPressDesignSettings() {
  const out = {};
  WORDPRESS_DESIGN_KEYS.forEach(key => { out[key] = clone(state.meta[key]); });
  return out;
}
function applyWordPressDesignSettings() {
  if (!IS_WORDPRESS || !WP.designSettings || typeof WP.designSettings !== 'object') return;
  WORDPRESS_DESIGN_KEYS.forEach(key => {
    if (Object.prototype.hasOwnProperty.call(WP.designSettings, key)) state.meta[key] = clone(WP.designSettings[key]);
  });
  if (!state.meta.tokens) state.meta.tokens = defaultTokens(state.meta);
}

/* Product shape belongs to the host contract, not to CSS loaded after the editor. Removing
   unavailable controls before mounting also prevents keyboard and event seams from reviving
   Cloud behavior inside WordPress. */
function applyHostFeatures() {
  document.documentElement.dataset.pagecraftHost = HOST ? HOST.kind : 'standalone';
  const remove = selector => document.querySelector(selector)?.remove();
  if (!HOST_FEATURES.sites) remove('#sitesBtn');
  if (!HOST_FEATURES.sharing) remove('#shareBtn');
  if (!HOST_FEATURES.account) {
    remove('#accountBtn');
    remove('#accountPop');
  }
  if (!HOST_FEATURES.cloudPageManager) {
    remove('#leftRail');
    remove('#panePages');
    remove('#paneCms');
  }
  if (!HOST_FEATURES.projectExport) remove('[data-act="project"]');
}

/* WordPress's native-content index is only a link catalogue. Treat the injected payload as
   data at the seam: reject malformed targets, non-HTTPS links outside local testing,
   cross-origin links, duplicate ids,
   and return frozen copies so a ported panel cannot accidentally turn a picker into an edit
   path. The standalone build has no connected WordPress target and therefore an empty list. */
const WORDPRESS_CONTENT = (() => {
  if (!SRV || !Array.isArray(SRV.wordpressContent)) return Object.freeze([]);
  const targets = [];
  const seenConnections = new Set();
  const text = value => typeof value === 'string' ? value.trim() : '';
  const safeTargetUrl = value => {
    try {
      const parsed = new URL(text(value));
      const loopback = parsed.hostname === 'localhost' || parsed.hostname === '127.0.0.1' || parsed.hostname === '::1';
      const protocolOk = parsed.protocol === 'https:' || (parsed.protocol === 'http:' && loopback);
      return protocolOk && !parsed.username && !parsed.password ? parsed : null;
    } catch { return null; }
  };

  for (const raw of SRV.wordpressContent) {
    if (!raw || typeof raw !== 'object' || !Array.isArray(raw.items)) continue;
    const connectionId = text(raw.connectionId);
    const environment = raw.environment === 'staging' || raw.environment === 'production' ? raw.environment : '';
    const targetOrigin = text(raw.targetOrigin);
    const targetPathText = text(raw.targetPath);
    const targetPath = targetPathText === '/' ? '/' : targetPathText.replace(/\/+$/, '');
    const origin = safeTargetUrl(targetOrigin);
    if (!connectionId || !environment || !origin || !targetPath.startsWith('/')
      || /[?#\\]/.test(targetPath) || seenConnections.has(connectionId)) continue;
    seenConnections.add(connectionId);

    const seenItems = new Set();
    const items = [];
    for (const rawItem of raw.items) {
      if (!rawItem || typeof rawItem !== 'object') continue;
      const id = text(rawItem.id);
      const objectType = text(rawItem.objectType);
      const url = text(rawItem.url);
      const parsed = safeTargetUrl(url);
      const insideTarget = !!parsed && (targetPath === '/' || parsed.pathname === targetPath
        || parsed.pathname.startsWith(targetPath + '/'));
      if (!id || !['page', 'post'].includes(objectType) || !parsed || parsed.origin !== origin.origin
        || !insideTarget || parsed.hash || parsed.search || seenItems.has(id)) continue;
      seenItems.add(id);
      items.push(Object.freeze({
        id,
        objectType,
        title: text(rawItem.title) || `Untitled ${objectType}`,
        url,
        modifiedAt: text(rawItem.modifiedAt)
      }));
    }
    targets.push(Object.freeze({
      connectionId,
      environment,
      profile: text(raw.profile),
      targetOrigin,
      targetPath,
      items: Object.freeze(items)
    }));
  }
  return Object.freeze(targets);
})();
const wordpressContent = () => WORDPRESS_CONTENT;

/* The live URL, for sending to somebody.

   Only in server mode, because the single-file build has nowhere to share to — the button is
   hidden and this returns early. The URL comes from the server rather than being assembled
   here: only it knows whether this site has a domain of its own yet or is answering under a
   path on the shared host, and getting that wrong means handing somebody a link to nothing.

   Copy, with the link shown as a fallback. `navigator.clipboard` needs a secure context, which
   a local run over plain http is not, so the toast carries the URL either way. */
function wireShare() {
  const btn = $('#shareBtn');
  if (!HOST_FEATURES.sharing) return;
  const url = IS_WORDPRESS ? WP.previewUrl : SRV && SRV.url;
  if (!btn || !url) return;
  btn.hidden = false;
  btn.title = `Copy ${url}`;
  btn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(url);
      toast(`Link copied — ${url}`);
    } catch {
      toast(url);
    }
  });
}

function wireHistory() {
  const btn = $('#historyBtn');
  if (!btn || !HOST || !HOST_FEATURES.revisions || (!IS_WORDPRESS && SRV.role !== 'owner')) return;
  btn.hidden = false;
  btn.addEventListener('click', IS_WORDPRESS ? historyPanel : historyModal);
}

const historyDate = value => {
  const date = new Date(value);
  return Number.isNaN(date.getTime()) ? 'Unknown time' : new Intl.DateTimeFormat(undefined, {
    dateStyle: 'medium', timeStyle: 'short'
  }).format(date);
};

let rightSurfaceTrigger = null;
function openRightSurface(title, description, content, trigger) {
  if (!IS_WORDPRESS) return null;
  const inspector = $('#right'), panel = $('#rightAux');
  if (!inspector || !panel) return null;
  rightSurfaceTrigger = trigger || null;
  inspector.hidden = true;
  panel.hidden = false;
  panel.innerHTML = `<div class="sHead">
    <span class="ic">${svg('page', 14)}</span>
    <span class="tt"><b>${esc(title)}</b><small>${esc(description)}</small></span>
    <button class="iconbtn panelClose" id="rightSurfaceClose" title="Close ${esc(title)}" aria-label="Close ${esc(title)}">${svg('close', 13)}</button>
  </div><div class="sidePanelBody">${content}</div>`;
  for (const button of [$('#reviewBtn'), $('#historyBtn')]) {
    if (!button) continue;
    const active = button === trigger;
    button.classList.toggle('on', active);
    button.setAttribute('aria-pressed', String(active));
  }
  $('#rightSurfaceClose').addEventListener('click', closeRightSurface);
  layoutCanvas();
  requestAnimationFrame(() => $('#rightSurfaceClose')?.focus());
  return panel;
}

function closeRightSurface() {
  const panel = $('#rightAux');
  if (!panel || panel.hidden) return;
  panel.hidden = true;
  panel.replaceChildren();
  for (const button of [$('#reviewBtn'), $('#historyBtn')]) {
    if (!button) continue;
    button.classList.remove('on');
    button.setAttribute('aria-pressed', 'false');
  }
  const trigger = rightSurfaceTrigger;
  rightSurfaceTrigger = null;
  renderRight();
  layoutCanvas();
  if (trigger && document.contains(trigger)) trigger.focus();
}

function closeReviewSurface() {
  if (IS_WORDPRESS) closeRightSurface();
  else closeModal();
}

async function historyPanel() {
  const panel = openRightSurface('Version history', 'WordPress revisions',
    '<div class="note" id="rightHistory">Loading saved versions…</div>', $('#historyBtn'));
  if (!panel) return;
  const host = $('#rightHistory');
  try {
    const revisions = await HOST.revisions.list();
    if (!host || panel.hidden) return;
    host.outerHTML = revisions.length ? `<div class="historyList" id="rightHistory">${revisions.map(revision => {
      const current = revision.version === SRV.version;
      const author = revision.author && (revision.author.name || revision.author.email);
      return `<div class="historyRow">
        <div class="historyVersion">Version ${revision.version}</div>
        <div class="historyMeta">${esc(historyDate(revision.createdAt))}</div>
        <div class="historyMeta">${esc(author || 'Imported version')}</div>
        ${current ? '<span class="historyCurrent">Current</span>' : `<button class="btn tiny" data-restore="${revision.version}">Restore</button>`}
      </div>`;
    }).join('')}</div>` : '<div class="note" id="rightHistory">No saved versions yet.</div>';
    $$('[data-restore]', panel).forEach(button => button.addEventListener('click', async () => {
      const version = Number(button.dataset.restore);
      if (!await askConfirm(`Restore version ${version}?`,
        'Your current page will remain in WordPress revisions. Restoring creates a new revision and reloads the editor.',
        { ok: 'Restore version ' + version, danger: true })) return;
      button.disabled = true;
      button.textContent = 'Restoring…';
      try {
        await HOST.revisions.restore(version, SRV.version);
        location.reload();
      } catch (error) {
        button.disabled = false;
        button.textContent = 'Restore';
        toast(error.message || String(error));
      }
    }));
  } catch (error) {
    if (!host || panel.hidden) return;
    host.outerHTML = `<div class="alert" id="rightHistory"><b>History is unavailable.</b><span>${esc(error.message || String(error))}</span></div>`;
  }
}

async function historyModal() {
  openModal('Version history', '<div class="note">Loading saved versions…</div>',
    '<button class="btn" id="historyClose">Close</button>');
  $('#historyClose').addEventListener('click', closeModal);
  try {
    const revisions = await HOST.revisions.list();
    $('#mBody').innerHTML = revisions.length ? `<div class="historyList">${revisions.map(revision => {
      const current = revision.version === SRV.version;
      const author = revision.author && (revision.author.name || revision.author.email);
      return `<div class="historyRow">
        <div class="historyVersion">Version ${revision.version}</div>
        <div class="historyMeta">${esc(historyDate(revision.createdAt))}</div>
        <div class="historyMeta">${esc(author || 'Imported version')}</div>
        ${current ? '<span class="historyCurrent">Current</span>' : `<button class="btn tiny" data-restore="${revision.version}">Restore</button>`}
      </div>`;
    }).join('')}</div>` : '<div class="note">No saved versions yet.</div>';
    $$('[data-restore]', $('#mBody')).forEach(button => button.addEventListener('click', async () => {
      const version = Number(button.dataset.restore);
      if (!await askConfirm(`Restore version ${version}?`,
        'Your current site will remain in history. Restoring creates a new version and reloads the editor.',
        { ok: 'Restore version ' + version, danger: true })) return;
      button.disabled = true;
      button.textContent = 'Restoring…';
      try {
        await HOST.revisions.restore(version, SRV.version);
        location.reload();
      } catch (error) {
        button.disabled = false;
        button.textContent = 'Restore';
        toast(error.message || String(error));
      }
    }));
  } catch (error) {
    $('#mBody').innerHTML = `<div class="alert"><b>History is unavailable.</b><span>${esc(error.message || String(error))}</span></div>`;
  }
}

/* Drafts and releases are deliberately separate in server mode. Autosave protects the work;
   Publish is the explicit boundary that changes a public site. The single-file edition still
   has no server release ledger, so its primary action remains Export. */
const releaseClass = status => /live|active|published|succeeded/.test(status) ? 'live'
  : /fail|reject|rollback/.test(status) ? 'failed'
    : /queue|wait|download|stage|activat|verify|approval/.test(status) ? 'waiting' : '';
const releaseLabel = status => ({ succeeded: 'Live', published: 'Published', active: 'Live', needs_approval: 'Needs approval' }[status]
  || status.replace(/_/g, ' ').replace(/^./, c => c.toUpperCase()));

function renderReleasePanel(payload = {}) {
  const host = $('#releasePanel');
  if (!host) return;
  const publicationId = payload.publicationId || SRV.publishedPublicationId;
  const version = payload.publishedVersion ?? payload.sourceVersion ?? SRV.publishedVersion;
  const when = payload.publishedAt;
  const status = payload.status || (publicationId ? 'published' : 'draft');
  host.innerHTML = `
    <div class="releaseLead">
      <div>
        <h3>${publicationId ? 'Published on Pagecraft' : 'Nothing has been published yet'}</h3>
        <p>${publicationId
          ? `Draft version ${esc(version || '—')} became the public release${when ? ` on ${esc(historyDate(when))}` : ''}. Autosaved changes after that remain private.`
          : 'Autosave is protecting this draft, but visitors will not see it until an owner publishes it.'}</p>
      </div>
      <span class="releaseState ${releaseClass(status)}">${esc(releaseLabel(status))}</span>
    </div>`;
  host.setAttribute('aria-busy', 'false');
}

async function flushDraft() {
  await writeServer();
  const until = Date.now() + 20000;
  while ((saving || saveAgain) && Date.now() < until) await new Promise(resolve => setTimeout(resolve, 40));
  if (saving || saveAgain) throw new Error('The draft is still saving. Try Publish again in a moment.');
  if (saveState !== 'ok') throw new Error('The draft was not saved, so it was not published.');
}

async function finishWordPress(button) {
  button.disabled = true;
  button.textContent = 'Saving…';
  try {
    await flushDraft();
    button.textContent = 'Saved';
    const target = WP.pagesUrl || WP.exitUrl;
    if (target) window.top.location.href = target;
  } catch (error) {
    button.disabled = false;
    button.textContent = 'Try again';
    toast(error && error.message || String(error));
  }
}

async function publishDraft(button) {
  const findings = lint();
  const counts = lintCounts(findings);
  if (counts.error) {
    toast(`Resolve ${counts.error} problem${counts.error === 1 ? '' : 's'} before publishing`);
    return;
  }
  if (counts.warn && !await askConfirm('Publish with suggestions?',
    `${counts.warn} suggestion${counts.warn === 1 ? '' : 's'} will be recorded with this release. Problems always block publication.`,
    { ok: 'Publish this release' })) return;

  button.disabled = true;
  button.textContent = 'Publishing…';
  $('#releasePanel')?.setAttribute('aria-busy', 'true');
  try {
    await flushDraft();
    const payload = await HOST.releases.publish({
      sourceVersion: SRV.version,
      acknowledgeWarnings: counts.warn > 0
    });
    SRV.publishedPublicationId = payload.publicationId;
    SRV.publishedVersion = payload.sourceVersion ?? SRV.publishedVersion;
    renderReleasePanel(payload);
    toast(payload.status === 'unchanged' ? 'This version is already published' : 'Published to Pagecraft');
    button.textContent = 'Published';
    setTimeout(() => { if (button.isConnected) { button.disabled = false; button.textContent = 'Publish to Pagecraft'; } }, 900);
  } catch (error) {
    if (error && error.status === 409) {
      warnStale(error.payload || {});
    }
    button.disabled = false;
    button.textContent = 'Try again';
    const host = $('#releasePanel');
    if (host) host.insertAdjacentHTML('afterbegin', `<div class="alert" style="margin-bottom:var(--gap-2)"><b>Nothing changed publicly.</b><span>${esc(error.message || String(error))}</span></div>`);
    if (host) host.setAttribute('aria-busy', 'false');
  }
}

async function wordpressPublishModal() {
  openModal('Publish on WordPress', `
    <div class="releaseLead"><div><h3>Use Pagecraft natively in WordPress</h3>
      <p>Install the Pagecraft Importer in WordPress. It verifies and installs the matching Pagecraft Builder and Theme, then lets you build locally or import this whole Cloud project.</p></div></div>
    <ol class="releaseInstructions">
      <li>Download the verified Pagecraft Importer.</li>
      <li>In WordPress, open Plugins → Add New Plugin → Upload Plugin.</li>
      <li>Activate the Importer and approve its Builder and Theme compatibility checks.</li>
      <li>Build from scratch, or connect Pagecraft Cloud and import the whole project.</li>
    </ol>
    <div id="importerDownload" class="releaseEmpty" role="status">Checking the current signed release…</div>`, `
    <button class="btn" id="releaseClose">Close</button>`);
  $('#releaseClose').addEventListener('click', closeModal);
  const host = $('#importerDownload');
  try {
    const response = await fetch('/v1/wordpress-distribution/stable', { credentials: 'same-origin' });
    if (!response.ok) throw new Error('The signed Importer download is not enabled yet.');
    const payload = await response.json();
    const importer = payload.products && payload.products.importer;
    if (!importer || !importer.downloadUrl || !importer.sha256) throw new Error('The release manifest is incomplete.');
    host.innerHTML = `<a class="btn primary" href="${esc(importer.downloadUrl)}">Download Pagecraft Importer ${esc(importer.version || '')}</a>
      <small>SHA-256: <code>${esc(importer.sha256)}</code></small>`;
  } catch (error) {
    host.innerHTML = `<b>Importer download unavailable.</b><span>${esc(error.message || String(error))}</span>`;
  }
}

function publishModal() {
  if (!SRV) return exportModal();
  if (editing.on) exitEdit();
  const counts = lintCounts(lint());
  const mayPublish = SRV.role === 'owner' && !counts.error;
  openModal('Publish', `
    <div class="review" id="exReview"></div>
    <div id="releasePanel" role="status" aria-live="polite" aria-atomic="true" aria-busy="false"></div>`, `
    <button class="btn" id="releaseWordPress">Publish on WordPress</button>
    <span style="flex:1"></span>
    <button class="btn" id="releaseClose">Close</button>
    ${SRV.role === 'owner' ? `<button class="btn primary" id="releasePublish"${mayPublish ? '' : ' disabled'}>${counts.error ? 'Resolve problems first' : 'Publish to Pagecraft'}</button>` : ''}`);
  ui().mountReview('exReview', true);
  /* The editor page already carries the current publication identity and version. Rendering
     that injected state avoids a second authenticated database round trip just to open this
     dialog; a successful publish replaces it with the API's fresh response below. */
  renderReleasePanel();
  $('#releaseClose').addEventListener('click', closeModal);
  $('#releaseWordPress').addEventListener('click', wordpressPublishModal);
  const publish = $('#releasePublish');
  if (publish) publish.addEventListener('click', () => publishDraft(publish));
}

function reviewModal() {
  if (editing.on) exitEdit();
  openModal('Review', '<div class="review" id="exReview"></div>',
    '<span style="flex:1"></span><button class="btn primary" id="reviewClose">Close</button>');
  ui().mountReview();
  $('#reviewClose').addEventListener('click', closeModal);
}

function reviewPanel() {
  if (editing.on) exitEdit();
  const panel = openRightSurface('Review', 'Checks for this WordPress page',
    '<div class="review" id="rightReview"></div>', $('#reviewBtn'));
  if (panel) ui().mountReview('rightReview', true);
}

/* May this session change the shape of the site, as opposed to its words?

   The server already refuses a structural save from a content account, and it is the
   boundary — this is not a second one. It is so the editor stops offering what cannot be
   done: a panel that adds elements, a tab full of colours, a keystroke that deletes a
   section. Refusing a save somebody was invited to attempt is honest and unkind.

   Absent `PC_SERVER` this is the single-file build, where there is no account and nothing to
   scope. */
const canStructure = () => !SRV || SRV.role !== 'content';

/** Wrap a structural verb so it cannot fire from a shortcut, a menu or a drag. */
const structural = (fn) => (...args) => { if (canStructure()) return fn(...args); };

function stamp(txt, bad) {
  const t = $('#savedTag');
  t.textContent = txt;
  t.classList.toggle('bad', !!bad);
}

function writeNow() {
  if (SRV) return writeServer();
  try {
    localStorage.setItem(LS, JSON.stringify({ ...doc(), v: SCHEMA, cur: state.cur, tab: TABID }));
    saveState = 'ok';
    stamp('Saved ' + new Date().toTimeString().slice(0, 5), false);
  } catch (e) {
    saveState = 'failed';
    stamp('NOT SAVED', true);
    warnSaveFailed(e);
  }
}

/* One save in flight at a time, and one queued behind it. Without the guard a fast typist
   sends the second PUT before the first returns, the second carries the version the first
   is about to consume, and the server correctly calls it stale — so the editor would report
   a conflict it caused itself. */
let saving = false, saveAgain = false;

async function writeServer() {
  if (saving) { saveAgain = true; return; }
  const cloudDocument = !IS_WORDPRESS ? JSON.stringify(doc()) : null;
  if (!IS_WORDPRESS && saveState === 'ok' && cloudDocument === lastCloudDocument) return;
  saving = true;
  stamp('Saving…', false);
  try {
    const body = await HOST.documents.save({
      document: doc(),
      version: SRV.version,
      ...(IS_WORDPRESS ? { compiled: {
        html: buildPage(page()),
        globalCss: assetsToBlob(treeCss([state.header, state.footer], false)),
        pageCss: assetsToBlob(treeCss([page().tree], false))
      } } : {})
    });
    SRV.version = body.version;
    if (!IS_WORDPRESS) lastCloudDocument = cloudDocument;
    saveState = 'ok';
    stamp('Draft saved ' + new Date().toTimeString().slice(0, 5), false);
  } catch (e) {
    if (e && e.status === 409) {
      saveState = 'failed'; stamp('NOT SAVED', true); warnStale(e.payload || {}); return;
    }
    if (e && e.status === 403) {
      saveState = 'failed'; stamp('NOT SAVED', true); warnContentOnly(e.payload || {}); return;
    }
    saveState = 'failed';
    stamp('NOT SAVED', true);
    warnSaveFailed(e);
  } finally {
    saving = false;
    if (saveAgain) { saveAgain = false; writeServer(); }
  }
}

/* Somebody else saved between this editor loading and this editor saving. Reloading is the
   only honest offer: merging two documents is not something this can do, and pretending
   otherwise would lose one of them quietly. */
function warnStale(info) {
  if (saveWarned) return;
  saveWarned = true;
  const theirs = info && info.conflict ? info.conflict.theirs : '?';
  openModal('Somebody else saved this page', `
    <div class="alert">
      <b>This page changed somewhere else while you were working.</b>
      <span>Your version is ${SRV.version}, the host now has ${theirs}. Saving would overwrite their work, so nothing was saved.</span>
    </div>
    <div class="note" style="margin-top:var(--gap-2);line-height:1.7">
      Download a copy of what you have, then reload to get their version. There is no way to

function load() {
  /* Before anything draws, so the panels never flash into view. The default panel is Add,
     which a content account does not have — `boot()` sends it to Pages instead. */
  if (SRV && !canStructure()) document.body.classList.add('content-only');
  /* The server put the document in the page, so there is no asynchronous read. Adoption still
     runs: an older row follows the one migration chain, while a newer one fails closed with
     the upgrade instruction supplied by the shared host boundary. */
  if (SRV) {
    let d = null, loadError = null;
    if (IS_WORDPRESS && !SRV.doc) {
      blankProject(WP.page && WP.page.title || 'Untitled page');
      state.pages[0].name = WP.page && WP.page.title || 'Untitled page';
      state.pages[0].slug = WP.page && WP.page.slug || 'page';
      state.meta.name = WP.siteName || 'WordPress';
      applyWordPressDesignSettings();
      return;
    }
    try { d = PC_UI.adoptHostDocument(SRV.doc); } catch (error) { loadError = error; }
    if (d) {
      state.meta = { ...state.meta, ...d.meta };
      if (!state.meta.tokens) state.meta.tokens = defaultTokens(state.meta);
      state.header = d.header || []; state.footer = d.footer || [];
      state.pages = d.pages;
      state.cur = 0;
      applyWordPressDesignSettings();
      return;
    }
    /* A document the server holds and this build cannot read is not a case to paper over
       with the demo site — that would look like the site had been replaced. */
    seed();
    setTimeout(() => openModal('This site cannot be opened by this build', `
      <div class="alert"><b>The server holds a document this Pagecraft build cannot read.</b>
      <span>You are looking at the demo site. Nothing has been saved and nothing has been lost.</span></div>
      <div class="note" style="margin-top:var(--gap-2)">${esc(loadError && loadError.message || 'Update this host to a matching Pagecraft build.')}</div>`,
      `<button class="btn primary" id="svOk">Understood</button>`) || $('#svOk').addEventListener('click', closeModal), 300);
    return;
  }
  let raw = null;
  try {
    raw = localStorage.getItem(LS);
    if (!raw) {                              // adopt a project saved before the rename
      const old = localStorage.getItem(LS_LEGACY);
      if (old) { raw = old; localStorage.setItem(LS, old); localStorage.removeItem(LS_LEGACY); }
    }
  } catch (e) { }
  if (!raw) { seed(); return; }
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) { }
  let d = null, loadError = null;
  try { d = PC_UI.adoptHostDocument(parsed); } catch (error) { loadError = error; }
  if (!d) {
    seed();
    if (loadError) setTimeout(() => openModal('Saved project cannot be opened by this build', `
      <div class="alert"><b>This browser holds a project this Pagecraft build cannot read.</b>
      <span>It was left untouched rather than loaded and possibly mangled. You are looking at the demo site.</span></div>
      <div class="note" style="margin-top:var(--gap-2)">${esc(loadError.message)}</div>`,
      `<button class="btn primary" id="nvOk">Understood</button>`) || $('#nvOk').addEventListener('click', closeModal), 300);
    return;
  }
  state.meta = { ...state.meta, ...d.meta };
  if (!state.meta.tokens) state.meta.tokens = defaultTokens(state.meta);
  state.header = d.header || []; state.footer = d.footer || [];
  state.pages = d.pages;
  state.cur = Math.min(d.cur || 0, d.pages.length - 1);
}


/* ================================================== asset store (IndexedDB)
   Images live as blobs in IndexedDB, not as data URIs inside the project
   JSON — that keeps localStorage small and lifts the hard 5 MB ceiling.
   A project references them as `asset:<id>`, resolved to a blob URL on the
   canvas and to a data URI (or a file path) at export time.               */
const AS = { db: null, mem: new Map(), ok: false };
/* `A_RE` and `assetFile` are the core's now — the server has to name an asset the same way
   this file does, and two copies of that rule is one copy too many. They arrive in scope with
   the rest of the core, which is why declaring them here again is `Identifier 'A_RE' has
   already been declared` and a dead app. The boot test says so by name. */

const idbReq = rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });

function idbOpen() {
  return new Promise(res => {
    let rq;
    try { rq = indexedDB.open('slate.assets', 1); } catch (e) { return res(null); }
    rq.onupgradeneeded = () => { if (!rq.result.objectStoreNames.contains('a')) rq.result.createObjectStore('a', { keyPath: 'id' }); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => res(null);
    rq.onblocked = () => res(null);
  });
}
const idbStore = (mode) => AS.db.transaction('a', mode).objectStore('a');

async function assetsLoad() {
  if (SRV) { AS.ok = true; return assetsLoadServer(); }
  AS.db = await idbOpen();
  AS.ok = !!AS.db;
  if (!AS.ok) return;
  let recs = [];
  try { recs = await idbReq(idbStore('readonly').getAll()) || []; } catch (e) { recs = []; }
  recs.forEach(r => { if (r && r.blob) AS.mem.set(r.id, { ...r, url: URL.createObjectURL(r.blob) }); });
}

/* Intrinsic size is measured here and stored with the record. It used to be
   measured by each caller and set on the in-memory copy only, so a reload dropped
   it — and it is what the export writes as width/height and what the review's
   `no-dimensions` check reads. */
/* On the server the bytes belong to the server, not to this browser: an image kept in one
   person's IndexedDB is an image every other person sees as a placeholder. So the upload goes
   over the wire and comes back as an id, and `AS.mem` records it with a URL pointing at the
   server — which keeps every existing reader of `AS.mem` working unchanged. */
async function assetAddServer(file) {
  let meta;
  try {
    meta = await HOST.assets.upload(file, file.name);
  } catch (e) {
    const why = e && e.payload;
    toast((why && (why.detail || why.error)) || (e && e.status
      ? `The server refused the image (${e.status})`
      : 'The upload did not reach the server'));
    return null;
  }
  AS.mem.set(meta.id, {
    id: meta.id, name: meta.name, type: meta.mimeType, size: meta.size || file.size,
    w: meta.width, h: meta.height,
    /* served by the editor's own route, so it needs the session the page already has */
    url: meta.url || (SRV.editorSessionToken ? URL.createObjectURL(file) : `/api/sites/${SRV.siteId}/assets/${meta.id}`)
  });
  return meta.id;
}

/* Every asset the server holds, so the canvas can resolve tokens that were uploaded by
   somebody else — which on a shared site is most of them. */
async function assetsLoadServer() {
  let list = [];
  try {
    list = await HOST.assets.list();
  } catch (e) { }
  await Promise.all(list.map(async m => {
    let url = m.url;
    if (SRV.editorSessionToken) {
      try {
        url = URL.createObjectURL(await HOST.assets.download(m.id));
      } catch { return; }
    }
    AS.mem.set(m.id, {
      id: m.id, name: m.name, type: m.mimeType, size: m.size || 0,
      w: m.width, h: m.height, url

  }));
}

async function assetAdd(file) {
  if (SRV) return assetAddServer(file);
  const id = 'a' + uid().replace(/[^a-z0-9]/g, '');
  const url = URL.createObjectURL(file);
  const dim = (await imgSize(url)) || { w: 0, h: 0 };
  const rec = { id, name: file.name || 'image', type: file.type || 'application/octet-stream', size: file.size, blob: file, w: dim.w, h: dim.h };
  if (AS.ok) {
    try { await idbReq(idbStore('readwrite').put(rec)); }
    catch (e) { AS.ok = false; toast('Could not store the image — it will be lost on reload'); }
  }
  AS.mem.set(id, { ...rec, url });

}
async function assetDel(id) {
  const a = AS.mem.get(id);
  if (SRV) {
    try {
      await HOST.assets.remove(id);
    } catch (e) {
      const why = e && e.payload;
      toast((why && why.error) || (e && e.status
        ? `The server refused to delete the image (${e.status})`
        : 'The image could not be deleted from the server'));
      return false;
    }
  } else if (AS.ok) {
    try { await idbReq(idbStore('readwrite').delete(id)); }
    catch (e) { toast('The image could not be deleted from storage'); return false; }
  }
  /* a server URL is a path, not a blob URL, and revoking one is a no-op that reads as a bug */
  if (a && a.url && a.url.startsWith('blob:')) URL.revokeObjectURL(a.url);
  AS.mem.delete(id);
  return true;
}
const assetBytes = () => [...AS.mem.values()].reduce((n, a) => n + (a.size || 0), 0);

/* how many times each asset is referenced by the whole project */
function assetUsage() {
  const hits = {};
  const json = JSON.stringify(doc());
  let m;
  A_RE.lastIndex = 0;
  while ((m = A_RE.exec(json))) hits[m[1]] = (hits[m[1]] || 0) + 1;
  return hits;
}

/* intrinsic pixel size of an image, used to emit width/height on export */
const imgSize = url => new Promise(res => {
  if (!url) return res(null);
  const i = new Image();
  i.onload = () => res({ w: i.naturalWidth, h: i.naturalHeight });
  i.onerror = () => res(null);
  i.src = url;
});

const blobToData = b => new Promise(res => {
  const fr = new FileReader();
  fr.onload = () => res(fr.result);
  fr.onerror = () => res(PH);
  fr.readAsDataURL(b);
});

/* canvas: cheap object URLs */
const assetsToBlob = str => str.replace(A_RE, (m, id) => (AS.mem.get(id) || {}).url || PH);

/* export: inline as data URIs, or rewrite to a relative assets/ path */
async function assetsToData(str) {
  const ids = [...new Set([...str.matchAll(A_RE)].map(m => m[1]))];
  const map = {};
  for (const id of ids) {
    const a = AS.mem.get(id);
    map[id] = a && a.blob ? await blobToData(a.blob) : PH;
  }
  return str.replace(A_RE, (m, id) => map[id] || PH);

const assetPath = v => {

   valid and fetched once. */

const assetsToPaths = (str, rel = '') => str.replace(A_RE, (m, id, w) => {

/* Every (asset, width) pair a rendered page asks for, so the writer emits exactly the files
   the markup promises and no others. */
const assetVariantsIn = str => {
  const out = new Map();
  for (const m of str.matchAll(A_RE)) {
    const a = AS.mem.get(m[1]);
    if (!m[2] || !a || !a.blob || !rasterable(a)) continue;
    out.set(m[1] + '@' + m[2], { a, w: +m[2] });
  }
  return [...out.values()];

/* Downscaled once per asset and width, however many pages reference it. The promise itself

   instead of racing. */
const VAR = new Map();
function variantBlob(a, w) {

/* ---- zip -----------------------------------------------------------------
   Written by hand rather than pulled in: a whole site is a handful of files, and
   the format is a local header per entry, then a central directory, then a
   twenty-two byte tail. Deflate comes from CompressionStream where the browser
   has it and falls back to stored, which is still a valid archive.
   Timestamps are fixed at the ZIP epoch so the same site zips to the same bytes —
   the same reason content.json carries no generated-at stamp. */
const deflateRaw = async u8 => {
  if (typeof CompressionStream !== 'function') return null;
  try {
    const st = new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    const packed = new Uint8Array(await new Response(st).arrayBuffer());
    return packed.length < u8.length ? packed : null;
  } catch (e) { return null; }
};

async function makeZip(entries) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0, count = 0;
  const put = (n, len) => { const b = new Uint8Array(len); for (let i = 0; i < len; i++) b[i] = (n >>> (8 * i)) & 0xFF; return b; };
  for (const e of entries) {
    const name = enc.encode(e.path);
    const raw = typeof e.data === 'string' ? enc.encode(e.data)
      : e.data instanceof Uint8Array ? e.data
        : new Uint8Array(await e.data.arrayBuffer());
    const crc = crc32(raw);
    const packed = raw.length > 256 ? await deflateRaw(raw) : null;
    const body = packed || raw, method = packed ? 8 : 0;
    const head = [put(0x04034b50, 4), put(20, 2), put(0, 2), put(method, 2), put(0, 2), put(0x21, 2),
      put(crc, 4), put(body.length, 4), put(raw.length, 4), put(name.length, 2), put(0, 2), name];
    chunks.push(...head, body);
    central.push(...[put(0x02014b50, 4), put(20, 2), put(20, 2), put(0, 2), put(method, 2), put(0, 2), put(0x21, 2),
      put(crc, 4), put(body.length, 4), put(raw.length, 4), put(name.length, 2), put(0, 2), put(0, 2),
      put(0, 2), put(0, 2), put(0, 4), put(offset, 4), name]);
    offset += head.reduce((n, b) => n + b.length, 0) + body.length;
    count++;
  }
  const cdSize = central.reduce((n, b) => n + b.length, 0);
  return new Blob([...chunks, ...central,
    put(0x06054b50, 4), put(0, 2), put(0, 2), put(count, 2), put(count, 2), put(cdSize, 4), put(offset, 4), put(0, 2)],
    { type: 'application/zip' });
}

/* What the canvas needs to render the current page the way its file will look. `pg` and the

}

/* Preview runs the exact interaction payloads written into an export. Keeping a second,
   hand-written approximation here is how Tabs, Gallery, Code, Slider and Video could all
   look right in the editor while doing nothing until after download. The listeners and
   observers are recorded so repainting Preview does not leave old document/window handlers
   alive against nodes that no longer exist. */
let previewDispose = () => {};
const previewScriptBody = source => {
  const text = String(source || '');
  if (!/^\s*<script[>\s]/i.test(text)) return text;
  return text.slice(text.indexOf('>') + 1, text.toLowerCase().lastIndexOf('<'));
};
function runPreviewRuntime(html) {
  previewDispose();
  previewDispose = () => {};
  if (!cdoc || !document.body.classList.contains('preview')) return;

  let runtimeStyle = null;
  if (/\bbp-animate\b/.test(html)) {
    runtimeStyle = cdoc.createElement('style');
    runtimeStyle.id = 's-preview-runtime';
    runtimeStyle.textContent = ANIM_CSS + '\n' + ANIM_CALM;
    cdoc.head.appendChild(runtimeStyle);
  }

  const listeners = [], observers = [];
  const proto = cwin.EventTarget && cwin.EventTarget.prototype;
  const add = proto && proto.addEventListener;
  if (add) proto.addEventListener = function(type, fn, opts) {
    listeners.push([this, type, fn, opts]);
    return add.call(this, type, fn, opts);
  };

  const nativeObserver = {};
  ['MutationObserver', 'IntersectionObserver'].forEach(name => {
    const Native = cwin[name];
    if (typeof Native !== 'function') return;
    nativeObserver[name] = Native;
    const Wrapped = function(...args) {
      const observer = new Native(...args);
      observers.push(observer);
      return observer;
    };
    Wrapped.prototype = Native.prototype;
    cwin[name] = Wrapped;
  });

  const scripts = [
    [/data-slider/.test(html), SLIDE_JS],
    [/data-copy/.test(html), CODE_JS],
    [/data-tabs/.test(html), TABS_JS],
    [/data-nav/.test(html), NAV_JS],
    [/data-facade/.test(html), FACADE_JS],
    [/data-lightbox/.test(html), LB_JS],
    [/\bbp-animate\b/.test(html), ANIM_JS]
  ];
  try {
    scripts.forEach(([used, source]) => {
      if (!used) return;
      const script = cdoc.createElement('script');
      script.textContent = previewScriptBody(source);
      cdoc.body.appendChild(script);
      script.remove();
    });
  } finally {
    if (add) proto.addEventListener = add;
    Object.keys(nativeObserver).forEach(name => { cwin[name] = nativeObserver[name]; });
  }

  previewDispose = () => {
    listeners.forEach(([target, type, fn, opts]) => {
      try { target.removeEventListener(type, fn, opts); } catch (e) { }
    });
    observers.forEach(observer => { try { observer.disconnect(); } catch (e) { } });
    if (runtimeStyle) runtimeStyle.remove();
    $$('.pagecraft-lightbox', cdoc).forEach(el => el.remove());
    try { delete cwin.bpAnimate; } catch (e) { }
  };
}

function paint() {
  if (!cdoc) return;
  previewDispose();
  previewDispose = () => {};
  const editing = !document.body.classList.contains('preview');
  const scope = scopeOf();
  const css = treeCss(curSets(), editing);

  let html = '';
  for (const R of regions()) {
    const nodes = R.get();
    const live = R.kind === scope;
    /* `pageCtx()` in preview too. Without it a detail template previewed with its
       bindings unresolved — every bound heading showing the literal it stands in for —
       which is the one page where the preview matters most. Edit mode passed it all
       along; preview was the branch that forgot. */
    if (!editing) { html += renderList(nodes, { edit: false, ...pageCtx() }); continue; }
    if (!nodes.length && !live) continue;                 // nothing to show as context

    const inner = renderList(nodes, { edit: live, ...pageCtx() })
      || (live ? `<div class="s-canvas-empty"><b>${R.kind === 'main' ? 'This page is empty' : R.label + ' is empty'}</b>
          <span>Drag an element onto the canvas, or</span>
          <button class="s-openadd" data-openadd="1">Open the Add panel</button></div>` : '');

    /* dim everything that is not the region being edited */
    const st = live ? 'edit' : (scope === 'main' ? 'locked' : 'dim');
    html += `<div class="s-region" data-kind="${R.kind}" data-state="${st}">`
      + `<div class="s-lockbar">`
      + (live
        ? (R.kind === 'main'
          ? `<span class="s-lockchip">${svg('page', 11)} Page content</span>`
          : `<span class="s-lockchip on">${svg('globe', 11)} Editing ${R.label.toLowerCase()}</span>`)
        : `<span class="s-lockchip">${svg(R.kind === 'main' ? 'page' : 'globe', 11)} ${R.label} ${svg('lock', 10)}</span>`
        + `<button class="s-lockopen" data-goto="${modeFor(R.kind)}">Edit ${R.kind === 'main' ? 'page' : R.kind} ${svg('edit', 10)}</button>`)
      + `</div><div class="s-rbody">${inner}</div></div>`;
  }
  if (!editing) html = html || '';

  syncFonts();
  cdoc.getElementById('s-css').textContent = assetsToBlob(css);
  cdoc.getElementById('s-root').innerHTML = assetsToBlob(html);
  if (!editing) runPreviewRuntime(html);
  positionHud();
}

/* ================================================================ toast */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ================================================================== HUD */
function positionHud() {
  if (!cdoc) return;
  const hud = cdoc.getElementById('s-hud'); if (!hud) return;
  const s = state.ui.sel ? locate(state.ui.sel) : null;
  if (!s || document.body.classList.contains('preview') || editing.on) { hud.innerHTML = ''; return; }
  const el = cdoc.getElementById(s.node.id);
  if (!el) { hud.innerHTML = ''; return; }
  const r = el.getBoundingClientRect();
  const top = r.top + cwin.scrollY, left = r.left + cwin.scrollX;
  const d = DEF[s.node.type];
  const ids = selIds(), many = ids.length > 1;
  /* Extra members get an outline and nothing else: one bar, on the primary, so there is
     never a question which element the buttons act on.

     The bar was cut to three buttons once, on the reasoning that the verbs had three
     homes — this bar, the inspector footer and the context menu — and that was one too
     many. That conflated two different things. Duplicated *logic* was the real problem,
     and `runAct` fixed it: every entry point now calls the same implementation, so they
     cannot disagree. Duplicated *affordances* were never the problem — a toolbar button,
     a menu item and a keyboard shortcut for one action is how tools work, and taking
     Duplicate and Delete off the bar turned the two most-used verbs into two clicks. */
  const alt = ids.slice(1).map(id => {
    const e2 = cdoc.getElementById(id); if (!e2) return '';
    const q = e2.getBoundingClientRect();
    return `<div class="frame alt" style="left:${q.left + cwin.scrollX}px;top:${q.top + cwin.scrollY}px;width:${q.width}px;height:${q.height}px"></div>`;
  }).join('');
  hud.innerHTML = alt +
    `<div class="frame" style="left:${left}px;top:${top}px;width:${r.width}px;height:${r.height}px">
      <i class="nw"></i><i class="n"></i><i class="ne"></i><i class="e"></i>
      <i class="se"></i><i class="s"></i><i class="sw"></i><i class="w"></i>
     </div>
     <div class="bar" style="top:${top}px;left:${left}px">
      <span class="nm">${many ? ids.length + ' selected' : esc(d.label)}</span>
      <button class="g" data-act="drag" title="${many ? 'Drag all ' + ids.length + ' to move them together' : 'Drag to move'}">${svg('drag', 12)}</button>
      ${!many && s.parent ? `<button data-act="up" title="Select parent (esc)">${svg('caretUp', 12)}</button>` : ''}
      ${/* only where there is a list to be at the end of, so the bar does not carry two
             buttons that cannot do anything */''}
      ${(s.parent ? s.parent.children : tree()).length > 1 ? `
        <button data-act="first" title="Move to the top (⌘⇧↑)">${svg('toTop', 12)}</button>
        <button data-act="last" title="Move to the bottom (⌘⇧↓)">${svg('toBottom', 12)}</button>` : ''}
      ${!many && d.edit ? `<button data-act="edit" title="Edit content">${svg('edit', 12)}</button>` : ''}
      ${/* Save as a block is in the ⋯ menu and not on the bar. It is a thing you do once to
             an element you have finished, where everything else here is a thing you do while
             working — and the bar had grown to nine buttons. `runAct` handles the verb the
             same either way, so nothing moved except where it is offered. */''}
      <button data-act="dup" title="Duplicate ${many ? 'all ' : ''}(⌘D)">${svg('copy', 12)}</button>
      <button data-act="del" title="Delete ${many ? 'all ' : ''}(⌫)">${svg('trash', 12)}</button>
      <button data-act="more" title="Everything else — or right-click the element">${svg('more', 12)}</button>
    </div>`
    + (many ? '' : gripsHtml(s));

  /* Above the element, unless there is not room — and the room is measured rather than
     guessed. The bar carries `scale(1 / --z)` so it stays the same size on screen at any
     canvas zoom, which means its height *in canvas pixels* grows as you zoom out: at 76% a
     26px bar occupies 34, so a fixed 26px threshold clipped it at every zoom below 100%.

     Measuring after the write costs one layout read and is exact whatever the bar contains —
     a multi-select bar and a single-element bar are different widths, and a future button
     would change the height again. */
  const bar = hud.querySelector('.bar');
  if (!bar) return;
  /* Measured, not assumed. The bar carries `scale(1 / --z)` so it stays legible at any canvas
     zoom, which means its height in canvas pixels grows as you zoom out — 33px at 78%, 54px at
     54%, and more again with a wider bar. Every constant here was wrong at some zoom.

     The bar's own CSS no longer offsets it. It used to sit above its element with a
     translateY(-100%) about a bottom-left origin, and that origin is on the *untranslated*
     box — so scaling lifted the bar by its height times (scale - 1), leaving a gap above the
     element that was nothing at 100% zoom and grew the further out you went. The position is
     set here instead, from the height that was just measured, which is exact at every zoom and
     is the same arithmetic that keeps the bar on screen. */
  const h = bar.getBoundingClientRect().height;

  /* One clamp, and the position set outright rather than nudged by a transform. Above the
     element is the preference, but the bar has to stay inside the part of the canvas you can
     actually see — and the case that matters is scrolling down with a tall section selected:
     its top edge goes off-screen, and both "above the top edge" and "hanging from the top
     edge" go off-screen with it. Pinning to the top of the view keeps the bar with the
     selection the whole way down a page.

       want  above the element, which is where it sits whenever there is room
       0     the top of what is visible; never higher than this
       hi    still over the element; never lower, so it cannot float free of what it labels */
  const want = r.top - h;
  const hi = Math.max(0, r.bottom - h);
  const y = Math.min(Math.max(want, 0), hi);
  bar.style.top = (y + cwin.scrollY) + 'px';
  /* flush above gets the tab shape it always had; anything else is sitting over the element,
     so it rounds on the side that is no longer touching an edge */
  if (y > want + 0.5) bar.style.borderRadius = '0 6px 6px 6px';
}

/* A grip per gutter, on the row that is selected — or on the parent row when a
   column is selected, which is how you usually arrive at wanting to resize.
   Positioned between each adjacent pair, from the live boxes rather than from the
   stored ratios, so it lands correctly whatever the widths actually resolve to. */
function gripsHtml(s) {
  const row = s.node.type === 'row' ? s.node
    : (s.node.type === 'column' && s.parent && s.parent.type === 'row') ? s.parent : null;
  if (!row || (row.children || []).length < 2) return '';
  const boxes = row.children.map(c => {
    const e = cdoc.getElementById(c.id);
    return e ? e.getBoundingClientRect() : null;
  });
  if (boxes.some(b => !b)) return '';
  let out = '';
  for (let i = 0; i < boxes.length - 1; i++) {
    const a = boxes[i], b = boxes[i + 1];
    /* a wrapped row stacks its columns — there is no vertical gutter to drag */
    if (b.left < a.left + 1) continue;
    const x = (a.right + b.left) / 2 + cwin.scrollX;
    const t = Math.min(a.top, b.top) + cwin.scrollY;
    const h = Math.max(a.bottom, b.bottom) - Math.min(a.top, b.top);
    out += `<div class="grip" data-grip="${row.id}" data-i="${i}"
      style="left:${x}px;top:${t}px;height:${h}px" title="Drag to resize"></div>`;
  }
  return out;
}

/* `add` toggles one member, `range` sweeps from the primary to `id` in document
   order, and a plain call replaces the set. Only a plain call clears the class
   target: while adding, the primary has not moved, so the target still holds. */
function select(id, opts = {}) {
  if (editing.on) exitEdit();
  if (opts.add) selToggle(id);
  else if (opts.range && state.ui.sel && id) selSet(selRange(state.ui.sel, id));
  else {
    if (id !== state.ui.sel) { state.ui.target = ''; state.ui.lmode = null; }
    selSet(id ? [id] : []);
  }
  /* reveal every member — a hit buried under a collapsed parent is no use if
     the Navigator will not show it */
  for (const sid of selIds()) {
    const h = locate(sid); if (!h) continue;
    for (let p = h.parent; p; p = (locate(p.id) || {}).parent) delete state.ui.collapsed[p.id];
  }
  /* At tablet widths the library and inspector take turns instead of both taking a
     fixed column. Selection is the unambiguous signal that the inspector is the side
     somebody needs; clearing it returns to the library. */
  document.body.classList.toggle('library-focus', !state.ui.sel);
  paintSel();
  renderRight();
  renderModebar();
  renderLayers();
  drawBlocks();
  if (opts.scroll && state.ui.sel && cdoc) {
    const el = cdoc.getElementById(state.ui.sel);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}
/* cheap selection repaint — avoids rebuilding the whole canvas */
function paintSel() {
  if (!cdoc) return;
  $$('[data-sel],[data-sel2]', cdoc).forEach(e => {
    e.removeAttribute('data-sel'); e.removeAttribute('data-sel2');
  });
  /* Only the primary gets `data-sel` — widgets hang behaviour off it (a nav
     opens its list), and that should follow the one element the inspector is
     pointed at, not everything in the set. */
  selIds().forEach((id, i) => {
    const el = cdoc.getElementById(id);
    if (el && el.dataset.id) el.setAttribute(i ? 'data-sel2' : 'data-sel', '');
  });
  positionHud();
}

/* ---- one dispatcher for every element verb -----------------------------
   The HUD bar, the Navigator row, the inspector footer and the context menu all call
   this. Before it, duplicate and delete existed three times over, each with its own
   idea of whether it applied to the selection or to one node. */
function runAct(act, ids) {
  const list = (ids && ids.length ? ids : selIds()).filter(id => locate(id));
  if (!list.length) return;
  const id = list[0], many = list.length > 1;
  switch (act) {
    case 'edit': enterEdit(id); break;
    case 'up': { const h = locate(id); select(h.parent ? h.parent.id : null); break; }
    case 'copy':
      if (copyNode(id)) toast(DEF[locate(id).node.type].label + ' copied'
        + (many ? ' — the clipboard holds one element at a time' : ''));
      break;
    case 'cut': {
      if (!copyNode(id)) break;
      const label = DEF[locate(id).node.type].label;
      if (canStructure()) edit(() => delNode(id));
      toast(label + ' cut' + (many ? ' — the clipboard holds one element at a time' : ''));
      break;
    }
    case 'paste': {
      if (!clip.node) break;
      let made = null;
      edit(() => { made = pasteNode(id); if (made) selSet([made.id]); });
      toast(made ? DEF[made.type].label + ' pasted' : 'A ' + DEF[clip.node.type].label + ' cannot go there');
      break;
    }
    case 'first': case 'last': {
      const dir = act === 'first' ? -1 : 1;
      /* asked before the edit, not after: `edit` snapshots and clears the redo stack before
         its body runs, so finding out afterwards that nothing moved is already too late */
      if (atEdge(list, dir)) { toast(dir < 0 ? 'Already at the top' : 'Already at the bottom'); break; }
      edit(() => sendEdge(list, dir));
      break;
    }
    case 'dup': if (canStructure()) edit(() => (many ? dupMany(list) : dupNode(id))); break;
    case 'del': if (canStructure()) edit(() => (many ? delMany(list) : delNode(id))); break;
    case 'stcopy': copyStyles(id); toast('Styles copied from ' + styleClip.from); renderRight(); break;
    case 'stpaste': {
      if (!styleClip.css) { toast('No styles copied yet'); break; }
      let k = 0;
      edit(() => { k = pasteStylesMany(list); });
      toast(k > 1 ? `Styles pasted onto ${k} elements` : k ? 'Styles pasted' : 'Nothing changed');
      break;
    }
    case 'hide': edit(() => list.forEach(x => {
      const nd = locate(x).node;
      nd.hide = nd.hide || {};
      nd.hide[dk()] = !nd.hide[dk()];
    })); break;
    case 'block': saveBlockFlow(id); break;
  }
}

/* ---- the context menu -------------------------------------------------
   Right-click is where a paste verb belongs, and there was none anywhere in the app.
   It is also what lets the HUD bar stop growing: seven buttons floating over the
   element became a name, a drag handle and one more. */
function closeCtx() { const c = $('#ctx'); if (c) c.remove(); }
function openCtx(x, y, ids) {
  closeCtx();
  const items = menuFor(ids);
  if (!items.length) return;
  const m = document.createElement('div');
  m.id = 'ctx';
  m.setAttribute('role', 'menu');
  m.setAttribute('aria-label', 'Element actions');
  m.innerHTML = items.map(i =>
    `<button role="menuitem" data-a="${i.act}"${i.danger ? ' class="danger"' : ''}${i.sep ? ' data-sep="1"' : ''}>`
    + `<span>${esc(i.label)}</span>${i.key ? `<em>${esc(i.key)}</em>` : ''}</button>`).join('');
  document.body.appendChild(m);
  /* place it at the pointer, then pull it back inside the window rather than letting
     a menu near the right or bottom edge run off */
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(y, window.innerHeight - r.height - 8) + 'px';
  const buttons = $$('button', m);
  buttons[0]?.focus();
  m.addEventListener('keydown', e => {
    const at = buttons.indexOf(document.activeElement);
    const next = e.key === 'Home' ? 0 : e.key === 'End' ? buttons.length - 1
      : e.key === 'ArrowDown' ? (at + 1) % buttons.length
        : e.key === 'ArrowUp' ? (at - 1 + buttons.length) % buttons.length : -1;
    if (next < 0) return;
    e.preventDefault(); buttons[next].focus();
  });
  buttons.forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.a;
    closeCtx();
    runAct(a, ids);
  }));
}
/* One closer for every way out: another click, Escape, a scroll, a resize.

   Escape *consumes* the event when it dismisses a menu, and only then. Otherwise the
   menu closed and `hotkey` also ran its own Escape branch on the same press, so one tap
   dismissed the menu and walked the selection up a level — two things for one key. With
   no menu open the event is left alone and Escape means what it always meant. */
const escCtx = e => {
  if (e.key !== 'Escape' || !$('#ctx')) return;
  closeCtx();
  e.stopPropagation();
};
document.addEventListener('pointerdown', e => { if (!e.target.closest('#ctx')) closeCtx(); }, true);
document.addEventListener('keydown', escCtx, true);
window.addEventListener('resize', closeCtx);

/* ========================================================= canvas events */
function bindCanvas() {
  /* The context menu lives in the outer document, and so did every one of its closers —
     but the canvas is an iframe, and events inside it never reach the outer document. So
     the menu, which is nearly always opened by right-clicking an element *in the canvas*,
     survived the very next thing anyone does: clicking another element. Capture phase, so
     it runs before the handler below decides what the click meant, and unconditional,
     because a pointerdown anywhere in the canvas is never a click on the menu. */
  cdoc.addEventListener('pointerdown', closeCtx, true);
  cdoc.addEventListener('keydown', escCtx, true);

  cdoc.addEventListener('pointerdown', e => {
    if (document.body.classList.contains('preview')) return;
    const hudBtn = e.target.closest && e.target.closest('#s-hud button');
    if (hudBtn) {
      e.preventDefault();
      const act = hudBtn.dataset.act, id = state.ui.sel, ids = selIds();
      if (act === 'drag') {
        /* dragging any member of a selection drags the whole set */
        const many = ids.length > 1 && ids.includes(id);
        startDrag(e, {
          kind: 'move', id, ids: many ? ids : [id],
          label: many ? ids.length + ' elements' : DEF[locate(id).node.type].label
        }, true);
      } else if (act === 'more') {
        /* the bar lives inside the scaled iframe, so its coordinates need the factor */
        const fr = frameRect();
        openCtx(toScreen(e.clientX, fr.left), toScreen(e.clientY, fr.top), ids);
      } else runAct(act, ids);
      return;
    }
    const grip = e.target.closest && e.target.closest('[data-grip]');
    if (grip) { startColResize(e, grip); return; }
    if (editing.on && e.target.closest('[data-editing]')) return;

    /* A locked region is context, not a trap: only the explicit button opens
       its editor. Clicking elsewhere in it simply clears the selection. */
    if (e.target.closest('[data-openadd]')) {
      e.preventDefault();
      const tab = $('#leftRail button[data-t="add"]');
      if (tab) tab.click();
      return;
    }
    const open = e.target.closest('.s-lockopen');
    if (open) { e.preventDefault(); setMode(open.dataset.goto); return; }
    const region = e.target.closest('.s-region');
    if (region && region.dataset.state !== 'edit') { e.preventDefault(); select(null); return; }

    const hit = e.target.closest('[data-id]');
    if (!hit) { select(null); return; }
    if (editing.on) exitEdit();
    /* Both modifiers add here. A range needs a flat list to sweep, and the canvas
       has depth instead — shift-clicking two headings would otherwise drag in
       every row and column that happens to sit between them. The Navigator, which
       does present a list, is where shift takes a range. */
    const add = e.metaKey || e.ctrlKey || e.shiftKey;
    /* A modifier click is a selection gesture, not a text one. Without this the
       browser also extends a native text selection across the canvas, so adding
       three cards leaves everything between them highlighted blue. */
    if (add) { e.preventDefault(); const g = cwin.getSelection(); if (g) g.removeAllRanges(); }
    select(hit.dataset.id, { add });
  }, true);

  cdoc.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (!a) return;
    const claimed = e.defaultPrevented;
    e.preventDefault();
    if (!document.body.classList.contains('preview')) return;
    /* Gallery lightbox (and any future exported interaction) already owns this click.
       Preview still prevents the browser navigation, but does not reinterpret it as a page
       link or announce a spurious external-link warning. */
    if (claimed) return;
    const href = a.getAttribute('href') || '';
    if (!href) return;
    /* A fragment on this page is a scroll, and always was. */
    if (href.startsWith('#') && href.length > 1) {
      const t = cdoc.getElementById(href.slice(1));
      if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      return toast('No element with the anchor ' + href + ' on this page');
    }
    /* Anything else that lands inside this project is followed, which is what makes Preview
       a preview of a site rather than of one page. It used to say "links follow through in
       the exported file" and stay put — true, and no use to anyone checking their nav.

       `pageAt` does the resolving because the slug is the page's identity and the `.html` in
       the stored href is a file-naming detail. A detail-page link carries its item too, so
       the template renders the post that was actually clicked. */
    const to = pageAt(href);
    if (!to) {
      return toast(/^([a-z][\w+.-]*:|\/\/)/i.test(href)
        ? 'External links open in the exported site, not here'
        : `Nothing in this project answers to ${href}`);
    }
    if (to.col && to.item) {
      state.ui.item = state.ui.item || {};
      state.ui.item[to.col.id] = published(to.col).findIndex(i => i.id === to.item.id);
    }
    /* a pager link names which page of results it wants; everything else means the first */
    state.ui.pno = to.pageNo || 1;
    state.cur = to.at;
    state.ui.mode = 'page';
    selSet([]);
    render();
    /* after the new page is on screen, not before */
    requestAnimationFrame(() => {
      const t = to.frag && cdoc.getElementById(to.frag);
      if (t) t.scrollIntoView({ block: 'start' });
      else cwin.scrollTo(0, 0);
    });
    const pg = state.pages[to.at];
    toast(to.item ? `${itemTitle(to.col, to.item)} — ${pg.name}`
      : (to.pageNo > 1 ? `${pg.name} — page ${to.pageNo}` : pg.name));
  });
  cdoc.addEventListener('dblclick', e => {
    if (document.body.classList.contains('preview')) return;
    const hit = e.target.closest('[data-id]');
    if (hit && DEF[locate(hit.dataset.id) ? locate(hit.dataset.id).node.type : ''] ) {
      const n = locate(hit.dataset.id).node;
      if (DEF[n.type].edit) { e.preventDefault(); enterEdit(n.id); }
    }
  });
  /* the menu is placed at the pointer in outer-document coordinates, so once the canvas
     scrolls it is pointing at whatever moved into that spot */
  cwin.addEventListener('scroll', () => { closeCtx(); positionHud(); if (editing.on) placeRT(); }, { passive: true });
  cwin.addEventListener('resize', () => { positionHud(); if (editing.on) placeRT(); });
  /* Right-click selects what is under the pointer if it is not already selected — a
     menu that acts on something you cannot see selected is how you delete the wrong
     thing — then opens on the element, in outer-document coordinates. */
  cdoc.addEventListener('contextmenu', e => {
    if (document.body.classList.contains('preview')) return;
    const el = e.target.closest && e.target.closest('[data-id]');
    if (!el) return;
    e.preventDefault();
    const id = el.dataset.id;
    if (!selIds().includes(id)) { select(id); }
    const fr = frameRect();
    openCtx(toScreen(e.clientX, fr.left), toScreen(e.clientY, fr.top), selIds());
  });
  cdoc.addEventListener('keydown', e => {
    if (editing.on) {
      if (e.key === 'Escape') { e.preventDefault(); exitEdit(); }
      return;
    }
    hotkey(e);
  });
}

/* =============================================================== drag/drop */
let drag = null, dragDidMove = false;

function startDrag(e, payload, fromFrame) {
  e.preventDefault();
  drag = { ...payload, fromFrame, drop: null, moved: false };
  document.body.classList.add('dragging');
  const g = $('#ghost');
  g.innerHTML = svg(payload.icon || (payload.kind === 'move' ? 'drag' : 'plus'), 13) + esc(payload.label);
  g.style.display = 'flex';
  moveGhost(e, fromFrame);

  const src = e.target;
  try { src.setPointerCapture(e.pointerId); } catch (_) { }
  const dOwn = fromFrame ? cdoc : document;
  const mv = ev => onDragMove(ev, fromFrame);
  const up = ev => { onDrop(ev, fromFrame); cleanup(); };
  function cleanup() {
    dOwn.removeEventListener('pointermove', mv);
    dOwn.removeEventListener('pointerup', up);
    dOwn.removeEventListener('pointercancel', up);
  }
  dOwn.addEventListener('pointermove', mv);
  dOwn.addEventListener('pointerup', up);
  dOwn.addEventListener('pointercancel', up);
}

/* Dragging a gutter. Writes at the breakpoint being edited, because the column's
   own Width (share) control is responsive — resizing on Tablet must not quietly
   rewrite the desktop base. The whole gesture is one `tx`, so it is one ⌘Z. */
function startColResize(e, grip) {
  e.preventDefault();
  const hit = locate(grip.dataset.grip); if (!hit) return;
  const row = hit.node, i = +grip.dataset.i, b = dk();
  const rowEl = cdoc.getElementById(row.id); if (!rowEl) return;
  const span = rowEl.getBoundingClientRect().width;
  if (!span) return;
  const startX = e.clientX;
  const key = 'colresize:' + row.id + ':' + i + ':' + b;
  grip.classList.add('on');
  try { grip.setPointerCapture(e.pointerId); } catch (_) { }

  const tip = cdoc.createElement('div');
  tip.className = 'gtip';
  cdoc.getElementById('s-hud').appendChild(tip);

  const move = ev => {
    const pct = ((ev.clientX - startX) / span) * 100;
    const ws = resizeCols(row, i, pct, b);
    if (!ws) return;
    tx(key);
    applyColsAt(row, ws, b);
    paintCss();                                     // cheap: only the stylesheet
    const total = ws.reduce((a, x) => a + x, 0) || 1;
    tip.textContent = ws.map(w => Math.round((w / total) * 100) + '%').join('  ·  ');
    const g = rowEl.getBoundingClientRect();
    tip.style.left = (ev.clientX + cwin.scrollX) + 'px';
    tip.style.top = (g.top + cwin.scrollY - 6) + 'px';
  };
  const up = () => {
    cdoc.removeEventListener('pointermove', move);
    cdoc.removeEventListener('pointerup', up);
    cdoc.removeEventListener('pointercancel', up);
    tip.remove();
    grip.classList.remove('on');
    endTx(); save(); renderRight(); positionHud();
  };
  cdoc.addEventListener('pointermove', move);
  cdoc.addEventListener('pointerup', up);
  cdoc.addEventListener('pointercancel', up);
}

/* Note this is the *visual* box: with the canvas scaled, its width and height are
   already multiplied by zoomK. Only three places mix outer coordinates with iframe
   ones, and all three are here — everything else measures inside the iframe, where
   the scale does not exist. `inFrame` and `toScreen` are the whole conversion. */
function frameRect() { return $('#canvas').getBoundingClientRect(); }
const inFrame = (v, off) => (v - off) / zoomK;      // screen px -> iframe px
const toScreen = (v, off) => v * zoomK + off;       // iframe px -> screen px

function moveGhost(e, fromFrame) {
  const r = frameRect();
  const x = fromFrame ? toScreen(e.clientX, r.left) : e.clientX;
  const y = fromFrame ? toScreen(e.clientY, r.top) : e.clientY;
  const g = $('#ghost'); g.style.left = x + 'px'; g.style.top = y + 'px';
}

function onDragMove(e, fromFrame) {
  if (!drag) return;
  drag.moved = true;
  moveGhost(e, fromFrame);
  const r = frameRect();
  /* findDrop works in iframe document coordinates, so a pointer that came from the
     outer document has to be divided by the scale, not just offset. */
  const x = fromFrame ? e.clientX : inFrame(e.clientX, r.left);
  const y = fromFrame ? e.clientY : inFrame(e.clientY, r.top);
  /* the bounds are compared in iframe units too — r.width is the scaled box */
  if (x < 0 || y < 0 || x > r.width / zoomK || y > r.height / zoomK) { drag.drop = null; showDrop(null); return; }
  const type = drag.kind === 'new' ? drag.type
    : drag.kind === 'pattern' ? 'section'
      : drag.kind === 'block' ? blockRootType(drag.blockId)
        : drag.kind === 'component' ? ((findComponent(drag.componentId) || {}).node || {}).type
          : locate(drag.id).node.type;
  const d = findDrop(x, y, type, drag.kind === 'move' ? drag.id : null);
  drag.drop = d;
  showDrop(d);
}

function findDrop(x, y, type, movingId) {
  const el = cdoc.elementFromPoint(x, y);
  if (!el) return null;
  const chain = [];
  let e = el;
  while (e && e !== cdoc.documentElement) {
    if (e.dataset && e.dataset.id && locate(e.dataset.id)) chain.push(e);
    e = e.parentElement;
  }
  if (chain.length && movingId) {                   // never drop inside what we're dragging
    const self = chain.findIndex(c => c.dataset.id === movingId);
    if (self > -1) chain.splice(0, self + 1);
  }
  let container = null, ci = -1;
  for (let i = 0; i < chain.length; i++) {
    const n = locate(chain[i].dataset.id).node;
    if (holds(n.type, type)) { container = n; ci = i; break; }
  }
  const list = container ? container.children : tree();
  const horiz = !!(container && container.type === 'row');
  let index = list.length;

  const childEl = ci > 0 ? chain[ci - 1] : null;
  const direct = childEl && list.some(c => c.id === childEl.dataset.id) ? childEl : null;
  if (direct) {
    const idx = list.findIndex(c => c.id === direct.dataset.id);
    const r = direct.getBoundingClientRect();
    const mid = horiz ? r.left + r.width / 2 : r.top + r.height / 2;
    index = (horiz ? x : y) > mid ? idx + 1 : idx;
  } else {
    index = 0;
    for (const c of list) {
      const ce = cdoc.getElementById(c.id); if (!ce) { index++; continue; }
      const r = ce.getBoundingClientRect();
      const mid = horiz ? r.left + r.width / 2 : r.top + r.height / 2;
      if ((horiz ? x : y) > mid) index++;
    }
  }
  return { container, index, horiz, list };
}

function showDrop(d) {
  if (!cdoc) return;
  let ind = cdoc.getElementById('s-drop');
  if (!d) { if (ind) ind.remove(); return; }
  if (!ind) { ind = cdoc.createElement('div'); ind.id = 's-drop'; cdoc.getElementById('s-hud').appendChild(ind); }
  const sx = cwin.scrollX, sy = cwin.scrollY;
  const { container, index, horiz, list } = d;

  if (!list.length) {
    const host = container ? (container.type === 'section' ? cdoc.querySelector('#' + container.id + ' > .pagecraft-container') : cdoc.getElementById(container.id)) : cdoc.getElementById('s-root');
    if (!host) return;
    const r = host.getBoundingClientRect();
    ind.className = 'box';
    Object.assign(ind.style, { left: r.left + sx + 'px', top: r.top + sy + 'px', width: r.width + 'px', height: Math.max(r.height, 40) + 'px' });
    return;
  }
  const after = index >= list.length;
  const refN = after ? list[list.length - 1] : list[index];
  const ref = cdoc.getElementById(refN.id);
  if (!ref) return;
  const r = ref.getBoundingClientRect();
  ind.className = '';
  if (horiz) {
    Object.assign(ind.style, { left: (after ? r.right : r.left) - 1.5 + sx + 'px', top: r.top + sy + 'px', width: '3px', height: r.height + 'px' });
  } else {
    Object.assign(ind.style, { left: r.left + sx + 'px', top: (after ? r.bottom : r.top) - 1.5 + sy + 'px', width: r.width + 'px', height: '3px' });
  }
}

function onDrop(e, fromFrame) {
  document.body.classList.remove('dragging');
  $('#ghost').style.display = 'none';
  showDrop(null);
  const d = drag; drag = null;
  dragDidMove = !!(d && d.moved);
  if (!d || !d.drop) { return; }
  const { container, index } = d.drop;
  if (d.kind === 'pattern') {
    let made = null;
    edit(() => { made = patternInsert(d.patId, container, index); if (made) selSet([made.id]); });
    toast(made ? d.label + ' added' : 'That does not fit there');
  } else if (d.kind === 'block') {
    let made = null;
    edit(() => { made = blockInsert(d.blockId, container, index); if (made) selSet([made.id]); });
    toast(made ? findBlock(d.blockId).name + ' placed' : 'That block does not fit there');
  } else if (d.kind === 'component') {
    let made = null;
    edit(() => { made = instanceInsert(d.componentId, container, index); if (made) selSet([made.id]); });
    const cd = findComponent(d.componentId);
    toast(made ? (cd ? cd.name : 'Component') + ' placed' : 'That component does not fit there');
  } else if (d.kind === 'new') {
    edit(() => { const leaf = insert(d.type, container, index); selSet([leaf.id]); });
    toast(labelOf(d.type) + ' added');
  } else {
    const set = d.ids && d.ids.length > 1 ? d.ids : null;
    if (set) {
      let k = 0;
      edit(() => { k = moveMany(set, container, index); });
      toast(k === set.length ? `${k} elements moved` : k ? `${k} of ${set.length} moved — the rest do not fit there` : 'They do not fit there');
    } else {
      edit(() => moveNode(d.id, container, index));
    }
  }
}

function placeRT() {
  const rt = $('#rt');
  if (!editing.on || editing.kind !== 'rich') { rt.classList.remove('show'); return; }

  const r = el.getBoundingClientRect();

     scaled before it is offset — at 50% zoom it otherwise floats twice as far out */
  let left = toScreen(r.left + r.width / 2, fr.left) - w / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  let top = toScreen(r.top, fr.top) - rt.offsetHeight - 8;
  if (top < 54) top = Math.min(fr.top + r.bottom + 8, window.innerHeight - 40);
  rt.style.left = left + 'px'; rt.style.top = top + 'px';
}
/* `createLink` runs against the canvas iframe's live selection, and opening a
   dialog takes focus out of it. Save the range, put it back, then run the
   command — otherwise the link lands nowhere. */
async function linkPrompt() {
  const sel = cwin.getSelection();
  const saved = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  const url = await askText('Add a link', 'Link URL', 'https://', { ok: 'Add link', placeholder: 'https://example.com' });
  if (!url) return;
  if (editing.el) editing.el.focus();
  if (saved) { const s2 = cwin.getSelection(); s2.removeAllRanges(); s2.addRange(saved); }
