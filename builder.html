/* Where a widget's editable text actually lives, when it is not the whole element.
   A button keeps its label in a span so the icon beside it stays out of the way, and a
   quote keeps its words in a paragraph so the attribution does not get typed into the
   quotation. Both enterEdit and syncEdit need the same answer, and while only the button
   needed one they each hard-coded it — a second widget would have meant a second pair of
   special cases free to disagree.

   'p' covers both quote shapes on purpose: attributed, the paragraph sits inside the
   blockquote inside the figure; unattributed, the host is the blockquote and the
   paragraph is its own child. */
const EDIT_IN = { button: 'span', quote: 'p' };
const editTarget = (n, host) => (EDIT_IN[n.type] && host.querySelector(EDIT_IN[n.type])) || host;

function enterEdit(id) {
  const h = locate(id); if (!h) return;
  const n = h.node, d = DEF[n.type];
  if (!d.edit) return;
  if (editing.on) exitEdit();
  if (state.ui.sel !== id || multiOn()) { selSet([id]); paintSel(); renderRight(); renderLayers(); }

  const host = cdoc.getElementById(id); if (!host) return;
  const target = editTarget(n, host);

  hist.u.push(clone(doc())); hist.r.length = 0;
  editing.on = true; editing.id = id; editing.el = host; editing.kind = d.edit;
  target.contentEditable = 'true';
  host.setAttribute('data-editing', '');
  if (d.edit === 'rich') target.style.outline = 'none';
  target.focus();
  if (n.type !== 'text') {
    const rg = cdoc.createRange(); rg.selectNodeContents(target);
    const s = cwin.getSelection(); s.removeAllRanges(); s.addRange(rg);
  }
  const onInput = () => syncEdit();
  const onPaste = ev => {
    ev.preventDefault();
    const txt = (ev.clipboardData || cwin.clipboardData).getData('text/plain');
    cdoc.execCommand('insertText', false, txt);
  };
  const onKey = ev => {
    if (ev.key === 'Enter' && n.type !== 'text') { ev.preventDefault(); exitEdit(); }
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k' && n.type === 'text') {
      ev.preventDefault(); linkPrompt();
    }
  };
  target.addEventListener('input', onInput);
  target.addEventListener('paste', onPaste);
  target.addEventListener('keydown', onKey);
  editing.off = [() => {
    target.removeEventListener('input', onInput);
    target.removeEventListener('paste', onPaste);
    target.removeEventListener('keydown', onKey);
    target.removeAttribute('contenteditable');
    target.style.outline = '';
  }];
  positionHud(); placeRT();
}

function syncEdit() {
  if (!editing.on) return;
  const h = locate(editing.id); if (!h) return;
  const n = h.node, host = editing.el;
  if (n.type === 'text') n.props.html = host.innerHTML.trim();
  else if (n.type === 'button') n.props.text = editTarget(n, host).innerText.replace(/\n+/g, ' ').trim();
  else n.props.text = editTarget(n, host).innerText.replace(/ /g, ' ').replace(/\n+$/, '');
  /* keep the inspector honest while typing on the canvas — a full re-render
     would steal focus, so the bound field is updated in place */
  const field = $('#right [data-x="v"]');
  if (field && n.type !== 'text' && field.value !== n.props.text) field.value = n.props.text;
  save();
  renderLayers();
}

function exitEdit() {
  if (!editing.on) return;
  syncEdit();
  editing.off.forEach(f => f());
  if (editing.el) editing.el.removeAttribute('data-editing');
  editing.on = false; editing.id = null; editing.el = null; editing.kind = null; editing.off = [];
  $('#rt').classList.remove('show');
  paint(); renderRight();
}

let UI = null;

     cannot drift from what the core actually exports. See the note there. */
  __CORE,

    select, setMode, editComponent, runAct, openCtx, startLayerDrag, regions, scopeOf, modeFor,
    askText, askConfirm, cmsModal, saveBlockFlow, toast, startDrag, appendSmart,

    consumeDragMoved: () => { const v = dragDidMove; dragDidMove = false; return v; },
    closeModal, closeReviewSurface,

/* ---- reordering in the Navigator --------------------------------------
   The canvas can already do this, but only where the thing is visible and big
   enough to aim at. A list is the surface for moving a Section past another Section,
   or for reaching a container that has nothing in it yet.

   Its own drag rather than the canvas one: the canvas resolves a drop by hit-testing
   real geometry, and a flat list of rows has none of that. What it has instead is
   thirds — the top third puts the node before the row, the bottom third after it, and
   the middle puts it inside when that row can hold it. */
let layerDrag = null;
function startLayerDrag(e, id) {
  e.preventDefault();
  e.stopPropagation();
  const set = selIds();
  const ids = set.length > 1 && set.includes(id) ? set : [id];
  const type = locate(id).node.type;
  layerDrag = { ids, type, drop: null, moved: false };
  document.body.classList.add('dragging');
  const g = $('#ghost');
  g.innerHTML = svg('drag', 13) + esc(ids.length > 1 ? ids.length + ' elements' : nameOf(locate(id).node));
  g.style.display = 'flex';

  const pane = $('#paneLayers');
  const line = document.createElement('div');
  line.id = 'l-drop';
  const host = pane.querySelector('.layers');

  const at = ev => {
    $('#ghost').style.left = ev.clientX + 'px';
    $('#ghost').style.top = ev.clientY + 'px';
    layerDrag.moved = true;
    const row = document.elementFromPoint(ev.clientX, ev.clientY);
    const lr = row && row.closest ? row.closest('.lrow[data-id]') : null;
    if (!lr) { layerDrag.drop = null; line.remove(); return; }
    const r = lr.getBoundingClientRect();
    const rel = (ev.clientY - r.top) / r.height;
    const zone = rel < 0.3 ? 'before' : rel > 0.7 ? 'after' : 'inside';
    const d = layerTarget(lr.dataset.id, zone, layerDrag.type, layerDrag.ids)
      /* a row that cannot take it inside still has edges that can */
      || (zone === 'inside' ? layerTarget(lr.dataset.id, 'after', layerDrag.type, layerDrag.ids) : null);
    layerDrag.drop = d;
    if (!d) { line.remove(); return; }
    const hr = host.getBoundingClientRect();
    if (zone === 'inside' && d.container && d.container.id === lr.dataset.id) {
      line.className = 'in';
      line.style.top = (r.top - hr.top) + 'px';
      line.style.height = r.height + 'px';
    } else {
      line.className = '';
      line.style.height = '';
      line.style.top = ((zone === 'after' ? r.bottom : r.top) - hr.top - 1) + 'px';
    }
    host.appendChild(line);
  };
  const up = () => {
    document.body.classList.remove('dragging');
    $('#ghost').style.display = 'none';
    line.remove();
    document.removeEventListener('pointermove', at);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    const d = layerDrag; layerDrag = null;
    if (!d || !d.drop || !d.moved) return;
    let k = 0;
    edit(() => { k = moveMany(d.ids, d.drop.container, d.drop.index); });
    if (d.ids.length > 1) toast(k ? `${k} element${k === 1 ? '' : 's'} moved` : 'They do not fit there');
  };
  try { e.target.setPointerCapture(e.pointerId); } catch (_) { }
  document.addEventListener('pointermove', at);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

/* ================================================================ pages */
/* ============================================================ media library
   A grid modal rather than a rail panel: a 272px panel fits one card per row,
   which is no way to look at images. `mediaModal` manages the library, and
   `mediaPicker` (on the ask layer) is the same grid used to answer "which image?".
   Both draw their cards from `mediaCards`, so they cannot drift. */
function mediaCards(list, use, attr) {
  return list.map(a => `<div class="mitem">
    <button class="mcard" ${attr}="${a.id}" title="${esc(a.name)}">
      <span class="mthumb"><img src="${a.url}" alt=""></span>
      <span class="mname">${esc(a.name)}</span>
      <span class="msub">${kb(a.size)}${a.w ? ` · ${a.w}×${a.h}` : ''}${use[a.id] ? ` · used ${use[a.id]}×` : ' · unused'}</span>
    </button>
    <button class="mdel" type="button" data-del="${a.id}" title="Delete from the library"
      aria-label="Delete ${esc(a.name)} from the library">${svg('trash', 12)}</button>
  </div>`).join('');
}

/* Takes a file into the library. Shared by every upload entry point. */
async function mediaTake(file) {
  if (!file || !/^image\//.test(file.type)) { toast('That is not an image file'); return null; }
  if (file.size > 6e6 && !await askConfirm('That is a large image',
    `This file is <b>${(file.size / 1048576).toFixed(1)} MB</b>. Large images slow the page down.`,
    { ok: 'Add anyway', danger: false })) return null;
  const id = await assetAdd(file);
  if (!id) return null;
  const got = AS.mem.get(id);
  writeNow();
  toast(`${file.name} — ${kb(got && got.size || file.size)} optimized${got && got.w ? `, ${got.w} × ${got.h}` : ''}`);
  return id;
}
function mediaChooseFiles(after) {
  const fi = document.createElement('input');
  fi.type = 'file'; fi.accept = 'image/*'; fi.multiple = true;
  fi.onchange = async () => { for (const f of fi.files) await mediaTake(f); after(); };
  fi.click();
}

function mediaModal() {
  if (editing.on) exitEdit();
  const draw = () => {
    const use = assetUsage();
    const list = [...AS.mem.values()];
    const orphans = list.filter(a => !use[a.id]).length;
    openModal('Media library', list.length
      ? `<div class="mgrid wide">${mediaCards(list, use, 'data-use')}</div>`
      : `<div class="empty" style="padding:28px 8px">Nothing here yet.<br><br>

      `<span class="note" style="margin:0;flex:1;text-align:left">${list.length

        : 'Stored in this browser'}</span>

       <button class="btn" id="mmUp">${svg('image', 13)} Upload</button>

/* one cell of the items table, per field type */
function cmsCell(col, it, f) {
  const v = it.values[f.id] ?? '';
  const k = `${it.id}|${f.id}`;
  if (f.type === 'image') {
    const a = /^asset:(\w+)$/.test(String(v)) && AS.mem.get(String(v).slice(6));
    return `<button class="cmsimg" data-vimg="${k}" title="Choose from the library">
      ${a ? `<img src="${a.url}" alt="">` : `<span>Choose…</span>`}</button>`;
  }
  if (f.type === 'bool') return `<input type="checkbox" data-v="${k}"${v ? ' checked' : ''}>`;
  if (f.type === 'ref') {
    const to = f.ref ? findCollection(f.ref) : null;
    if (!to) return `<span class="rowmeta">Pick a collection for this field</span>`;
    /* by title, because an item id is not something anyone recognises. Drafts are listed:
       you relate a post to an author while the author is still being written. */
    return `<select class="ctl" data-v="${k}" style="font-size:var(--fs-2)">
        <option value=""${v ? '' : ' selected'}>— none —</option>
        ${to.items.map(x => `<option value="${esc(x.id)}"${x.id === v ? ' selected' : ''}>${esc(itemTitle(to, x) || x.slug)}</option>`).join('')}
      </select>`;
  }
  if (f.type === 'rich') return `<textarea class="ctl" data-v="${k}" rows="2" style="font-size:var(--fs-2)">${esc(v)}</textarea>`;
  const type = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
  return `<input class="ctl" type="${type}" data-v="${k}" value="${esc(v)}" style="font-size:var(--fs-2)">`;
}

/* The frame renders at its breakpoint's width and is scaled to fit whatever the
   panels leave. Everything the drag and selection code measures lives *inside* the
   iframe, so it keeps working in unscaled document coordinates — only the three
   places that cross the boundary need the factor, and `zoomK` is what they read. */
let zoomK = 1;
function layoutCanvas() {
  const wrap = $('#frameWrap'), cv = $('#canvas');
  if (!wrap || !cv) return;
  if (document.body.classList.contains('preview')) {
    /* preview is the real thing at real size — no frame, no scale */
    zoomK = 1;
    wrap.style.width = ''; cv.style.width = ''; cv.style.height = '';
    cv.style.transform = '';
    return;
  }
  const target = canvasWidth(state.ui.dev, state.meta.maxWidth);
  const stage = $('#stage');
  /* the stage's own padding is 16px a side; clientWidth already excludes any
     scrollbar, which is why it is read rather than the window */
  const avail = Math.max(120, stage.clientWidth - 32);
  const k = zoomK = zoomFor(state.ui.zoom, target, avail);
  wrap.style.width = Math.round(target * k) + 'px';
  cv.style.width = target + 'px';
  /* the wrap's height comes from flex and does not depend on the iframe, so this
     is not circular: the iframe is made tall enough that scaling fills the wrap */

/* One decision, in one place: whether a build carries image variants. The page that
   promises a srcset and the writer that satisfies it both go through here, so they cannot
   disagree about which files exist. Inlining is excluded on purpose — five copies of every
   image inside a single self-contained file is worse than not trying. */
const withVariants = (ctx, mode) => ({ ...ctx, variants: mode === 'files' });

/* Fetch the faces once per export run and keep them: several pages want the same files, and
   a zip of twelve pages should not ask Google twelve times. `null` means it could not be done
   — offline, or a request refused — and the caller falls back to linking, because a page that
   silently ships no font at all is worse than a page with a third-party request.

   `fonts.gstatic.com` serves woff2 with a permissive CORS header, so this works from the
   browser; the css2 endpoint does too. Both are checked at runtime rather than assumed. */
let fontPack = undefined;
async function selfHostedFonts() {
  if (fontPack !== undefined) return fontPack;
  const href = gfontsHref();
  if (!href) return (fontPack = null);            // nothing but system fonts in use
  try {
    const css = await (await fetch(href)).text();
    const faces = parseFontCss(css);
    if (!faces.length) return (fontPack = null);
    const files = [];
    for (const f of faces) {
      const r = await fetch(f.url);
      if (!r.ok) return (fontPack = null);
      files.push({ path: fontFile(f), blob: await r.blob() });
    }
    fontPack = { css: fontFaceCss(faces, fontFile), files };
  } catch { fontPack = null; }
  return fontPack;
}

async function exportPage(pg, mode, ctx = {}) {
  /* only the separate-files export: a single self-contained file has nowhere to put a woff2,
     and inlining four of them as base64 is a worse trade than one request to Google */
  const pack = mode === 'files' && state.meta.selfHostFonts ? await selfHostedFonts() : null;
  const raw = buildPage(pg, { ...withVariants(ctx, mode), fontCss: pack ? pack.css : '' });
  return mode === 'files' ? assetsToPaths(raw, ctx.rel || '') : await assetsToData(raw);
}

/* Hand over an asset and every downscaled variant a page asked for. Shared by the two
   single-page download buttons, which used to write only the originals. */
async function writeAssetsFor(html, download) {
  for (const a of assetsUsedIn(html)) {
    if (!a.blob) continue;
    if (await download(assetFile(a).replace(/^assets\//, ''), a.blob, a.type) === false) return false;
  }
  for (const { a, w } of assetVariantsIn(html)) {
    const b = await variantBlob(a, w);
    if (!b) continue;
    if (await download(assetVariantFile(a, w).replace(/^assets\//, ''), b, variantType(a)) === false) return false;
  }
  return true;
}


/* Saving a file: hosted viewers mediate it through the downloads capability,
   a plain browser (or the local file) uses an object URL. Same code both ways. */
let dlNs;
async function saveHost() {
  if (dlNs !== undefined) return dlNs;
  dlNs = null;
  try { if (typeof claude !== 'undefined' && claude.use) dlNs = await claude.use('downloads'); } catch (e) { dlNs = null; }
  return dlNs;
}
async function download(name, text, type = 'text/html;charset=utf-8') {
  const ns = await saveHost();
  if (ns) {
    try { await ns.save({ filename: name, data: text }); toast('Saved ' + name); return true; }
    catch (err) {
      const c = err && err.code;
      if (c === 'declined') { toast('Save cancelled'); return false; }
      if (c === 'extension_not_enabled') {
        try {
          await ns.save({ filename: name.replace(/\.html?$/, '') + '.txt', data: text });
          toast('Saved as .txt — rename it to .html'); return true;
        } catch (e2) { toast('Saving is blocked here — use Copy HTML'); return false; }
      }
      if (c === 'too_large') { toast('Too large to save — use Copy HTML'); return false; }
      if (c === 'rate_limited') { toast('One save at a time — try again'); return false; }
      /* anything else: fall through to the object-URL path */
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
    toast('Downloaded ' + name);
    return true;
  } catch (e) { toast('Download blocked here — use Copy HTML'); return false; }
}

/* ================================================================ modal */
const dialogFocusables = box => $$('button:not([disabled]):not([hidden]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])', box)
  .filter(el => !el.closest('[hidden]'));
function trapDialogKey(e, box, close) {
  if (e.key === 'Escape') {
    e.preventDefault(); e.stopPropagation(); close(); return true;
  }
  if (e.key !== 'Tab') return false;
  const list = dialogFocusables(box);
  if (!list.length) { e.preventDefault(); box.focus(); return true; }
  const first = list[0], last = list[list.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  return true;
}

let modalReturnFocus = null;
/* Only the top dialog may be exposed to the accessibility tree. The confirmation
   layer intentionally sits above the larger project/publish dialog, so opening it
   makes that underlying dialog inert until the confirmation resolves. */
function syncDialogLayers() {
  const modalOpen = !$('#modal').hidden;
  const askOpen = !$('#ask').hidden;

  const lock = (el, on) => {
    if (on) { el.setAttribute('inert', ''); el.setAttribute('aria-hidden', 'true'); }
    else { el.removeAttribute('inert'); el.removeAttribute('aria-hidden'); }
  };
  lock(app, modalOpen || askOpen);
  lock(modal, modalOpen && askOpen);
}
function openModal(title, bodyHtml, footHtml, size) {

/* ---- asking for something ---------------------------------------------
   Replaces native prompt() and confirm(). Those were unstyled OS chrome in the
   middle of an art-directed tool, and — the reason this had to change — sandboxed
   iframes refuse them outright, so naming a class or a colour silently did
   nothing in an embedded editor.

let askDone = null;

function askOpen(title, bodyHtml, okLabel, danger) {
  askClose(null);                                     // never stack two asks
  askReturnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
  $('#askTitle').textContent = title;
  $('#askBody').innerHTML = bodyHtml;

     only exit is labelled Close rather than Cancel */

      toast('Selected — press ⌘C to copy');
    }
  });
  $('#exSeo').addEventListener('click', async () => {
    /* the button is disabled without a Site URL, so this is a belt-and-braces guard:
       a sitemap with no domain is worse than no sitemap */
    if (!state.meta.baseUrl) {
      toast('Add a Site URL in Project settings first');
      return;
    }
    if (await download('sitemap.xml', sitemapXml(), 'application/xml') === false) return;
    await download('robots.txt', robotsTxt(), 'text/plain');
  });
  /* The whole site as one archive: real folder paths, the images beside them, and
     the SEO files. This is the only export that can honour a nested detail page,
     since a browser download saves flat. */
  const buildSite = async () => {
    const files = [];
    /* fetched once for the whole archive, and null when it could not be — offline, or a
       request refused — in which case every page links Google as it always did */
    const pack = state.meta.selfHostFonts ? await selfHostedFonts() : null;
    if (pack) pack.files.forEach(f => files.push({ path: f.path, data: f.blob }));
    for (const step of sitePlan()) {
      /* a zip is separate files by definition, so it always carries variants */
      if (step.kind === 'page') files.push({ path: step.path, data: assetsToPaths(buildPage(step.target.pg, { ...withVariants(step.target, 'files'), fontCss: pack ? pack.css : '' }), step.target.rel) });
      else if (step.kind === 'content') files.push({ path: step.path, data: contentJson(assetPath) });
      else if (step.kind === 'sitemap') files.push({ path: step.path, data: sitemapXml() });
      else if (step.kind === 'robots') files.push({ path: step.path, data: robotsTxt() });
    }
    /* every image any page references, once, at the path those pages point to */
    const seen = new Set();
    let every = '';
    for (const t of exportTargets()) every += buildPage(t.pg, withVariants(t, 'files'));
    for (const a of assetsUsedIn(every)) seen.add(a.id);
    for (const { a, w } of assetVariantsIn(every)) {
      const b = await variantBlob(a, w);
      if (b) files.push({ path: assetVariantFile(a, w), data: b });
    }
    for (const id of seen) {
      const a = AS.mem.get(id);
      if (a && a.blob) files.push({ path: assetFile(a), data: a.blob });
    }
    return files;
  };
  $('#exZip').addEventListener('click', async () => {
    /* innerHTML, not textContent: the label carries an inline svg, and restoring a
       textContent snapshot silently stripped the icon for the rest of the session. */
    const btn = $('#exZip'), was = btn.innerHTML;
    btn.disabled = true; btn.textContent = 'Building…';
    try {
      const files = await buildSite();
      const blob = await makeZip(files);
      const name = (slugify(state.meta.name) || 'site') + '.zip';
      if (await download(name, blob, 'application/zip') !== false) {
        toast(`${files.length} file${files.length === 1 ? '' : 's'} · ${(blob.size / 1024).toFixed(0)} KB`);
      }
    } catch (e) {
      toast('Could not build the archive');
    } finally { btn.disabled = false; btn.innerHTML = was; }
  });
  /* The footer says what the committed action will actually produce, so the count
     is not hidden inside a tooltip on the button. */
  const foot = $('#exFoot');
  if (foot) {
    const n = sitePlan().length;
    const imgs = new Set();
    /* the archive is separate files by definition, so it carries the variants too and the
       count has to include them — it said "1 image" for an archive holding seven */
    let every = '';
    for (const t of exportTargets()) every += buildPage(t.pg, withVariants(t, 'files'));
    for (const a of assetsUsedIn(every)) imgs.add(a.id);
    const nv = assetVariantsIn(every).length;
    const nImg = imgs.size + nv;
    foot.innerHTML = `The archive holds <b>${n + nImg}</b> file${n + nImg === 1 ? '' : 's'}`
      + ` — ${targets.length} page${targets.length === 1 ? '' : 's'}`
      + `${nImg ? `, ${nImg} image file${nImg === 1 ? '' : 's'}` : ''}`
      + `${collections().length ? ', content.json' : ''}`
      + `${state.meta.baseUrl ? ', sitemap and robots' : ''}.`;
  }
  const exc = $('#exContent');
  if (exc) exc.addEventListener('click', () => download('content.json', contentJson(assetPath), 'application/json'));
  $('#exJson').addEventListener('click', backupJson);
  const inContent = $('#exContentIn');
  if (inContent) inContent.addEventListener('click', () => {
    const fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.json,application/json';
    fi.onchange = () => {
      const f = fi.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        let rep = null;
        /* inside `edit` so the whole file is one undo step: an import that landed forty
           items should come back out in one press, not forty */
        try { edit(() => { rep = contentImport(JSON.parse(rd.result)); }); } catch (e) { rep = null; }
        if (!rep) { toast('That file has no collections in it — expected a content.json'); return; }
        render();
        /* the counts, because an upsert is invisible otherwise: nothing was deleted and you
           cannot tell what landed by looking at the CMS */
        const bits = [];
        if (rep.collections.added) bits.push(`${rep.collections.added} new collection${rep.collections.added === 1 ? '' : 's'}`);
        if (rep.fields.added) bits.push(`${rep.fields.added} new field${rep.fields.added === 1 ? '' : 's'}`);
        if (rep.items.added) bits.push(`${rep.items.added} item${rep.items.added === 1 ? '' : 's'} added`);
        if (rep.items.updated) bits.push(`${rep.items.updated} updated`);
        toast(bits.length ? bits.join(' · ') : 'Nothing in that file was new');
        /* a note is something the author has to act on, so it gets a dialog rather than a
           toast that disappears */
        if (rep.notes.length) {
          askConfirm('Imported, with notes',
            '<ul style="margin:0;padding-left:18px">' + rep.notes.map(n => `<li>${esc(n)}</li>`).join('') + '</ul>',
            { ok: 'Got it', danger: false });
        }
      };
      rd.readAsText(f);
    };
    fi.click();
  });

  $('#exImport').addEventListener('click', () => {
    const fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.json,application/json';
    fi.onchange = () => {
      const f = fi.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        let d = null;
        try { d = migrate(JSON.parse(rd.result)); } catch (e) { d = null; }
        if (!d) { toast('That file is not a Pagecraft project this build can open'); return; }
        hist.u.push(clone(doc()));
        state.meta = { ...state.meta, ...d.meta }; state.header = d.header || []; state.footer = d.footer || [];
        state.pages = d.pages; state.cur = 0; selSet([]);
        closeModal(); render(); writeNow(); toast('Project imported');
      };
      rd.readAsText(f);
    };
    fi.click();
  });
}

}
function wireUnit(id, get, set) {
  const num = $('#' + id), unit = $('#' + id + 'U');

}

/* ---- find and replace -----------------------------------------------
   Grouped by where a hit lives, because "which page was that on" is the question
   being asked. A row is a button: it switches page or global region, selects the
   element and scrolls to it. Replace is one action over the whole project with undo
   behind it, since a per-hit replace list goes stale the moment the first one lands. */
let findState = { q: '', to: '', ci: true };
/* ---- the bind sheet -------------------------------------------------
   One dialog that shows the whole mapping and commits it in one go. Binding used to
   be one control at a time — select, open Content, click the badge, pick a field,
   repeat — which was about fifteen interactions for a five-field card, and there was
   nowhere to see what was bound to what. */
function bindModal(rootId) {
  if (editing.on) exitEdit();
  const sc = bindScope(rootId);
  if (!sc) { toast('Point this at a collection first'); return; }
  const col = sc.col;
  const slots = bindSlots(rootId);
  if (!slots.length) {
    toast('Nothing inside this to bind — add a Heading, an Image or a text block');
    return;
  }
  let map = guessBindings(slots, col);
  const key = s => s.nodeId + '|' + s.key;

  const draw = () => {
    const set = Object.values(map).filter(Boolean).length;
    $('#bsCount').innerHTML = set
      ? `<b>${set}</b> of ${slots.length} bound to <b>${esc(col.name)}</b>`
      : `Nothing bound yet. ${slots.length} places could take a value.`;
    $('#bsBody').innerHTML = `<table class="cmst"><thead><tr>
        <th>Element</th><th style="width:150px">Its field</th><th style="width:230px">Takes its value from</th>
      </tr></thead><tbody>${slots.map((s, i) => `<tr>
        <td><b style="font-size:var(--fs-2)">${esc(s.element)}</b><br><small style="font-family:var(--label);font-size:var(--fs-1);color:var(--text-3)">${esc(DEF[s.type].label)}</small></td>
        <td>${esc(s.label)}</td>
        <td><select class="ctl" data-b="${i}">
          <option value="">— not bound —</option>
          ${/* `fieldPaths`, so a reference can be read through here as well as in the badge —
                 a sheet that could only offer this collection's own fields would make the
                 whole-card flow the one place a reference was useless */''}
          ${fieldPaths(col).map(f => `<option value="${esc(f.path)}"${map[key(s)] === f.path ? ' selected' : ''}>${esc(f.label)} · ${f.type}</option>`).join('')}
        </select></td>
      </tr>`).join('')}</tbody></table>`;
    $$('#bsBody select').forEach(el => el.addEventListener('change', () => {
      map[key(slots[+el.dataset.b])] = el.value;
      draw();
    }));
  };

  openModal(`Bind to ${col.name}`, `
    <div class="note" style="margin:0 0 var(--gap-2)">Each row takes its value from a field, once
      per item. A field can be used twice if you want it twice. Nothing is written until you commit.</div>
    <div id="bsBody"></div>`, `
    <span class="note" id="bsCount" style="margin:0;flex:1;text-align:left"></span>
    <button class="btn" id="bsGuess">Suggest again</button>
    <button class="btn" id="bsNone">Clear all</button>
    <button class="btn primary" id="bsOk">Bind</button>`, 'lg');

  $('#bsGuess').addEventListener('click', () => { map = guessBindings(slots.map(s => ({ ...s, current: '' })), col); draw(); });
  $('#bsNone').addEventListener('click', () => { slots.forEach(s => { map[key(s)] = ''; }); draw(); });
  $('#bsOk').addEventListener('click', () => {
    let n = 0;
    edit(() => { n = applyBindings(map); });
    closeModal(); render();
    toast(n ? `${n} binding${n === 1 ? '' : 's'} set` : 'Nothing changed');
  });
  draw();
}

function findModal() {
  if (editing.on) exitEdit();
  openModal('Find and replace', `
    <div class="fgrid" style="margin-bottom:var(--gap-2)">
      <div class="f"><label>Find</label>
        <input class="ctl" id="fdQ" value="${esc(findState.q)}" placeholder="Text on any page, or in the CMS" autocomplete="off"></div>
      <div class="f"><label>Replace with</label>
        <input class="ctl" id="fdTo" value="${esc(findState.to)}" placeholder="Leave empty to delete it" autocomplete="off"></div>
    </div>
    <div class="tog-row" style="margin-bottom:var(--gap-2)"><span>Match case</span>
      <button class="sw-tog${findState.ci ? '' : ' on'}" id="fdCase"><i></i></button></div>
    <div id="fdOut"></div>`, `
    <span class="note" id="fdCount" style="margin:0;flex:1;text-align:left"></span>
    <button class="btn danger" id="fdRep">Replace all</button>
    <button class="btn primary" id="fdDone">Close</button>`);

  const q = $('#fdQ'), to = $('#fdTo'), out = $('#fdOut'), count = $('#fdCount'), rep = $('#fdRep');

  const draw = () => {
    findState.q = q.value; findState.to = to.value;
    const hits = searchAll(findState.q, { caseSensitive: !findState.ci });
    const total = searchCount(hits);
    rep.disabled = !total;
    count.innerHTML = !findState.q
      ? 'Searches every page, both global regions and the CMS.'
      : total
        ? `<b>${total}</b> occurrence${total === 1 ? '' : 's'} in ${hits.length} place${hits.length === 1 ? '' : 's'}`
        : 'Nothing found.';
    if (!findState.q) { out.innerHTML = '<div class="empty">Type to search.</div>'; return; }
    if (!hits.length) { out.innerHTML = `<div class="empty">No match for <b>${esc(findState.q)}</b>.</div>`; return; }
    /* group in the order searchAll walked, so the list reads header → pages → footer → CMS */
    const groups = [];
    hits.forEach(h => {
      const key = h.where + ':' + h.pageName;
      let g = groups.find(x => x.key === key);
      if (!g) groups.push(g = { key, name: h.pageName, where: h.where, rows: [] });
      g.rows.push(h);
    });
    out.innerHTML = groups.map((g, gi) => `
      <div class="xlab"${gi ? ' style="margin-top:var(--gap-3)"' : ''}>${esc(g.name)}${g.where === 'cms' ? ' · CMS' : ''}</div>
      ${g.rows.map(h => `<button class="hitrow" data-h="${hits.indexOf(h)}">
        <span class="hn">${esc(h.element)}</span>
        <span class="hf">${esc(h.field)}</span>
        <span class="hs">${esc(h.snippet)}</span>
        ${h.hits > 1 ? `<span class="hc">${h.hits}×</span>` : ''}
      </button>`).join('')}`).join('');

    $$('.hitrow', out).forEach(b => b.addEventListener('click', () => {
      const h = hits[+b.dataset.h];
      closeModal();
      /* a hit goes wherever it is edited: an element on the canvas, an item in the
         CMS dialog, a page's own fields in the Pages panel, the project name in
         Project settings */
      if (h.where === 'cms') { cmsModal(h.colId); return; }
      if (h.where === 'project') { projectModal(); return; }
      state.ui.mode = h.where === 'page' ? 'page' : h.where;
      if (h.where === 'page') state.cur = h.page;
      render();
      if (h.type === 'meta') { showPanel('pages'); selSet([]); return; }
      select(h.nodeId, { scroll: true });
    }));
  };

  const live = dbounce(draw, 140);
  q.addEventListener('input', live);
  to.addEventListener('input', () => { findState.to = to.value; });
  $('#fdCase').addEventListener('click', () => {
    findState.ci = !findState.ci;
    $('#fdCase').classList.toggle('on', !findState.ci);
    draw();
  });
  rep.addEventListener('click', async () => {
    const n = searchCount(searchAll(findState.q, { caseSensitive: !findState.ci }));
    if (!n) return;
    if (!await askConfirm('Replace across the whole project?',
      `<b>${n}</b> occurrence${n === 1 ? '' : 's'} of “${esc(findState.q)}” become “${esc(findState.to) || '<i>nothing</i>'}”, `
      + 'on every page, in both global regions and in the CMS. ⌘Z undoes it in one step.',
      { ok: 'Replace all ' + n, danger: true })) return;
    let did = 0;
    edit(() => { did = replaceAll(findState.q, findState.to, { caseSensitive: !findState.ci }); });
    render();
    toast(`Replaced ${did} occurrence${did === 1 ? '' : 's'}`);
    draw();
  });
  $('#fdDone').addEventListener('click', closeModal);
  draw();
  q.focus(); q.select();
}

function helpModal() {
  /* This is now the only place the shortcuts are written down — the inspector's
     empty state used to repeat a shorter list, and that panel no longer appears
     when nothing is selected. */
  const K = [
    ['Move through elements', '↑ ↓'], ['Select parent · first child', '← →'],
    ['Add to the selection', '⌘click'], ['Select a range, in the Navigator', '⇧click'],
    ['Reorder among siblings', '⇧↑ ⇧↓'], ['Edit text in place', '↵ or double-click'],
    ['Copy · cut · paste', '⌘C · ⌘X · ⌘V'],
    ['Copy · paste the <b>styling</b>', '⌘⇧C · ⌘⇧V'], ['Duplicate', '⌘D'], ['Delete', '⌫'],
    ['Undo / redo', '⌘Z · ⌘⇧Z'], ['Back to one element, then the parent', 'esc'],
    ['Find and replace, across the project', '⌘F'],
    ['Preview', '⌘P'], ['Export HTML', '⌘E'],
    ['Bold / italic while editing', '⌘B · ⌘I'], ['Insert link while editing', '⌘K']
  ];
  openModal('Keyboard & tips', `
    <table class="kt">${K.map(([a, b]) => `<tr><td>${a}</td><td><span class="kbd">${b}</span></td></tr>`).join('')}</table>
    <div class="note" style="margin-top:var(--gap-3);line-height:1.7">
      <b style="color:var(--text-2)">Structure</b> — Section → Row → Column → content. Missing wrappers are
      created for you.<br>
      <b style="color:var(--text-2)">Responsive</b> — pick Tablet or Mobile in the top bar and what you change
      becomes an override (max-width 1024px / 767px). A green badge marks one; click it to clear.<br>
      <b style="color:var(--text-2)">Global header &amp; footer</b> — shared by every page, edited in place. Hover the
      region and press <b>Edit header</b> or <b>Edit footer</b>; <b>Done</b> brings you back.<br>
      <b style="color:var(--text-2)">Autosave</b> — stored in this browser. Export → project JSON for a backup.
    </div>`, `<button class="btn primary" id="hOk">Got it</button>`);
  $('#hOk').addEventListener('click', closeModal);
}

/* ============================================================= keyboard */
function hotkey(e) {
  /* the ask layer owns the keyboard while it is up — its own handler takes Enter
     and Escape, and without this Escape would also walk the canvas selection */
  if (askOpenNow()) return;
  const t = e.target, tag = (t.tagName || '').toLowerCase();
  /* A dialog is its own keyboard scope. Buttons inside it used to leak Enter, arrows,
     Delete and command shortcuts into the canvas; Escape could close the dialog and then
     walk the selection as the same event continued bubbling. */
  const modalTarget = t.closest && t.closest('#modal');
  if (!$('#modal').hidden || modalTarget) {
    if (e.key === 'Escape') { e.preventDefault(); closeModal(); }
    return;
  }
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || (t.isContentEditable && !editing.on)) return;
  const meta = e.metaKey || e.ctrlKey;
  /* some synthetic and assistive input stacks omit `key`; `code` still names
     the physical key, which is enough for the navigation set */
  const k = (e.key || '').toLowerCase() || (e.code || '').toLowerCase();
  if (meta && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (meta && k === 'y') { e.preventDefault(); redo(); return; }
  if (meta && k === 'd') {
    e.preventDefault();
    const ids = selIds();
    if (ids.length && canStructure()) edit(() => ids.length > 1 ? dupMany(ids) : dupNode(ids[0]));
    return;
  }
  /* Styles first: the ⌘C and ⌘V branches below never checked shift, so without this
     ⌘⇧C would copy the element instead of its look. */
  if (meta && e.shiftKey && k === 'c') {
    if (!state.ui.sel) return;
    e.preventDefault();
    copyStyles(state.ui.sel);
    toast('Styles copied from ' + styleClip.from);
    renderRight();
    return;
  }
  if (meta && e.shiftKey && k === 'v') {
    if (!styleClip.css) { toast('No styles copied yet — ⌘⇧C first'); return; }
    const ids = selIds();
    if (!ids.length) return;
    e.preventDefault();
    let n = 0;
    edit(() => { n = pasteStylesMany(ids); });
    toast(n > 1 ? `Styles pasted onto ${n} elements` : n ? 'Styles pasted' : 'Nothing to paste onto');
    return;
  }
  const oneDeep = ' — the clipboard holds one element at a time';
  if (meta && k === 'c') {
    if (state.ui.sel && copyNode(state.ui.sel)) {
      e.preventDefault();
      toast(DEF[locate(state.ui.sel).node.type].label + ' copied' + (multiOn() ? oneDeep : ''));
    }
    return;
  }
  if (meta && k === 'x') {
    if (state.ui.sel && copyNode(state.ui.sel)) {
      e.preventDefault();
      const label = DEF[locate(state.ui.sel).node.type].label, many = multiOn();
      edit(() => delNode(state.ui.sel));
      toast(label + ' cut' + (many ? oneDeep : ''));
    }
    return;
  }
  if (meta && k === 'v') {
    if (!clip.node) return;
    e.preventDefault();
    let made = null;
    edit(() => { made = pasteNode(state.ui.sel); if (made) selSet([made.id]); });
    toast(made ? DEF[made.type].label + ' pasted' : 'A ' + DEF[clip.node.type].label + ' cannot go there');
    return;
  }
  if (meta && k === 'f') { e.preventDefault(); findModal(); return; }
  if (meta && k === 'p') {
    e.preventDefault();
    if (HOST_FEATURES.preview === 'wordpress' && WP.previewUrl) window.open(WP.previewUrl, '_blank', 'noopener');
    else togglePreview();
    return;
  }
  if (meta && k === 'e') {
    e.preventDefault();
    if (HOST_FEATURES.projectExport) exportModal();
    else if (IS_WORDPRESS) reviewPanel();
    else reviewModal();
    return;
  }
  if (meta && k === 's') { e.preventDefault(); save(); toast('Saved locally'); return; }
  if (!meta && (k === 'backspace' || k === 'delete')) {
    const ids = selIds();
    if (ids.length && canStructure()) { e.preventDefault(); edit(() => ids.length > 1 ? delMany(ids) : delNode(ids[0])); }
    return;
  }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
    if (e.shiftKey && state.ui.sel && (k === 'arrowup' || k === 'arrowdown')) {
      e.preventDefault();
      const dir = k === 'arrowup' ? -1 : 1;
      /* with meta as well, all the way — the same pair of keys, one step or the whole way,
         which is how every list in every editor behaves */
      if (meta) { runAct(dir < 0 ? 'first' : 'last', selIds()); return; }
      const ids = selIds();
      if (canStructure()) edit(() => ids.length > 1 ? nudgeMany(ids, dir) : nudge(ids[0], dir));
      return;
    }
    if (meta) return;
    e.preventDefault();
    const cur = state.ui.sel;
    let next = null;
    if (k === 'arrowup') next = step(cur, -1);
    else if (k === 'arrowdown') next = step(cur, 1);
    else if (k === 'arrowleft') next = parentOf(cur);
    else next = firstChildOf(cur) || step(cur, 1);
    if (next) select(next, { scroll: true });
    return;
  }
  if (k === 'enter' && state.ui.sel && !meta) {
    const n = locate(state.ui.sel);
    if (n && DEF[n.node.type].edit) { e.preventDefault(); enterEdit(state.ui.sel); return; }
  }
  if (k === 'escape') {
    if (IS_WORDPRESS && !$('#rightAux')?.hidden) { closeRightSurface(); return; }
    /* one step per press: back to a single element first, then up the tree.
       Doing both at once would lose the set before you could see what you had. */
    if (multiOn()) { select(state.ui.sel); return; }
    if (state.ui.sel) { const h = locate(state.ui.sel); select(h && h.parent ? h.parent.id : null); }
  }
}
document.addEventListener('keydown', hotkey);

/* ================================================================= init */
function bindTop() {
  const sitesButton = $('#sitesBtn');
  const accountButton = $('#accountBtn');
  const accountPop = $('#accountPop');
  const accountDialog = () => {
    const open = accountPop.hidden;
    accountPop.hidden = !open;
    accountButton.setAttribute('aria-expanded', String(open));
  };
  if (SRV && HOST_FEATURES.sites) {
    sitesButton.hidden = false;
    sitesButton.addEventListener('click', () => { location.href = '/'; });
    if (SRV.user) {
      const accountName = String(SRV.user.name || SRV.user.email || 'Pagecraft');
      const initials = accountName.trim().split(/\s+/).slice(0, 2).map(part => part[0] || '').join('').toUpperCase();
      $('#accountInitials').textContent = initials || 'PC';
      $('#accountEmail').textContent = SRV.user.email || accountName;
      accountButton.hidden = false;
      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape' || accountPop.hidden) return;
        accountPop.hidden = true;
        accountButton.setAttribute('aria-expanded', 'false');
        accountButton.focus();
      });
    }
  }
  $$('#devSeg button').forEach(b => b.addEventListener('click', () => setDev(b.dataset.dev)));
  $('#undoBtn').addEventListener('click', undo);
  $('#redoBtn').addEventListener('click', redo);
  if (HOST_FEATURES.preview === 'wordpress' && WP.previewUrl) {
    $('#previewBtn').title = 'Preview this WordPress page';
    $('#previewBtn').setAttribute('aria-label', 'Preview this WordPress page');
    $('#previewBtn').addEventListener('click', () => window.open(WP.previewUrl, '_blank', 'noopener'));
  } else {
    $('#previewBtn').addEventListener('click', togglePreview);
  }
  const primary = $('#exportBtn');
  const primaryLabel = $('#publishLabel');
  if (IS_WORDPRESS) {
    const returnLabel = WP.returnLabel || 'Save and return to WordPress Pages';
    primary.title = returnLabel;
    primary.setAttribute('aria-label', returnLabel);
    primaryLabel.textContent = 'Done';
    primary.addEventListener('click', () => finishWordPress(primary));
    $('#reviewBtn').addEventListener('click', reviewPanel);
  } else if (SRV) {
    if (SRV.role === 'owner') {
      primary.title = 'Publish this draft';
      primary.setAttribute('aria-label', 'Publish this draft');
      primaryLabel.textContent = 'Publish';
      primary.addEventListener('click', publishModal);
    } else {
      /* Publication includes warning acceptance and target promotion. A content collaborator
         may review and export, but must not be offered an action the API will refuse. */
      primary.hidden = true;
    }
    $('#reviewBtn').addEventListener('click', publishModal);
  } else {
    primary.title = 'Export HTML (⌘E)';
    primary.setAttribute('aria-label', 'Export HTML');
    primaryLabel.textContent = 'Export';
    primary.addEventListener('click', exportModal);
    $('#reviewBtn').addEventListener('click', exportModal);
  }
  wireShare();
  wireHistory();
  $('#helpBtn').addEventListener('click', helpModal);
  /* Extracted so anything can open a panel, not only a click on the rail — starting
     an empty site sends you to Add, which is the only thing left to do. */
  window.showPanel = t => {
    document.body.classList.add('library-focus');
    state.ui.tab = t;
    $$('#leftRail button[data-t]').forEach(x => x.classList.toggle('on', x.dataset.t === t));
    ['add', 'layers', 'pages', 'cms'].forEach(k => {
      const pane = $('#pane' + k[0].toUpperCase() + k.slice(1));
      if (pane) pane.hidden = k !== t;
    });
    renderPanelHead();
    renderCms();
    requestAnimationFrame(() => { layoutCanvas(); positionHud(); renderDim(); });
  };
  /* Add is the default panel and a content account has no Add. Pages is the right landing
     place: every site has one, and its title and description are content. */
  if (SRV && !canStructure()) showPanel('pages');
  $$('#leftRail button').forEach(b => b.addEventListener('click', () => {
    /* Media and Project open dialogs rather than swapping the panel, so they set
       neither `state.ui.tab` nor the `on` treatment — the panel behind them has not
       changed. Scoping the toggle to `[data-t]` is what keeps them out of it. */
    const dialog = { media: mediaModal, project: projectModal, account: accountDialog }[b.dataset.act];
    if (dialog) { dialog(); return; }
    /* A second press on the active rail item dismisses the narrow drawer. Desktop
       keeps the stable workbench behavior. */
    if (matchMedia('(max-width:900px)').matches && b.dataset.t === state.ui.tab
      && document.body.classList.contains('library-focus')) {
      document.body.classList.remove('library-focus');
      requestAnimationFrame(() => { layoutCanvas(); positionHud(); renderDim(); });
      return;
    }
    showPanel(b.dataset.t);
  }));
  document.body.classList.toggle('library-focus', !state.ui.sel);
  window.addEventListener('resize', () => { layoutCanvas(); positionHud(); renderDim(); });
}

HOOKS.change = () => render();
HOOKS.save = () => save();
HOOKS.note = msg => toast(msg);

(async function boot() {
  applyHostFeatures();
  await assetsLoad();
  load();
  if (SRV && !IS_WORDPRESS) {
    lastCloudDocument = JSON.stringify(doc());
    saveState = 'ok';
  }
  await mountCanvas();
  bindTop();
  renderPalette();
  setDev(state.ui.dev);
  stamp(IS_WORDPRESS ? 'WordPress draft ready' : (SRV ? 'Draft ready' : 'Ready'), false);
})();
</script>
