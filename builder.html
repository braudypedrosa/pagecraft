function load() {
  /* Before anything draws, so the panels never flash into view. The default panel is Add,
     which a content account does not have — `boot()` sends it to Pages instead. */
  if (SRV && !canStructure()) document.body.classList.add('content-only');
  /* The server put the document in the page, so there is no asynchronous read. Adoption still
     runs: an older row follows the one migration chain, while a newer one fails closed with
     the upgrade instruction supplied by the shared host boundary. */
  if (SRV) {
    let d = null, loadError = null;
    if (IS_WORDPRESS && !SRV.doc) {
      blankProject(WP.page && WP.page.title || 'Untitled page');
      state.meta.name = WP.siteName || 'WordPress';
      applyWordPressDesignSettings();
      const initialTemplate = TEMPLATES.find(template => template.id === WP.initialTemplate);
      if (initialTemplate && initialTemplate.id !== 'blank') {
        state.pages = [];
        state.pages.push(pageFromTemplate(initialTemplate.id, WP.page && WP.page.title || initialTemplate.name));
      }
      state.pages[0].name = WP.page && WP.page.title || (initialTemplate ? initialTemplate.name : 'Untitled page');
      state.pages[0].slug = WP.page && WP.page.slug || slugify(state.pages[0].name) || 'page';
      return;
    }
    try { d = PC_UI.adoptHostDocument(SRV.doc); } catch (error) { loadError = error; }
    if (d) {
      state.meta = { ...state.meta, ...d.meta };
      if (!state.meta.tokens) state.meta.tokens = defaultTokens(state.meta);
      state.header = d.header || []; state.footer = d.footer || [];
      state.pages = d.pages;
      state.cur = rememberedPageIndex(state.pages);
      applyWordPressDesignSettings();
      return;
    }
    /* A document the server holds and this build cannot read is not a case to paper over
       with the demo site — that would look like the site had been replaced. Nor may the demo be
       saved: the first edit would put it on the server under the real site's version. */
    seed();
    loadBlocked = true;
    setTimeout(() => openModal('This site cannot be opened by this build', `
      <div class="alert"><b>The server holds a document this Pagecraft build cannot read.</b>
      <span>You are looking at the demo site, and nothing you do here will be saved. The site on the server is untouched.</span></div>
      <div class="note" style="margin-top:var(--gap-2)">${esc(loadError && loadError.message || 'Update this host to a matching Pagecraft build.')}</div>`,
      `<button class="btn primary" id="svOk">Understood</button>`) || $('#svOk').addEventListener('click', closeModal), 300);
    return;
  }
  let raw = null;
  try {
    raw = localStorage.getItem(LS);
    if (!raw) {                              // adopt a project saved before the rename
      const old = localStorage.getItem(LS_LEGACY);
      if (old) { raw = old; localStorage.setItem(LS, old); localStorage.removeItem(LS_LEGACY); }
    }
  } catch (e) { }
  if (!raw) { seed(); return; }
  let parsed = null;
  try { parsed = JSON.parse(raw); } catch (e) { }
  let d = null, loadError = null;
  try { d = PC_UI.adoptHostDocument(parsed); } catch (error) { loadError = error; }
  if (!d) {
    seed();
    /* the unreadable project is still in localStorage, and the first save would overwrite it */
    loadBlocked = true;
    if (loadError) setTimeout(() => openModal('Saved project cannot be opened by this build', `
      <div class="alert"><b>This browser holds a project this Pagecraft build cannot read.</b>
      <span>It was left untouched rather than loaded and possibly mangled. You are looking at the demo site, and nothing you do here will be saved.</span></div>
      <div class="note" style="margin-top:var(--gap-2)">${esc(loadError.message)}</div>`,
      `<button class="btn primary" id="nvOk">Understood</button>`) || $('#nvOk').addEventListener('click', closeModal), 300);
    return;
  }
  state.meta = { ...state.meta, ...d.meta };
  if (!state.meta.tokens) state.meta.tokens = defaultTokens(state.meta);
  state.header = d.header || []; state.footer = d.footer || [];
  state.pages = d.pages;
  state.cur = Math.min(d.cur || 0, d.pages.length - 1);
}


/* ================================================== asset store (IndexedDB)
   Images live as blobs in IndexedDB, not as data URIs inside the project
   JSON — that keeps localStorage small and lifts the hard 5 MB ceiling.
   A project references them as `asset:<id>`, resolved to a blob URL on the
   canvas and to a data URI (or a file path) at export time.               */
const AS = { db: null, mem: new Map(), ok: false };
/* `A_RE` and `assetFile` are the core's now — the server has to name an asset the same way
   this file does, and two copies of that rule is one copy too many. They arrive in scope with
   the rest of the core, which is why declaring them here again is `Identifier 'A_RE' has
   already been declared` and a dead app. The boot test says so by name. */

const idbReq = rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });

function idbOpen() {
  return new Promise(res => {
    let rq;
    try { rq = indexedDB.open('slate.assets', 1); } catch (e) { return res(null); }
    rq.onupgradeneeded = () => { if (!rq.result.objectStoreNames.contains('a')) rq.result.createObjectStore('a', { keyPath: 'id' }); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => res(null);
    rq.onblocked = () => res(null);
  });
}
const idbStore = (mode) => AS.db.transaction('a', mode).objectStore('a');

async function assetsLoad() {
  if (SRV) { AS.ok = true; return assetsLoadServer(); }
  AS.db = await idbOpen();
  AS.ok = !!AS.db;
  if (!AS.ok) return;
  let recs = [];
  try { recs = await idbReq(idbStore('readonly').getAll()) || []; } catch (e) { recs = []; }
  recs.forEach(r => { if (r && r.blob) AS.mem.set(r.id, { ...r, url: URL.createObjectURL(r.blob) }); });
}

/* Intrinsic size is measured here and stored with the record. It used to be
   measured by each caller and set on the in-memory copy only, so a reload dropped
   it — and it is what the export writes as width/height and what the review's
   `no-dimensions` check reads. */
/* On the server the bytes belong to the server, not to this browser: an image kept in one
   person's IndexedDB is an image every other person sees as a placeholder. So the upload goes
   over the wire and comes back as an id, and `AS.mem` records it with a URL pointing at the
   server — which keeps every existing reader of `AS.mem` working unchanged. */
async function assetAddServer(file) {
  let meta;
  try {
    meta = await HOST.assets.upload(file, file.name);
  } catch (e) {
    const why = e && e.payload;
    toast((why && (why.detail || why.error)) || (e && e.status
      ? `The server refused the image (${e.status})`
      : 'The upload did not reach the server. Try again.'), {tone:'error'});
    return null;
  }
  AS.mem.set(meta.id, {
    id: meta.id, name: meta.name, type: meta.mimeType, size: meta.size || file.size,
    w: meta.width, h: meta.height, tags: meta.tags || [], metadataVersion: meta.metadataVersion || 0, createdAt: meta.createdAt || null,
    usageKnown: meta.usageKnown === true && Number.isInteger(meta.usageCount),
    usageCount: Number.isInteger(meta.usageCount) ? meta.usageCount : null,
    canDelete: meta.usageKnown === true && Number.isInteger(meta.usageCount) && meta.canDelete === true,
    usedBy: Array.isArray(meta.usedBy) ? meta.usedBy : [],
    /* served by the editor's own route, so it needs the session the page already has */
    url: meta.url || (SRV.editorSessionToken ? URL.createObjectURL(file) : `/api/sites/${SRV.siteId}/assets/${meta.id}`)
  });
  return meta.id;
}

/* Every asset the server holds, so the canvas can resolve tokens that were uploaded by
   somebody else — which on a shared site is most of them. */
async function assetsLoadServer() {
  let list = [];
  try {
    list = await HOST.assets.list();
  } catch (e) { }
  await Promise.all(list.map(async m => {
    const record = {
      id: m.id, name: m.name, type: m.mimeType, size: m.size || 0,
      w: m.width, h: m.height, tags: m.tags || [], metadataVersion: m.metadataVersion || 0, createdAt: m.createdAt || null,
      usageKnown: m.usageKnown === true && Number.isInteger(m.usageCount),
      usageCount: Number.isInteger(m.usageCount) ? m.usageCount : null,
      canDelete: m.usageKnown === true && Number.isInteger(m.usageCount) && m.canDelete === true,
      usedBy: Array.isArray(m.usedBy) ? m.usedBy : [],
      url: m.url
    };
    if (SRV.editorSessionToken) {
      try {
        const blob = await HOST.assets.download(m.id);
        record.blob = blob;
        record.url = URL.createObjectURL(blob);
      } catch { /* retain metadata so a later export can retry the byte download */ }
    }
    AS.mem.set(m.id, record);
  }));
}

async function assetAdd(file) {
  if (SRV) return assetAddServer(file);
  const id = 'a' + uid().replace(/[^a-z0-9]/g, '');
  const url = URL.createObjectURL(file);
  const dim = (await imgSize(url)) || { w: 0, h: 0 };
  const rec = { id, name: file.name || 'image', type: file.type || 'application/octet-stream', size: file.size, blob: file, w: dim.w, h: dim.h };
  if (AS.ok) {
    try { await idbReq(idbStore('readwrite').put(rec)); }
    catch (e) { AS.ok = false; toast('Could not store the image — it will be lost on reload', {tone:'error'}); }
  }
  AS.mem.set(id, { ...rec, url });
  return id;
}
const deletingAssets = new Set();
const confirmingAssetDeletes = new Set();
async function assetDel(id, button = null, silent = false) {
  if (deletingAssets.has(id)) return false;
  deletingAssets.add(id);
  const a = AS.mem.get(id);
  const action = silent ? null : feedback().begin(button, 'Deleting image…');
  try {
    if (IS_WORDPRESS) {
      const usage = assetUse(id);
      if (!usage.canDelete) {
        const message = assetDeleteBlockedMessage(usage);
        if (action) action.error(message); else if (!silent) toast(message, {tone:'error'});
        return false;
      }
    }
    if (SRV) await HOST.assets.remove(id);
    else if (AS.ok) await idbReq(idbStore('readwrite').delete(id));
    if (a && a.url && a.url.startsWith('blob:')) URL.revokeObjectURL(a.url);
    AS.mem.delete(id);
    action?.success(SRV ? 'Image removed from the library. History copies are retained.' : 'Image deleted.');
    return true;
  } catch (error) {
    const payload = error?.payload;
    const inUse = IS_WORDPRESS && error?.status === 409 && payload?.code === 'pagecraft_media_in_use';
    if (inUse && a) Object.assign(a, {
      usageKnown: true,
      usageCount: Number.isInteger(payload.usageCount) ? payload.usageCount : 0,
      canDelete: false,
      usedBy: Array.isArray(payload.usedBy) ? payload.usedBy : []
    });
    const message = inUse
      ? (payload.error || 'This image is used by WordPress content and cannot be deleted.')
      : (payload?.error || error?.message || 'The image could not be deleted.') + ' Try again.';
    if (action) action.error(message); else if (!silent) toast(message, {tone:'error'});
    return false;
  } finally { deletingAssets.delete(id); }
}

const assetBytes = () => [...AS.mem.values()].reduce((n, a) => n + (a.size || 0), 0);

/* how many times each asset is referenced by the whole project */
function assetUsage() {
  const hits = {};
  const json = JSON.stringify(doc());
  let m;
  A_RE.lastIndex = 0;
  while ((m = A_RE.exec(json))) hits[m[1]] = (hits[m[1]] || 0) + 1;
  /* WordPress imports and custom markup can retain a canonical attachment URL instead of
     an asset token. Count every literal occurrence in the unsaved document; a URL with a
     query suffix still refers to the same attachment. The host scans saved content too. */
  if (IS_WORDPRESS) for (const asset of AS.mem.values()) {
    if (!asset.url) continue;
    const exact = String(asset.url);
    let at = 0;
    while ((at = json.indexOf(exact, at)) >= 0) {
      const after = json[at + exact.length];
      if (!after || /[?#\s"'\\<>()},\]]/.test(after)) hits[asset.id] = (hits[asset.id] || 0) + 1;
      at += exact.length;
    }
  }
  return hits;
}

/** One deletion decision joins current unsaved references with the WordPress host's
    site-wide scan. Cloud and standalone retain their document-only rule. */
function assetUse(id, localUsage = assetUsage()) {
  const asset = AS.mem.get(id);
  const localCount = Number(localUsage[id] || 0);
  if (!IS_WORDPRESS) return {
    known: true, localCount, serverCount: 0, usedBy: [], used: localCount > 0,
    canDelete: localCount === 0
  };
  const completeUsage = Array.isArray(asset?.usedBy) && asset.usedBy.every(item => item
    && typeof item.id === 'string' && typeof item.type === 'string'
    && typeof item.title === 'string' && typeof item.status === 'string'
    && (item.parentId === null || typeof item.parentId === 'string')
    && Array.isArray(item.references) && item.references.length > 0
    && item.references.every(reference => ['managed_document','native_content','featured_image'].includes(reference)));
  const usedBy = completeUsage ? asset.usedBy : [];
  const serverCount = asset?.usageKnown === true && Number.isInteger(asset.usageCount) && asset.usageCount >= 0
    ? asset.usageCount : null;
  const known = completeUsage && serverCount !== null
    && (serverCount === 0 ? usedBy.length === 0 : usedBy.length > 0)
    && !(asset?.canDelete === true && serverCount !== 0);
  return {
    known, localCount, serverCount,
    usedBy: known ? usedBy : [],
    used: localCount > 0 || (serverCount || 0) > 0,
    canDelete: known && serverCount === 0 && usedBy.length === 0
      && asset?.canDelete === true && localCount === 0
  };
}

function assetDeleteBlockedMessage(usage) {
  if (!IS_WORDPRESS) return 'This image is used on the site. Remove its references before deleting it.';
  if (!usage.known) return 'WordPress usage could not be checked. Reload the media library before deleting this image.';
  if (usage.localCount) return 'This image is used in the current draft. Remove its references before deleting it.';
  return 'This image is used by WordPress content. Open Details to inspect its site-wide references.';
}

function assetUsageLabel(id, localUsage) {
  const usage = assetUse(id, localUsage);
  if (!IS_WORDPRESS) return usage.localCount ? `used ${usage.localCount}×` : 'unused';
  if (!usage.known) return 'usage unavailable';
  const labels = [];
  if (usage.serverCount) labels.push(`WordPress ${usage.serverCount}×`);
  if (usage.localCount) labels.push(`current draft ${usage.localCount}×`);
  return labels.length ? labels.join(' · ') : usage.canDelete ? 'unused' : 'protected by WordPress';
}

async function confirmWordPressAssetDelete(ids, prune = false) {
  const assets = ids.map(id => AS.mem.get(id)).filter(Boolean);
  if (!assets.length) return false;
  const key = prune ? 'prune' : assets[0].id;
  if (confirmingAssetDeletes.has(key) || deletingAssets.has(assets[0].id)) return false;
  confirmingAssetDeletes.add(key);
  const message = prune
    ? `Permanently delete ${assets.length} unused image${assets.length === 1 ? '' : 's'} from the WordPress media library? This cannot be undone.`
    : `Permanently delete <b>${esc(assets[0].name)}</b> from the WordPress media library? This cannot be undone.`;
  try {
    return await askConfirm(prune ? 'Remove unused images?' : 'Delete this image?', message,
      {ok: prune ? 'Delete unused images' : 'Delete image', danger:true});
  } finally { confirmingAssetDeletes.delete(key); }
}

async function assetDeleteMany(ids) {
  const result = {removed: 0, blocked: 0, failed: 0};
  for (const id of [...new Set(ids)]) {
    const before = assetUse(id);
    if (!before.canDelete) {
      if (before.known && before.used) result.blocked++; else result.failed++;
      continue;
    }
    if (await assetDel(id, null, true)) { result.removed++; continue; }
    const after = assetUse(id);
    if (after.known && after.used) result.blocked++; else result.failed++;
  }
  return result;
}

const assetDeleteSummary = result => `${result.removed} removed · ${result.blocked} still used · ${result.failed} failed`;

/* intrinsic pixel size of an image, used to emit width/height on export */
const imgSize = url => new Promise(res => {
  if (!url) return res(null);
  const i = new Image();
  i.onload = () => res({ w: i.naturalWidth, h: i.naturalHeight });
  i.onerror = () => res(null);
  i.src = url;
});

const blobToData = b => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => res(fr.result);
  fr.onerror = () => rej(new Error('An image could not be read for export. Try again.'));
  fr.readAsDataURL(b);
});

/* canvas: cheap object URLs */
const assetsToBlob = str => str.replace(A_RE, (m, id) => (AS.mem.get(id) || {}).url || PH);

const assetIdsIn = str => [...new Set([...String(str).matchAll(A_RE)].map(m => m[1]))];
const assetFetches = new Map();

/* Hosted asset lists deliberately carry metadata and a display URL, not every byte in the
   library. Export fetches only the tokens its output actually references. A failed fetch is
   actionable: returning a placeholder or omitting the file would create a download that looks
   successful but is broken. Standalone projects keep their existing IndexedDB/blob behaviour. */
async function materializeAsset(id) {
  const asset = AS.mem.get(id);
  if (!asset) {
    if (SRV) throw new Error(`Image “${id}” is no longer available. Reload the editor or replace it, then try exporting again.`);
    return null;
  }
  if (asset.blob) return asset;
  if (!SRV) return asset;
  if (!HOST?.assets?.download) throw new Error(`Image “${asset.name || id}” cannot be downloaded by this host. Try exporting again after reconnecting.`);

  let job = assetFetches.get(id);
  if (!job) {
    job = (async () => {
      try {
        const blob = await HOST.assets.download(id);
        if (!blob || typeof blob.arrayBuffer !== 'function' || blob.size === 0) throw new Error('The host returned no image bytes.');
        asset.blob = blob;
        if (!asset.size) asset.size = blob.size || 0;
        if (!asset.type && blob.type) asset.type = blob.type;
        return asset;
      } catch {
        throw new Error(`Image “${asset.name || id}” could not be downloaded for export. Check your connection and try again.`);
      }
    })();
    assetFetches.set(id, job);
  }
  try { return await job; }
  finally { if (assetFetches.get(id) === job) assetFetches.delete(id); }
}

async function materializeAssetsFor(str) {
  return Promise.all(assetIdsIn(str).map(materializeAsset));
}

/* export: inline as data URIs, or rewrite to a relative assets/ path */
async function assetsToData(str) {
  const assets = await materializeAssetsFor(str);
  const map = Object.create(null);
  for (const asset of assets) {
    if (asset) map[asset.id] = asset.blob ? await blobToData(asset.blob) : PH;
  }
  return str.replace(A_RE, (m, id) => map[id] || PH);

/* `asset:<id>` → the path the exported HTML uses for it. Lives here because only

const assetPath = v => {
  const m = /^asset:(\w+)$/.exec(String(v == null ? '' : v));
  const a = m && AS.mem.get(m[1]);
  return a ? assetFile(a) : String(v == null ? '' : v);
};
/* `content.json` uses the same generated asset paths as an exported site. On re-import into

   a URL, an existing token, or an unknown path must remain exactly what the file supplied. */
const contentImageResolver = () => {
  const byPath = new Map();
  for (const a of AS.mem.values()) byPath.set(assetFile(a), `asset:${a.id}`);
  return value => byPath.has(value) ? byPath.get(value) : value;

};
/* An SVG is already resolution-independent, so rasterising it to five sizes would trade a

   variant files are written: the srcset then offers one file at several widths, which is
   valid and fetched once. */
const rasterable = a => !!a && !/svg/i.test(a.type || '');

const assetsToPaths = (str, rel = '') => str.replace(A_RE, (m, id, w) => {
  const a = AS.mem.get(id);
  if (!a) return PH;
  return rel + (w && rasterable(a) ? assetVariantFile(a, +w) : assetFile(a));
});

/* Every (asset, width) pair a rendered page asks for, so the writer emits exactly the files
   the markup promises and no others. */
const assetVariantsIn = str => {
  const out = new Map();
  for (const m of str.matchAll(A_RE)) {
    const a = AS.mem.get(m[1]);
    if (!m[2] || !a || !rasterable(a)) continue;
    out.set(m[1] + '@' + m[2], { a, w: +m[2] });
  }
  return [...out.values()];

    catch { throw new Error(`Image “${a.name || a.id}” could not be decoded for responsive export. Replace it or try again.`); }
    try {

         encoded to the MIME type promised by assetVariantFile. Returning the original WebP
         bytes under a .jpg name made otherwise complete archives invalid. */
      const sourceWidth = Number(bmp.width), sourceHeight = Number(bmp.height);
      if (!(sourceWidth > 0) || !(sourceHeight > 0)) throw new Error('The decoded image has no dimensions.');
      const width = Math.max(1, Math.min(sourceWidth, w));
      const height = Math.max(1, Math.round(sourceHeight * (width / sourceWidth)));

      const cv = document.createElement('canvas');
      cv.width = width; cv.height = height;
      const cx = cv.getContext('2d');
      if (!cx) throw new Error('Canvas encoding is unavailable.');
      cx.imageSmoothingQuality = 'high';

        type, 0.82));

      throw new Error(`Image “${a.name || a.id}” could not be encoded for responsive export. Try again or replace it.`);
    } finally { bmp.close?.(); }

  VAR.set(key, job);
  job.catch(() => { if (VAR.get(key) === job) VAR.delete(key); });

/* The byte files promised by a token-bearing page/content source. Both originals and
   responsive variants come from this one list so single pages, all pages and site ZIPs cannot
   disagree, and unused library assets are never fetched or exported. */
async function exportAssetFiles(str) {
  const assets = (await materializeAssetsFor(str)).filter(Boolean);
  const files = assets.filter(a => a.blob).map(a => ({ path: assetFile(a), data: a.blob, type: a.type }));
  for (const { a, w } of assetVariantsIn(str)) {

/* ---- zip -----------------------------------------------------------------
   Written by hand rather than pulled in: a whole site is a handful of files, and
   the format is a local header per entry, then a central directory, then a
   twenty-two byte tail. Deflate comes from CompressionStream where the browser
   has it and falls back to stored, which is still a valid archive.
   Timestamps are fixed at the ZIP epoch so the same site zips to the same bytes —
   the same reason content.json carries no generated-at stamp. */
const deflateRaw = async u8 => {
  if (typeof CompressionStream !== 'function') return null;
  try {
    const st = new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    const packed = new Uint8Array(await new Response(st).arrayBuffer());
    return packed.length < u8.length ? packed : null;
  } catch (e) { return null; }
};

async function makeZip(entries) {
  const enc = new TextEncoder();

  const put = (n, len) => { const b = new Uint8Array(len); for (let i = 0; i < len; i++) b[i] = (n >>> (8 * i)) & 0xFF; return b; };
  for (const e of entries) {
    const name = enc.encode(e.path);
    const raw = typeof e.data === 'string' ? enc.encode(e.data)
      : e.data instanceof Uint8Array ? e.data
        : new Uint8Array(await e.data.arrayBuffer());
    const crc = crc32(raw);
    const packed = raw.length > 256 ? await deflateRaw(raw) : null;
    const body = packed || raw, method = packed ? 8 : 0;
    const head = [put(0x04034b50, 4), put(20, 2), put(0, 2), put(method, 2), put(0, 2), put(0x21, 2),
      put(crc, 4), put(body.length, 4), put(raw.length, 4), put(name.length, 2), put(0, 2), name];
    chunks.push(...head, body);
    central.push(...[put(0x02014b50, 4), put(20, 2), put(20, 2), put(0, 2), put(method, 2), put(0, 2), put(0x21, 2),
      put(crc, 4), put(body.length, 4), put(raw.length, 4), put(name.length, 2), put(0, 2), put(0, 2),
      put(0, 2), put(0, 2), put(0, 4), put(offset, 4), name]);
    offset += head.reduce((n, b) => n + b.length, 0) + body.length;
    count++;
  }

  return new Blob([...chunks, ...central,
    put(0x06054b50, 4), put(0, 2), put(0, 2), put(count, 2), put(count, 2), put(cdSize, 4), put(offset, 4), put(0, 2)],
    { type: 'application/zip' });
}

/* On a detail template the whole page stands for one item, so the canvas needs
   that item threaded in from the top — there is no `src` node to open the scope. */
/* What the canvas needs to render the current page the way its file will look. `pg` and the
   page number are here because a paginated list renders a slice and draws links to its
   neighbours, and neither is derivable from the node. The number is clamped on read rather
   than on write, so deleting items cannot leave the canvas parked on a page that has gone. */
function pageCtx() {

  const pages = pgn ? listPageCount(pgn.node, pgn.col) : 1;

/* Preview runs the exact interaction payloads written into an export. Keeping a second,
   hand-written approximation here is how Tabs, Gallery, Code, Slider and Video could all

  const runtimeDisposers = [];
  cwin.__pagecraftRegisterPreviewDispose = cleanup => {
    if (typeof cleanup === 'function') runtimeDisposers.push(cleanup);
  };
  let runtimeStyle = null;

    runtimeStyle.id = 's-preview-runtime';

    runtimeStyle.textContent = 'html{background:var(--c-bg,#fff);scrollbar-width:thin;scrollbar-color:var(--c-muted,#5f6660) var(--c-bg,#fff)}'
      + (/\bbp-animate\b/.test(html) ? '\n' + ANIM_CSS + '\n' + ANIM_CALM : '');

  const listeners = [], observers = [];
  const proto = cwin.EventTarget && cwin.EventTarget.prototype;
  const add = proto && proto.addEventListener;
  if (add) proto.addEventListener = function(type, fn, opts) {

    [/data-copy/.test(html), CODE_JS],
    [/data-tabs/.test(html), TABS_JS],
    [/data-nav/.test(html), NAV_JS],
    [/data-facade/.test(html), FACADE_JS],
    [/data-lightbox/.test(html), LB_JS],
    [/data-pagecraft-select/.test(html), PUBLIC_SELECT_JS],

let canvasReadyCleanup = () => {};
function watchCanvasPreview(source) {
  canvasReadyCleanup();
  const strip = $('#canvasPreviewState');
  if (!strip) return;
  strip.classList.remove('is-ready');
  strip.hidden = !document.body.classList.contains('preview');
  if (strip.hidden) return;
  const status = strip.querySelector('span'), retry = strip.querySelector('button');
  status.textContent = 'Rendering preview…'; retry.hidden = true;
  let active = true, timer = null;
  const listeners = [];
  canvasReadyCleanup = () => { active = false; clearTimeout(timer); listeners.forEach(([image, fn]) => { image.removeEventListener('load', fn); image.removeEventListener('error', fn); }); };
  const refs = [...source.matchAll(new RegExp(A_RE.source, 'g'))];
  const missing = refs.some(match => !AS.mem.get(match[1])?.url);
  retry.onclick = async () => {
    retry.disabled = true;
    try { if (SRV) await assetsLoadServer(); }
    finally { retry.disabled = false; if (active) paint(); }
  };
  requestAnimationFrame(() => requestAnimationFrame(() => {
    if (!active) return;
    const images = [...cdoc.images].filter(image => {
      const rect = image.getBoundingClientRect();
      return image.loading !== 'lazy' || rect.top < cwin.innerHeight && rect.bottom > 0;
    });
    const check = (expired = false) => {
      if (!active) return;
      const pending = images.some(image => !image.complete);
      const failed = missing || images.some(image => image.complete && !image.naturalWidth);
      if (pending && !expired) { status.textContent = 'Preview displayed; images are still loading…'; return; }
      status.textContent = failed || pending ? 'Some preview images could not load. Check them before publishing.' : 'Preview displayed.';
      retry.hidden = !(failed || pending);

      strip.classList.toggle('is-ready', !failed && !pending);

      const fn = () => check(); listeners.push([image, fn]);

  const scope = scopeOf();
  const sets = curSets();
  const css = treeCss(sets, editing) + publicFormControlCssFor(sets, editing);
  /* A Follow mobile-menu definition has no copied links of its own. In component Preview,
     carry the exact validated parent that opened the definition just as edit rendering does;
     export rendering stays independent of transient editor ownership. */
  const previewMobileMenuOwner = !editing && state.ui.mode === 'component' && state.ui.cedit
    ? mobileMenuOwner(state.ui.cedit) : null;
  const previewMobileMenuItems = Array.isArray(previewMobileMenuOwner?.node.props.items)
    ? previewMobileMenuOwner.node.props.items : null;

  const canvasRegions = regions();
  const publicRegions = !editing ? renderPublicLists(canvasRegions.map(R => R.get()), {
    edit: false, canvas: true, ...pageCtx(),

        : `<span class="s-lockchip">${svg(R.kind === 'main' ? 'page' : 'globe', 11)} ${esc(R.label)} ${svg('lock', 10)}</span>`
        + `<button class="s-lockopen" data-goto="${modeFor(R.kind)}">Edit ${R.kind === 'main' ? 'page' : R.kind} ${svg('edit', 10)}</button>`)

     and `runAct` fixed it: every entry point now calls the same implementation, so they

  const barBounds = bar.getBoundingClientRect();
  const h = barBounds.height;
  /* Direct siblings are the content a bar immediately above or below can hide. Use their
     rendered boxes rather than inferred spacing: canvas zoom, wrapping and authored margins
     all change where the actual hit targets land. Ancestors deliberately stay out of this
     list because their boxes contain the selected element and would reject every position. */
  const blockers = (s.list || []).filter(node => node.id !== s.node.id).map(node => {
    const sibling = selectedCanvasElement(node.id);
    return sibling ? sibling.getBoundingClientRect() : null;

  const placed = PC_UI.selectionToolbarPosition ? PC_UI.selectionToolbarPosition(r, {
    width: barBounds.width, height: h,
  }, {
    width: cwin.innerWidth, height: cwin.innerHeight,
  }, blockers) : {
    left: Math.max(0, Math.min(r.left, cwin.innerWidth - barBounds.width)),
    top: PC_UI.selectionToolbarTop(r, h, cwin.innerHeight),
  };

  bar.style.left = (x + cwin.scrollX) + 'px';

  // A short element at the top of the viewport needs the bar below it, so
  // the controls never cover the text the user is trying to select or edit.
  const y = placed.top;
  bar.style.top = (y + cwin.scrollY) + 'px';
  if (y >= r.bottom) bar.style.borderRadius = '0 0 6px 6px';

}

/* A grip per gutter, on the row that is selected — or on the parent row when a
   column is selected, which is how you usually arrive at wanting to resize.
   Positioned between each adjacent pair, from the live boxes rather than from the
   stored ratios, so it lands correctly whatever the widths actually resolve to. */
function gripsHtml(s) {
  const row = s.node.type === 'row' ? s.node
    : (s.node.type === 'column' && s.parent && s.parent.type === 'row') ? s.parent : null;
  if (!row || (row.children || []).length < 2) return '';
  const boxes = row.children.map(c => {
    const e = selectedCanvasElement(c.id);
    return e ? e.getBoundingClientRect() : null;
  });
  if (boxes.some(b => !b)) return '';
  let out = '';
  for (let i = 0; i < boxes.length - 1; i++) {
    const a = boxes[i], b = boxes[i + 1];
    /* a wrapped row stacks its columns — there is no vertical gutter to drag */
    if (b.left < a.left + 1) continue;
    const x = (a.right + b.left) / 2 + cwin.scrollX;
    const t = Math.min(a.top, b.top) + cwin.scrollY;
    const h = Math.max(a.bottom, b.bottom) - Math.min(a.top, b.top);
    out += `<div class="grip" data-grip="${row.id}" data-i="${i}"
      style="left:${x}px;top:${t}px;height:${h}px" title="Drag to resize"></div>`;
  }
  return out;
}

/* `add` toggles one member, `range` sweeps from the primary to `id` in document
   order, and a plain call replaces the set. Only a plain call clears the class
   target: while adding, the primary has not moved, so the target still holds. */
function selectsCanvasAncestor(id) {
  let at = state.ui.sel ? locate(state.ui.sel) : null;
  while (at && at.parent) {
    if (at.parent.id === id) return !!contextualCanvasElement(id);
    at = locate(at.parent.id);
  }
  return false;

function select(id, opts = {}) {

  if (opts.add) selToggle(id);
  else if (opts.range && state.ui.sel && id) selSet(selRange(state.ui.sel, id));
  else {
    if (id !== state.ui.sel) { state.ui.target = ''; state.ui.lmode = null; }

     somebody needs; clearing it returns to the library. */
  document.body.classList.toggle('library-focus', !state.ui.sel);

}
// Panel changes can reflow the canvas. Reveal only an offscreen selection;
// ordinary edits must not snap a tall section back to its beginning.
function revealSelection(force = false) {
  const el = cdoc && state.ui.sel && selectedCanvasElement(state.ui.sel);
  if (!el || document.body.classList.contains('preview')) return;
  const r = el.getBoundingClientRect();
  if (force || r.bottom <= 0 || r.top >= cwin.innerHeight || r.right <= 0 || r.left >= cwin.innerWidth)
    el.scrollIntoView({ block: 'nearest', inline: 'nearest' });

}
/* cheap selection repaint — avoids rebuilding the whole canvas */
function paintSel() {
  if (!cdoc) return;
  $$('[data-sel],[data-sel2]', cdoc).forEach(e => {
    e.removeAttribute('data-sel'); e.removeAttribute('data-sel2');
  });
  /* Only the primary gets `data-sel`, matching the element shown in the inspector. */
  selIds().forEach((id, i) => {
    const el = i ? cdoc.getElementById(id) : selectedCanvasElement(id);
    if (el && el.dataset.id) el.setAttribute(i ? 'data-sel2' : 'data-sel', '');
  });
  positionHud();
}

/* ---- element clipboard identity ----------------------------------------
   Copy is duplication and must receive fresh ids. Cut is a move: retaining the
   detached subtree's ids keeps form submissions and other identity-backed data
   attached to the element after it lands somewhere else.

   The flag is set only after a real deletion. A component definition's root cannot
   be removed (tree() exposes a throwaway one-item list there), so it is refused
   before touching the clipboard. Before an identity-preserving paste, every held id
   is checked across pages, shared regions and component definitions. Undo may have
   restored the old subtree; a conflicting id safely turns that paste into a copy. */
let elementClipboardCut = false;
function copyElement(id) {
  if (!copyNode(id)) return false;
  elementClipboardCut = false;
  return true;
}

  const h = locate(id);
  if (!h || !canStructure() || (state.ui.mode === 'component' && !h.parent)) return false;
  if (!copyNode(id)) return false;
  edit(() => delNode(id));
  const removed = !h.list.includes(h.node);
  elementClipboardCut = removed;
  return removed;
}

  if (!clip.node) return false;
  const ids = new Set();
  eachNode([clip.node], n => ids.add(n.id));
  if ([...ids].some(id => locateAny(id))) return true;
  let found = false;
  components().forEach(def => eachNode([def.node], n => { if (ids.has(n.id)) found = true; }));
  return found;
}
function pasteElement(intoId) {
  if (!clip.node) return null;
  const move = elementClipboardCut && !clipboardIdsInUse();
  const made = move ? dropTree(clone(clip.node), intoId) : pasteNode(intoId);
  /* A completed cut becomes an ordinary clipboard copy. Repeated paste must not
     create duplicate ids; a failed placement remains retryable as the move. */
  if (made) elementClipboardCut = false;
  return made;
}

/* ---- one dispatcher for every element verb -----------------------------
   The HUD bar, the Navigator row, the inspector footer and the context menu all call
   this. Before it, duplicate and delete existed three times over, each with its own
   idea of whether it applied to the selection or to one node. */
function runAct(act, ids) {
  const list = (ids && ids.length ? ids : selIds()).filter(id => locate(id));
  if (!list.length) return;
  const id = list[0], many = list.length > 1;
  switch (act) {
    case 'edit': enterEdit(id); break;
    case 'up': { const h = locate(id); select(h.parent ? h.parent.id : null); break; }
    case 'copy':
      if (copyElement(id)) toast(kindOf(locate(id).node) + ' copied'
        + (many ? ' — the clipboard holds one element at a time' : ''));
      break;
    case 'cut': {
      const label = kindOf(locate(id).node);
      if (!cutElement(id)) break;
      toast(label + ' cut' + (many ? ' — the clipboard holds one element at a time' : ''));
      break;
    }
    case 'paste': {
      if (!clip.node) break;
      let made = null;
      edit(() => { made = pasteElement(id); if (made) selSet([made.id]); });
      toast(made ? kindOf(made) + ' pasted' : 'A ' + kindOf(clip.node) + ' cannot go there');
      break;
    }
    case 'first': case 'last': {
      const dir = act === 'first' ? -1 : 1;
      /* asked before the edit, not after: `edit` snapshots and clears the redo stack before
         its body runs, so finding out afterwards that nothing moved is already too late */
      if (atEdge(list, dir)) { toast(dir < 0 ? 'Already at the top' : 'Already at the bottom'); break; }
      edit(() => sendEdge(list, dir));
      break;
    }
    case 'dup': if (canStructure()) { edit(() => (many ? dupMany(list) : dupNode(id)), many ? `Duplicate ${list.length} elements` : 'Duplicate ' + kindOf(locate(id).node).toLowerCase()); toast(many ? `${list.length} elements duplicated` : 'Element duplicated'); } break;
    case 'del': if (canStructure()) { const label = many ? `Delete ${list.length} elements` : 'Delete ' + kindOf(locate(id).node).toLowerCase(); edit(() => (many ? delMany(list) : delNode(id)), label); toast(many ? `${list.length} elements deleted. Undo restores them.` : 'Element deleted. Undo restores it.'); } break;
    case 'stcopy': copyStyles(id); toast('Styles copied from ' + styleClip.from); renderRight(); break;
    case 'stpaste': {
      if (!styleClip.css) { toast('No styles copied yet'); break; }
      const check = stylePasteCheck();
      if (!check.ok) { toast(check.reason); break; }
      let k = 0;
      edit(() => { k = pasteStylesMany(list); });
      toast(k > 1 ? `Styles pasted onto ${k} elements` : k ? 'Styles pasted' : 'Nothing changed');
      break;
    }
    case 'hide': edit(() => list.forEach(x => {
      const nd = locate(x).node;
      nd.hide = nd.hide || {};
      nd.hide[dk()] = !nd.hide[dk()];
    })); break;
    case 'block': saveBlockFlow(id); break;
  }
}

/* ---- the context menu -------------------------------------------------
   Right-click is where a paste verb belongs, and there was none anywhere in the app.
   It is also what lets the HUD bar stop growing: seven buttons floating over the
   element became a name, a drag handle and one more. */
function closeCtx(immediate = false) {
  const c = $('#ctx'); if (!c) return;
  const fx = PC_UI.installUiMotion();
  if (immediate || !fx || fx.reduced()) { fx?.cancel(c); c.remove(); return; }
  fx.exit(c, {kind:'popover',remove:true});
}
function openCtx(x, y, ids) {
  closeCtx(true);
  const items = menuFor(ids);
  if (!items.length) return;
  const m = document.createElement('div');
  m.id = 'ctx'; m.className = 'pc-menu';
  m.setAttribute('role', 'menu');
  m.setAttribute('aria-label', 'Element actions');
  m.innerHTML = items.map((i, index) =>
    `<button role="menuitem" data-a="${i.act}" class="pc-menu-item${i.danger ? ' danger' : ''}">`
    + `<span>${esc(i.label)}</span>${i.key ? `<em>${esc(i.key)}</em>` : ''}</button>`
    + (i.sep && index < items.length - 1 ? '<div class="pc-menu-divider" role="separator"></div>' : '')).join('');
  document.body.appendChild(m);
  /* place it at the pointer, then pull it back inside the window rather than letting
     a menu near the right or bottom edge run off */
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(y, window.innerHeight - r.height - 8) + 'px';
  PC_UI.installUiMotion()?.enter(m,{kind:'popover'});
  const buttons = $$('button', m);
  buttons[0]?.focus();
  m.addEventListener('keydown', e => {
    const at = buttons.indexOf(document.activeElement);
    const next = e.key === 'Home' ? 0 : e.key === 'End' ? buttons.length - 1
      : e.key === 'ArrowDown' ? (at + 1) % buttons.length
        : e.key === 'ArrowUp' ? (at - 1 + buttons.length) % buttons.length : -1;
    if (next < 0) return;
    e.preventDefault(); buttons[next].focus();
  });
  buttons.forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.a;
    closeCtx();
    runAct(a, ids);
  }));
}
/* One closer for every way out: another click, Escape, a scroll, a resize.

   Escape *consumes* the event when it dismisses a menu, and only then. Otherwise the
   menu closed and `hotkey` also ran its own Escape branch on the same press, so one tap
   dismissed the menu and walked the selection up a level — two things for one key. With
   no menu open the event is left alone and Escape means what it always meant. */
const escCtx = e => {
  if (e.key !== 'Escape' || !$('#ctx')) return;
  closeCtx();
  e.stopPropagation();
};
document.addEventListener('pointerdown', e => { if (!e.target.closest('#ctx')) closeCtx(); }, true);
function closePageActions(target) {
  document.querySelectorAll('.page-actions[open]').forEach(menu => {
    if (!target || !menu.contains(target)) menu.removeAttribute('open');
  });
}
document.addEventListener('pointerdown', e => closePageActions(e.target), true);
document.addEventListener('pagecraft:outside-pointer', () => closePageActions());
window.addEventListener('blur', () => closePageActions());
document.addEventListener('keydown', escCtx, true);

/* ========================================================= canvas events */
let canvasSelectionContext = null;

/* A repeated card is one editable template rendered with several CMS items. Keep the clicked
   item's identity as UI context while leaving the shared node id — and therefore every edit —
   on the template. Item ids are mapped back to the collection instead of trusting a rendered
   position because filters and sorting can put raw item zero second on screen. */
function rememberCanvasItem(hit) {
  canvasSelectionContext = null;
  const nodeId = hit && hit.dataset ? String(hit.dataset.id || '') : '';
  if (!nodeId || !locate(nodeId)) return false;
  const items = [];
  for (let element = hit; element && element !== cdoc.documentElement; element = element.parentElement) {
    const colId = String(element.dataset?.cmsCol || '');
    const itemId = String(element.dataset?.cmsItem || '');
    if (!colId && !itemId) continue;
    const col = colId ? findCollection(colId) : null;
    const index = col && itemId ? col.items.findIndex(item => item.id === itemId) : -1;
    /* A half or stale pair is not context. Abort rather than combining an untrusted inner
       identity with a valid outer row from the same DOM branch. */
    if (!col || index < 0) return false;
    if (!items.some(item => item.colId === col.id && item.itemId === itemId)) {
      items.push({ colId: col.id, itemId });
    }
  }
  if (!items.length) return false;
  state.ui.item = state.ui.item || {};
  items.slice().reverse().forEach(item => {
    const col = findCollection(item.colId);
    state.ui.item[col.id] = col.items.findIndex(row => row.id === item.itemId);
  });
  canvasSelectionContext = { items, nodeId, element: hit };
  return true;
}

/* HUD, outline and reveal need the visible copy that supplied the inspector context. A deleted
   item or repainted stale node falls back to the longstanding bare-id target without throwing. */
function contextualCanvasElement(id) {
  if (!cdoc || !canvasSelectionContext) return null;
  const context = canvasSelectionContext;
  state.ui.item = state.ui.item || {};
  const resolved = [];
  for (const item of context.items) {
    const col = findCollection(item.colId);
    const index = col ? col.items.findIndex(row => row.id === item.itemId) : -1;
    if (!col || index < 0) { canvasSelectionContext = null; return null; }
    resolved.push({ col, index });
  }
  /* The innermost item drives the selected control. Apply outer contexts first so a nested
     list that deliberately reuses its parent's collection leaves the nearest row visible. */
  resolved.reverse().forEach(({ col, index }) => { state.ui.item[col.id] = index; });

  const score = element => {
    const found = new Set();
    for (let at = element; at && at !== cdoc.documentElement; at = at.parentElement) {
      const colId = String(at.dataset?.cmsCol || '');
      const itemId = String(at.dataset?.cmsItem || '');
      if (context.items.some(item => item.colId === colId && item.itemId === itemId)) {
        found.add(colId + '\n' + itemId);
      }
    }
    return found.size;
  };
  if (context.element && context.element.isConnected) {
    for (let at = context.element; at && at !== cdoc.documentElement; at = at.parentElement) {
      if (at.dataset?.id === id && score(at)) { context.element = at; return at; }
    }
  }
  let best = null, bestScore = 0;
  Array.from(cdoc.querySelectorAll('[data-id]')).forEach(element => {
    if (element.dataset.id !== id) return;
    const candidateScore = score(element);
    if (candidateScore > bestScore) { best = element; bestScore = candidateScore; }
  });
  if (best) context.element = best;
  return best;
}

/* A repaint can replace one repeated branch with another while keeping the selected template
   node. Undoing a Collection source change is the important case: the old item identity can
   still exist in its collection, but no longer describes any rendered copy of the selected
   node. Resolve valid context first; otherwise adopt the first visible fallback and its
   validated ancestor chain so the outline and bound inspector read the same row. This changes
   UI context only — never the document or history. */
function reconcileCanvasSelectionContext(id = state.ui.sel) {
  if (!cdoc || !id) return null;
  const contextual = contextualCanvasElement(id);
  if (contextual) return contextual;
  const fallback = cdoc.getElementById(id);
  if (!fallback) { canvasSelectionContext = null; return null; }
  rememberCanvasItem(fallback);
  return fallback;
}

function selectedCanvasElement(id) {
  if (!cdoc) return null;
  return id === state.ui.sel
    ? reconcileCanvasSelectionContext(id)
    : contextualCanvasElement(id) || cdoc.getElementById(id);
}

/* Review findings are generated from rendered collection values, so a shared template id is
   not enough to find the affected copy. Validate the structured identity against the live
   document, repaint its current paginator/detail/static-source context, then require an exact
   DOM ancestry match. A stale target must not silently become the first repeated card. */
function showReviewTarget(target) {
  const unavailable = message => { toast(message); return false; };
  if (!target || typeof target !== 'object'
    || typeof target.pageId !== 'string' || typeof target.nodeId !== 'string'
    || !['page', 'header', 'footer'].includes(target.scope)) {
    return unavailable('That review target is no longer available');
  }
  /* Site checks can be opened while the editor is in Preview. Return to the editor
     before changing page/region/item context so the recovery target is actionable. */
  if (document.body.classList.contains('preview')) togglePreview();
  const pageIndex = state.pages.findIndex(pg => pg.id === target.pageId);
  if (pageIndex < 0) return unavailable('That page is no longer in the project');
  const pg = state.pages[pageIndex];
  const root = target.scope === 'header' ? state.header
    : target.scope === 'footer' ? state.footer : pg.tree;
  if (!locate(target.nodeId, root)) return unavailable('That element is no longer in the project');

  const items = value => {
    if (value === undefined) return [];
    if (!Array.isArray(value)) return null;
    const out = [];
    for (const row of value) {
      if (!row || typeof row !== 'object'
        || typeof row.collectionId !== 'string' || typeof row.itemId !== 'string') return null;
      const col = findCollection(row.collectionId);
      const index = col ? col.items.findIndex(item => item.id === row.itemId) : -1;
      if (!col || index < 0) return null;
      out.push({ col, itemId: row.itemId, index });
    }
    return out;
  };
  const previewItems = items(target.previewItems);
  const repeatItems = items(target.repeatPath);
  if (!previewItems || !repeatItems) return unavailable('That affected item is no longer available');

  let pageNo = 1;
  if (target.pagination !== undefined) {
    const pagination = target.pagination;
    if (!pagination || typeof pagination !== 'object'
      || typeof pagination.listNodeId !== 'string' || typeof pagination.itemId !== 'string') {
      return unavailable('That affected item is no longer available');
    }
    const paginator = paginatorOf(pg);
    const per = paginator && parseInt(String(paginator.node.props.per || ''), 10);
    const rows = paginator && paginator.node.id === pagination.listNodeId
      ? listItems(paginator.node, paginator.col) : [];
    const rowIndex = rows.findIndex(item => item.id === pagination.itemId);
    if (!paginator || !(per > 0) || rowIndex < 0) {
      return unavailable('That affected item is no longer shown');
    }
    pageNo = Math.floor(rowIndex / per) + 1;
  }

  if (editing.on) exitEdit();
  state.cur = pageIndex;
  state.ui.mode = target.scope;
  state.ui.pno = pageNo;
  state.ui.item = state.ui.item || {};
  [...previewItems, ...repeatItems].forEach(item => { state.ui.item[item.col.id] = item.index; });
  canvasSelectionContext = null;
  selSet([]);
  closeReviewSurface();
  render();

  const pathOf = element => {
    const nearest = [];
    for (let at = element; at && at !== cdoc.documentElement; at = at.parentElement) {
      const collectionId = String(at.dataset?.cmsCol || '');
      const itemId = String(at.dataset?.cmsItem || '');
      if (!collectionId || !itemId) continue;
      const previous = nearest[nearest.length - 1];
      if (!previous || previous.collectionId !== collectionId || previous.itemId !== itemId) {
        nearest.push({ collectionId, itemId });
      }
    }
    return nearest.reverse();
  };
  const expectedPath = repeatItems.map(item => ({ collectionId: item.col.id, itemId: item.itemId }));
  const matchesPath = element => {
    const actual = pathOf(element);
    return actual.length === expectedPath.length && actual.every((item, index) =>
      item.collectionId === expectedPath[index].collectionId && item.itemId === expectedPath[index].itemId);
  };
  const candidates = Array.from(cdoc.querySelectorAll('[data-id]'))
    .filter(element => element.dataset.id === target.nodeId);
  const candidate = expectedPath.length
    ? candidates.find(matchesPath)
    : cdoc.getElementById(target.nodeId);
  if (!candidate) {
    canvasSelectionContext = null;
    selSet([]);
    paintSel(); renderRight(); renderLayers();
    return unavailable('That affected item is no longer shown');
  }
  if (expectedPath.length && !rememberCanvasItem(candidate)) {
    canvasSelectionContext = null;
    return unavailable('That affected item is no longer shown');
  }
  select(target.nodeId, { keepCanvasContext: expectedPath.length > 0, scroll: true });
  return true;
}

function canvasPointerHit(e) {
  const hit = e.target.closest && e.target.closest('[data-id]');
  if (!hit || !['section', 'row', 'column'].includes(hit.dataset.t)) return hit;

     a narrow vertical band; real child controls and neighbouring elements keep their clicks. */
  let nearest = null, distance = Infinity;
  hit.querySelectorAll('[data-t=divider][data-id]').forEach(divider => {
    const r = divider.getBoundingClientRect();
    if (!r.width || e.clientX < r.left || e.clientX > r.right) return;
    const dy = e.clientY < r.top ? r.top - e.clientY : e.clientY > r.bottom ? e.clientY - r.bottom : 0;
    if (dy <= 12 && dy < distance) { nearest = divider; distance = dy; }

    const fr = frameRect();

    const y = r ? r.top + r.height / 2 : e.clientY;

function bindCanvas() {

     but the canvas is an iframe, and events inside it never reach the outer document. So
     the menu, which is nearly always opened by right-clicking an element *in the canvas*,
     survived the very next thing anyone does: clicking another element. Capture phase, so
     it runs before the handler below decides what the click meant, and unconditional,
     because a pointerdown anywhere in the canvas is never a click on the menu. */
  cdoc.addEventListener('pointerdown', () => {
    closeCtx();
    document.dispatchEvent(new Event('pagecraft:outside-pointer'));
  }, true);
  cdoc.addEventListener('keydown', escCtx, true);

  cdoc.addEventListener('pointerdown', e => {
    if (document.body.classList.contains('preview')) return;
    if (e.target.closest('[data-slide-p], [data-slide-n], [data-slide-dots]')) return;
    const hudBtn = e.target.closest && e.target.closest('#s-hud button');
    if (hudBtn) {
      e.preventDefault();
      activateHudButton(hudBtn, e);
      return;
    }
    const grip = e.target.closest && e.target.closest('[data-grip]');
    if (grip) { startColResize(e, grip); return; }
    if (editing.on && e.target.closest('[data-editing]')) return;

    /* A locked region is context, not a trap: only the explicit button opens
       its editor. Clicking elsewhere in it simply clears the selection. */
    if (e.target.closest('[data-openadd]')) {
      e.preventDefault();
      const tab = $('#leftRail button[data-t="add"]');
      if (tab) tab.click();
      return;
    }
    const open = e.target.closest('.s-lockopen');
    if (open) { e.preventDefault(); setMode(open.dataset.goto); return; }
    const region = e.target.closest('.s-region');
    if (region && region.dataset.state !== 'edit') { e.preventDefault(); select(null); return; }

    const hit = canvasPointerHit(e);
    if (!hit) { select(null); return; }
    if (editing.on) exitEdit();
    /* contextmenu preserves selected targets; its preceding secondary press must too. */
    if (e.button === 2 && selIds().includes(hit.dataset.id)) {
      rememberCanvasItem(hit);
      paintSel();
      renderRight();
      return;
    }
    /* Both modifiers add here. A range needs a flat list to sweep, and the canvas
       has depth instead — shift-clicking two headings would otherwise drag in
       every row and column that happens to sit between them. The Navigator, which
       does present a list, is where shift takes a range. */
    const add = e.button !== 2 && (e.metaKey || e.ctrlKey || e.shiftKey);
    /* A modifier click is a selection gesture, not a text one. Without this the
       browser also extends a native text selection across the canvas, so adding
       three cards leaves everything between them highlighted blue. */
    if (add) { e.preventDefault(); const g = cwin.getSelection(); if (g) g.removeAllRanges(); }
    const keepCanvasContext = rememberCanvasItem(hit);
    select(hit.dataset.id, { add, keepCanvasContext });
  }, true);

  /* Native button activation from Enter, Space and assistive technology dispatches a click
     with detail 0. Pointer clicks already ran on pointerdown above, so accepting only that
     native click keeps one action per gesture. */
  cdoc.addEventListener('click', e => {
    if (e.detail !== 0 || document.body.classList.contains('preview')) return;
    const hudBtn = e.target.closest && e.target.closest('#s-hud button');
    if (!hudBtn) return;
    e.preventDefault();
    activateHudButton(hudBtn, e, true);
  });

  cdoc.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (!a) return;
    const claimed = e.defaultPrevented;
    e.preventDefault();
    if (!document.body.classList.contains('preview')) return;
    /* Gallery lightbox (and any future exported interaction) already owns this click.
       Preview still prevents the browser navigation, but does not reinterpret it as a page
       link or announce a spurious external-link warning. */
    if (claimed) return;
    const href = a.getAttribute('href') || '';
    if (!href) return;
    /* A fragment on this page is a scroll, and always was. */
    if (href.startsWith('#') && href.length > 1) {
      const t = cdoc.getElementById(href.slice(1));
      if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      return toast('No element with the anchor ' + href + ' on this page');
    }
    /* Anything else that lands inside this project is followed, which is what makes Preview
       a preview of a site rather than of one page. It used to say "links follow through in
       the exported file" and stay put — true, and no use to anyone checking their nav.

       `pageAt` does the resolving because the slug is the page's identity and the `.html` in
       the stored href is a file-naming detail. A detail-page link carries its item too, so
       the template renders the post that was actually clicked. */
    const to = pageAt(href);
    if (!to) {
      return toast(/^([a-z][\w+.-]*:|\/\/)/i.test(href)
        ? 'External links open in the exported site, not here'
        : `Nothing in this project answers to ${href}`);
    }
    if (to.col && to.item) {
      state.ui.item = state.ui.item || {};
      state.ui.item[to.col.id] = published(to.col).findIndex(i => i.id === to.item.id);
    }
    /* a pager link names which page of results it wants; everything else means the first */
    state.ui.pno = to.pageNo || 1;
    state.cur = to.at;
    state.ui.mode = 'page';
    selSet([]);
    render();
    /* after the new page is on screen, not before */
    requestAnimationFrame(() => {
      const t = to.frag && cdoc.getElementById(to.frag);
      if (t) t.scrollIntoView({ block: 'start' });
      else cwin.scrollTo(0, 0);
    });
    const pg = state.pages[to.at];
    toast(to.item ? `${itemTitle(to.col, to.item)} — ${pg.name}`
      : (to.pageNo > 1 ? `${pg.name} — page ${to.pageNo}` : pg.name));
  });
  cdoc.addEventListener('dblclick', e => {
    if (document.body.classList.contains('preview')) return;
    const hit = e.target.closest('[data-id]');
    if (hit && DEF[locate(hit.dataset.id) ? locate(hit.dataset.id).node.type : ''] ) {
      const n = locate(hit.dataset.id).node;
      if (DEF[n.type].edit) { e.preventDefault(); enterEdit(n.id); }
    }
  });
  /* the menu is placed at the pointer in outer-document coordinates, so once the canvas
     scrolls it is pointing at whatever moved into that spot */
  cwin.addEventListener('scroll', () => { closeCtx(); positionHud(); if (editing.on) placeRT(); }, { passive: true });
  cwin.addEventListener('resize', () => { positionHud(); if (editing.on) placeRT(); });
  /* A Preview embed is a sandboxed frame with an opaque origin, so it cannot be measured from
     here. It reports its height, and that number is the only thing read from it. */
  cwin.addEventListener('message', e => {
    const h = e.data && e.data.pagecraftEmbedHeight;
    if (typeof h !== 'number' || !(h >= 0)) return;
    const frame = $$('iframe[data-embed-frame]', cdoc).find(f => f.contentWindow === e.source);
    if (frame) frame.style.height = Math.min(Math.ceil(h), 20000) + 'px';
  });
  /* Right-click selects what is under the pointer if it is not already selected — a
     menu that acts on something you cannot see selected is how you delete the wrong
     thing — then opens on the element, in outer-document coordinates. */
  cdoc.addEventListener('contextmenu', e => {
    if (document.body.classList.contains('preview')) return;
    const el = e.target.closest && e.target.closest('[data-id]');
    if (!el) return;
    e.preventDefault();
    const id = el.dataset.id;
    if (!selIds().includes(id)) { select(id); }
    const fr = frameRect();
    openCtx(toScreen(e.clientX, fr.left), toScreen(e.clientY, fr.top), selIds());
  });
  cdoc.addEventListener('keydown', e => {
    if (e.target.closest('[data-slide-p], [data-slide-n], [data-slide-dots], [data-slides]') && ['ArrowLeft', 'ArrowRight', ' ', 'Enter'].includes(e.key)) return;
    if (editing.on) {
      if (e.key === 'Escape') { e.preventDefault(); exitEdit(); }
      return;
    }
    hotkey(e);
  });
}

/* =============================================================== drag/drop */
let drag = null, dragDidMove = false;

function startDrag(e, payload, fromFrame) {
  e.preventDefault();
  drag = { ...payload, fromFrame, drop: null, moved: false, startX: e.clientX, startY: e.clientY };
  document.body.classList.add('dragging');
  const g = $('#ghost');
  g.innerHTML = svg(payload.icon || (payload.kind === 'move' ? 'drag' : 'plus'), 13) + esc(payload.label);
  g.style.display = 'flex';
  moveGhost(e, fromFrame);

  const src = e.target;
  try { src.setPointerCapture(e.pointerId); } catch (_) { }
  const dOwn = fromFrame ? cdoc : document;
  const mv = ev => onDragMove(ev, fromFrame);
  const up = ev => { onDrop(ev, fromFrame); cleanup(); };
  const cancel = () => { if (drag) drag.drop = null; onDrop(null, fromFrame); cleanup(); };
  const key = ev => { if (ev.key === 'Escape') { ev.preventDefault(); ev.stopImmediatePropagation(); cancel(); } };
  function cleanup() {
    dOwn.removeEventListener('pointermove', mv);
    dOwn.removeEventListener('pointerup', up);
    dOwn.removeEventListener('pointercancel', cancel);
    dOwn.removeEventListener('keydown', key, true);
  }
  dOwn.addEventListener('pointermove', mv);
  dOwn.addEventListener('pointerup', up);
  dOwn.addEventListener('pointercancel', cancel);
  dOwn.addEventListener('keydown', key, true);
}

/* Dragging a gutter. Writes at the breakpoint being edited, because the column's
   own Width (share) control is responsive — resizing on Tablet must not quietly
   rewrite the desktop base. The whole gesture is one `tx`, so it is one ⌘Z. */
function startColResize(e, grip) {
  e.preventDefault();
  const hit = locate(grip.dataset.grip); if (!hit) return;
  const row = hit.node, i = +grip.dataset.i, b = dk();
  const rowEl = cdoc.getElementById(row.id); if (!rowEl) return;
  const span = rowEl.getBoundingClientRect().width;
  if (!span) return;
  const startX = e.clientX;
  const key = 'colresize:' + row.id + ':' + i + ':' + b;
  grip.classList.add('on');
  try { grip.setPointerCapture(e.pointerId); } catch (_) { }

  const tip = cdoc.createElement('div');
  tip.className = 'gtip';
  cdoc.getElementById('s-hud').appendChild(tip);

  const move = ev => {
    const pct = ((ev.clientX - startX) / span) * 100;
    const ws = resizeCols(row, i, pct, b);
    if (!ws) return;
    tx(key);
    applyColsAt(row, ws, b);
    paintCss();                                     // cheap: only the stylesheet
    const total = ws.reduce((a, x) => a + x, 0) || 1;
    tip.textContent = ws.map(w => Math.round((w / total) * 100) + '%').join('  ·  ');
    const g = rowEl.getBoundingClientRect();
    tip.style.left = (ev.clientX + cwin.scrollX) + 'px';
    tip.style.top = (g.top + cwin.scrollY - 6) + 'px';
  };
  const up = () => {
    cdoc.removeEventListener('pointermove', move);
    cdoc.removeEventListener('pointerup', up);
    cdoc.removeEventListener('pointercancel', up);
    tip.remove();
    grip.classList.remove('on');
    endTx(); save(); renderRight(); positionHud();
  };
  cdoc.addEventListener('pointermove', move);
  cdoc.addEventListener('pointerup', up);
  cdoc.addEventListener('pointercancel', up);
}

/* Note this is the *visual* box: with the canvas scaled, its width and height are
   already multiplied by zoomK. Only three places mix outer coordinates with iframe
   ones, and all three are here — everything else measures inside the iframe, where
   the scale does not exist. `inFrame` and `toScreen` are the whole conversion. */
function frameRect() { return $('#canvas').getBoundingClientRect(); }
const inFrame = (v, off) => (v - off) / zoomK;      // screen px -> iframe px
const toScreen = (v, off) => v * zoomK + off;       // iframe px -> screen px

function moveGhost(e, fromFrame) {
  const r = frameRect();
  const x = fromFrame ? toScreen(e.clientX, r.left) : e.clientX;
  const y = fromFrame ? toScreen(e.clientY, r.top) : e.clientY;
  const g = $('#ghost'); g.style.left = x + 'px'; g.style.top = y + 'px';
}

function onDragMove(e, fromFrame) {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.startX, e.clientY - drag.startY) * (fromFrame ? zoomK : 1) < 5) return;
  drag.moved = true;
  moveGhost(e, fromFrame);
  const r = frameRect();
  /* findDrop works in iframe document coordinates, so a pointer that came from the
     outer document has to be divided by the scale, not just offset. */
  const x = fromFrame ? e.clientX : inFrame(e.clientX, r.left);
  const y = fromFrame ? e.clientY : inFrame(e.clientY, r.top);
  /* the bounds are compared in iframe units too — r.width is the scaled box */
  if (x < 0 || y < 0 || x > r.width / zoomK || y > r.height / zoomK) { drag.drop = null; showDrop(null); return; }
  const type = drag.kind === 'new' ? drag.type
    : drag.kind === 'pattern' ? 'section'
      : drag.kind === 'block' ? blockRootType(drag.blockId)
        : drag.kind === 'component' ? ((findComponent(drag.componentId) || {}).node || {}).type
          : locate(drag.id)?.node.type;
  if (!type) { drag.drop = null; showDrop(null); return; }
  const d = findDrop(x, y, type, drag.kind === 'move' ? drag.id : null);
  drag.drop = d;
  showDrop(d);
}

function findDrop(x, y, type, movingId) {
  const el = cdoc.elementFromPoint(x, y);
  if (!el) return null;
  const chain = [];
  let e = el;
  while (e && e !== cdoc.documentElement) {
    if (e.dataset && e.dataset.id && locate(e.dataset.id)) chain.push(e);
    e = e.parentElement;
  }
  if (chain.length && movingId) {                   // never drop inside what we're dragging
    const self = chain.findIndex(c => c.dataset.id === movingId);
    if (self > -1) chain.splice(0, self + 1);
  }
  let container = null, ci = -1;
  for (let i = 0; i < chain.length; i++) {
    const n = locate(chain[i].dataset.id).node;
    /* A slotless component instance has the root's type but no render location for
       page-owned children. Keep the canvas destination consistent with core insertion. */
    if (holds(n.type, type) && !(n.use && slotsOf(findComponent(n.use)).length === 0)) {
      container = n; ci = i; break;
    }
  }
  /* A component has one root and no page around it: a drop that found no container would land
     in a list that is thrown away, and the node with it. */
  if (!container && state.ui.mode === 'component') return null;
  const list = container ? container.children : tree();
  const horiz = !!(container && container.type === 'row');
  let index = list.length;

  const childEl = ci > 0 ? chain[ci - 1] : null;
  const direct = childEl && list.some(c => c.id === childEl.dataset.id) ? childEl : null;
  if (direct) {
    const idx = list.findIndex(c => c.id === direct.dataset.id);
    const r = direct.getBoundingClientRect();
    const mid = horiz ? r.left + r.width / 2 : r.top + r.height / 2;
    index = (horiz ? x : y) > mid ? idx + 1 : idx;
  } else {
    index = 0;
    for (const c of list) {
      const ce = cdoc.getElementById(c.id); if (!ce) { index++; continue; }
      const r = ce.getBoundingClientRect();
      const mid = horiz ? r.left + r.width / 2 : r.top + r.height / 2;
      if ((horiz ? x : y) > mid) index++;
    }
  }
  return { container, index, horiz, list };
}

function showDrop(d) {
  if (!cdoc) return;
  let ind = cdoc.getElementById('s-drop');
  const oldLabel = cdoc.getElementById('s-drop-label');
  if (oldLabel) oldLabel.remove();
  if (!d) { if (ind) ind.remove(); return; }
  if (!ind) { ind = cdoc.createElement('div'); ind.id = 's-drop'; cdoc.getElementById('s-hud').appendChild(ind); }
  const sx = cwin.scrollX, sy = cwin.scrollY;
  const { container, index, horiz, list } = d;
  const label = cdoc.createElement('div');
  label.id = 's-drop-label';
  const neighbor = list[index] || list[list.length - 1];
  label.textContent = (drag?.kind === 'move' ? 'Move' : 'Add') + ' ' + (drag?.label || 'element')
    + (neighbor ? (index < list.length ? ' before ' : ' after ') + kindOf(neighbor) : ' inside ' + (container ? kindOf(container) : 'page'));
  cdoc.getElementById('s-hud').appendChild(label);
  const placeLabel = () => {
    const bounds = ind.getBoundingClientRect(), box = label.getBoundingClientRect();
    label.style.left = Math.max(0, Math.min(bounds.left, cwin.innerWidth - box.width)) + sx + 'px';
    label.style.top = Math.max(0, bounds.top - box.height - 4 / zoomK) + sy + 'px';
  };

  if (!list.length) {
    const host = container ? (container.type === 'section' ? cdoc.querySelector('#' + container.id + ' > .pagecraft-container') : cdoc.getElementById(container.id)) : cdoc.getElementById('s-root');
    if (!host) return;
    const r = host.getBoundingClientRect();
    ind.className = 'box';
    Object.assign(ind.style, { left: r.left + sx + 'px', top: r.top + sy + 'px', width: r.width + 'px', height: Math.max(r.height, 40) + 'px' });
    placeLabel();
    return;
  }
  const after = index >= list.length;
  const refN = after ? list[list.length - 1] : list[index];
  const ref = cdoc.getElementById(refN.id);
  if (!ref) return;
  const r = ref.getBoundingClientRect();
  ind.className = '';
  if (horiz) {
    Object.assign(ind.style, { left: (after ? r.right : r.left) - 1.5 + sx + 'px', top: r.top + sy + 'px', width: '3px', height: r.height + 'px' });
  } else {
    Object.assign(ind.style, { left: r.left + sx + 'px', top: (after ? r.bottom : r.top) - 1.5 + sy + 'px', width: r.width + 'px', height: '3px' });
  }
  placeLabel();
}

/* These palette keys either create useful children immediately or persist as a shared base
   type, so document-diff inference cannot recover the element name the author chose. */
function semanticAddHistoryLabel(key) {
  return ['columns', 'flex', 'grid', 'linkbox', 'slider', 'list'].includes(key)
    ? 'Add ' + labelOf(key) : undefined;
}

function onDrop(e, fromFrame) {
  document.body.classList.remove('dragging');
  $('#ghost').style.display = 'none';
  showDrop(null);
  const d = drag; drag = null;
  dragDidMove = !!(d && d.moved);
  if (!d || !d.moved || !d.drop) { return; }
  const { container, index } = d.drop;
  if (d.kind === 'pattern') {
    let made = null;
    edit(() => { made = patternInsert(d.patId, container, index); if (made) selSet([made.id]); }, 'Add section');
    toast(made ? d.label + ' added' : 'That does not fit there');
  } else if (d.kind === 'block') {
    let made = null;
    edit(() => { made = blockInsert(d.blockId, container, index); if (made) selSet([made.id]); });
    toast(made ? findBlock(d.blockId).name + ' placed' : 'That block does not fit there');
  } else if (d.kind === 'component') {
    let made = null;
    edit(() => { made = instanceInsert(d.componentId, container, index); if (made) selSet([made.id]); });
    const cd = findComponent(d.componentId);
    toast(made ? (cd ? cd.name : 'Component') + ' placed' : 'That component does not fit there');
  } else if (d.kind === 'new') {
    let leaf = null;
    edit(() => { leaf = insert(d.type, container, index); if (leaf) selSet([leaf.id]); }, semanticAddHistoryLabel(d.type));
    if (leaf) PC_UI.recordElementUse(d.type);
    toast(leaf ? labelOf(d.type) + ' added' : 'That does not fit there');
  } else {
    const set = d.ids && d.ids.length > 1 ? d.ids : null;
    if (set) {
      let k = 0;
      edit(() => { k = moveMany(set, container, index); });
      toast(k === set.length ? `${k} elements moved` : k ? `${k} of ${set.length} moved — the rest do not fit there` : 'They do not fit there');
    } else {
      // The destination index describes the list before removal. moveMany also
      // adjusts that index for one element moving forward within its own list.
      edit(() => moveMany([d.id], container, index), 'Move ' + kindOf(locate(d.id).node).toLowerCase());
    }
  }
  requestAnimationFrame(() => revealSelection(true));
}

function placeRT() {
  const rt = $('#rt');
  if (!editing.on || editing.kind !== 'rich') { rt.classList.remove('show'); return; }
  const el = editing.el, fr = frameRect();
  const r = el.getBoundingClientRect();
  rt.classList.add('show');
  const w = rt.offsetWidth || 340;
  /* the toolbar lives in the outer document, so the element's iframe rect has to be
     scaled before it is offset — at 50% zoom it otherwise floats twice as far out */
  let left = toScreen(r.left + r.width / 2, fr.left) - w / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  let top = toScreen(r.top, fr.top) - rt.offsetHeight - 8;
  if (top < 54) top = Math.min(fr.top + r.bottom + 8, window.innerHeight - 40);
  rt.style.left = left + 'px'; rt.style.top = top + 'px';
}
/* `createLink` runs against the canvas iframe's live selection, and opening a
   dialog takes focus out of it. Save the range, put it back, then run the
   command — otherwise the link lands nowhere. */
async function linkPrompt() {
  if (!editing.on || editing.prompt) return;
  const host = editing.el;
  const sel = cwin.getSelection();
  const saved = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  editing.prompt = true;
  try {
    const url = await askText('Add a link', 'Link URL', 'https://', { ok: 'Add link', placeholder: 'https://example.com' });
    if (!editing.on || editing.el !== host || !host.isConnected) return;
    host.focus();
    if (saved && host.contains(saved.commonAncestorContainer)) {
      const selection = cwin.getSelection();
      selection.removeAllRanges(); selection.addRange(saved);
    }
    if (!url) return;
    const href = safeRichUrl(url);
    if (!href) {
      toast('Use a web, email, phone, page or anchor link.', { tone: 'error' });
      return;
    }
    cdoc.execCommand('createLink', false, href);
    // The keyboard shortcut does not pass through the toolbar's sync handler.
    syncEdit();
  } finally {
    editing.prompt = false;

    const lr = row && row.closest ? row.closest('.lrow[data-id]') : null;
    if (!lr) { layerDrag.drop = null; line.remove(); return; }

    const rel = (ev.clientY - r.top) / r.height;
    const zone = rel < 0.3 ? 'before' : rel > 0.7 ? 'after' : 'inside';
    const d = layerTarget(lr.dataset.id, zone, layerDrag.type, layerDrag.ids)

      || (zone === 'inside' ? layerTarget(lr.dataset.id, 'after', layerDrag.type, layerDrag.ids) : null);

    if (!d) { line.remove(); return; }
    const hr = host.getBoundingClientRect();
    if (zone === 'inside' && d.container && d.container.id === lr.dataset.id) {
      line.className = 'in';
      line.style.top = (r.top - hr.top) + 'px';
      line.style.height = r.height + 'px';
    } else {
      line.className = '';
      line.style.height = '';

    document.body.classList.remove('dragging');

    document.removeEventListener('pointermove', at);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    const d = layerDrag; layerDrag = null;
    if (!d || !d.drop || !d.moved) return;
    let k = 0;
    edit(() => { k = moveMany(d.ids, d.drop.container, d.drop.index); });
    if (d.ids.length > 1) toast(k ? `${k} element${k === 1 ? '' : 's'} moved` : 'They do not fit there');
  };
  try { e.target.setPointerCapture(e.pointerId); } catch (_) { }
  document.addEventListener('pointermove', at);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

function wordPressMediaUsageDetails(usedBy) {
  const statusLabels = {publish:'Published',private:'Private',draft:'Draft',pending:'Pending',future:'Scheduled'};
  const typeLabels = {page:'page',post:'post',pagecraft_global:'shared element'};
  const current = [], currentById = new Map(), revisionGroups = new Map();
  for (const item of Array.isArray(usedBy) ? usedBy : []) {
    if (item.type !== 'revision') {
      const row = {
        title:item.title || 'Private content',
        titleKnown:Boolean(item.title),
        detail:[statusLabels[item.status] || '', typeLabels[item.type] || 'content'].filter(Boolean).join(' '),
        references:new Set(item.references || []), revisions:0,
      };
      current.push(row);
      currentById.set(String(item.id), row);
      continue;
    }
    const key = item.parentId ? String(item.parentId) : `revision:${item.id}`;
    const group = revisionGroups.get(key) || {parentId:item.parentId ? String(item.parentId) : '', title:'', titleHidden:false, references:new Set(), count:0};
    group.count += 1;
    if (item.title) group.title ||= item.title; else group.titleHidden = true;
    for (const reference of item.references || []) group.references.add(reference);
    revisionGroups.set(key, group);
  }
  const rows = [...current];
  for (const group of revisionGroups.values()) {
    const currentRow = currentById.get(group.parentId);
    if (currentRow?.titleKnown && !group.titleHidden) {
      currentRow.revisions += group.count;
      for (const reference of group.references) currentRow.references.add(reference);
    } else {
      rows.push({
        title:group.titleHidden ? 'Private content' : group.title || 'Private content',
        detail:'', references:group.references, revisions:group.count,
      });
    }
  }
  return {
    currentCount:current.length,
    revisionCount:[...revisionGroups.values()].reduce((total, group) => total + group.count, 0),
    rows:rows.map(row => ({...row,references:[...row.references]})),
  };
}

/* Pin the reviewed draft; save before adopting it so rejected versions never enter Undo. */
async function mediaReplaceCommit(sourceId, replacementId, baseline) {
  while (saving) await new Promise(resolve => setTimeout(resolve, 25));
  if (loadBlocked) throw new Error('This site could not be opened, so nothing is being saved.');
  if (saveState === 'failed' || JSON.stringify(doc()) !== baseline) throw new Error('The draft changed. Review the replacement again.');
  if (!HOST?.assets?.retainsHistory || !SRV) throw new Error('This host does not support retained replacements.');
  const next = replaceMediaReferences(doc(), sourceId, replacementId);
  saving = true;
  try {
    const result = await HOST.documents.save({document:next, version:SRV.version});
    SRV.version = result.version; lastCloudDocument = JSON.stringify(next);
    if (JSON.stringify(doc()) !== baseline) {
      saveAgain = true;
      throw new Error('The draft changed while saving. Your newer edits were kept. Review the replacement again.');
    }
    edit(() => { state.meta=next.meta; state.pages=next.pages; state.header=next.header; state.footer=next.footer; });
    saveState='ok'; stamp('Draft saved — not published', false);
  } finally { saving=false; if(saveAgain){saveAgain=false;writeNow();} }
}
async function mediaReplace(id) {

    const file=Array.from(files)[0]; if(!file) return false;
