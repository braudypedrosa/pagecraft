            ${f.type === 'select'
        ? `<input class="ctl" data-x="fo" data-k="${k}" value="${esc(f.opts || '')}" placeholder="Option one, Option two">`
        : `<input class="ctl" data-x="fp" data-k="${k}" value="${esc(f.ph || '')}" placeholder="Placeholder">`}
            <button class="freq${f.required ? ' on' : ''}" data-x="fr" data-k="${k}" title="Required">Req</button>
          </div>
        </div>`).join('')}
        <button class="btn" data-x="fa" style="width:100%;justify-content:center;margin-top:${arr.length ? '6' : '0'}px;font-size:12px">${svg('plus', 12)} Add field</button>`);
    }
    case 'link': {
      const here = page().slug;
      const L = linkOf(n, c.k, here);
      const tkey = c.tk || 'target';
      const anchors = L.mode === 'page' ? anchorsOf(L.page || here) : [];
      /* "This item's own page" is only offered where there is an item to mean — inside
         a Collection List, or on a detail template — and only once some page templates
         the collection, or the link would resolve to nothing. */
      const lsc = bindScope(n.id);
      const hasDetail = lsc && state.pages.some(p => p.collection === lsc.col.id);
      const MODES = [['none', 'No link'], ['page', 'A page in this project'],
        ...(hasDetail ? [['item', `This item’s own page`]] : []),
        ['url', 'External URL'], ['email', 'Email address'], ['phone', 'Phone number']];
      return F(`<select class="ctl" data-x="lm">
          ${MODES.map(([v, l]) => `<option value="${v}"${L.mode === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}
        </select>
        ${L.mode === 'page' ? `<select class="ctl" data-x="lp" style="margin-top:var(--gap-1)">
            ${state.pages.map(p => `<option value="${esc(p.slug)}"${(L.page || here) === p.slug ? ' selected' : ''}>${esc(p.name)} — /${esc(p.slug)}.html</option>`).join('')}
          </select>
          <select class="ctl" data-x="lf" style="margin-top:var(--gap-1)">
            <option value="">Top of the page</option>
            ${anchors.map(id => `<option value="${esc(id)}"${L.frag === id ? ' selected' : ''}>#${esc(id)}</option>`).join('')}
            ${L.frag && !anchors.includes(L.frag) ? `<option value="${esc(L.frag)}" selected>#${esc(L.frag)} — missing</option>` : ''}
          </select>
          ${anchors.length ? '' : '<div class="note">That page has no anchors yet. Give an element an HTML anchor id under Advanced.</div>'}` : ''}
        ${['url', 'email', 'phone'].includes(L.mode) ? `<input class="ctl" data-x="lv"${L.mode === 'email' ? ' type="email"' : ''} value="${esc(L.value || '')}" placeholder="${L.mode === 'url' ? 'https://example.com' : L.mode === 'email' ? 'hello@example.com' : '+1 555 0100'}" style="margin-top:var(--gap-1)">` : ''}
        ${L.mode === 'item' && lsc ? `<div class="note">Each card links to its own page under <b>${esc(lsc.col.slug)}/</b>.</div>` : ''}
        ${L.mode !== 'none' ? `<div class="tog-row" style="margin-top:var(--gap-1)"><span>Open in a new tab</span>
          <button class="sw-tog${propVal(n, tkey) === '_blank' ? ' on' : ''}" data-x="lt"><i></i></button></div>` : ''}`);
    }
    case 'dims': {
      return F(`<div class="unit">
          <input class="ctl" data-x="dw" type="number" min="0" value="${esc(n.props.w || '')}" placeholder="width">
          <input class="ctl" data-x="dh" type="number" min="0" value="${esc(n.props.h || '')}" placeholder="height">
          <button class="btn" data-x="ddetect" style="flex:0 0 auto;font-size:12px" title="Read the real dimensions from the image">Detect</button>
        </div>`);
    }
    case 'items': {
      const arr = Array.isArray(val) ? val : [];
      return F(`${arr.map((it, k) => `<div class="irow">
        <input class="ctl" data-x="il" data-k="${k}" value="${esc(it.label || '')}" placeholder="Label">
        <input class="ctl" data-x="ih" data-k="${k}" value="${esc(it.href || '')}" placeholder="#anchor or page.html">
        <button class="x" data-x="iu" data-k="${k}" title="Move up"${k === 0 ? ' disabled' : ''}>${svg('caret', 11)}</button>
        <button class="x" data-x="ix" data-k="${k}" title="Remove">${svg('trash', 11)}</button>
      </div>`).join('')}
      <button class="btn" data-x="ia" style="width:100%;justify-content:center;margin-top:${arr.length ? '6' : '0'}px;font-size:11px">${svg('plus', 12)} Add link</button>`);
    }
    case 'qa': {
      const arr = Array.isArray(val) ? val : [];
      return F(`${arr.map((it, k) => `<div class="qarow">
          <div class="qarow-a">
            <input class="ctl" data-x="qq" data-k="${k}" value="${esc(it.q || '')}" placeholder="Question">
            <button class="x" data-x="qu" data-k="${k}" title="Move up"${k === 0 ? ' disabled' : ''}>${svg('caret', 11)}</button>
            <button class="x" data-x="qx" data-k="${k}" title="Remove">${svg('trash', 11)}</button>
          </div>
          <textarea class="ctl" data-x="qb" data-k="${k}" rows="2" placeholder="Answer — leave a blank line to start a new paragraph">${esc(it.a || '')}</textarea>
        </div>`).join('')}
        <button class="btn" data-x="qadd" style="width:100%;justify-content:center;margin-top:${arr.length ? '6' : '0'}px;font-size:12px">${svg('plus', 12)} Add question</button>`);
    }
    case 'icon': {
      const cur = ICON_PATHS[val] ? val : 'check';
      return F(`<div class="iconpick">${ICONS.map(([g, list]) => `
          <div class="ipgroup">${esc(g)}</div>
          <div class="ipgrid">${list.map(([nm]) =>
        `<button data-x="ico" data-v="${nm}" class="${nm === cur ? 'on' : ''}" title="${nm}">${iconSvg(nm)}</button>`).join('')}</div>`).join('')}
        </div>`);
    }
    case 'imgs': {
      const arr = Array.isArray(val) ? val : [];
      return F(`${arr.map((it, k) => {
        const ref = String(it.src || '').match(/^asset:([a-z0-9]+)$/);
        const a = ref && AS.mem.get(ref[1]);
        return `<div class="gtile">
            <span class="gthumb">${a ? `<img src="${a.url}" alt="">` : '<span>not in<br>project</span>'}</span>
            <span class="gmeta">
              <input class="ctl" data-x="ga" data-k="${k}" value="${esc(it.alt || '')}" placeholder="Alt text — describe it">
              <input class="ctl" data-x="gc" data-k="${k}" value="${esc(it.caption || '')}" placeholder="Caption (optional)">
            </span>
            <span class="gacts">
              <button class="x" data-x="gu" data-k="${k}" title="Move up"${k === 0 ? ' disabled' : ''}>${svg('caret', 11)}</button>
              <button class="x" data-x="gx" data-k="${k}" title="Remove">${svg('trash', 11)}</button>
            </span>
          </div>`;
      }).join('')}
        <div style="display:flex;gap:6px;margin-top:${arr.length ? '6' : '0'}px">
          <button class="btn" data-x="gadd" style="flex:1;justify-content:center;font-size:12px">${svg('image', 13)} Upload</button>
          ${AS.mem.size ? `<button class="btn" data-x="glib" style="flex:1;justify-content:center;font-size:12px" title="Pick from the Media library">${svg('copy', 13)} Library</button>` : ''}
        </div>
        <div class="note">Upload takes several files at once. Alt text is what a screen reader reads — the review asks for it.</div>`);
    }
    case 'cols': {
      const count = (n.children || []).length;
      const hit = matchLayout(n);
      const list = LAYOUTS[count] || [];
      return `<div class="f" data-ci="${i}">${labelHtml(c, n)}
        <div class="pick">${COUNTS.map(k =>
        `<button data-x="ccount" data-v="${k}" class="${k === count ? 'on' : ''}" title="${k} column${k === 1 ? '' : 's'}">${k}</button>`).join('')}</div>
        ${list.length > 1 ? `<label style="margin-top:var(--gap-2)">Layout</label>
        <div class="lay">${list.map((l, k) =>
          `<button data-x="clay" data-v="${k}" class="${hit === k ? 'on' : ''}" title="${l.map(w => Math.round(w) + '%').join(' / ')}">
             ${l.map(w => `<i style="flex-grow:${w}"></i>`).join('')}
           </button>`).join('')}</div>` : ''}
        <div class="note">${count > COUNTS[COUNTS.length - 1] ? `${count} columns — more than the presets cover. Set each column's width individually.` : 'Drag a gutter on the canvas to change the split. Reducing the count moves content into the last column.'}</div>
      </div>`;
    }
  }
  return '';
}

function groupHtml(name, items, n, base) {
  const key = n.type + ':' + name;
  const closed = state.ui.open[key] === false;
  return `<div class="group${closed ? ' closed' : ''}" data-gk="${key}">
    <div class="gh">${svg('caret', 10)} ${esc(name)}</div>
    <div class="gb">${items.map((c, i) => ctlHtml(n, c, base + i)).join('')}</div>
  </div>`;
}

function renderRight() {
  const box = $('#right');
  const s = state.ui.sel ? locate(state.ui.sel) : null;
  CUR = [];

  /* With nothing selected there is nothing to inspect, so the panel leaves and
     the canvas takes the space. What the empty state used to hold — the shortcut
     table — lives in the ? dialog, which is always reachable. */
  const was = box.hidden;
  box.hidden = !s;
  /* Joining or leaving changes the canvas width, so the selection frame and the
     px readout need recomputing once layout settles — `select()` paints the HUD
     before it calls this. */
  if (was !== box.hidden) requestAnimationFrame(() => { layoutCanvas(); positionHud(); renderDim(); });
  if (!s) { box.innerHTML = ''; return; }

  const n = s.node, d = DEF[n.type], tab = state.ui.stab;
  const content = d.controls.content || [];
  const style = d.controls.style || [];
  /* With several elements picked, the fields still come from the primary — it is
     the one type whose controls are guaranteed to exist — and `applyC` fans each
     edit out over the set. The header has to say so, or the count is the only
     clue that a slider just moved twelve things. */
  const ids = selIds(), many = ids.length > 1;
  const kinds = [...new Set(selNodes().map(x => DEF[x.type].label))];

  let html = `
    <div class="sHead">
      <div class="ic">${svg(d.icon, 14)}</div>
      <div class="tt"><b>${many ? ids.length + ' selected' : esc(d.label)}</b>
        <small>${many ? esc(kinds.join(' · ')) : '#' + esc(domIdOf(n))}</small></div>
      <button class="iconbtn" id="stCopy" title="Copy this element's styling (⌘⇧C)">${svg('pipette', 13)}</button>
      ${!many && s.parent ? `<button class="iconbtn" id="selParent" title="Select parent (esc)">${svg('caret', 13)}</button>` : ''}
    </div>
    ${styleClip.css ? `<div class="stclip">
      ${svg('pipette', 12)}
      <span class="cn">Holding <b>${esc(styleClip.from)}</b></span>
      <button class="btn tiny" id="stPaste" title="Replace the styling of ${many ? 'all ' + ids.length : 'this element'} (⌘⇧V)">Paste${many ? ' to ' + ids.length : ''}</button>
      <button class="x" id="stDrop" title="Forget it">${svg('trash', 11)}</button>
    </div>` : ''}
    <div class="tabs" id="sTabs">
      <button data-s="content" class="${tab === 'content' ? 'on' : ''}">Content</button>
      <button data-s="style" class="${tab === 'style' ? 'on' : ''}">Style</button>
      <button data-s="advanced" class="${tab === 'advanced' ? 'on' : ''}">Advanced</button>
    </div><div class="pane">`;

  if (tab === 'content') {
    CUR = content.slice();
    html += `<div class="group"><div class="gh">${svg('caret', 10)} ${esc(d.label)}</div><div class="gb">${content.map((c, i) => ctlHtml(n, c, i)).join('') || '<div class="note">No content options — use the Style tab.</div>'}</div></div>`;
  } else if (tab === 'style') {
    const applied = nodeClasses(n);
    const target = state.ui.target && findClass(state.ui.target) && applied.some(c => c.id === state.ui.target) ? state.ui.target : '';
    const pool = classes().filter(c => !applied.some(x => x.id === c.id));
    html += `<div class="group" data-gk="${n.type}:Styling"><div class="gh">${svg('caret', 10)} Styling</div><div class="gb">
      <div class="tgrow">
        <button class="tg${target ? '' : ' on'}" data-tg="">This element</button>
      </div>
      ${applied.map(c => {
      const uses = classUsage(c.id);
      return `<div class="tgrow">
          <button class="tg${target === c.id ? ' on' : ''}" data-tg="${c.id}">.${esc(c.id)}</button>
          <small>${uses} use${uses === 1 ? '' : 's'}</small>
          <button class="tgx" data-rm="${c.id}" title="Remove this class from the element">${svg('trash', 12)}</button>
        </div>`;
    }).join('')}
      <select class="ctl" data-x="addcls" style="margin-top:var(--gap-1)">
        <option value="">Add a class…</option>
        ${pool.map(c => `<option value="${c.id}">.${esc(c.id)} · ${classUsage(c.id)} use${classUsage(c.id) === 1 ? '' : 's'}</option>`).join('')}
        <option value="__new">＋ New class from this element…</option>
      </select>
      <div class="note">${target
      ? `Editing <b>.${esc(target)}</b> — every change here reaches all ${classUsage(target)} element${classUsage(target) === 1 ? '' : 's'} using it.`
      : applied.length
        ? 'Editing this element only. Its classes are listed above; pick one to edit it instead.'
        : 'Editing this element only. Save its styling as a class to reuse it elsewhere.'}</div>
    </div></div>`;

    let base = 0;
    if (style.length) { CUR = style.slice(); html += groupHtml('Typography & fill', style, n, 0); base = style.length; }
    COMMON_STYLE.forEach(g => {
      CUR = CUR.concat(g.items);
      html += groupHtml(g.g, g.items, n, base);
      base += g.items.length;
    });
  } else {
    const adv = [
      { t: 'text', k: '_id', label: 'HTML id', ph: autoId(n), note: 'Auto-generated unless you set one. This is what a link anchor targets.' },
      { t: 'text', k: '_cls', label: 'CSS classes', ph: 'hero card--dark' },
      { t: 'select', c: 'position', label: 'Position', opts: [['', 'Static'], ['relative', 'Relative'], ['absolute', 'Absolute'], ['sticky', 'Sticky'], ['fixed', 'Fixed']] },
      { t: 'unit', c: 'top', label: 'Top', r: 1, units: ['px', '%', 'rem'] },
      { t: 'unit', c: 'z-index', label: 'Z-index', units: [''] },
      { t: 'select', c: 'overflow', label: 'Overflow', opts: [['', 'Visible'], ['hidden', 'Hidden'], ['auto', 'Auto']] },
      { t: 'unit', c: 'max-width', label: 'Max width', r: 1, units: ['px', 'rem', '%', 'ch'] },
      { t: 'area', k: '_css', label: 'Custom CSS', rows: 4, ph: '& { … }' }
    ];
    CUR = adv.slice();
    html += `<div class="group"><div class="gh">${svg('caret', 10)} Identity & layout</div><div class="gb">${adv.map((c, i) => ctlHtml(n, c, i)).join('')}</div></div>
    ${DEF[n.type].level < 4 ? `<div class="group"><div class="gh">${svg('caret', 10)} Content source</div><div class="gb">
      <select class="ctl" id="advSrc">
        <option value="">— None —</option>
        ${collections().map(c => `<option value="${c.id}"${n.src === c.id ? ' selected' : ''}>${esc(c.name)} · ${c.items.length} item${c.items.length === 1 ? '' : 's'}</option>`).join('')}
      </select>
      ${n.src && findCollection(n.src)
        ? `<button class="btn" id="advBindAll" style="width:100%;justify-content:center;margin-top:var(--gap-1)">${svg('cms', 13)} Bind the fields inside…</button>`
        : ''}
      <div class="note">${n.src && findCollection(n.src)
        ? `Nothing on the canvas changes yet — this only opens the scope. Select something
           inside and click the badge beside a field to take its value from
           <b>${esc(findCollection(n.src).name)}</b>. The bar above shows which item is
           previewed; to repeat the whole set instead, use a <b>Collection list</b>.`
        : collections().length
          ? 'Point this at a collection and everything inside it can bind to a field.'
          : 'No collections yet — make one in <b>CMS</b>.'}</div>
    </div></div>` : ''}
    <div class="group"><div class="gh">${svg('caret', 10)} Visibility</div><div class="gb">
      ${['d', 't', 'm'].map(b => `<div class="tog-row" style="margin-bottom:var(--gap-1)"><span>${svg(b === 'd' ? 'desktop' : b === 't' ? 'tablet' : 'mobile', 12)} Hide on ${DEV_LABEL[b]}</span>
        <button class="sw-tog${n.hide && n.hide[b] ? ' on' : ''}" data-hide="${b}"><i></i></button></div>`).join('')}
      <div class="note">Ghosted on the canvas, so you can still select them.</div>
    </div></div>`;
  }

  html += `</div>
    <div class="sFoot">
      <button class="btn" id="sDup">${svg('copy', 13)} Duplicate${many ? ' all' : ''}</button>
      <button class="btn danger" id="sDel">${svg('trash', 13)} Delete${many ? ' all' : ''}</button>
    </div>`;
  box.innerHTML = html;
  bindRight(n);
}

/* ------------------------------------------------------ control wiring */
/* One edit reaches every selected element. The exception is a class target:
   its members already share the object, so it takes a single write and fanning
   out would just rewrite the same value N times. */
function applyC(n, c, v) {
  const ids = selIds();
  if (ids.length > 1 && ids.includes(n.id) && !(c.c && tgtIsClass(n))) {
    fanTargets(c, ids).forEach(t => applyOne(t, c, v));
    return;
  }
  applyOne(n, c, v);
}
function applyOne(n, c, v) {
  if (c.k === '_id') { n.adv.htmlId = v.replace(/[^\w-]/g, ''); return; }
  if (c.k === '_cls') { n.adv.cls = v; return; }
  if (c.k === '_css') { n.adv.css = v; return; }
  if (c.c) setCss(tgtObj(n), c.c, v, !!c.r);
  else n.props[c.k] = v;
}

function bindRight(n) {
  const box = $('#right');

  $$('.gh', box).forEach(h => h.addEventListener('click', () => {
    const g = h.parentElement, k = g.dataset.gk;
    g.classList.toggle('closed');
    if (k) state.ui.open[k] = !g.classList.contains('closed');
  }));
  const st = $('#sTabs');
  if (st) $$('button', st).forEach(b => b.addEventListener('click', () => { state.ui.stab = b.dataset.s; renderRight(); }));
  const sp = $('#selParent');
  if (sp) sp.addEventListener('click', () => { const h = locate(n.id); select(h.parent ? h.parent.id : null); });
  const abAll = $('#advBindAll');
  if (abAll) abAll.addEventListener('click', () => bindModal(n.id));
  const asrc = $('#advSrc');
  if (asrc) asrc.addEventListener('change', () => {
    edit(() => srcSet(n, asrc.value));
    /* not "Bound to X" — that is what binding a *field* does, and reusing the word
       here is most of why setting a source reads as though it should have changed
       something on its own */
    toast(asrc.value ? findCollection(asrc.value).name + ' is the scope — now bind a field' : 'Content source cleared');
  });
  const stC = $('#stCopy');
  if (stC) stC.addEventListener('click', () => {
    copyStyles(n.id);
    toast('Styles copied from ' + styleClip.from);
    renderRight();                                  // so the strip appears
  });
  const stP = $('#stPaste');
  if (stP) stP.addEventListener('click', () => {
    const ids = selIds();
    let k = 0;
    edit(() => { k = pasteStylesMany(ids); });
    toast(k > 1 ? `Styles pasted onto ${k} elements` : k ? 'Styles pasted' : 'Nothing changed');
  });
  const stD = $('#stDrop');
  if (stD) stD.addEventListener('click', () => {
    styleClip.css = null;
    renderRight();                                  // so the strip goes away
    toast('Style clipboard cleared');
  });
  const sd = $('#sDup'); if (sd) sd.addEventListener('click', () => runAct('dup', selIds()));
  const sx = $('#sDel'); if (sx) sx.addEventListener('click', () => runAct('del', selIds()));
  $$('[data-tg]', box).forEach(b => b.addEventListener('click', () => {
    state.ui.target = b.dataset.tg;
    renderRight();
  }));
  $$('[data-rm]', box).forEach(b => b.addEventListener('click', () => {
    if (state.ui.target === b.dataset.rm) state.ui.target = '';
    edit(() => classRemove(n, b.dataset.rm));
  }));
  const addCls = box.querySelector('[data-x="addcls"]');
  if (addCls) addCls.addEventListener('change', async () => {
    const v = addCls.value;
    if (!v) return;
    if (v === '__new') {
      const name = await askText('New class', 'Class name', DEF[n.type].label,
        { ok: 'Create class', note: 'Restyling it reaches every element using it.' });
      if (name === null) { addCls.value = ''; return; }
      edit(() => { state.ui.target = classFrom(n, name); });
      toast('Class created from this element');
      return;
    }
    edit(() => { classApply(n, v); state.ui.target = v; });
  });
  $$('[data-bind]', box).forEach(b => b.addEventListener('click', async () => {
    const key = b.dataset.bind, sc = bindScope(n.id);
    if (!sc) return;
    const cur = bindGet(n, key);
    const chosen = await askPick(`Bind to ${esc(sc.col.name)}`,
      [['', '— No binding, use the value typed here —'], ...sc.col.fields.map(f => [f.id, `${f.name} · ${f.type}`])],
      cur);
    if (chosen === null) return;
    edit(() => bindSet(n, key, chosen));
    toast(chosen ? 'Bound to ' + (findField(sc.col, chosen) || {}).name : 'Binding cleared');
  }));
  $$('[data-hide]', box).forEach(b => b.addEventListener('click', () => edit(() => {
    n.hide = n.hide || {}; n.hide[b.dataset.hide] = !n.hide[b.dataset.hide];
  })));

  $$('.f[data-ci]', box).forEach(f => {
    const c = CUR[+f.dataset.ci]; if (!c) return;
    const key = n.id + '|' + (c.c || c.k || c.t);
    const cssOnly = !!c.c;                       // writes a CSS property, not content
    const live = v => { tx(key); applyC(n, c, v); (cssOnly ? repaintCss : repaint)(); };
    const hard = v => {
      tx(key); applyC(n, c, v);
      if (cssOnly) paintCss(); else { paint(); renderLayers(); }
      save(); endTx(); renderRight();
    };

    /* responsive badge → clear the override for this breakpoint */
    const badge = f.querySelector('.rsp[data-clear="1"]');
    if (badge) badge.addEventListener('click', () => {
      tx(key + ':clear');
      const o = tgtObj(n);
      if (c.t === 'box') ['top', 'right', 'bottom', 'left'].forEach(s => { delete o.css[dk()][c.c + '-' + s]; });
      else delete o.css[dk()][c.c];
      endTx(); paintCss(); save(); renderRight();
    });

    const gv = x => f.querySelector(`[data-x="${x}"]`);

    switch (c.t) {
      case 'text': case 'area': {
        const el = gv('v');
        el.addEventListener('input', () => live(el.value));
        el.addEventListener('blur', endTx);
        break;
      }
      case 'select': { const el = gv('v'); el.addEventListener('change', () => hard(el.value)); break; }
      case 'unit': {
        const nu = gv('n'), uu = gv('u');
        const push = () => {
          const v = String(nu.value).trim();
          live(v === '' ? '' : v + (uu.value || ''));
        };
        nu.addEventListener('input', push);
        nu.addEventListener('blur', endTx);
        uu.addEventListener('change', () => { push(); endTx(); });
        break;
      }
      case 'slider': {
        const r = gv('r'), nn = gv('n');

function renderModebar() {
  const s = state.ui.sel ? locate(state.ui.sel) : null;
  const crumbs = [];
  if (s) {
    let cur = s;
    while (cur) { crumbs.unshift(cur.node); cur = cur.parent ? locate(cur.parent.id) : null; }
  }
  const scope = scopeOf();
  const R = REGIONS.find(x => x.kind === scope);
  $('#modebar').innerHTML =
    (scope === 'main'
      ? `<span class="pill">${svg('page', 11)} ${esc(page().name)}</span><span class="crumb">/${esc(page().slug)}.html</span>`
      : `<span class="pill g">${svg('globe', 11)} Editing ${esc(R.label.toLowerCase())} — shared by all ${state.pages.length} pages</span>`
        + `<button class="btn tiny" id="doneScope">Done</button>`) +
    `<span class="spacer"></span>` +
    (crumbs.length ? `<span class="crumb">${crumbs.map(n => esc(DEF[n.type].label)).join(' › ')}</span>` : '') +
    itemBarHtml() +
    `<span class="pill">${svg('desktop', 11)} ${DEV_LABEL[dk()]}${dk() !== 'd' ? ' override' : ' base'}</span>`;
  const ib = $('#itemBar');
  if (ib) $$('button', ib).forEach(b => b.addEventListener('click', () => {
    state.ui.item = state.ui.item || {};
    state.ui.item[b.dataset.col] = +b.dataset.i;
    paint(); renderModebar();
  }));
}

/* Which item the canvas is standing in for. Only shown when something on this
   page actually declares a source — otherwise it is noise. */
function itemBarHtml() {
  const seen = [];
  if (page().collection && findCollection(page().collection)) seen.push(page().collection);
  eachNode(tree(), n => { if (n.src && findCollection(n.src) && !seen.includes(n.src)) seen.push(n.src); });
  if (!seen.length) return '';
  return seen.map(id => {
    const col = findCollection(id);
    if (!col.items.length) return `<span class="pill">${svg('cms', 11)} ${esc(col.name)} — no items yet</span>`;
    const at = Math.min(previewIndex(id), col.items.length - 1);
    return `<span class="pill" id="itemBar" style="gap:4px">${svg('cms', 11)} ${esc(col.name)}
      <button data-col="${id}" data-i="${Math.max(0, at - 1)}" title="Previous item"${at === 0 ? ' disabled' : ''}>‹</button>
      <b style="font-weight:600">${esc(itemTitle(col, col.items[at]))}</b>
      <button data-col="${id}" data-i="${Math.min(col.items.length - 1, at + 1)}" title="Next item"${at === col.items.length - 1 ? ' disabled' : ''}>›</button>
      <small style="color:var(--text-3)">${at + 1}/${col.items.length}</small></span>`;
  }).join('');
}

/* The frame renders at its breakpoint's width and is scaled to fit whatever the
   panels leave. Everything the drag and selection code measures lives *inside* the
   iframe, so it keeps working in unscaled document coordinates — only the three
   places that cross the boundary need the factor, and `zoomK` is what they read. */
let zoomK = 1;
function layoutCanvas() {
  const wrap = $('#frameWrap'), cv = $('#canvas');
  if (!wrap || !cv) return;
  if (document.body.classList.contains('preview')) {
    /* preview is the real thing at real size — no frame, no scale */
    zoomK = 1;
    wrap.style.width = ''; cv.style.width = ''; cv.style.height = '';
    cv.style.transform = '';
    return;
  }
  const target = canvasWidth(state.ui.dev, state.meta.maxWidth);
  const stage = $('#stage');
  /* the stage's own padding is 16px a side; clientWidth already excludes any
     scrollbar, which is why it is read rather than the window */
  const avail = Math.max(120, stage.clientWidth - 32);
  const k = zoomK = zoomFor(state.ui.zoom, target, avail);
  wrap.style.width = Math.round(target * k) + 'px';
  cv.style.width = target + 'px';
  /* the wrap's height comes from flex and does not depend on the iframe, so this
     is not circular: the iframe is made tall enough that scaling fills the wrap */
  cv.style.height = Math.max(1, Math.round(wrap.clientHeight / k)) + 'px';
  cv.style.transform = k === 1 ? 'none' : `scale(${k})`;
  /* The selection HUD lives inside the iframe, so it is scaled along with the page.
     The frame has to be — it tracks the element — but its label bar and handles are
     editor chrome and were shrinking to 57% of legible. `--z` lets that CSS divide
     itself back out. Set after renderDoc(), which rewrites the document. */
  if (cdoc && cdoc.documentElement) cdoc.documentElement.style.setProperty('--z', String(k));
}

function renderDim() {
  const el = $('#dim');
  if (!el || !cwin) return;
  const target = canvasWidth(state.ui.dev, state.meta.maxWidth);
  const stage = $('#stage');
  /* what Fit *would* give, so the label reads the same whichever option is chosen */
  const pct = Math.round(fitZoom(target, Math.max(120, (stage ? stage.clientWidth : 0) - 32)) * 100);
  /* the width shown is the width the page is *rendered* at, which is now the same
     thing as the breakpoint being edited — that is the whole point of the scale */
  el.innerHTML = `<span>${esc(DEV_LABEL[dk()])}</span><b>${target} PX</b>`
    + `<span class="sep"></span>`
    + `<select id="zoomSel" title="Canvas zoom">${ZOOMS.map(([v, lb]) =>
      `<option value="${v}"${String(state.ui.zoom) === v ? ' selected' : ''}>${lb}${v === 'fit' ? ' · ' + pct + '%' : ''}</option>`).join('')}</select>`;
  const sel = $('#zoomSel');
  if (sel) sel.addEventListener('change', () => {
    state.ui.zoom = sel.value;
    layoutCanvas(); positionHud(); renderDim();
  });
}

/* The review runs on idle rather than on every keystroke, so a large project
   does not pay for it while you type. */
let reviewCounts = null;
const refreshReview = dbounce(() => {
  try { reviewCounts = lintCounts(lint()); } catch (e) { reviewCounts = null; }
  paintReview();
}, 700);
function paintReview() {
  const dot = $('#reviewDot'), txt = $('#reviewText');
  if (!dot || !txt) return;
  if (!reviewCounts) { dot.className = 'rdot'; txt.textContent = 'Review'; return; }
  const { error, warn } = reviewCounts;
  dot.className = 'rdot ' + (error ? 'bad' : warn ? 'warn' : 'ok');
  txt.textContent = error ? `${error} problem${error === 1 ? '' : 's'}`
    : warn ? `${warn} suggestion${warn === 1 ? '' : 's'}`
      : 'No problems';
  $('#reviewBtn').title = (error || warn) ? 'Open the review' : 'Nothing to fix';
}

function render(opts = {}) {
  paint(); paintSel();
  renderLayers(); renderPages(); renderCms(); renderRight(); renderModebar();
  renderPanelHead(); renderDoc(); layoutCanvas(); renderDim(); drawBlocks();
  paintReview(); refreshReview();
  const done = $('#doneScope');
  if (done) done.addEventListener('click', () => setMode('page'));
  paintHistory();
}

function setMode(m) {
  if (editing.on) exitEdit();
  state.ui.mode = m; selSet([]); render();
}
function setDev(d) {
  state.ui.dev = d;
  $$('#devSeg button').forEach(b => {
    const on = b.dataset.dev === d;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  const w = $('#frameWrap');
  w.className = 'frameWrap' + (d === 'desktop' ? '' : ' ' + d);
  layoutCanvas();
  render();
  /* the width transitions, so the scale that fits it has to be recomputed after —
     and the HUD repositioned against where the frame actually ended up */
  setTimeout(() => { layoutCanvas(); positionHud(); renderDim(); }, 260);
}
function togglePreview() {
  if (editing.on) exitEdit();
  const on = document.body.classList.toggle('preview');
  $('#previewBtn').innerHTML = on
    ? `${svg('edit', 14)} Exit preview`
    : `${svg('eye', 14)} Preview`;
  layoutCanvas();
  paint();
  if (!on) paintSel();
}


/* =============================================================== export */

async function exportPage(pg, mode, ctx = {}) {
  const raw = buildPage(pg, ctx);
  return mode === 'files' ? assetsToPaths(raw, ctx.rel || '') : await assetsToData(raw);
}


/* Saving a file: hosted viewers mediate it through the downloads capability,
   a plain browser (or the local file) uses an object URL. Same code both ways. */
let dlNs;
async function saveHost() {
  if (dlNs !== undefined) return dlNs;
  dlNs = null;
  try { if (typeof claude !== 'undefined' && claude.use) dlNs = await claude.use('downloads'); } catch (e) { dlNs = null; }
  return dlNs;
}
async function download(name, text, type = 'text/html;charset=utf-8') {
  const ns = await saveHost();
  if (ns) {
    try { await ns.save({ filename: name, data: text }); toast('Saved ' + name); return true; }
    catch (err) {
      const c = err && err.code;
      if (c === 'declined') { toast('Save cancelled'); return false; }
      if (c === 'extension_not_enabled') {
        try {
          await ns.save({ filename: name.replace(/\.html?$/, '') + '.txt', data: text });
          toast('Saved as .txt — rename it to .html'); return true;
        } catch (e2) { toast('Saving is blocked here — use Copy HTML'); return false; }
      }
      if (c === 'too_large') { toast('Too large to save — use Copy HTML'); return false; }
      if (c === 'rate_limited') { toast('One save at a time — try again'); return false; }
      /* anything else: fall through to the object-URL path */
    }
  }
  try {
    const url = URL.createObjectURL(new Blob([text], { type }));
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
    toast('Downloaded ' + name);
    return true;
  } catch (e) { toast('Download blocked here — use Copy HTML'); return false; }
}

/* ---- asking for something ---------------------------------------------
   Replaces native prompt() and confirm(). Those were unstyled OS chrome in the
   middle of an art-directed tool, and — the reason this had to change — sandboxed
   iframes refuse them outright, so naming a class or a colour silently did
   nothing in the published Artifact.
   Both return a promise: a string / true on confirm, null / false on any exit. */
let askDone = null;
function askOpen(title, bodyHtml, okLabel, danger) {
  askClose(null);                                     // never stack two asks
  $('#askTitle').textContent = title;
  $('#askBody').innerHTML = bodyHtml;
  const yes = $('#askYes');
  /* a picker resolves by choosing something, so it has no commit button and its
     only exit is labelled Close rather than Cancel */
  yes.hidden = okLabel === null;
  yes.textContent = okLabel || '';
  yes.classList.toggle('danger', !!danger);
  yes.classList.toggle('primary', !danger);
  $('#askNo').textContent = okLabel === null ? 'Close' : 'Cancel';
  $('#ask').hidden = false;
  const input = $('#askBody input');
  if (input) { input.focus(); input.select(); }
  else if (!yes.hidden) yes.focus();
  return new Promise(res => { askDone = res; });
}
function askClose(value) {
  $('#ask').hidden = true;
  const res = askDone; askDone = null;
  if (res) res(value);
}
const askOpenNow = () => !$('#ask').hidden;

/* a name, a URL — anything that used prompt() */
function askText(title, label, value = '', opts = {}) {
  return askOpen(title,
    `<div class="f" style="margin-bottom:0"><label>${esc(label)}</label>
       <input class="ctl" id="askIn" value="${esc(value)}" placeholder="${esc(opts.placeholder || '')}">
       ${opts.note ? `<div class="note">${opts.note}</div>` : ''}</div>`,
    opts.ok || 'Save', false);
}

/* a yes/no — anything that used confirm(). `msg` may carry markup. */
function askConfirm(title, msg, opts = {}) {
  return askOpen(title, `<div class="msg">${msg}</div>`, opts.ok || 'Delete', opts.danger !== false)
    .then(v => v === true);
}

/* The media library as a picker. Resolves with an asset id, or null. It rides the
   ask layer so it can open from inside Project settings without displacing it. */
/* one-of-many, for choosing a field. Resolves with the value, or null on exit. */
function askPick(title, opts, current = '') {

/* Naming and the global choice belong in one step — the toggle changes what saving
   means, so asking afterwards would be too late. Resolves {name, sync} or null. */
function askBlock(defaultName) {
  const p = askOpen('Save as a block', `
    <div class="f"><label>Block name</label>
      <input class="ctl" id="askIn" value="${esc(defaultName)}"></div>
    <div class="tog-row" style="margin-top:var(--gap-2)">
      <span>${svg('globe', 12)} Global — copies stay in step</span>
      <button class="sw-tog" id="askSync"><i></i></button>
    </div>
    <div class="note" id="askSyncNote"></div>`, 'Save block', false);
  const tog = $('#askSync'), note = $('#askSyncNote');
  const paint = () => {
    note.innerHTML = tog.classList.contains('on')
      ? 'Copies stay linked. Edit one, then push to the rest.'
      : 'Each copy is independent.';

      <div class="xrow">

        <button class="btn" id="exImport">Import project JSON…</button>

  /* Review the whole project before anything leaves the building. */
  const findings = lint();
  const counts = lintCounts(findings);
  const REGION_MODE = { 'page': 'page', 'global header': 'header', 'global footer': 'footer' };
  const drawReview = (open) => {
    const box = $('#exReview');
    const clean = !findings.length;
    box.innerHTML = `
      <div class="rh">
        <span class="dot ${clean ? 'ok' : counts.error ? 'bad' : 'warn'}"></span>

          ${f.nodeId ? `<button class="go" data-f="${i}">Show me</button>` : ''}

    $$('[data-f]', box).forEach(b => b.addEventListener('click', () => {

  const target = () => targets[+pick.value] || targets[0];
  const cur = () => { const t = target(); return exportPage(t.pg, mode.value, t); };

  const draw = async () => {
    code.textContent = 'Building…';
    const html = await cur();

    $('#exSize').textContent = (html.length / 1024).toFixed(1) + ' KB';
    $('#exNote').innerHTML = mode.value === 'files'

      : `One self-contained file: semantic markup, a single inline stylesheet, and every image embedded.

  };
  pick.addEventListener('change', draw);

      if (await download(assetFile(a).replace(/^assets\//, ''), a.blob, a.type) === false) return false;

    return true;
  };

  $('#exOne').addEventListener('click', async () => {
    const t = target();

       says where it belongs */

  $('#exAll').addEventListener('click', async () => {                 // one prompt at a time
    for (const t of targets) {
      const html = await exportPage(t.pg, mode.value, t);
      if (await download(t.path.replace(/\//g, '-'), html) === false) return;
    }
    if (mode.value === 'files') {
      for (const a of AS.mem.values()) {

      }

  $('#exCopy').addEventListener('click', async () => {
    const html = await cur();
    try { await navigator.clipboard.writeText(html); toast('HTML copied to clipboard'); }
    catch (e) {

      const sl = window.getSelection(); sl.removeAllRanges(); sl.addRange(r);

  });
  $('#exSeo').addEventListener('click', async () => {
    /* the button is disabled without a Site URL, so this is a belt-and-braces guard:
       a sitemap with no domain is worse than no sitemap */
    if (!state.meta.baseUrl) {
      toast('Add a Site URL in Project settings first');
      return;
    }
    if (await download('sitemap.xml', sitemapXml(), 'application/xml') === false) return;
    await download('robots.txt', robotsTxt(), 'text/plain');
  });
  /* The whole site as one archive: real folder paths, the images beside them, and
     the SEO files. This is the only export that can honour a nested detail page,
     since a browser download saves flat. */
  const buildSite = async () => {
    const files = [];
    for (const step of sitePlan()) {
      if (step.kind === 'page') files.push({ path: step.path, data: assetsToPaths(buildPage(step.target.pg, step.target), step.target.rel) });
      else if (step.kind === 'content') files.push({ path: step.path, data: contentJson(assetPath) });
      else if (step.kind === 'sitemap') files.push({ path: step.path, data: sitemapXml() });
      else if (step.kind === 'robots') files.push({ path: step.path, data: robotsTxt() });
    }
    /* every image any page references, once, at the path those pages point to */
    const seen = new Set();
    for (const t of exportTargets()) for (const a of assetsUsedIn(buildPage(t.pg, t))) seen.add(a.id);
    for (const id of seen) {
      const a = AS.mem.get(id);
      if (a && a.blob) files.push({ path: assetFile(a), data: a.blob });
    }
    return files;
  };
  $('#exZip').addEventListener('click', async () => {
    /* innerHTML, not textContent: the label carries an inline svg, and restoring a
       textContent snapshot silently stripped the icon for the rest of the session. */
    const btn = $('#exZip'), was = btn.innerHTML;
    btn.disabled = true; btn.textContent = 'Building…';
    try {
      const files = await buildSite();
      const blob = await makeZip(files);
      const name = (slugify(state.meta.name) || 'site') + '.zip';
      if (await download(name, blob, 'application/zip') !== false) {
        toast(`${files.length} file${files.length === 1 ? '' : 's'} · ${(blob.size / 1024).toFixed(0)} KB`);
      }
    } catch (e) {
      toast('Could not build the archive');
    } finally { btn.disabled = false; btn.innerHTML = was; }
  });
  /* The footer says what the committed action will actually produce, so the count
     is not hidden inside a tooltip on the button. */
  const foot = $('#exFoot');
  if (foot) {
    const n = sitePlan().length;
    const imgs = new Set();
    for (const t of exportTargets()) for (const a of assetsUsedIn(buildPage(t.pg, t))) imgs.add(a.id);
    foot.innerHTML = `The archive holds <b>${n + imgs.size}</b> file${n + imgs.size === 1 ? '' : 's'}`
      + ` — ${targets.length} page${targets.length === 1 ? '' : 's'}`
      + `${imgs.size ? `, ${imgs.size} image${imgs.size === 1 ? '' : 's'}` : ''}`
      + `${collections().length ? ', content.json' : ''}`
      + `${state.meta.baseUrl ? ', sitemap and robots' : ''}.`;
  }
  const exc = $('#exContent');
  if (exc) exc.addEventListener('click', () => download('content.json', contentJson(assetPath), 'application/json'));

  $('#exImport').addEventListener('click', () => {
    const fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.json,application/json';
    fi.onchange = () => {
      const f = fi.files[0]; if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        let d = null;
        try { d = migrate(JSON.parse(rd.result)); } catch (e) { d = null; }
        if (!d) { toast('That file is not a Slate project this build can open'); return; }
        hist.u.push(clone(doc()));
        state.meta = { ...state.meta, ...d.meta }; state.header = d.header || []; state.footer = d.footer || [];
        state.pages = d.pages; state.cur = 0; selSet([]);
        closeModal(); render(); writeNow(); toast('Project imported');
      };
      rd.readAsText(f);
    };
    fi.click();
  });
}

function wireAsset(pfx, set, redraw) {
  const take = async file => {
    const id = await mediaTake(file);
    if (!id) return;
    set('asset:' + id); redraw();
  };
  const choose = () => {
    const fi = document.createElement('input');
    fi.type = 'file'; fi.accept = 'image/*';
    fi.onchange = () => take(fi.files[0]);
    fi.click();
  };
  const up = $('#' + pfx + 'Up'); if (up) up.addEventListener('click', choose);
  const clr = $('#' + pfx + 'Clr'); if (clr) clr.addEventListener('click', () => { set(''); writeNow(); redraw(); });
  const lib = $('#' + pfx + 'Lib'); if (lib) lib.addEventListener('click', async () => {
    const id = await mediaPicker();
    if (!id) return;
    set('asset:' + id); writeNow(); redraw();
  });
  const drop = $('#' + pfx + 'Drop');
  if (drop) {
    drop.addEventListener('click', choose);
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => take(e.dataTransfer.files[0]));
  }
}

      <div class="f"><label>Language</label>${langSelect('mLang', m.lang)}</div>
      <div class="f"><label>Site URL <span style="color:var(--text-3);font-weight:400">— enables canonical tags and a sitemap</span></label>
        <input class="ctl" id="mBase" value="${esc(m.baseUrl)}" placeholder="https://example.com"></div>
    </div>
    <div class="fgrid">
      <div class="f"><label>Favicon</label><div id="mFavBox"></div></div>
      <div class="f"><label>Social share image <span style="color:var(--text-3);font-weight:400">— when a page has none</span></label><div id="mOgBox"></div></div>
    </div>

    <div class="f"><label>Colours <span style="color:var(--text-3);font-weight:500">— change one here and every element linked to it follows</span></label>
      <div id="mColors"></div></div>

    <div class="f"><label>Text styles <span style="color:var(--text-3);font-weight:500">— reusable typography, edited from any element that uses one</span></label>
      <div id="mStyles"></div></div>

    <div class="f"><label>Style classes <span style="color:var(--text-3);font-weight:500">— any reusable styling; later in the list wins</span></label>
      <div id="mClasses"></div></div>

    <div class="f"><label>Global CSS — injected into every exported page</label>
      <textarea class="ctl" id="mCss" style="min-height:88px">${esc(m.css)}</textarea></div>
    <div class="f"><label>Extra &lt;head&gt; HTML — web fonts, analytics, favicons</label>
      <textarea class="ctl" id="mHeadHtml" style="min-height:66px" placeholder="&lt;link rel=&quot;stylesheet&quot; href=&quot;https://fonts.googleapis.com/…&quot;&gt;">${esc(m.headHtml)}</textarea></div>`, `
    <button class="btn" id="mBlank" title="Clear the pages and global regions, keep your colours and styles">Start an empty site</button>
    <button class="btn danger" id="mReset">Reset to demo content</button>
    <span style="flex:1"></span>
    <button class="btn primary" id="mDone">Done</button>`);

  const wire = (id, fn) => {
    const el = $('#' + id); if (!el) return;
    el.addEventListener('input', () => { fn(el.value); paintCss(); save(); });
  };
  wire('mName', v => { m.name = v; renderModebar(); });

  const wireSel = (id, fn) => {
    const el = $('#' + id); if (!el) return;
    el.addEventListener('change', () => { fn(el.value); paintCss(); save(); });
  };
  wireSel('mFont', v => { m.font = v || FONT_BASE[1][0]; });
  wireSel('mHead', v => { m.headFont = v; });
  wire('mBase', v => { m.baseUrl = v.trim(); });
  wireUnit('mMax', null, v => { m.maxWidth = v || '1200px'; });
  wireUnit('mSize', null, v => { m.size = v || '16px'; });
  const langEl = $('#mLang');
  if (langEl) langEl.addEventListener('change', () => { m.lang = langEl.value; paintCss(); save(); });

  const drawFav = () => {
    $('#mFavBox').innerHTML = assetField('mFav', m.favicon, 'Exported as a &lt;link rel="icon"&gt;.');
    wireAsset('mFav', v => { m.favicon = v; }, drawFav);
  };
  const drawOg = () => {
    $('#mOgBox').innerHTML = assetField('mOg', m.ogImage,
      'Crawlers need an absolute URL, so this works once a <b>Site URL</b> is set and you export with <b>images as separate files</b>.');
    wireAsset('mOg', v => { m.ogImage = v; }, drawOg);
  };
  drawFav(); drawOg();
  wire('mCss', v => { m.css = v; });
  wire('mHeadHtml', v => { m.headHtml = v; });

  /* ---- colour tokens ---- */
  function drawColors() {
    const box = $('#mColors'); if (!box) return;
    box.innerHTML = colors().map(t => {
      const lock = RESERVED.includes(t.id);
      return `<div class="arow" data-c="${t.id}">
        <span class="sw"><i style="background:${esc(t.value)}"></i>
          <input type="color" data-cp="${t.id}" value="${/^#[0-9a-f]{6}$/i.test(t.value) ? t.value : '#888888'}"></span>
        <span class="an">
          <input class="ctl" data-cn="${t.id}" value="${esc(t.name)}" style="font-size:12.5px;font-weight:600">
        </span>
        <input class="ctl" data-cv="${t.id}" value="${esc(t.value)}" style="width:92px;flex:0 0 92px;font-family:var(--mono);font-size:11px">
        ${lock
        ? `<span class="rowlock" title="Built in — part of the brand, so it cannot be deleted">${svg('lock', 13)}</span>`
        : `<button class="iconbtn" data-cd="${t.id}" title="Delete — usages keep this colour as a literal">${svg('trash', 13)}</button>`}
      </div>`;
    }).join('') + `<button class="btn" id="mColorAdd" style="width:100%;justify-content:center;font-size:11px">${svg('plus', 12)} Add colour</button>`;

    const set = (id, v) => {
      const t = findColor(id); if (!t) return;
      t.value = v;
      const row = box.querySelector(`[data-c="${id}"]`);
      row.querySelector('.sw i').style.background = v;
      const cp = row.querySelector('[data-cp]'), cv = row.querySelector('[data-cv]');
      if (/^#[0-9a-f]{6}$/i.test(v) && cp.value !== v) cp.value = v;
      if (cv.value !== v) cv.value = v;
      paintCss(); save();
    };
    $$('[data-cp]', box).forEach(el => el.addEventListener('input', () => { tx('tok:' + el.dataset.cp); set(el.dataset.cp, el.value); }));
    $$('[data-cv]', box).forEach(el => el.addEventListener('input', () => { tx('tok:' + el.dataset.cv); set(el.dataset.cv, el.value.trim()); }));
    $$('[data-cn]', box).forEach(el => el.addEventListener('input', () => {
      tx('tokname:' + el.dataset.cn);
      const t = findColor(el.dataset.cn); if (t) { t.name = el.value; save(); }
    }));
    $$('[data-cd]', box).forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.cd, used = colorUsage(id);
      if (used && !await askConfirm('Delete this colour token?', `<b>${esc(findColor(id).name)}</b> is used ${used}×. Those elements keep the colour, as a literal value — they just stop following the token.`, { ok: 'Delete token' })) return;
      edit(() => colorDelete(id));
      drawColors(); toast('Token deleted, colours kept');
    }));
    $('#mColorAdd').addEventListener('click', async () => {
      const name = await askText('New colour token', 'Colour name', 'New colour', { ok: 'Add colour' });
      if (name === null) return;
      edit(() => colorAdd(name, '#888888'));
      drawColors();
    });
  }
  drawColors();

  /* ---- text styles: created, named and edited here ---- */
  let openStyle = null, styleDev = 'd';
  const TS_WEIGHTS = [['', 'Default'], ['300', 'Light 300'], ['400', 'Regular 400'], ['500', 'Medium 500'],
  ['600', 'Semibold 600'], ['700', 'Bold 700'], ['800', 'Extrabold 800'], ['900', 'Black 900']];
  const TS_CASE = [['', 'None'], ['uppercase', 'UPPERCASE'], ['lowercase', 'lowercase'], ['capitalize', 'Capitalize']];

  function styleEditor(t) {
    const b = t.css[styleDev] || {};
    const base = t.css.d || {};
    const ph = k => styleDev === 'd' ? '' : (base[k] || '');
    const uf = (prop, units) => {
      const p = parseU(b[prop]);
      return `<div class="unit">
          <input class="ctl" data-sv="${prop}" type="number" step="any" value="${esc(p.n)}" placeholder="${esc(parseU(ph(prop)).n || 'auto')}">
          <select class="ctl" data-su="${prop}">${units.map(u => `<option value="${u}"${u === p.u ? ' selected' : ''}>${u || '—'}</option>`).join('')}</select>
        </div>`;
    };
    const colVal = b.color || '';
    const tok = refId(colVal) ? findColor(refId(colVal)) : null;
    return `<div class="tsedit">
      <div class="pick" style="margin-bottom:var(--gap-2)">
        ${['d', 't', 'm'].map(d => `<button data-sd="${d}" class="${styleDev === d ? 'on' : ''}">${svg(d === 'd' ? 'desktop' : d === 't' ? 'tablet' : 'mobile', 12)} ${DEV_LABEL[d]}</button>`).join('')}
      </div>
      <div class="row2">
        <div class="f"><label>Size</label>${uf('font-size', U.size)}</div>
        <div class="f"><label>Weight</label><select class="ctl" data-sv="font-weight">
          ${TS_WEIGHTS.map(([v, l]) => `<option value="${v}"${(b['font-weight'] || '') === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select></div>
      </div>
      <div class="row2">
        <div class="f"><label>Line height</label>${uf('line-height', U.line)}</div>
        <div class="f"><label>Letter spacing</label>${uf('letter-spacing', U.track)}</div>
      </div>
      <div class="f"><label>Font</label>${fontSelect('tsFont', b['font-family'] || '')}</div>
      ${styleDev === 'd' ? `<div class="f"><label>Default HTML tag <span style="color:var(--text-3);font-weight:400">— applied when a heading takes this style</span></label>
        <select class="ctl" id="tsTag">
          ${[['', 'Leave as-is'], ['h1', 'H1'], ['h2', 'H2'], ['h3', 'H3'], ['h4', 'H4'], ['h5', 'H5'], ['h6', 'H6'], ['p', 'Paragraph'], ['div', 'div — not a heading']]
        .map(([v, l]) => `<option value="${v}"${(t.tag || '') === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select></div>` : ''}
      <div class="row2">
        <div class="f"><label>Transform</label><select class="ctl" data-sv="text-transform">
          ${TS_CASE.map(([v, l]) => `<option value="${v}"${(b['text-transform'] || '') === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select></div>
        <div class="f"><label>Colour</label>
          <div class="clr">
            <span class="sw"><i style="background:${esc(resolveColor(colVal) || 'transparent')}"></i></span>
            ${tok ? `<span class="tokchip">${svg('link', 10)} ${esc(tok.name)}</span>`
        : `<input class="ctl hex" data-sv="color" value="${esc(colVal)}" placeholder="${esc(ph('color') || 'inherit')}">`}
            <button class="x" data-sclr="1" title="Clear">${svg('trash', 11)}</button>
          </div>
          <div class="toks">${colors().map(c =>
          `<button class="tok${tok && tok.id === c.id ? ' on' : ''}" data-stok="${c.id}" title="${esc(c.name)}" style="background:${esc(c.value)}"></button>`).join('')}</div>
        </div>
      </div>
      <div class="note">${styleDev === 'd'
        ? 'The base values. Switch to Tablet or Mobile to override only what differs there.'
        : 'Only what you set here overrides desktop. Empty fields fall through to the base value shown as a placeholder.'}</div>
    </div>`;
  }

  function drawStyles() {
    const box = $('#mStyles'); if (!box) return;
    box.innerHTML = styles().map(t => {
      const d = t.css.d || {};
      const open = openStyle === t.id;
      return `<div class="arow${open ? ' open' : ''}" data-t="${t.id}">
        <span style="flex:0 0 40px;text-align:center;font-weight:${d['font-weight'] || 500};font-size:${Math.min(19, parseInt(d['font-size'] || 16, 10) || 16)}px;color:var(--text)">Aa</span>
        <span class="an">
          <input class="ctl" data-tn="${t.id}" value="${esc(t.name)}" style="font-size:12.5px;font-weight:600">
        </span>
        <input class="ctl" data-tsize="${t.id}" value="${esc(d['font-size'] || '')}" placeholder="auto"
          title="Base size — expand the row to set a Tablet or Mobile override"
          style="width:74px;flex:0 0 74px;font-family:var(--mono);font-size:11px">
        <select class="ctl" data-tweight="${t.id}" title="Base weight" style="width:118px;flex:0 0 118px;font-size:11.5px">
          ${TS_WEIGHTS.map(([v, l]) => `<option value="${v}"${(d['font-weight'] || '') === v ? ' selected' : ''}>${l}</option>`).join('')}
        </select>
        <button class="iconbtn${open ? ' flip' : ''}" data-te="${t.id}" title="${open ? 'Close' : 'Line height, letter spacing, colour, and per-breakpoint overrides'}">${svg('caret', 13)}</button>
        <button class="iconbtn" data-td="${t.id}" title="Delete — elements keep the look">${svg('trash', 13)}</button>
      </div>${open ? styleEditor(t) : ''}`;
    }).join('') + `<button class="btn" id="mStyleAdd" style="width:100%;justify-content:center">${svg('plus', 12)} Add text style</button>`;

    $$('[data-tn]', box).forEach(el => el.addEventListener('input', () => {
      tx('tsname:' + el.dataset.tn);
      const t = findStyle(el.dataset.tn); if (t) { t.name = el.value; save(); }
    }));
    /* Size and weight are editable in the row itself — the read-only meta line that
       used to sit here made every row two lines tall and could not be acted on.
       Both write the desktop base; the expanded editor is where breakpoints live. */
    $$('[data-tsize]', box).forEach(el => {
      const push = () => {
        const t = findStyle(el.dataset.tsize); if (!t) return;
        tx('tssize:' + t.id);
        const base = (t.css.d = t.css.d || {});
        const raw = String(el.value).trim();
        const p = parseU(raw);
        if (raw === '' || p.n === '') delete base['font-size'];
        else base['font-size'] = p.n + (p.u || 'px');   // a bare number means px
        paintCss(); save();
      };
      el.addEventListener('input', push);
      el.addEventListener('blur', () => { endTx(); drawStyles(); });
    });
    $$('[data-tweight]', box).forEach(el => el.addEventListener('change', () => {
      const t = findStyle(el.dataset.tweight); if (!t) return;
      tx('tsweight:' + t.id);
      const base = (t.css.d = t.css.d || {});
      if (el.value === '') delete base['font-weight']; else base['font-weight'] = el.value;
      endTx(); paintCss(); save(); drawStyles();
    }));
    $$('[data-te]', box).forEach(b => b.addEventListener('click', () => {
      openStyle = openStyle === b.dataset.te ? null : b.dataset.te;
      styleDev = 'd';
      drawStyles();
    }));
    $$('[data-td]', box).forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.td, used = tsUsage(id);
      if (used && !await askConfirm('Delete this text style?', `<b>${esc(findStyle(id).name)}</b> is used by ${used} element${used === 1 ? '' : 's'}. They keep their current look — they just stop following the style.`, { ok: 'Delete style' })) return;
      edit(() => styleDelete(id));
      if (openStyle === id) openStyle = null;
      drawStyles(); toast('Style deleted, looks kept');
    }));
    $('#mStyleAdd').addEventListener('click', async () => {
      const name = await askText('New text style', 'Style name', 'New style', { ok: 'Add style' });
      if (name === null) return;
      const base = tokenId(name) || 'style';
      let id = base, k = 2;
      while (findStyle(id)) id = base + '-' + k++;
      edit(() => state.meta.tokens.text.push({
        id, name: String(name).slice(0, 40),
        css: { d: { 'font-size': '16px', 'font-weight': '400', 'line-height': '1.5' }, t: {}, m: {} }
      }));
      openStyle = id; styleDev = 'd';
      drawStyles();
      toast('Text style created — set its values below');
    });

    /* ---- the expanded editor ---- */
    const t = openStyle && findStyle(openStyle);
    if (!t) return;
    const bucket = () => (t.css[styleDev] = t.css[styleDev] || {});
    const commit = () => { paintCss(); save(); };
    $$('[data-sd]', box).forEach(b => b.addEventListener('click', () => { styleDev = b.dataset.sd; drawStyles(); }));
    $$('select[data-sv]', box).forEach(el => el.addEventListener('change', () => {
      tx('tsval:' + t.id + el.dataset.sv);
      if (el.value === '') delete bucket()[el.dataset.sv]; else bucket()[el.dataset.sv] = el.value;
      endTx(); commit(); drawStyles();
    }));
    $$('input[data-sv]', box).forEach(el => {
      const prop = el.dataset.sv;
      const unit = box.querySelector(`[data-su="${prop}"]`);
      const push = () => {
        tx('tsval:' + t.id + prop);
        const raw = String(el.value).trim();
        if (raw === '') delete bucket()[prop];
        else bucket()[prop] = unit ? raw + unit.value : raw;
        commit();
      };
      el.addEventListener('input', push);
      el.addEventListener('blur', () => { endTx(); drawStyles(); });
      if (unit) unit.addEventListener('change', () => { push(); endTx(); });
    });
    const tagEl = $('#tsTag');
    if (tagEl) tagEl.addEventListener('change', () => {
      tx('tstag:' + t.id);
      if (tagEl.value) t.tag = tagEl.value; else delete t.tag;
      endTx(); save();
    });
    const fontEl = $('#tsFont');
    if (fontEl) fontEl.addEventListener('change', () => {
      tx('tsval:' + t.id + 'font');
      if (fontEl.value) bucket()['font-family'] = fontEl.value; else delete bucket()['font-family'];
      endTx(); commit(); drawStyles();
    });
    $$('[data-stok]', box).forEach(b => b.addEventListener('click', () => {
      tx('tsval:' + t.id + 'color');
      bucket().color = cvar(b.dataset.stok);
      endTx(); commit(); drawStyles();
    }));
    const sclr = box.querySelector('[data-sclr]');
    if (sclr) sclr.addEventListener('click', () => {
      tx('tsval:' + t.id + 'color');
      delete bucket().color;
      endTx(); commit(); drawStyles();
    });
  }
  drawStyles();

  /* ---- style classes ---- */
  function drawClasses() {
    const box = $('#mClasses'); if (!box) return;
    const list = classes();
    box.innerHTML = list.length ? list.map((c, i) => {
      const props = ['d', 't', 'm'].reduce((k, b) => k + Object.keys(c.css[b] || {}).length, 0);
      return `<div class="arow" data-k="${c.id}">
        <span style="flex:0 0 34px;text-align:center;font-family:var(--label);font-size:11px;color:var(--text-3)">.${esc(c.id.slice(0, 4))}</span>
        <span class="an">
          <input class="ctl" data-kn="${c.id}" value="${esc(c.name)}" style="font-size:12.5px;font-weight:600">
        </span>
        <span class="rowmeta" title="${props} declaration${props === 1 ? '' : 's'} in this class">${props} decl</span>
        <button class="iconbtn" data-ku="${c.id}" title="Raise precedence"${i === 0 ? ' disabled' : ''}>${svg('caret', 12)}</button>
        <button class="iconbtn" data-kd="${c.id}" title="Delete — elements keep the look">${svg('trash', 13)}</button>
      </div>`;
    }).join('') + `<div class="note">Precedence runs top to bottom: a class lower in this list overrides one above it. An element's own styling always wins.</div>`
      : `<div class="note">No classes yet. Select an element, open <b>Style</b>, and save its styling as a class.</div>`;

    $$('[data-kn]', box).forEach(el => el.addEventListener('input', () => {
      tx('clsname:' + el.dataset.kn);
      const c = findClass(el.dataset.kn); if (c) { c.name = el.value; save(); }
    }));
    $$('[data-ku]', box).forEach(b => b.addEventListener('click', () => {
      edit(() => classMove(b.dataset.ku, -1)); drawClasses();
    }));
    $$('[data-kd]', box).forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.kd, uses = classUsage(id);
      if (uses && !await askConfirm('Delete this class?', `<b>${esc(findClass(id).name)}</b> is used by ${uses} element${uses === 1 ? '' : 's'}. They keep their current look — they just stop sharing it.`, { ok: 'Delete class' })) return;
      edit(() => classDelete(id));
      drawClasses(); toast('Class deleted, looks kept');
    }));
  }
  drawClasses();

  /* ---- image manager ---- */

  $('#mDone').addEventListener('click', () => { closeModal(); render(); });
  /* Naming the site *is* the confirmation: cancelling the name cancels the whole
     thing, so there is one dialog rather than a warning followed by a prompt — and
     naming it is what you were going to do next anyway. */
  $('#mBlank').addEventListener('click', async () => {
    const name = await askText('Start an empty site', 'Site name', '', {
      ok: 'Start empty',
      placeholder: state.meta.name === 'Pagecraft' ? 'My site' : state.meta.name,
      note: 'Clears every page, the global header and footer, and the items in any CMS '
        + 'collection. Your colours, text styles, classes, saved blocks and the collections '
        + 'themselves stay — and ⌘Z brings this project back.'
    });
    if (name === null) return;
    edit(() => blankProject(name));
    selSet([]); closeModal(); render(); writeNow();
    toast('Empty site — add your first section');
    showPanel('add');
  });

  $('#mReset').addEventListener('click', async () => {
    if (!await askConfirm('Replace everything?', '<b>Your current pages are lost.</b> Export a project JSON first to keep them.', { ok: 'Replace with demo' })) return;
    hist.u.push(clone(doc()));
    seed(); selSet([]); closeModal(); render(); writeNow(); toast('Demo content restored');
  });
}

/* ---- find and replace -----------------------------------------------
   Grouped by where a hit lives, because "which page was that on" is the question
   being asked. A row is a button: it switches page or global region, selects the
   element and scrolls to it. Replace is one action over the whole project with undo
   behind it, since a per-hit replace list goes stale the moment the first one lands. */
let findState = { q: '', to: '', ci: true };
/* ---- the bind sheet -------------------------------------------------
   One dialog that shows the whole mapping and commits it in one go. Binding used to
   be one control at a time — select, open Content, click the badge, pick a field,
   repeat — which was about fifteen interactions for a five-field card, and there was
   nowhere to see what was bound to what. */
function bindModal(rootId) {
  if (editing.on) exitEdit();
  const sc = bindScope(rootId);
  if (!sc) { toast('Point this at a collection first'); return; }
  const col = sc.col;
  const slots = bindSlots(rootId);
  if (!slots.length) {
    toast('Nothing inside this to bind — add a Heading, an Image or a text block');
    return;
  }
  let map = guessBindings(slots, col);
  const key = s => s.nodeId + '|' + s.key;

  const draw = () => {
    const set = Object.values(map).filter(Boolean).length;
    $('#bsCount').innerHTML = set
      ? `<b>${set}</b> of ${slots.length} bound to <b>${esc(col.name)}</b>`
      : `Nothing bound yet. ${slots.length} places could take a value.`;
    $('#bsBody').innerHTML = `<table class="cmst"><thead><tr>
        <th>Element</th><th style="width:150px">Its field</th><th style="width:230px">Takes its value from</th>
      </tr></thead><tbody>${slots.map((s, i) => `<tr>
        <td><b style="font-size:12.5px">${esc(s.element)}</b><br><small style="font-family:var(--label);font-size:11px;color:var(--text-3)">${esc(DEF[s.type].label)}</small></td>
        <td>${esc(s.label)}</td>
        <td><select class="ctl" data-b="${i}">
          <option value="">— not bound —</option>
          ${col.fields.map(f => `<option value="${f.id}"${map[key(s)] === f.id ? ' selected' : ''}>${esc(f.name)} · ${f.type}</option>`).join('')}
        </select></td>
      </tr>`).join('')}</tbody></table>`;
    $$('#bsBody select').forEach(el => el.addEventListener('change', () => {
      map[key(slots[+el.dataset.b])] = el.value;
      draw();
    }));
  };

  openModal(`Bind to ${col.name}`, `
    <div class="note" style="margin:0 0 var(--gap-2)">Each row takes its value from a field, once
      per item. A field can be used twice if you want it twice. Nothing is written until you commit.</div>
    <div id="bsBody"></div>`, `
    <span class="note" id="bsCount" style="margin:0;flex:1;text-align:left"></span>
    <button class="btn" id="bsGuess">Suggest again</button>
    <button class="btn" id="bsNone">Clear all</button>
    <button class="btn primary" id="bsOk">Bind</button>`, 'lg');

  $('#bsGuess').addEventListener('click', () => { map = guessBindings(slots.map(s => ({ ...s, current: '' })), col); draw(); });
  $('#bsNone').addEventListener('click', () => { slots.forEach(s => { map[key(s)] = ''; }); draw(); });
  $('#bsOk').addEventListener('click', () => {
    let n = 0;
    edit(() => { n = applyBindings(map); });
    closeModal(); render();
    toast(n ? `${n} binding${n === 1 ? '' : 's'} set` : 'Nothing changed');
  });
  draw();
}

function findModal() {
  if (editing.on) exitEdit();
  openModal('Find and replace', `
    <div class="fgrid" style="margin-bottom:var(--gap-2)">
      <div class="f"><label>Find</label>
        <input class="ctl" id="fdQ" value="${esc(findState.q)}" placeholder="Text on any page, or in the CMS" autocomplete="off"></div>
      <div class="f"><label>Replace with</label>
        <input class="ctl" id="fdTo" value="${esc(findState.to)}" placeholder="Leave empty to delete it" autocomplete="off"></div>
    </div>
    <div class="tog-row" style="margin-bottom:var(--gap-2)"><span>Match case</span>
      <button class="sw-tog${findState.ci ? '' : ' on'}" id="fdCase"><i></i></button></div>
    <div id="fdOut"></div>`, `
    <span class="note" id="fdCount" style="margin:0;flex:1;text-align:left"></span>
    <button class="btn danger" id="fdRep">Replace all</button>
    <button class="btn primary" id="fdDone">Close</button>`);

  const q = $('#fdQ'), to = $('#fdTo'), out = $('#fdOut'), count = $('#fdCount'), rep = $('#fdRep');

  const draw = () => {
    findState.q = q.value; findState.to = to.value;
    const hits = searchAll(findState.q, { caseSensitive: !findState.ci });
    const total = searchCount(hits);
    rep.disabled = !total;
    count.innerHTML = !findState.q
      ? 'Searches every page, both global regions and the CMS.'
      : total
        ? `<b>${total}</b> occurrence${total === 1 ? '' : 's'} in ${hits.length} place${hits.length === 1 ? '' : 's'}`
        : 'Nothing found.';
    if (!findState.q) { out.innerHTML = '<div class="empty">Type to search.</div>'; return; }
    if (!hits.length) { out.innerHTML = `<div class="empty">No match for <b>${esc(findState.q)}</b>.</div>`; return; }
    /* group in the order searchAll walked, so the list reads header → pages → footer → CMS */
    const groups = [];
    hits.forEach(h => {
      const key = h.where + ':' + h.pageName;
      let g = groups.find(x => x.key === key);
      if (!g) groups.push(g = { key, name: h.pageName, where: h.where, rows: [] });
      g.rows.push(h);
    });
    out.innerHTML = groups.map((g, gi) => `
      <div class="xlab"${gi ? ' style="margin-top:var(--gap-3)"' : ''}>${esc(g.name)}${g.where === 'cms' ? ' · CMS' : ''}</div>
      ${g.rows.map(h => `<button class="hitrow" data-h="${hits.indexOf(h)}">
        <span class="hn">${esc(h.element)}</span>
        <span class="hf">${esc(h.field)}</span>
        <span class="hs">${esc(h.snippet)}</span>
        ${h.hits > 1 ? `<span class="hc">${h.hits}×</span>` : ''}
      </button>`).join('')}`).join('');

    $$('.hitrow', out).forEach(b => b.addEventListener('click', () => {
      const h = hits[+b.dataset.h];
      closeModal();
      /* a hit goes wherever it is edited: an element on the canvas, an item in the
         CMS dialog, a page's own fields in the Pages panel, the project name in
         Project settings */
      if (h.where === 'cms') { cmsModal(h.colId); return; }
      if (h.where === 'project') { projectModal(); return; }
      state.ui.mode = h.where === 'page' ? 'page' : h.where;
      if (h.where === 'page') state.cur = h.page;
      render();
      if (h.type === 'meta') { showPanel('pages'); selSet([]); return; }
      select(h.nodeId, { scroll: true });
    }));
  };

  const live = dbounce(draw, 140);
  q.addEventListener('input', live);
  to.addEventListener('input', () => { findState.to = to.value; });
  $('#fdCase').addEventListener('click', () => {
    findState.ci = !findState.ci;
    $('#fdCase').classList.toggle('on', !findState.ci);
    draw();
  });
  rep.addEventListener('click', async () => {
    const n = searchCount(searchAll(findState.q, { caseSensitive: !findState.ci }));
    if (!n) return;
    if (!await askConfirm('Replace across the whole project?',
      `<b>${n}</b> occurrence${n === 1 ? '' : 's'} of “${esc(findState.q)}” become “${esc(findState.to) || '<i>nothing</i>'}”, `
      + 'on every page, in both global regions and in the CMS. ⌘Z undoes it in one step.',
      { ok: 'Replace all ' + n, danger: true })) return;
    let did = 0;
    edit(() => { did = replaceAll(findState.q, findState.to, { caseSensitive: !findState.ci }); });
    render();
    toast(`Replaced ${did} occurrence${did === 1 ? '' : 's'}`);
    draw();
  });
  $('#fdDone').addEventListener('click', closeModal);
  draw();
  q.focus(); q.select();
}

function helpModal() {
  /* This is now the only place the shortcuts are written down — the inspector's
     empty state used to repeat a shorter list, and that panel no longer appears
     when nothing is selected. */
  const K = [
    ['Move through elements', '↑ ↓'], ['Select parent · first child', '← →'],
    ['Add to the selection', '⌘click'], ['Select a range, in the Navigator', '⇧click'],
    ['Reorder among siblings', '⇧↑ ⇧↓'], ['Edit text in place', '↵ or double-click'],
    ['Copy · cut · paste', '⌘C · ⌘X · ⌘V'],
    ['Copy · paste the <b>styling</b>', '⌘⇧C · ⌘⇧V'], ['Duplicate', '⌘D'], ['Delete', '⌫'],
    ['Undo / redo', '⌘Z · ⌘⇧Z'], ['Back to one element, then the parent', 'esc'],
    ['Find and replace, across the project', '⌘F'],
    ['Preview', '⌘P'], ['Export HTML', '⌘E'],
    ['Bold / italic while editing', '⌘B · ⌘I'], ['Insert link while editing', '⌘K']
  ];
  openModal('Keyboard & tips', `
    <table class="kt">${K.map(([a, b]) => `<tr><td>${a}</td><td><span class="kbd">${b}</span></td></tr>`).join('')}</table>
    <div class="note" style="margin-top:var(--gap-3);line-height:1.7">
      <b style="color:var(--text-2)">Structure</b> — Section → Row → Column → content. Missing wrappers are
      created for you.<br>
      <b style="color:var(--text-2)">Responsive</b> — pick Tablet or Mobile in the top bar and what you change
      becomes an override (max-width 1024px / 767px). A green badge marks one; click it to clear.<br>
      <b style="color:var(--text-2)">Global header &amp; footer</b> — shared by every page, edited in place. Hover the
      region and press <b>Edit header</b> or <b>Edit footer</b>; <b>Done</b> brings you back.<br>
      <b style="color:var(--text-2)">Autosave</b> — stored in this browser. Export → project JSON for a backup.
    </div>`, `<button class="btn primary" id="hOk">Got it</button>`);
  $('#hOk').addEventListener('click', closeModal);
}

/* ============================================================= keyboard */
function hotkey(e) {
  /* the ask layer owns the keyboard while it is up — its own handler takes Enter
     and Escape, and without this Escape would also walk the canvas selection */
  if (askOpenNow()) return;
  const t = e.target, tag = (t.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || (t.isContentEditable && !editing.on)) return;
  const meta = e.metaKey || e.ctrlKey;
  /* some synthetic and assistive input stacks omit `key`; `code` still names
     the physical key, which is enough for the navigation set */
  const k = (e.key || '').toLowerCase() || (e.code || '').toLowerCase();
  if (meta && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (meta && k === 'y') { e.preventDefault(); redo(); return; }
  if (meta && k === 'd') {
    e.preventDefault();
    const ids = selIds();
    if (ids.length) edit(() => ids.length > 1 ? dupMany(ids) : dupNode(ids[0]));
    return;
  }
  /* Styles first: the ⌘C and ⌘V branches below never checked shift, so without this
     ⌘⇧C would copy the element instead of its look. */
  if (meta && e.shiftKey && k === 'c') {
    if (!state.ui.sel) return;
    e.preventDefault();
    copyStyles(state.ui.sel);
    toast('Styles copied from ' + styleClip.from);
    renderRight();
    return;
  }
  if (meta && e.shiftKey && k === 'v') {
    if (!styleClip.css) { toast('No styles copied yet — ⌘⇧C first'); return; }
    const ids = selIds();
    if (!ids.length) return;
    e.preventDefault();
    let n = 0;
    edit(() => { n = pasteStylesMany(ids); });
    toast(n > 1 ? `Styles pasted onto ${n} elements` : n ? 'Styles pasted' : 'Nothing to paste onto');
    return;
  }
  const oneDeep = ' — the clipboard holds one element at a time';
  if (meta && k === 'c') {
    if (state.ui.sel && copyNode(state.ui.sel)) {
      e.preventDefault();
      toast(DEF[locate(state.ui.sel).node.type].label + ' copied' + (multiOn() ? oneDeep : ''));
    }
    return;
  }
  if (meta && k === 'x') {
    if (state.ui.sel && copyNode(state.ui.sel)) {
      e.preventDefault();
      const label = DEF[locate(state.ui.sel).node.type].label, many = multiOn();
      edit(() => delNode(state.ui.sel));
      toast(label + ' cut' + (many ? oneDeep : ''));
    }
    return;
  }
  if (meta && k === 'v') {
    if (!clip.node) return;
    e.preventDefault();
    let made = null;
    edit(() => { made = pasteNode(state.ui.sel); if (made) selSet([made.id]); });
    toast(made ? DEF[made.type].label + ' pasted' : 'A ' + DEF[clip.node.type].label + ' cannot go there');
    return;
  }
  if (meta && k === 'f') { e.preventDefault(); findModal(); return; }
  if (meta && k === 'p') { e.preventDefault(); togglePreview(); return; }
  if (meta && k === 'e') { e.preventDefault(); exportModal(); return; }
  if (meta && k === 's') { e.preventDefault(); save(); toast('Saved locally'); return; }
  if (!meta && (k === 'backspace' || k === 'delete')) {
    const ids = selIds();
    if (ids.length) { e.preventDefault(); edit(() => ids.length > 1 ? delMany(ids) : delNode(ids[0])); }
    return;
  }
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) {
    if (e.shiftKey && state.ui.sel && (k === 'arrowup' || k === 'arrowdown')) {
      e.preventDefault();
      const ids = selIds(), dir = k === 'arrowup' ? -1 : 1;
      edit(() => ids.length > 1 ? nudgeMany(ids, dir) : nudge(ids[0], dir));
      return;
    }
    if (meta) return;
    e.preventDefault();
    const cur = state.ui.sel;
    let next = null;
    if (k === 'arrowup') next = step(cur, -1);
    else if (k === 'arrowdown') next = step(cur, 1);
    else if (k === 'arrowleft') next = parentOf(cur);
    else next = firstChildOf(cur) || step(cur, 1);
    if (next) select(next, { scroll: true });
    return;
  }
  if (k === 'enter' && state.ui.sel && !meta) {
    const n = locate(state.ui.sel);
    if (n && DEF[n.node.type].edit) { e.preventDefault(); enterEdit(state.ui.sel); return; }
  }
  if (k === 'escape') {
    if (!$('#modal').hidden) { closeModal(); return; }
    /* one step per press: back to a single element first, then up the tree.
       Doing both at once would lose the set before you could see what you had. */
    if (multiOn()) { select(state.ui.sel); return; }
    if (state.ui.sel) { const h = locate(state.ui.sel); select(h && h.parent ? h.parent.id : null); }
  }
}
document.addEventListener('keydown', hotkey);

/* ================================================================= init */
function bindTop() {
  $$('#devSeg button').forEach(b => b.addEventListener('click', () => setDev(b.dataset.dev)));
  $('#undoBtn').addEventListener('click', undo);
  $('#redoBtn').addEventListener('click', redo);
  $('#previewBtn').addEventListener('click', togglePreview);
  $('#exportBtn').addEventListener('click', exportModal);
  $('#reviewBtn').addEventListener('click', exportModal);
  $('#projBtn').addEventListener('click', projectModal);
  $('#helpBtn').addEventListener('click', helpModal);
  /* Extracted so anything can open a panel, not only a click on the rail — starting
     an empty site sends you to Add, which is the only thing left to do. */
  window.showPanel = t => {
    state.ui.tab = t;
    $$('#leftRail button[data-t]').forEach(x => x.classList.toggle('on', x.dataset.t === t));
    ['add', 'layers', 'pages', 'cms'].forEach(k => { $('#pane' + k[0].toUpperCase() + k.slice(1)).hidden = k !== t; });
    renderPanelHead();
    renderCms();
  };
  $$('#leftRail button').forEach(b => b.addEventListener('click', () => {
    /* Media and Project open dialogs rather than swapping the panel, so they set
       neither `state.ui.tab` nor the `on` treatment — the panel behind them has not
       changed. Scoping the toggle to `[data-t]` is what keeps them out of it. */
    const dialog = { media: mediaModal, project: projectModal }[b.dataset.act];
    if (dialog) { dialog(); return; }
    showPanel(b.dataset.t);
  }));
  window.addEventListener('resize', () => { layoutCanvas(); positionHud(); renderDim(); });
}

HOOKS.change = () => render();
HOOKS.save = () => save();
HOOKS.note = msg => toast(msg);

(async function boot() {
  await assetsLoad();
  load();
  await mountCanvas();
  bindTop();
  renderPalette();
  setDev(state.ui.dev);
  stamp('Ready', false);
})();
</script>
