  state.meta = { ...state.meta, ...d.meta };
  if (!state.meta.tokens) state.meta.tokens = defaultTokens(state.meta);
  state.header = d.header || []; state.footer = d.footer || [];
  state.pages = d.pages;
  state.cur = Math.min(d.cur || 0, d.pages.length - 1);
}


/* ================================================== asset store (IndexedDB)
   Images live as blobs in IndexedDB, not as data URIs inside the project
   JSON — that keeps localStorage small and lifts the hard 5 MB ceiling.
   A project references them as `asset:<id>`, resolved to a blob URL on the
   canvas and to a data URI (or a file path) at export time.               */
const AS = { db: null, mem: new Map(), ok: false };
const A_RE = /asset:([a-z0-9]+)/g;

const idbReq = rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });

function idbOpen() {
  return new Promise(res => {
    let rq;
    try { rq = indexedDB.open('slate.assets', 1); } catch (e) { return res(null); }
    rq.onupgradeneeded = () => { if (!rq.result.objectStoreNames.contains('a')) rq.result.createObjectStore('a', { keyPath: 'id' }); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => res(null);
    rq.onblocked = () => res(null);
  });
}
const idbStore = (mode) => AS.db.transaction('a', mode).objectStore('a');

async function assetsLoad() {
  AS.db = await idbOpen();
  AS.ok = !!AS.db;
  if (!AS.ok) return;
  let recs = [];
  try { recs = await idbReq(idbStore('readonly').getAll()) || []; } catch (e) { recs = []; }
  recs.forEach(r => { if (r && r.blob) AS.mem.set(r.id, { ...r, url: URL.createObjectURL(r.blob) }); });
}

/* Intrinsic size is measured here and stored with the record. It used to be
   measured by each caller and set on the in-memory copy only, so a reload dropped
   it — and it is what the export writes as width/height and what the review's
   `no-dimensions` check reads. */
async function assetAdd(file) {
  const id = 'a' + uid().replace(/[^a-z0-9]/g, '');
  const url = URL.createObjectURL(file);
  const dim = (await imgSize(url)) || { w: 0, h: 0 };
  const rec = { id, name: file.name || 'image', type: file.type || 'application/octet-stream', size: file.size, blob: file, w: dim.w, h: dim.h };
  if (AS.ok) {
    try { await idbReq(idbStore('readwrite').put(rec)); }
    catch (e) { AS.ok = false; toast('Could not store the image — it will be lost on reload'); }
  }
  AS.mem.set(id, { ...rec, url });
  return id;
}
async function assetDel(id) {
  const a = AS.mem.get(id);
  if (a && a.url) URL.revokeObjectURL(a.url);
  AS.mem.delete(id);
  if (AS.ok) { try { await idbReq(idbStore('readwrite').delete(id)); } catch (e) { } }
}
const assetBytes = () => [...AS.mem.values()].reduce((n, a) => n + (a.size || 0), 0);
const kb = n => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';

/* how many times each asset is referenced by the whole project */
function assetUsage() {
  const hits = {};
  const json = JSON.stringify(doc());
  let m;
  A_RE.lastIndex = 0;
  while ((m = A_RE.exec(json))) hits[m[1]] = (hits[m[1]] || 0) + 1;
  return hits;
}

/* intrinsic pixel size of an image, used to emit width/height on export */
const imgSize = url => new Promise(res => {
  if (!url) return res(null);
  const i = new Image();
  i.onload = () => res({ w: i.naturalWidth, h: i.naturalHeight });
  i.onerror = () => res(null);
  i.src = url;
});

const blobToData = b => new Promise(res => {
  const fr = new FileReader();
  fr.onload = () => res(fr.result);
  fr.onerror = () => res(PH);
  fr.readAsDataURL(b);
});

/* canvas: cheap object URLs */
const assetsToBlob = str => str.replace(A_RE, (m, id) => (AS.mem.get(id) || {}).url || PH);

/* export: inline as data URIs, or rewrite to a relative assets/ path */
async function assetsToData(str) {
  const ids = [...new Set([...str.matchAll(A_RE)].map(m => m[1]))];
  const map = {};
  for (const id of ids) {
    const a = AS.mem.get(id);
    map[id] = a && a.blob ? await blobToData(a.blob) : PH;
  }
  return str.replace(A_RE, (m, id) => map[id] || PH);
}
const assetFile = a => 'assets/' + (a.name || a.id).replace(/[^\w.-]+/g, '-').toLowerCase();
/* `asset:<id>` → the path the exported HTML uses for it. Lives here because only
   the UI holds the asset store; core takes it as an argument so it stays testable. */
const assetPath = v => {
  const m = /^asset:(\w+)$/.exec(String(v == null ? '' : v));
  const a = m && AS.mem.get(m[1]);
  return a ? assetFile(a) : String(v == null ? '' : v);
};
const assetsToPaths = (str, rel = '') => str.replace(A_RE, (m, id) => {
  const a = AS.mem.get(id);
  return a ? rel + assetFile(a) : PH;
});
/* ---- zip -----------------------------------------------------------------
   Written by hand rather than pulled in: a whole site is a handful of files, and
   the format is a local header per entry, then a central directory, then a
   twenty-two byte tail. Deflate comes from CompressionStream where the browser
   has it and falls back to stored, which is still a valid archive.
   Timestamps are fixed at the ZIP epoch so the same site zips to the same bytes —
   the same reason content.json carries no generated-at stamp. */
const CRC_T = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[i] = c >>> 0;
  }
  return t;
})();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
const deflateRaw = async u8 => {
  if (typeof CompressionStream !== 'function') return null;
  try {
    const st = new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    const packed = new Uint8Array(await new Response(st).arrayBuffer());
    return packed.length < u8.length ? packed : null;
  } catch (e) { return null; }
};

async function makeZip(entries) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0, count = 0;
  const put = (n, len) => { const b = new Uint8Array(len); for (let i = 0; i < len; i++) b[i] = (n >>> (8 * i)) & 0xFF; return b; };
  for (const e of entries) {
    const name = enc.encode(e.path);
    const raw = typeof e.data === 'string' ? enc.encode(e.data)
      : e.data instanceof Uint8Array ? e.data
        : new Uint8Array(await e.data.arrayBuffer());
    const crc = crc32(raw);
    const packed = raw.length > 256 ? await deflateRaw(raw) : null;
    const body = packed || raw, method = packed ? 8 : 0;
    const head = [put(0x04034b50, 4), put(20, 2), put(0, 2), put(method, 2), put(0, 2), put(0x21, 2),
      put(crc, 4), put(body.length, 4), put(raw.length, 4), put(name.length, 2), put(0, 2), name];
    chunks.push(...head, body);
    central.push(...[put(0x02014b50, 4), put(20, 2), put(20, 2), put(0, 2), put(method, 2), put(0, 2), put(0x21, 2),
      put(crc, 4), put(body.length, 4), put(raw.length, 4), put(name.length, 2), put(0, 2), put(0, 2),
      put(0, 2), put(0, 2), put(0, 4), put(offset, 4), name]);
    offset += head.reduce((n, b) => n + b.length, 0) + body.length;
    count++;
  }
  const cdSize = central.reduce((n, b) => n + b.length, 0);
  return new Blob([...chunks, ...central,
    put(0x06054b50, 4), put(0, 2), put(0, 2), put(count, 2), put(count, 2), put(cdSize, 4), put(offset, 4), put(0, 2)],
    { type: 'application/zip' });
}

const assetsUsedIn = str => [...new Set([...str.matchAll(A_RE)].map(m => m[1]))].map(id => AS.mem.get(id)).filter(Boolean);


/* =============================================================== canvas */
let cwin = null, cdoc = null;

function mountCanvas() {
  const f = $('#canvas');
  return new Promise(res => {
    f.onload = () => {
      cwin = f.contentWindow; cdoc = f.contentDocument;
      /* the embedded brand faces, handed to the canvas document as well */
      const fonts = document.getElementById('pc-fonts');
      const slot = cdoc.getElementById('s-fonts');
      if (fonts && slot) slot.textContent = fonts.textContent;
      bindCanvas(); res();
    };
    f.srcdoc = '<!doctype html><html><head><meta charset="utf-8">'
      + '<link id="s-gf" rel="stylesheet" href="">'
      + '<style id="s-fonts"></style><style id="s-css"></style>'
      + '</head><body><div id="s-root"></div><div id="s-hud"></div></body></html>';
  });
}

/* All three regions are always on the canvas and always styled. The editing
   scope decides which one is live; the others are dimmed, locked context. */
const curSets = () => [state.header, page().tree, state.footer];
const REGIONS = [
  { kind: 'header', label: 'Global header', get: () => state.header },
  { kind: 'main', label: 'Page content', get: () => page().tree },
  { kind: 'footer', label: 'Global footer', get: () => state.footer }
];
const scopeOf = () => state.ui.mode === 'page' ? 'main' : state.ui.mode;
const modeFor = kind => kind === 'main' ? 'page' : kind;

/* Style-only edits must not touch the markup: rebuilding innerHTML tears down
   every embedded iframe, which restarts any video mid-edit. */
/* keep the canvas pointed at the families the project uses */
function syncFonts() {
  if (!cdoc) return;
  const link = cdoc.getElementById('s-gf');
  if (!link) return;
  const href = gfontsHref();
  if (link.getAttribute('href') !== href) link.setAttribute('href', href);
}

function paintCss() {
  if (!cdoc) return;
  syncFonts();
  const el = cdoc.getElementById('s-css');
  if (!el) return;
  el.textContent = assetsToBlob(treeCss(curSets(), !document.body.classList.contains('preview')));
  positionHud();
}

/* On a detail template the whole page stands for one item, so the canvas needs
   that item threaded in from the top — there is no `src` node to open the scope. */
function pageCtx() {
  const col = page().collection ? findCollection(page().collection) : null;
  return col ? { col, item: previewItem(col) } : {};
}

function paint() {
  if (!cdoc) return;
  const editing = !document.body.classList.contains('preview');
  const scope = scopeOf();
  const css = treeCss(curSets(), editing);

  let html = '';
  for (const R of REGIONS) {
    const nodes = R.get();
    const live = R.kind === scope;
    if (!editing) { html += renderList(nodes, { edit: false }); continue; }
    if (!nodes.length && !live) continue;                 // nothing to show as context

    const inner = renderList(nodes, { edit: live, ...pageCtx() })
      || (live ? `<div class="s-canvas-empty"><b>${R.kind === 'main' ? 'This page is empty' : R.label + ' is empty'}</b>
          <span>Drag an element onto the canvas, or</span>
          <button class="s-openadd" data-openadd="1">Open the Add panel</button></div>` : '');

    /* dim everything that is not the region being edited */
    const st = live ? 'edit' : (scope === 'main' ? 'locked' : 'dim');
    html += `<div class="s-region" data-kind="${R.kind}" data-state="${st}">`
      + `<div class="s-lockbar">`
      + (live
        ? (R.kind === 'main'
          ? `<span class="s-lockchip">${svg('page', 11)} Page content</span>`
          : `<span class="s-lockchip on">${svg('globe', 11)} Editing ${R.label.toLowerCase()}</span>`)
        : `<span class="s-lockchip">${svg(R.kind === 'main' ? 'page' : 'globe', 11)} ${R.label} ${svg('lock', 10)}</span>`
        + `<button class="s-lockopen" data-goto="${modeFor(R.kind)}">Edit ${R.kind === 'main' ? 'page' : R.kind} ${svg('edit', 10)}</button>`)
      + `</div><div class="s-rbody">${inner}</div></div>`;
  }
  if (!editing) html = html || '';

  syncFonts();
  cdoc.getElementById('s-css').textContent = assetsToBlob(css);
  cdoc.getElementById('s-root').innerHTML = assetsToBlob(html);
  positionHud();
}

/* ================================================================ toast */
let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ================================================================== HUD */
function positionHud() {
  if (!cdoc) return;
  const hud = cdoc.getElementById('s-hud'); if (!hud) return;
  const s = state.ui.sel ? locate(state.ui.sel) : null;
  if (!s || document.body.classList.contains('preview') || editing.on) { hud.innerHTML = ''; return; }
  const el = cdoc.getElementById(s.node.id);
  if (!el) { hud.innerHTML = ''; return; }
  const r = el.getBoundingClientRect();
  const top = r.top + cwin.scrollY, left = r.left + cwin.scrollX;
  const flip = r.top < 26;
  const d = DEF[s.node.type];
  const ids = selIds(), many = ids.length > 1;
  /* Extra members get an outline and nothing else: one bar, on the primary,
     so there is never a question which element the buttons act on. */
  const alt = ids.slice(1).map(id => {
    const e2 = cdoc.getElementById(id); if (!e2) return '';
    const q = e2.getBoundingClientRect();
    return `<div class="frame alt" style="left:${q.left + cwin.scrollX}px;top:${q.top + cwin.scrollY}px;width:${q.width}px;height:${q.height}px"></div>`;
  }).join('');
  hud.innerHTML = alt +
    `<div class="frame" style="left:${left}px;top:${top}px;width:${r.width}px;height:${r.height}px">
      <i class="nw"></i><i class="n"></i><i class="ne"></i><i class="e"></i>
      <i class="se"></i><i class="s"></i><i class="sw"></i><i class="w"></i>
     </div>
     <div class="bar" style="top:${flip ? top + r.height : top}px;left:${left}px;${flip ? 'transform:none' : ''}">
      <span class="nm">${many ? ids.length + ' selected' : esc(d.label)}</span>
      <button class="g" data-act="drag" title="${many ? 'Drag all ' + ids.length + ' to move them together' : 'Drag to move'}">${svg('drag', 12)}</button>
      ${!many && d.edit ? `<button data-act="edit" title="Edit content">${svg('edit', 12)}</button>` : ''}
      <button data-act="more" title="Everything else — or right-click the element">${svg('drag', 12, 'rot')}</button>
    </div>`
    + (many ? '' : gripsHtml(s));
}

/* A grip per gutter, on the row that is selected — or on the parent row when a
   column is selected, which is how you usually arrive at wanting to resize.
   Positioned between each adjacent pair, from the live boxes rather than from the
   stored ratios, so it lands correctly whatever the widths actually resolve to. */
function gripsHtml(s) {
  const row = s.node.type === 'row' ? s.node
    : (s.node.type === 'column' && s.parent && s.parent.type === 'row') ? s.parent : null;
  if (!row || (row.children || []).length < 2) return '';
  const boxes = row.children.map(c => {
    const e = cdoc.getElementById(c.id);
    return e ? e.getBoundingClientRect() : null;
  });
  if (boxes.some(b => !b)) return '';
  let out = '';
  for (let i = 0; i < boxes.length - 1; i++) {
    const a = boxes[i], b = boxes[i + 1];
    /* a wrapped row stacks its columns — there is no vertical gutter to drag */
    if (b.left < a.left + 1) continue;
    const x = (a.right + b.left) / 2 + cwin.scrollX;
    const t = Math.min(a.top, b.top) + cwin.scrollY;
    const h = Math.max(a.bottom, b.bottom) - Math.min(a.top, b.top);
    out += `<div class="grip" data-grip="${row.id}" data-i="${i}"
      style="left:${x}px;top:${t}px;height:${h}px" title="Drag to resize"></div>`;
  }
  return out;
}

/* `add` toggles one member, `range` sweeps from the primary to `id` in document
   order, and a plain call replaces the set. Only a plain call clears the class
   target: while adding, the primary has not moved, so the target still holds. */
function select(id, opts = {}) {
  if (editing.on) exitEdit();
  if (opts.add) selToggle(id);
  else if (opts.range && state.ui.sel && id) selSet(selRange(state.ui.sel, id));
  else {
    if (id !== state.ui.sel) { state.ui.target = ''; state.ui.lmode = null; }
    selSet(id ? [id] : []);
  }
  /* reveal every member — a hit buried under a collapsed parent is no use if
     the Navigator will not show it */
  for (const sid of selIds()) {
    const h = locate(sid); if (!h) continue;
    for (let p = h.parent; p; p = (locate(p.id) || {}).parent) delete state.ui.collapsed[p.id];
  }
  paintSel();
  renderRight();
  renderLayers();
  drawBlocks();
  if (opts.scroll && state.ui.sel && cdoc) {
    const el = cdoc.getElementById(state.ui.sel);
    if (el) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}
/* cheap selection repaint — avoids rebuilding the whole canvas */
function paintSel() {
  if (!cdoc) return;
  $$('[data-sel],[data-sel2]', cdoc).forEach(e => {
    e.removeAttribute('data-sel'); e.removeAttribute('data-sel2');
  });
  /* Only the primary gets `data-sel` — widgets hang behaviour off it (a nav
     opens its list), and that should follow the one element the inspector is
     pointed at, not everything in the set. */
  selIds().forEach((id, i) => {
    const el = cdoc.getElementById(id);
    if (el && el.dataset.id) el.setAttribute(i ? 'data-sel2' : 'data-sel', '');
  });
  positionHud();
}

/* ---- one dispatcher for every element verb -----------------------------
   The HUD bar, the Navigator row, the inspector footer and the context menu all call
   this. Before it, duplicate and delete existed three times over, each with its own
   idea of whether it applied to the selection or to one node. */
function runAct(act, ids) {
  const list = (ids && ids.length ? ids : selIds()).filter(id => locate(id));
  if (!list.length) return;
  const id = list[0], many = list.length > 1;
  switch (act) {
    case 'edit': enterEdit(id); break;
    case 'up': { const h = locate(id); select(h.parent ? h.parent.id : null); break; }
    case 'copy':
      if (copyNode(id)) toast(DEF[locate(id).node.type].label + ' copied'
        + (many ? ' — the clipboard holds one element at a time' : ''));
      break;
    case 'cut': {
      if (!copyNode(id)) break;
      const label = DEF[locate(id).node.type].label;
      edit(() => delNode(id));
      toast(label + ' cut' + (many ? ' — the clipboard holds one element at a time' : ''));
      break;
    }
    case 'paste': {
      if (!clip.node) break;
      let made = null;
      edit(() => { made = pasteNode(id); if (made) selSet([made.id]); });
      toast(made ? DEF[made.type].label + ' pasted' : 'A ' + DEF[clip.node.type].label + ' cannot go there');
      break;
    }
    case 'dup': edit(() => (many ? dupMany(list) : dupNode(id))); break;
    case 'del': edit(() => (many ? delMany(list) : delNode(id))); break;
    case 'stcopy': copyStyles(id); toast('Styles copied from ' + styleClip.from); renderRight(); break;
    case 'stpaste': {
      if (!styleClip.css) { toast('No styles copied yet'); break; }
      let k = 0;
      edit(() => { k = pasteStylesMany(list); });
      toast(k > 1 ? `Styles pasted onto ${k} elements` : k ? 'Styles pasted' : 'Nothing changed');
      break;
    }
    case 'hide': edit(() => list.forEach(x => {
      const nd = locate(x).node;
      nd.hide = nd.hide || {};
      nd.hide[dk()] = !nd.hide[dk()];
    })); break;
    case 'block': saveBlockFlow(id); break;
    case 'push': pushBlockFlow(id); break;
  }
}

/* ---- the context menu -------------------------------------------------
   Right-click is where a paste verb belongs, and there was none anywhere in the app.
   It is also what lets the HUD bar stop growing: seven buttons floating over the
   element became a name, a drag handle and one more. */
function closeCtx() { const c = $('#ctx'); if (c) c.remove(); }
function openCtx(x, y, ids) {
  closeCtx();
  const items = menuFor(ids);
  if (!items.length) return;
  const m = document.createElement('div');
  m.id = 'ctx';
  m.innerHTML = items.map(i =>
    `<button data-a="${i.act}"${i.danger ? ' class="danger"' : ''}${i.sep ? ' data-sep="1"' : ''}>`
    + `<span>${esc(i.label)}</span>${i.key ? `<em>${esc(i.key)}</em>` : ''}</button>`).join('');
  document.body.appendChild(m);
  /* place it at the pointer, then pull it back inside the window rather than letting
     a menu near the right or bottom edge run off */
  const r = m.getBoundingClientRect();
  m.style.left = Math.min(x, window.innerWidth - r.width - 8) + 'px';
  m.style.top = Math.min(y, window.innerHeight - r.height - 8) + 'px';
  $$('button', m).forEach(b => b.addEventListener('click', () => {
    const a = b.dataset.a;
    closeCtx();
    runAct(a, ids);
  }));
}
/* one closer for every way out: another click, Escape, a scroll, a resize */
document.addEventListener('pointerdown', e => { if (!e.target.closest('#ctx')) closeCtx(); }, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCtx(); });
window.addEventListener('resize', closeCtx);

/* ========================================================= canvas events */
function bindCanvas() {
  cdoc.addEventListener('pointerdown', e => {
    if (document.body.classList.contains('preview')) return;
    const hudBtn = e.target.closest && e.target.closest('#s-hud button');
    if (hudBtn) {
      e.preventDefault();
      const act = hudBtn.dataset.act, id = state.ui.sel, ids = selIds();
      if (act === 'drag') {
        /* dragging any member of a selection drags the whole set */
        const many = ids.length > 1 && ids.includes(id);
        startDrag(e, {
          kind: 'move', id, ids: many ? ids : [id],
          label: many ? ids.length + ' elements' : DEF[locate(id).node.type].label
        }, true);
      } else if (act === 'more') {
        /* the bar lives inside the scaled iframe, so its coordinates need the factor */
        const fr = frameRect();
        openCtx(toScreen(e.clientX, fr.left), toScreen(e.clientY, fr.top), ids);
      } else runAct(act, ids);
      return;
    }
    const grip = e.target.closest && e.target.closest('[data-grip]');
    if (grip) { startColResize(e, grip); return; }
    if (editing.on && e.target.closest('[data-editing]')) return;

    /* A locked region is context, not a trap: only the explicit button opens
       its editor. Clicking elsewhere in it simply clears the selection. */
    if (e.target.closest('[data-openadd]')) {
      e.preventDefault();
      const tab = $('#leftRail button[data-t="add"]');
      if (tab) tab.click();
      return;
    }
    const open = e.target.closest('.s-lockopen');
    if (open) { e.preventDefault(); setMode(open.dataset.goto); return; }
    const region = e.target.closest('.s-region');
    if (region && region.dataset.state !== 'edit') { e.preventDefault(); select(null); return; }

    const hit = e.target.closest('[data-id]');
    if (!hit) { select(null); return; }
    if (editing.on) exitEdit();
    /* Both modifiers add here. A range needs a flat list to sweep, and the canvas
       has depth instead — shift-clicking two headings would otherwise drag in
       every row and column that happens to sit between them. The Navigator, which
       does present a list, is where shift takes a range. */
    const add = e.metaKey || e.ctrlKey || e.shiftKey;
    /* A modifier click is a selection gesture, not a text one. Without this the
       browser also extends a native text selection across the canvas, so adding
       three cards leaves everything between them highlighted blue. */
    if (add) { e.preventDefault(); const g = cwin.getSelection(); if (g) g.removeAllRanges(); }
    select(hit.dataset.id, { add });
  }, true);

  cdoc.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (!a) return;
    e.preventDefault();
    if (!document.body.classList.contains('preview')) return;
    const href = a.getAttribute('href') || '';
    if (href.startsWith('#') && href.length > 1) {
      const t = cdoc.getElementById(href.slice(1));
      if (t) { t.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      toast('No element with the anchor ' + href + ' on this page');
    } else if (href) toast('Links follow through in the exported file');
  });
  cdoc.addEventListener('dblclick', e => {
    if (document.body.classList.contains('preview')) return;
    const hit = e.target.closest('[data-id]');
    if (hit && DEF[locate(hit.dataset.id) ? locate(hit.dataset.id).node.type : ''] ) {
      const n = locate(hit.dataset.id).node;
      if (DEF[n.type].edit) { e.preventDefault(); enterEdit(n.id); }
    }
  });
  /* preview mode drives the same toggle the export ships */
  cdoc.addEventListener('click', e => {
    if (!document.body.classList.contains('preview')) return;
    const t = e.target.closest('[data-nav-t]');
    if (t) {
      const w = t.closest('[data-nav]');
      const open = !w.classList.contains('is-open');
      w.classList.toggle('is-open', open);
      t.setAttribute('aria-expanded', open ? 'true' : 'false');
      return;
    }
    $$('[data-nav].is-open', cdoc).forEach(w => {
      if (w.contains(e.target)) return;
      w.classList.remove('is-open');
      const b = w.querySelector('[data-nav-t]');
      if (b) b.setAttribute('aria-expanded', 'false');
    });
  });
  cwin.addEventListener('scroll', () => { positionHud(); if (editing.on) placeRT(); }, { passive: true });
  cwin.addEventListener('resize', () => { positionHud(); if (editing.on) placeRT(); });
  /* Right-click selects what is under the pointer if it is not already selected — a
     menu that acts on something you cannot see selected is how you delete the wrong
     thing — then opens on the element, in outer-document coordinates. */
  cdoc.addEventListener('contextmenu', e => {
    if (document.body.classList.contains('preview')) return;
    const el = e.target.closest && e.target.closest('[data-id]');
    if (!el) return;
    e.preventDefault();
    const id = el.dataset.id;
    if (!selIds().includes(id)) { select(id); }
    const fr = frameRect();
    openCtx(toScreen(e.clientX, fr.left), toScreen(e.clientY, fr.top), selIds());
  });
  cdoc.addEventListener('keydown', e => {
    if (editing.on) {
      if (e.key === 'Escape') { e.preventDefault(); exitEdit(); }
      return;
    }
    hotkey(e);
  });
}

/* =============================================================== drag/drop */
let drag = null, dragDidMove = false;

function startDrag(e, payload, fromFrame) {
  e.preventDefault();
  drag = { ...payload, fromFrame, drop: null, moved: false };
  document.body.classList.add('dragging');
  const g = $('#ghost');
  g.innerHTML = svg(payload.icon || (payload.kind === 'move' ? 'drag' : 'plus'), 13) + esc(payload.label);
  g.style.display = 'flex';
  moveGhost(e, fromFrame);

  const src = e.target;
  try { src.setPointerCapture(e.pointerId); } catch (_) { }
  const dOwn = fromFrame ? cdoc : document;
  const mv = ev => onDragMove(ev, fromFrame);
  const up = ev => { onDrop(ev, fromFrame); cleanup(); };
  function cleanup() {
    dOwn.removeEventListener('pointermove', mv);
    dOwn.removeEventListener('pointerup', up);
    dOwn.removeEventListener('pointercancel', up);
  }
  dOwn.addEventListener('pointermove', mv);
  dOwn.addEventListener('pointerup', up);
  dOwn.addEventListener('pointercancel', up);
}

/* Dragging a gutter. Writes at the breakpoint being edited, because the column's
   own Width (share) control is responsive — resizing on Tablet must not quietly
   rewrite the desktop base. The whole gesture is one `tx`, so it is one ⌘Z. */
function startColResize(e, grip) {
  e.preventDefault();
  const hit = locate(grip.dataset.grip); if (!hit) return;
  const row = hit.node, i = +grip.dataset.i, b = dk();
  const rowEl = cdoc.getElementById(row.id); if (!rowEl) return;
  const span = rowEl.getBoundingClientRect().width;
  if (!span) return;
  const startX = e.clientX;
  const key = 'colresize:' + row.id + ':' + i + ':' + b;
  grip.classList.add('on');
  try { grip.setPointerCapture(e.pointerId); } catch (_) { }

  const tip = cdoc.createElement('div');
  tip.className = 'gtip';
  cdoc.getElementById('s-hud').appendChild(tip);

  const move = ev => {
    const pct = ((ev.clientX - startX) / span) * 100;
    const ws = resizeCols(row, i, pct, b);
    if (!ws) return;
    tx(key);
    applyColsAt(row, ws, b);
    paintCss();                                     // cheap: only the stylesheet
    const total = ws.reduce((a, x) => a + x, 0) || 1;
    tip.textContent = ws.map(w => Math.round((w / total) * 100) + '%').join('  ·  ');
    const g = rowEl.getBoundingClientRect();
    tip.style.left = (ev.clientX + cwin.scrollX) + 'px';
    tip.style.top = (g.top + cwin.scrollY - 6) + 'px';
  };
  const up = () => {
    cdoc.removeEventListener('pointermove', move);
    cdoc.removeEventListener('pointerup', up);
    cdoc.removeEventListener('pointercancel', up);
    tip.remove();
    grip.classList.remove('on');
    endTx(); save(); renderRight(); positionHud();
  };
  cdoc.addEventListener('pointermove', move);
  cdoc.addEventListener('pointerup', up);
  cdoc.addEventListener('pointercancel', up);
}

/* Note this is the *visual* box: with the canvas scaled, its width and height are
   already multiplied by zoomK. Only three places mix outer coordinates with iframe
   ones, and all three are here — everything else measures inside the iframe, where
   the scale does not exist. `inFrame` and `toScreen` are the whole conversion. */
function frameRect() { return $('#canvas').getBoundingClientRect(); }
const inFrame = (v, off) => (v - off) / zoomK;      // screen px -> iframe px
const toScreen = (v, off) => v * zoomK + off;       // iframe px -> screen px

function moveGhost(e, fromFrame) {
  const r = frameRect();
  const x = fromFrame ? toScreen(e.clientX, r.left) : e.clientX;
  const y = fromFrame ? toScreen(e.clientY, r.top) : e.clientY;
  const g = $('#ghost'); g.style.left = x + 'px'; g.style.top = y + 'px';
}

function onDragMove(e, fromFrame) {
  if (!drag) return;
  drag.moved = true;
  moveGhost(e, fromFrame);
  const r = frameRect();
  /* findDrop works in iframe document coordinates, so a pointer that came from the
     outer document has to be divided by the scale, not just offset. */
  const x = fromFrame ? e.clientX : inFrame(e.clientX, r.left);
  const y = fromFrame ? e.clientY : inFrame(e.clientY, r.top);
  /* the bounds are compared in iframe units too — r.width is the scaled box */
  if (x < 0 || y < 0 || x > r.width / zoomK || y > r.height / zoomK) { drag.drop = null; showDrop(null); return; }
  const type = drag.kind === 'new' ? drag.type
    : drag.kind === 'pattern' ? 'section'
      : drag.kind === 'block' ? blockRootType(drag.blockId)
      : locate(drag.id).node.type;
  const d = findDrop(x, y, type, drag.kind === 'move' ? drag.id : null);
  drag.drop = d;
  showDrop(d);
}

function findDrop(x, y, type, movingId) {
  const el = cdoc.elementFromPoint(x, y);
  if (!el) return null;
  const chain = [];
  let e = el;
  while (e && e !== cdoc.documentElement) {
    if (e.dataset && e.dataset.id && locate(e.dataset.id)) chain.push(e);
    e = e.parentElement;
  }
  if (chain.length && movingId) {                   // never drop inside what we're dragging
    const self = chain.findIndex(c => c.dataset.id === movingId);
    if (self > -1) chain.splice(0, self + 1);
  }
  let container = null, ci = -1;
  for (let i = 0; i < chain.length; i++) {
    const n = locate(chain[i].dataset.id).node;
    if (holds(n.type, type)) { container = n; ci = i; break; }
  }
  const list = container ? container.children : tree();
  const horiz = !!(container && container.type === 'row');
  let index = list.length;

  const childEl = ci > 0 ? chain[ci - 1] : null;
  const direct = childEl && list.some(c => c.id === childEl.dataset.id) ? childEl : null;
  if (direct) {
    const idx = list.findIndex(c => c.id === direct.dataset.id);
    const r = direct.getBoundingClientRect();
    const mid = horiz ? r.left + r.width / 2 : r.top + r.height / 2;
    index = (horiz ? x : y) > mid ? idx + 1 : idx;
  } else {
    index = 0;
    for (const c of list) {
      const ce = cdoc.getElementById(c.id); if (!ce) { index++; continue; }
      const r = ce.getBoundingClientRect();
      const mid = horiz ? r.left + r.width / 2 : r.top + r.height / 2;
      if ((horiz ? x : y) > mid) index++;
    }
  }
  return { container, index, horiz, list };
}

function showDrop(d) {
  if (!cdoc) return;
  let ind = cdoc.getElementById('s-drop');
  if (!d) { if (ind) ind.remove(); return; }
  if (!ind) { ind = cdoc.createElement('div'); ind.id = 's-drop'; cdoc.getElementById('s-hud').appendChild(ind); }
  const sx = cwin.scrollX, sy = cwin.scrollY;
  const { container, index, horiz, list } = d;

  if (!list.length) {
    const host = container ? (container.type === 'section' ? cdoc.querySelector('#' + container.id + ' > .pagecraft-container') : cdoc.getElementById(container.id)) : cdoc.getElementById('s-root');
    if (!host) return;
    const r = host.getBoundingClientRect();
    ind.className = 'box';
    Object.assign(ind.style, { left: r.left + sx + 'px', top: r.top + sy + 'px', width: r.width + 'px', height: Math.max(r.height, 40) + 'px' });
    return;
  }
  const after = index >= list.length;
  const refN = after ? list[list.length - 1] : list[index];
  const ref = cdoc.getElementById(refN.id);
  if (!ref) return;
  const r = ref.getBoundingClientRect();
  ind.className = '';
  if (horiz) {
    Object.assign(ind.style, { left: (after ? r.right : r.left) - 1.5 + sx + 'px', top: r.top + sy + 'px', width: '3px', height: r.height + 'px' });
  } else {
    Object.assign(ind.style, { left: r.left + sx + 'px', top: (after ? r.bottom : r.top) - 1.5 + sy + 'px', width: r.width + 'px', height: '3px' });
  }
}

function onDrop(e, fromFrame) {
  document.body.classList.remove('dragging');
  $('#ghost').style.display = 'none';
  showDrop(null);
  const d = drag; drag = null;
  dragDidMove = !!(d && d.moved);
  if (!d || !d.drop) { return; }
  const { container, index } = d.drop;
  if (d.kind === 'pattern') {
    let made = null;
    edit(() => { made = patternInsert(d.patId, container, index); if (made) selSet([made.id]); });
    toast(made ? d.label + ' added' : 'That does not fit there');
  } else if (d.kind === 'block') {
    let made = null;
    edit(() => { made = blockInsert(d.blockId, container, index); if (made) selSet([made.id]); });
    toast(made ? findBlock(d.blockId).name + ' placed' : 'That block does not fit there');
  } else if (d.kind === 'new') {
    edit(() => { const leaf = insert(d.type, container, index); selSet([leaf.id]); });
    toast(labelOf(d.type) + ' added');
  } else {
    const set = d.ids && d.ids.length > 1 ? d.ids : null;
    if (set) {
      let k = 0;
      edit(() => { k = moveMany(set, container, index); });
      toast(k === set.length ? `${k} elements moved` : k ? `${k} of ${set.length} moved — the rest do not fit there` : 'They do not fit there');
    } else {
      edit(() => moveNode(d.id, container, index));
    }
  }
}

function placeRT() {
  const rt = $('#rt');
  if (!editing.on || editing.kind !== 'rich') { rt.classList.remove('show'); return; }
  const el = editing.el, fr = frameRect();
  const r = el.getBoundingClientRect();
  rt.classList.add('show');
  const w = rt.offsetWidth || 340;
  /* the toolbar lives in the outer document, so the element's iframe rect has to be
     scaled before it is offset — at 50% zoom it otherwise floats twice as far out */
  let left = toScreen(r.left + r.width / 2, fr.left) - w / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - w - 8));
  let top = toScreen(r.top, fr.top) - rt.offsetHeight - 8;
  if (top < 54) top = Math.min(fr.top + r.bottom + 8, window.innerHeight - 40);
  rt.style.left = left + 'px'; rt.style.top = top + 'px';
}
/* `createLink` runs against the canvas iframe's live selection, and opening a
   dialog takes focus out of it. Save the range, put it back, then run the
   command — otherwise the link lands nowhere. */
async function linkPrompt() {
  const sel = cwin.getSelection();
  const saved = sel && sel.rangeCount ? sel.getRangeAt(0).cloneRange() : null;
  const url = await askText('Add a link', 'Link URL', 'https://', { ok: 'Add link', placeholder: 'https://example.com' });
  if (!url) return;
  if (editing.el) editing.el.focus();
  if (saved) { const s2 = cwin.getSelection(); s2.removeAllRanges(); s2.addRange(saved); }
  cdoc.execCommand('createLink', false, url);
}
$('#rt').addEventListener('mousedown', async e => {
  const b = e.target.closest('button'); if (!b) return;
  e.preventDefault();
  if (b.dataset.c) cdoc.execCommand(b.dataset.c, false, null);
  else if (b.dataset.b) cdoc.execCommand('formatBlock', false, b.dataset.b);
  else if (b.dataset.link) await linkPrompt();
  syncEdit();
});

function enterEdit(id) {
  const h = locate(id); if (!h) return;
  const n = h.node, d = DEF[n.type];
  if (!d.edit) return;
  if (editing.on) exitEdit();
  if (state.ui.sel !== id || multiOn()) { selSet([id]); paintSel(); renderRight(); renderLayers(); }

  const host = cdoc.getElementById(id); if (!host) return;
  const target = n.type === 'button' ? host.querySelector('span') : host;

  hist.u.push(clone(doc())); hist.r.length = 0;
  editing.on = true; editing.id = id; editing.el = host; editing.kind = d.edit;
  target.contentEditable = 'true';
  host.setAttribute('data-editing', '');
  if (d.edit === 'rich') target.style.outline = 'none';
  target.focus();
  if (n.type !== 'text') {
    const rg = cdoc.createRange(); rg.selectNodeContents(target);
    const s = cwin.getSelection(); s.removeAllRanges(); s.addRange(rg);
  }
  const onInput = () => syncEdit();
  const onPaste = ev => {
    ev.preventDefault();
    const txt = (ev.clipboardData || cwin.clipboardData).getData('text/plain');
    cdoc.execCommand('insertText', false, txt);
  };
  const onKey = ev => {
    if (ev.key === 'Enter' && n.type !== 'text') { ev.preventDefault(); exitEdit(); }
    if ((ev.metaKey || ev.ctrlKey) && ev.key.toLowerCase() === 'k' && n.type === 'text') {
      ev.preventDefault(); linkPrompt();
    }
  };
  target.addEventListener('input', onInput);
  target.addEventListener('paste', onPaste);
  target.addEventListener('keydown', onKey);
  editing.off = [() => {
    target.removeEventListener('input', onInput);
    target.removeEventListener('paste', onPaste);
    target.removeEventListener('keydown', onKey);
    target.removeAttribute('contenteditable');
    target.style.outline = '';
  }];
  positionHud(); placeRT();
}

function syncEdit() {
  if (!editing.on) return;
  const h = locate(editing.id); if (!h) return;
  const n = h.node, host = editing.el;
  if (n.type === 'text') n.props.html = host.innerHTML.trim();
  else if (n.type === 'button') n.props.text = (host.querySelector('span') || host).innerText.replace(/\n+/g, ' ').trim();
  else n.props.text = host.innerText.replace(/ /g, ' ').replace(/\n+$/, '');
  /* keep the inspector honest while typing on the canvas — a full re-render
     would steal focus, so the bound field is updated in place */
  const field = $('#right [data-x="v"]');
  if (field && n.type !== 'text' && field.value !== n.props.text) field.value = n.props.text;
  save();
  renderLayers();
}

function exitEdit() {
  if (!editing.on) return;
  syncEdit();
  editing.off.forEach(f => f());
  if (editing.el) editing.el.removeAttribute('data-editing');
  editing.on = false; editing.id = null; editing.el = null; editing.kind = null; editing.off = [];
  $('#rt').classList.remove('show');
  paint(); renderRight();
}
document.addEventListener('pointerdown', e => {

});


/* ============================================================== palette */
const PAL = [
  {
    /* No bare Column here. Every route it offered is already covered: dropped on the
       root or a section it built the same Section > Row > Column that Columns does,
       and dropped on a row it did what the row's own 1–6 count control does. The
       type itself stays in DEF — cols(), wrap(), applyCols() and every template
       depend on it; it is just not something you add by hand. */
    g: 'Layout', items: [
      ['section', 'Section'], ['columns', 'Columns'], ['row', 'Row'], ['list', 'Collection']
    ]
  },
  {
    g: 'Content', items: [
      ['heading', 'Heading'], ['text', 'WYSIWYG'], ['image', 'Image'], ['gallery', 'Gallery'],
      ['video', 'Video'], ['icon', 'Icon']
    ]
  },
  {
    /* Grouped by what they do rather than by how they are built, which is why the
       Accordion sits with the Form: both are things a visitor operates. */
    g: 'Interactive', items: [
      ['button', 'Button'], ['nav', 'Nav menu'], ['form', 'Form'], ['accordion', 'Accordion'], ['embed', 'Embed']
    ]
  },
  {
    g: 'Spacing', items: [['divider', 'Divider'], ['spacer', 'Spacer']]
  }
];

function renderPalette() {
  const p = $('#paneAdd');

    <div class="tabs atabs" id="addTabs">

function drawAddBody() {
  const box = $('#addBody');

  if (tab === 'widgets') {
    box.innerHTML = `${PAL.map(g => `
      <div class="plabel">${g.g}</div>

      it.addEventListener('click', () => {

      ${order.map(cat => `

          <button class="pvcard" data-pat="${t.id}" title="${esc(t.desc)} — drag onto the canvas, or click to append">
            ${t.preview()}

          </button>`).join('')}</div>`).join('')}`;
    $$('[data-pat]', box).forEach(row => {
      const id = row.dataset.pat;

        toast(made ? PATTERNS.find(x => x.id === id).name + ' added' : 'That does not fit there');

  drawBlocks();
}

/* Sending one copy's content to the block and the rest. The same shape as updating
   a text style from an element: say how many others move, then do it in one step. */
async function pushBlockFlow(nodeId) {
  const h = locate(nodeId); if (!h) return;
  const b = findBlock((h.node.adv || {}).block); if (!b) return;
  const others = blockUsage(b.id) - 1;
  if (others > 0 && !await askConfirm('Update every copy?',
    `${others} other cop${others === 1 ? 'y' : 'ies'} of <b>${esc(b.name)}</b> will be updated to match this one.`,
    { ok: 'Push to all', danger: false })) return;
  let n = 0;
  edit(() => { n = blockPush(nodeId); });
  toast(n ? `“${esc(b.name)}” updated — ${n} cop${n === 1 ? 'y' : 'ies'} matched` : `“${esc(b.name)}” updated`);
}

function drawBlocks() {
  const box = $('#addBody');
  if (!box || (state.ui.atab || 'widgets') !== 'blocks') return;
  const sel = state.ui.sel ? locate(state.ui.sel) : null;
  box.innerHTML = `${blocks().length ? blocks().map(b => `
      <div class="brow" data-b="${b.id}" title="Drag onto the canvas, or click to place it">
        ${svg(DEF[b.node.type] ? DEF[b.node.type].icon : 'section', 14)}
        <span class="bn"><b>${esc(b.name)}</b><small>${esc(DEF[b.node.type] ? DEF[b.node.type].label : 'Block')}${b.sync ? ` · global · ${blockUsage(b.id)} placed` : ''}</small></span>
        <button class="bx" data-bdel="${b.id}" title="Forget this block">${svg('trash', 11)}</button>
      </div>`).join('') : '<div class="hint">Nothing saved yet. Select something on the canvas and save it here to reuse it on any page.</div>'}
    <button class="btn" id="blockSave" style="width:100%;justify-content:center;margin-top:var(--gap-1);font-size:12px"${sel ? '' : ' disabled'}>
      ${svg('plus', 12)} ${sel ? 'Save ' + esc(DEF[sel.node.type].label) + ' as block' : 'Select something to save'}
    </button>`;

  $$('.brow', box).forEach(row => {
    const id = row.dataset.b;
    row.addEventListener('pointerdown', e => {
      if (e.target.closest('[data-bdel]')) return;
      startDrag(e, { kind: 'block', blockId: id, label: findBlock(id).name, icon: 'section' }, false);
    });
    row.addEventListener('click', e => {
      if (e.target.closest('[data-bdel]')) return;
      if (dragDidMove) { dragDidMove = false; return; }
      let made = null;
      edit(() => { made = blockInsert(id, undefined); if (made) selSet([made.id]); });
      toast(made ? findBlock(id).name + ' placed' : 'That block does not fit there');
    });
  });
  $$('[data-bdel]', box).forEach(b => b.addEventListener('click', async e => {
    e.stopPropagation();

    if (!await askConfirm('Forget this block?', `<b>${esc(findBlock(id).name)}</b> leaves the Blocks tab. Copies already placed stay.`, { ok: 'Forget block' })) return;

  if (sv && sel) sv.addEventListener('click', () => saveBlockFlow(sel.node.id));
}

/* click-to-add: drop it into the current selection's nearest legal container */
/* Where a new `key` should land given the current selection: inside it when it can
   hold one, otherwise beside the nearest ancestor that can. Shared by the Add
   panel and the media library, which both place elements without a drag. */
function smartTarget(key) {
  let container = null, index = null;
  const s = state.ui.sel ? locate(state.ui.sel) : null;
  if (s) {
    let node = s.node, parent = s.parent;
    if (holds(node.type, key)) { container = node; index = node.children.length; }
    else {
      while (parent && !holds(parent.type, key)) { node = parent; parent = locate(parent.id).parent; }
      if (parent) { container = parent; index = parent.children.findIndex(c => c.id === node.id) + 1; }
      else { container = null; index = tree().findIndex(c => c.id === node.id) + 1; }
    }
  }
  if (index === null) index = tree().length;
  return [container, index];
}
function appendSmart(key) {
  const [container, index] = smartTarget(key);
  edit(() => { const leaf = insert(key, container, index); selSet([leaf.id]); });
  toast(labelOf(key) + ' added');
  const el = cdoc && cdoc.getElementById(state.ui.sel);
  if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

/* =============================================================== layers */
function renderLayers() {
  const p = $('#paneLayers');
  const list = tree();
  const rows = [];

  /* Global regions are edited in place: the live one expands, the others stay
     collapsed and locked. Selecting one switches the editing scope. */
  const scope = scopeOf();
  const regionRow = R => {
    const live = R.kind === scope;
    return `<div class="lrow region${live ? ' live' : ' locked'}" data-goto="${modeFor(R.kind)}">
      ${svg(R.kind === 'main' ? 'page' : 'globe', 13, 'ico')}
      <span class="nm">${R.label}</span>
      ${live ? '<span class="badge">Editing</span>' : svg('lock', 12, 'lk')}
    </div>`;
  };
  const picked = new Set(selIds());
  const walk = (arr, depth) => arr.forEach(n => {
    const kids = n.children || [];
    const col = state.ui.collapsed[n.id];
    const hid = n.hide && n.hide[dk()];
    const mark = state.ui.sel === n.id ? ' sel' : picked.has(n.id) ? ' sel2' : '';
    rows.push(`<div class="lrow${mark}${col ? ' collapsed' : ''}" data-id="${n.id}" style="padding-left:${6 + depth * 13}px">
      <span class="tw" data-tw="${n.id}">${kids.length ? svg('caret', 10) : ''}</span>
      <span class="gr" data-gr="${n.id}" title="Drag to reorder">${svg('drag', 11)}</span>
      ${svg(DEF[n.type].icon, 13, 'ico')}
      <span class="nm">${esc(nameOf(n))}</span>
      <span class="act">
        <button data-act="hide" title="${hid ? 'Show' : 'Hide'} on ${DEV_LABEL[dk()]}">${svg(hid ? 'eyeoff' : 'eye', 12)}</button>
        <button data-act="dup" title="Duplicate">${svg('copy', 12)}</button>
        <button data-act="del" title="Delete">${svg('trash', 12)}</button>
      </span>
    </div>`);
    if (kids.length && !col) walk(kids, depth + 1);
  });
  for (const R of REGIONS) {
    rows.push(regionRow(R));
    if (R.kind !== scope) continue;
    if (!list.length) rows.push(`<div class="empty" style="padding:14px 16px">Empty.<br>Add an element from the <b>Add</b> panel.</div>`);
    else walk(list, 1);
  }
  p.innerHTML = `<div class="layers">${rows.join('')}</div>`;
  bindLayers(p);
}

function bindLayers(p) {
  $$('.lrow', p).forEach(r => {
    if (r.dataset.goto) { r.addEventListener('click', () => setMode(r.dataset.goto)); return; }
    if (r.dataset.main) { r.addEventListener('click', () => select(null)); return; }
    const id = r.dataset.id;
    r.addEventListener('click', e => {
      const tw = e.target.closest('[data-tw]');
      if (tw) { state.ui.collapsed[id] = !state.ui.collapsed[id]; renderLayers(); return; }
      const b = e.target.closest('button[data-act]');
      if (b) {
        e.stopPropagation();
        /* a row's own actions apply to that row, not to whatever is selected */
        runAct(b.dataset.act, [id]);
        return;
      }
      select(id, { scroll: true, add: e.metaKey || e.ctrlKey, range: e.shiftKey });
    });
    const gr = r.querySelector('[data-gr]');
    if (gr) gr.addEventListener('pointerdown', e => startLayerDrag(e, id));
    r.addEventListener('contextmenu', e => {
      e.preventDefault();
      if (!selIds().includes(id)) select(id);
      openCtx(e.clientX, e.clientY, selIds());
    });
  });
}

/* ---- reordering in the Navigator --------------------------------------
   The canvas can already do this, but only where the thing is visible and big
   enough to aim at. A list is the surface for moving a Section past another Section,
   or for reaching a container that has nothing in it yet.

   Its own drag rather than the canvas one: the canvas resolves a drop by hit-testing
   real geometry, and a flat list of rows has none of that. What it has instead is
   thirds — the top third puts the node before the row, the bottom third after it, and
   the middle puts it inside when that row can hold it. */
let layerDrag = null;
function startLayerDrag(e, id) {
  e.preventDefault();
  e.stopPropagation();
  const set = selIds();
  const ids = set.length > 1 && set.includes(id) ? set : [id];
  const type = locate(id).node.type;
  layerDrag = { ids, type, drop: null, moved: false };
  document.body.classList.add('dragging');
  const g = $('#ghost');
  g.innerHTML = svg('drag', 13) + esc(ids.length > 1 ? ids.length + ' elements' : nameOf(locate(id).node));
  g.style.display = 'flex';

  const pane = $('#paneLayers');
  const line = document.createElement('div');
  line.id = 'l-drop';
  const host = pane.querySelector('.layers');

  const at = ev => {
    $('#ghost').style.left = ev.clientX + 'px';
    $('#ghost').style.top = ev.clientY + 'px';
    layerDrag.moved = true;
    const row = document.elementFromPoint(ev.clientX, ev.clientY);
    const lr = row && row.closest ? row.closest('.lrow[data-id]') : null;
    if (!lr) { layerDrag.drop = null; line.remove(); return; }
    const r = lr.getBoundingClientRect();
    const rel = (ev.clientY - r.top) / r.height;
    const zone = rel < 0.3 ? 'before' : rel > 0.7 ? 'after' : 'inside';
    const d = layerTarget(lr.dataset.id, zone, layerDrag.type, layerDrag.ids)
      /* a row that cannot take it inside still has edges that can */
      || (zone === 'inside' ? layerTarget(lr.dataset.id, 'after', layerDrag.type, layerDrag.ids) : null);
    layerDrag.drop = d;
    if (!d) { line.remove(); return; }
    const hr = host.getBoundingClientRect();
    if (zone === 'inside' && d.container && d.container.id === lr.dataset.id) {
      line.className = 'in';
      line.style.top = (r.top - hr.top) + 'px';
      line.style.height = r.height + 'px';
    } else {
      line.className = '';
      line.style.height = '';
      line.style.top = ((zone === 'after' ? r.bottom : r.top) - hr.top - 1) + 'px';
    }
    host.appendChild(line);
  };
  const up = () => {
    document.body.classList.remove('dragging');
    $('#ghost').style.display = 'none';
    line.remove();
    document.removeEventListener('pointermove', at);
    document.removeEventListener('pointerup', up);
    document.removeEventListener('pointercancel', up);
    const d = layerDrag; layerDrag = null;
    if (!d || !d.drop || !d.moved) return;
    let k = 0;
    edit(() => { k = moveMany(d.ids, d.drop.container, d.drop.index); });
    if (d.ids.length > 1) toast(k ? `${k} element${k === 1 ? '' : 's'} moved` : 'They do not fit there');
  };
  try { e.target.setPointerCapture(e.pointerId); } catch (_) { }
  document.addEventListener('pointermove', at);
  document.addEventListener('pointerup', up);
  document.addEventListener('pointercancel', up);
}

/* ================================================================ pages */
/* ============================================================ media library
   A grid modal rather than a rail panel: a 272px panel fits one card per row,
   which is no way to look at images. `mediaModal` manages the library, and
   `mediaPicker` (on the ask layer) is the same grid used to answer "which image?".
   Both draw their cards from `mediaCards`, so they cannot drift. */
function mediaCards(list, use, attr) {
  return list.map(a => `<div class="mitem">
    <button class="mcard" ${attr}="${a.id}" title="${esc(a.name)}">
      <span class="mthumb"><img src="${a.url}" alt=""></span>
      <span class="mname">${esc(a.name)}</span>
      <span class="msub">${kb(a.size)}${a.w ? ` · ${a.w}×${a.h}` : ''}${use[a.id] ? ` · used ${use[a.id]}×` : ' · unused'}</span>
    </button>
    <button class="mdel" data-del="${a.id}" title="Delete from the library">${svg('trash', 12)}</button>
  </div>`).join('');
}

/* Takes a file into the library. Shared by every upload entry point. */
async function mediaTake(file) {
  if (!file || !/^image\//.test(file.type)) { toast('That is not an image file'); return null; }
  if (file.size > 6e6 && !await askConfirm('That is a large image',
    `This file is <b>${(file.size / 1048576).toFixed(1)} MB</b>. Large images slow the page down.`,
    { ok: 'Add anyway', danger: false })) return null;
  const id = await assetAdd(file);
  const got = AS.mem.get(id);
  writeNow();
  toast(`${file.name} — ${kb(file.size)}${got && got.w ? `, ${got.w} × ${got.h}` : ''}`);
  return id;
}
function mediaChooseFiles(after) {
  const fi = document.createElement('input');
  fi.type = 'file'; fi.accept = 'image/*'; fi.multiple = true;
  fi.onchange = async () => { for (const f of fi.files) await mediaTake(f); after(); };
  fi.click();
}

function mediaModal() {
  if (editing.on) exitEdit();
  const draw = () => {
    const use = assetUsage();
    const list = [...AS.mem.values()];
    const orphans = list.filter(a => !use[a.id]).length;
    openModal('Media library', list.length
      ? `<div class="mgrid wide">${mediaCards(list, use, 'data-use')}</div>`
      : `<div class="empty" style="padding:28px 8px">Nothing here yet.<br><br>
          Upload below, or drop an image onto any <b>Image</b> or <b>Background</b> field.</div>`,
      `<span class="note" style="margin:0;flex:1;text-align:left">${list.length
        ? `${list.length} image${list.length === 1 ? '' : 's'} · ${kb(assetBytes())} · click one to place it`
        : 'Stored in this browser'}</span>
       ${orphans ? `<button class="btn" id="mmPrune">Remove ${orphans} unused</button>` : ''}
       <button class="btn" id="mmUp">${svg('image', 13)} Upload</button>
       <button class="btn primary" id="mmDone">Done</button>`, 'lg');

    $('#mmUp').addEventListener('click', () => mediaChooseFiles(draw));
    $('#mmDone').addEventListener('click', closeModal);
    const prune = $('#mmPrune');
    if (prune) prune.addEventListener('click', async () => {
      for (const a of [...AS.mem.values()]) if (!use[a.id]) await assetDel(a.id);
      writeNow(); draw(); toast('Unused images removed');
    });
    $$('[data-use]', $('#mBody')).forEach(b => b.addEventListener('click', () => {
      const a = AS.mem.get(b.dataset.use); if (!a) return;
      let made = null;
      edit(() => {
        made = insert('image', ...smartTarget('image'));
        made.props.src = 'asset:' + a.id;
        made.props.alt = '';
        if (a.w) { made.props.w = String(a.w); made.props.h = String(a.h); }
        selSet([made.id]);
      });
      closeModal();
      toast(`${a.name} placed — add alt text`);
    }));
    $$('[data-del]', $('#mBody')).forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.del;
      if (use[id] && !await askConfirm('Delete this image?',
        `It is used ${use[id]}× on the site. Those elements fall back to a placeholder.`,
        { ok: 'Delete image' })) return;
      await assetDel(id); writeNow(); paint(); draw();
    }));
  };
  draw();
}

/* ================================================================ content
   The sidebar lists collections; the data itself is edited in a wide dialog,

function renderCms() {

      <div class="note">A collection is a content type — a set of fields, and the items that fill them. Bind a widget to a field and it shows real content.</div>
    </div>

      { ok: 'Delete collection' })) return;
    edit(() => collectionDelete(col.id));
  }));
}

/* The content editor: schema on the left, items on the right. */
let cmsTab = 'items';
function cmsModal(colId) {

  const draw = () => {
    const col = findCollection(colId);
    if (!col) return closeModal();
    const tf = titleField(col);
    openModal(`Content — ${col.name}`, `
      <div class="tabs flush" id="cmsTabs">
        <button data-c="items" class="${cmsTab === 'items' ? 'on' : ''}">Items · ${col.items.length}</button>
        <button data-c="fields" class="${cmsTab === 'fields' ? 'on' : ''}">Fields · ${col.fields.length}</button>

      : col.items.length ? `
        <table class="cmst"><thead><tr>

          <td style="white-space:nowrap;display:flex;gap:2px;align-items:center">

            <button class="iconbtn" data-idel="${it.id}" title="Delete item">${svg('trash', 13)}</button>
          </td></tr>`).join('')}
        </tbody></table>`
        : `<div class="empty">No items yet. Add one and fill in its fields.</div>`}`,
      `<span class="note" style="margin:0;flex:1;text-align:left">${cmsTab === 'items'
        ? `${col.items.length} item${col.items.length === 1 ? '' : 's'} · URLs will be <b>${esc(col.slug)}/&lt;slug&gt;.html</b>`
        : 'Deleting a field clears its values on every item'}</span>
       <button class="btn" id="cmsNew">${svg('plus', 13)} ${cmsTab === 'items' ? 'Add item' : 'Add field'}</button>
       <button class="btn primary" id="cmsDone">Done</button>`, 'lg');

    $$('#cmsTabs button').forEach(b => b.addEventListener('click', () => { cmsTab = b.dataset.c; draw(); }));

      if (cmsTab === 'items') { edit(() => itemAdd(colId)); return draw(); }

      edit(() => fieldAdd(colId, name, 'text'));
      draw();
    });

    $$('[data-v]', box).forEach(el => {
      const [iid, fid] = el.dataset.v.split('|');

      el.addEventListener(el.tagName === 'SELECT' || el.type === 'checkbox' ? 'change' : 'input', push);

      const [iid, fid] = b.dataset.vimg.split('|');

      if (!id) return;

      draw();
    }));
  };
  draw();
}

const CMS_COL_W = { image: '72px', bool: '54px', date: '128px', number: '84px' };

/* one cell of the items table, per field type */
function cmsCell(col, it, f) {

    return `<button class="cmsimg" data-vimg="${k}" title="Choose from the library">

/* ====================================================== settings panel */
let CUR = [];                                   // control descriptors for this render
/* Style edits land on whatever the inspector is targeting: this element, or one
   of its classes. Explicit, so nobody restyles twelve elements by accident. */
function tgtObj(n) {
  const id = state.ui.target;
  const c = id && findClass(id);
  return (c && (n.cls || []).includes(id)) ? c : n;
}
const tgtIsClass = n => tgtObj(n) !== n;
/* The Undo and Redo buttons reflect history depth, and `tx()` pushes a snapshot
   without going through `edit()` — so `HOOKS.change()` never fires and the
   buttons kept their disabled state until the next full render. After any style
   edit `hist.u.length` was 1 while the button was still greyed out: ⌘Z worked and
   the button looked dead. Anything that moves history depth calls this. */
function paintHistory() {
  const u = $('#undoBtn'), r = $('#redoBtn');
  if (u) u.disabled = !hist.u.length;
  if (r) r.disabled = !hist.r.length;
}
let txKey = null;
function tx(key) {
  if (txKey === key) return;
  txKey = key; hist.u.push(clone(doc()));
  if (hist.u.length > hist.max) hist.u.shift();
  hist.r.length = 0;
  paintHistory();
}
const endTx = () => { txKey = null; paintHistory(); };
const repaint = dbounce(() => { paint(); save(); renderLayers(); refreshReview(); paintHistory(); }, 90);
const repaintCss = dbounce(() => { paintCss(); save(); refreshReview(); paintHistory(); }, 60);

function parseU(v) {
  const s = String(v == null ? '' : v).trim();
  const m = s.match(/^(-?[\d.]+)\s*(px|rem|em|%|vw|vh|ch|s|ms)?$/);
  return m ? { n: m[1], u: m[2] || '' } : { n: '', u: '' };
}
/* current + inherited value for a css prop */
function cssVal(n, c, resp) {
  const b = resp ? dk() : 'd';
  const own = n.css[b] ? n.css[b][c] : undefined;
  if (own !== undefined && own !== '') return { v: own, own: true };
  if (b === 'm' && n.css.t && n.css.t[c]) return { v: n.css.t[c], own: false };
  const d = n.css.d ? n.css.d[c] : '';
  return { v: d == null ? '' : d, own: false };
}
function setCss(n, c, val, resp) {
  const b = resp ? dk() : 'd';
  n.css[b] = n.css[b] || {};
  if (val === '' || val == null) delete n.css[b][c]; else n.css[b][c] = val;
}
const propVal = (n, k) => n.props[k];
/* A link's mode is derived from the href it holds, so a mode with nothing to store
   yet — URL, email or phone before you have typed — parsed back as `none`: the select
   snapped shut before its input could appear, and anything typed was then discarded
   because the builder was told the mode was `none`. The pending choice lives in
   `ui.lmode` until a value makes it real. Both the markup and the wiring read it here,
   or they disagree about what mode the field is in. */
function linkOf(n, propKey, here) {
  const L = parseLink(propVal(n, propKey), here);
  if (L.mode === 'none' && state.ui.lmode && state.ui.lmode.key === n.id + '|' + propKey) L.mode = state.ui.lmode.mode;
  return L;
}

function labelHtml(c, n) {
  const resp = !!c.r, dev = dk(), o = tgtObj(n);
  const own = resp && c.c ? !!(o.css[dev] && o.css[dev][c.c] !== undefined) : false;
  const badge = resp
    ? `<span class="rsp${own && dev !== 'd' ? ' ovr' : ''}" data-clear="${own && dev !== 'd' ? '1' : ''}"
        title="${dev === 'd' ? 'Editing the desktop base value' : own ? 'Overridden on ' + DEV_LABEL[dev] + ' — click to clear' : 'Set a ' + DEV_LABEL[dev] + ' override'}">${svg(dev === 'd' ? 'desktop' : dev === 't' ? 'tablet' : 'mobile', 9)}</span>`
    : '';
  /* the binding badge sits beside the responsive one: same slot, same size, so
     "this value comes from content" reads at a glance without a second row */
  const sc = c.k && bindableKeys(n.type).includes(c.k) ? bindScope(n.id) : null;
  const fid = sc ? bindGet(n, c.k) : '';
  const f = fid && findField(sc.col, fid);
  const bind = sc
    ? `<span class="bnd${fid ? ' on' : ''}" data-bind="${esc(c.k)}"
        title="${fid ? (f ? `Bound to ${esc(f.name)} — click to change` : 'Bound to a field that no longer exists') : `Bind to a field in ${esc(sc.col.name)}`}">${svg('cms', 9)}</span>`
    : '';

}

function ctlHtml(n, c, i) {
